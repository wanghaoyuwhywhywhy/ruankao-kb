<script>
const DATA=[{"n":1,"name":"信息化发展","start_page":1,"sections":[{"sec":"1.1","title":"信息与信息化","page":1,"subs":[{"sec":"1.1.1","title":"信息基础","page":2,"summary":"信息的定义(香农)、特征(客观性/普遍性/无限性/动态性/相对性/共享性/可传递性/依附性/可处理性/使用价值)信息的质量属性(精确性/完整性/可靠性/及时性/安全性/经济性)","kps":[{"id":"kp_001","sec":"1.1.1","title":"信息的基本概念与特征","tags":["重要"],"body":"<strong>信息</strong>是客观事物状态和运动特征的一种普遍形式，是对客观世界的描述。<ul><li><strong>客观性</strong>：信息是客观事物属性的真实反映</li><li><strong>普遍性</strong>：信息广泛存在于自然界和人类社会</li><li><strong>无限性</strong>：事物的变化是无限的，信息也是无限的</li><li><strong>动态性</strong>：信息随时间变化而变化</li><li><strong>依附性</strong>：信息必须依附于一定的载体</li><li><strong>共享性</strong>：信息可被多方共享，不会因共享而减少</li><li><strong>可传递性</strong>：信息可在空间和时间上转移</li><li><strong>可加工性</strong>：信息可通过加工提炼出新信息</li></ul><strong>数据</strong>是信息的载体和表达形式，<strong>信息</strong>是数据的内涵和语义解释。"},{"id":"kp_002","sec":"1.1.1","title":"系统的六大特点","tags":["重要","高频"],"body":"系统具有以下几个特点：<ol><li><strong>目的性</strong>：定义一个系统、组成一个系统或者抽象出一个系统，都有明确的目标或者目的，目标性决定了系统的功能。</li><li><strong>可嵌套性</strong>：系统可以包括若干子系统，系统之间也能够耦合成一个更大的系统。组成系统的部件也可以是系统。便于对系统进行分层、分部管理、研究或者建设。</li><li><strong>稳定性</strong>：受规则的约束，系统的内部结构和秩序应是可以预见的；系统的状态以及演化路径有限并能被预测；系统的功能发生作用导致的后果也是可以预估的。稳定性强的系统使得系统在受到外部作用的同时，内部结构和秩序仍然能够保持。</li><li><strong>开放性</strong>：系统的可访问性。这个特性决定了系统可以被外部环境识别，外部环境或者其他系统可以按照预定的方法，使用系统的功能或者影响系统的行为。体现在系统有可以清晰描述并被准确识别、理解的所谓接口层面上。</li><li><strong>脆弱性</strong>：与系统的稳定性相对应，即系统可能存在着丧失结构、功能、秩序的特性，往往是隐藏不易被外界感知的。脆弱性差的系统，一旦被侵入，整体性会被破坏，甚至面临崩溃，系统瓦解。</li><li><strong>健壮性</strong>：当系统面临干扰、输入错误、入侵等因素时，系统可能会出现非预期的状态而丧失原有功能、出现错误甚至表现出破坏功能。系统具有的能够抵御出现非预期状态的特性称为健壮性，也叫<strong>鲁棒性(robustness)</strong>。要求具有高可用性的信息系统，会采取<strong>冗余技术、容错技术、身份识别技术、可靠性技术</strong>等来抵御系统出现非预期的状态，保持系统的稳定性。</li></ol>"}]},{"sec":"1.1.2","title":"信息系统基础","page":4,"summary":"信息系统定义(输入/处理/输出/反馈/控制)、特性(目的性/整体性/层次性/稳定性/涌现性/环境的适应性)、生命周期(产生-开发-运行-消亡)、发展规律(呈现网络化/智能化/敏捷化/服务化)","kps":[{"id":"kp_003","sec":"1.1.2","title":"信息系统基础","tags":["重要"],"body":"<strong>信息系统</strong>是一种以处理信息为目的、由人、硬件、软件、网络和数据资源组成的有机整体。<ul><li><strong>基本功能</strong>：输入、存储、处理、输出、控制</li><li><strong>生命周期</strong>：立项规划、开发、运维、消亡四个阶段</li><li>信息系统建设是<strong>一项复杂的社会活动</strong>，具有目标性、整体性、层次性、开放性等特点</li></ul>信息系统的发展趋势：从简单到复杂、从单项到协同、从封闭到开放、从单机到网络。"}]},{"sec":"1.1.3","title":"信息化基础","page":7,"summary":"信息化定义、层次(产品-企业-产业-国民经济和社会)、主要任务、网络文化(健康发展)、信息化评价指标体系","kps":[{"id":"kp_004","sec":"1.1.3","title":"信息化基础及要素","tags":["重要"],"body":"<strong>信息化</strong>是培育、发展以智能化工具为代表的新的生产力并使之造福社会的历史过程。<br><br>信息化体系的<strong>六要素</strong>：<ol><li><strong>信息技术应用</strong>（龙头，主阵地）</li><li><strong>信息技术和产业</strong>（物质基础）</li><li><strong>信息资源</strong>（核心任务，关键环节）</li><li><strong>信息网络</strong>（基础设施）</li><li><strong>信息化人才</strong>（成功之本，关键因素）</li><li><strong>信息化政策法规和标准规范</strong>（根本保障）</li></ol>"},{"id":"kp_005","sec":"1.1.3","title":"信息化政策法规和标准规范的作用","tags":["重要"],"body":"信息化政策法规和标准规范用于规范和协调信息化体系各要素之间关系，是国家信息化快速、持续、有序、健康发展的<strong>根本保障</strong>。"}]}],"kps":[]},{"sec":"1.2","title":"现代化基础设施","page":12,"subs":[{"sec":"1.2.1","title":"新型基础设施建设","page":12,"summary":"新基建定义、分类(信息基础设施-融合基础设施-创新基础设施)、特点(技术广泛性/需求多元性/模式创新性/规模带动性)","kps":[{"id":"kp_006","sec":"1.2.1","title":"新型基础设施建设（新基建）","tags":["重要","高频"],"body":"<strong>新型基础设施建设</strong>（新基建）主要包括三个方面：<ol><li><strong>信息基础设施</strong>：以5G、物联网、工业互联网、人工智能、云计算、区块链等为代表，包括通信网络基础设施、新技术基础设施、算力基础设施等</li><li><strong>融合基础设施</strong>：深度应用互联网、大数据、人工智能等技术，支撑传统基础设施转型升级，如智能交通、智慧能源等</li><li><strong>创新基础设施</strong>：支撑科学研究、技术开发、产品研制的具有公益属性的基础设施，如重大科技基础设施、科教基础设施等</li></ol>"}]},{"sec":"1.2.2","title":"工业互联网","page":13,"summary":"工业互联网定义、体系架构(网络-数据-安全)、应用模式(智能化生产/网络化协同/个性化定制/服务化延伸)","kps":[{"id":"kp_007","sec":"1.2.2","title":"工业互联网","tags":["重要"],"body":"<strong>工业互联网</strong>是新一代信息通信技术与工业经济深度融合的新型基础设施、应用模式和工业生态。<ul><li><strong>网络</strong>：是基础，实现全要素、全系统、全产业链的互联互通</li><li><strong>平台</strong>：是核心，是工业全要素链接的枢纽和工业资源配置的核心</li><li><strong>数据</strong>：是要素，是工业互联网驱动制造业转型的关键</li><li><strong>安全</strong>：是保障，涵盖设备安全、网络安全、控制安全、应用安全、数据安全</li></ul>工业互联网平台体系包括<strong>边缘层、IaaS层、PaaS层、SaaS层</strong>。"}]},{"sec":"1.2.3","title":"城市物联网","page":16,"summary":"城市物联体系架构(感知层-网络层-平台层-应用层)、典型应用(智慧交通/智慧安防/智慧水务/智慧能源/智慧社区)","kps":[{"id":"kp_008","sec":"1.2.3","title":"城市物联网","tags":["重要"],"body":"<strong>城市物联网</strong>是智慧城市建设的重要支撑，通过物联网技术实现城市基础设施的智能化管理。<ul><li>支撑城市基础设施的泛在感知和智能管理</li><li>实现城市各领域信息系统的互联互通</li><li>是智慧城市的关键基础设施之一</li></ul>城市物联网与智慧城市密切相关，智慧城市的建设原则包括：<ul><li><strong>以人为本，务实推进</strong></li><li><strong>因地制宜，科学有序</strong></li><li><strong>市场为主，协同创新</strong></li><li><strong>可管可控，确保安全</strong></li></ul>"}]}],"kps":[]},{"sec":"1.3","title":"产业现代化","page":19,"subs":[{"sec":"1.3.1","title":"农业农村现代化","page":19,"summary":"农业农村现代化特征、数字乡村建设内容(智慧农业/乡村数字化治理/农村电商/乡村信息服务)","kps":[{"id":"kp_009","sec":"1.3.1","title":"农业农村现代化","tags":["重要"],"body":"<strong>农业农村现代化</strong>是通过信息技术推动农业现代化建设。<ul><li>农业生产智能化：物联网、遥感技术在农业中的应用</li><li>农业经营网络化：电子商务推动农产品销售</li><li>农业管理数字化：农业大数据辅助决策</li><li>农业服务在线化：为农民提供在线技术服务</li></ul>通过数字乡村建设，缩小城乡数字鸿沟。"}]},{"sec":"1.3.2","title":"工业现代化","page":20,"summary":"智能制造(大规模个性化定制/服务化延伸)、工业4.0特征、两化融合(深度融合/集成应用)","kps":[{"id":"kp_010","sec":"1.3.2","title":"工业现代化","tags":["重要"],"body":"<strong>工业现代化</strong>是通过信息技术推动工业转型升级。<ul><li><strong>智能制造</strong>：工业4.0的核心，包括数字化、网络化、智能化</li><li><strong>两化融合</strong>：信息化与工业化的深度融合</li><li><strong>数字化转型</strong>：利用数字技术重塑工业生产流程</li></ul>通过工业互联网、工业大数据等技术，实现制造业高质量发展。"}]},{"sec":"1.3.3","title":"服务现代化","page":23,"summary":"现代服务业特征(知识密集/技术密集/人才密集/高创新性/高增长性/强外部性(依赖三大外部条件))、数字化对服务业的变革","kps":[{"id":"kp_011","sec":"1.3.3","title":"服务现代化","tags":["重要"],"body":"<strong>服务现代化</strong>是通过信息技术推动服务业转型升级。<ul><li><strong>传统服务业数字化</strong>：金融、物流、商贸等领域的数字化转型</li><li><strong>新兴服务业态</strong>：平台经济、共享经济等新业态</li><li><strong>服务型制造</strong>：制造业向服务环节延伸</li></ul>服务现代化推动生产性服务业向专业化和价值链高端延伸。"}]}],"kps":[]},{"sec":"1.4","title":"数字中国","page":25,"subs":[{"sec":"1.4.1","title":"数字经济","page":25,"summary":"数字经济定义(以数据资源为关键要素)、构成(数据价值化-数字产业化-产业数字化-数字化治理)、数据要素市场化","kps":[{"id":"kp_012","sec":"1.4.1","title":"数字经济","tags":["重要","高频"],"body":"<strong>数字经济</strong>是以数据资源作为关键生产要素、以现代信息网络作为重要载体、以信息通信技术的有效使用作为效率提升和经济结构优化重要推动力的一系列经济活动。<br><br>数字经济包括：<ul><li><strong>数字产业化</strong>：数字技术本身形成的产业，如电子信息制造业、软件和信息技术服务业等</li><li><strong>产业数字化</strong>：利用数字技术对传统产业进行改造升级</li></ul>数据要素是数字经济的关键生产要素。"},{"id":"kp_013","sec":"1.4.1","title":"《\"十四五\"国家信息化规划》数据要素资源体系","tags":["重要","法规"],"body":"建立高效利用的数据要素资源体系，聚焦<strong>数据管理、共享开放、数据应用、授权许可、安全和隐私保护、风险管控</strong>等方面，探索多主体协同治理机制；加强数据收集、汇聚、存储、流通、应用等全生命周期的安全管理。建立<strong>数据分类分级管理制度</strong>和个人信息保护认证制度。"},{"id":"kp_014","sec":"1.4.1","title":"《\"十四五\"两化深度融合规划》产业数字化与数字产业化","tags":["重要","法规"],"body":"通过两化深度融合，推动<strong>产业数字化和数字产业化</strong>。<ul><li><strong>产业数字化</strong>：利用数字技术对传统产业进行改造升级</li><li><strong>数字产业化</strong>：数字技术本身形成产业</li></ul>两者相互促进，加快质量变革、效率变革和动力变革，赋能传统产业转型升级。"}]},{"sec":"1.4.2","title":"数字政府","page":30,"summary":"数字政府内涵(技术-业务-服务)、框架体系(技术支撑层-数据资产层-业务应用层-服务感知层)、G2G/G2B/G2C/G2E","kps":[{"id":"kp_015","sec":"1.4.2","title":"数字政府","tags":["重要"],"body":"<strong>数字政府</strong>是运用信息技术推进政府管理理念和方式变革、实现政府治理模式创新的新型政府运行模式。<ul><li><strong>协同办公</strong>：政府部门间业务协同</li><li><strong>政务服务</strong>：\"一网通办\"、\"最多跑一次\"</li><li><strong>社会治理</strong>：依托大数据实现精准治理</li></ul>数字政府建设核心是<strong>数据驱动</strong>，实现政府决策科学化、社会治理精准化、公共服务高效化。"}]},{"sec":"1.4.3","title":"数字社会","page":34,"summary":"数字社会核心组成(数字民生-数字生活-数字文化)、智慧城市(四大体系-四层架构-两大保障)","kps":[{"id":"kp_016","sec":"1.4.3","title":"数字社会与智慧城市","tags":["重要"],"body":"<strong>数字社会</strong>是数字技术在社会领域的应用，包括数字教育、数字医疗、数字交通等。<br><br><strong>智慧城市</strong>基本原则：<ul><li><strong>以人为本，务实推进</strong></li><li><strong>因地制宜，科学有序</strong></li><li><strong>市场为主，协同创新</strong></li><li><strong>可管可控，确保安全</strong></li></ul>智慧城市是数字社会建设的重要载体，通过信息技术实现城市运行管理的智能化。"}]},{"sec":"1.4.4","title":"数字生态","page":39,"summary":"数字生态内涵(数据要素治理-多元协同治理-网络安全保障-创新发展环境)","kps":[{"id":"kp_017","sec":"1.4.4","title":"数字生态","tags":["重要"],"body":"<strong>数字生态</strong>是数字时代社会、经济、环境的协调发展生态系统。<ul><li>良好的数字生态是数字中国建设的重要保障</li><li>构建<strong>政府、平台、企业、用户</strong>多元参与的治理格局</li><li>完善数字治理规则，包括数据治理、算法治理等</li><li>维护网络安全和数据安全</li></ul>营造良好数字生态需要法律、技术、经济等多维度协同。"}]}],"kps":[]},{"sec":"1.5","title":"数字化转型与元宇宙","page":41,"subs":[{"sec":"1.5.1","title":"数字化转型","page":41,"summary":"数字化转型定义、核心要素(数据-技术-流程-组织)、发展框架(战略-业务-技术-支撑保障)、能力成熟度模型","kps":[{"id":"kp_018","sec":"1.5.1","title":"数字化转型","tags":["重要"],"body":"<strong>数字化转型</strong>是利用数字技术，实现组织业务模式、运营模式和组织文化的根本性变革。<ul><li><strong>数字化转换</strong>：信息从模拟到数字的转换</li><li><strong>数字化升级</strong>：业务流程的数字化优化</li><li><strong>数字化转型</strong>：商业模式和组织文化的根本变革</li></ul>数字化转型的关键是<strong>数据驱动</strong>，核心是<strong>组织变革</strong>。"},{"id":"kp_019","sec":"1.5.1","title":"数据价值化三阶段","tags":["重要","高频"],"body":"数据价值化以<strong>数据资源化</strong>为起点，经历<strong>数据资产化</strong>、<strong>数据资本化</strong>阶段，实现数据价值化的经济过程。<ol><li><strong>数据资源化</strong>：原始数据通过采集、清洗、整合等处理，使其成为具有应用价值的资源（起点）</li><li><strong>数据资产化</strong>：通过确权、定价、交易等机制，将其转化为可计量、可交易的资产</li><li><strong>数据资本化</strong>：数据资产参与生产经营并带来收益，作为资本投入经济活动实现增值（高级形态）</li></ol>"}]},{"sec":"1.5.2","title":"元宇宙","page":47,"summary":"元宇宙定义(沉浸式-虚实融合-经济系统-数字孪生)、关键技术(区块链-交互技术-电子游戏-AI-网络技术-物联网)","kps":[{"id":"kp_020","sec":"1.5.2","title":"元宇宙","tags":["重要"],"body":"<strong>元宇宙</strong>是虚拟与现实高度融合的数字世界，是互联网的未来形态。<ul><li><strong>核心技术</strong>：区块链、交互技术、电子游戏技术、人工智能、网络及运算技术、物联网技术</li><li><strong>主要特征</strong>：沉浸式体验、虚实融合、开放创造、强社交性</li><li><strong>发展阶段</strong>：从数字孪生到数字原生再到虚实融合</li></ul>元宇宙被视为下一代互联网的重要发展方向。"}]}],"kps":[]},{"sec":"1.6","title":"本章练习","page":49,"subs":[],"kps":[]}]},{"n":2,"name":"信息技术发展","start_page":50,"sections":[{"sec":"2.1","title":"信息技术及其发展","page":50,"subs":[{"sec":"2.1.1","title":"计算机软硬件","page":50,"summary":"计算机基本组成(运算器-控制器-存储器-输入设备-输出设备)、CPU架构(CISC/RISC)、存储器层次","kps":[{"id":"kp_021","sec":"2.1.1","title":"计算机软硬件基础","tags":["重要"],"body":"<strong>计算机系统</strong>由硬件系统和软件系统组成。<ul><li><strong>硬件</strong>：CPU、存储器、输入/输出设备</li><li><strong>软件</strong>：系统软件（操作系统、数据库管理系统等）、应用软件</li></ul>计算机基本结构遵循<strong>冯·诺依曼体系结构</strong>：运算器、控制器、存储器、输入设备、输出设备。程序和数据以同等地位存放在存储器中。"}]},{"sec":"2.1.2","title":"计算机网络","page":52,"summary":"OSI七层模型(物理-数据链路-网络-传输-会话-表示-应用)、TCP/IP四层模型、IEEE 802标准、IPv6(128位)","kps":[{"id":"kp_022","sec":"2.1.2","title":"TCP/IP四层模型 vs OSI七层模型","tags":["重要","高频"],"body":"<strong>TCP/IP协议</strong>分为四层：网络接口层、网际层、传输层、应用层。<br><br><strong>OSI模型</strong>分为七层：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层。<br><br>TCP/IP协议的应用层相当于OSI模型的<strong>5-7层</strong>（会话层、表示层和应用层），因为TCP/IP的应用层包含了OSI模型中这三层的功能。"}]},{"sec":"2.1.3","title":"存储和数据库","page":59,"summary":"存储类型(DAS/NAS/SAN)、数据库(关系型/NoSQL/NewSQL)、数据仓库(ETL-OLAP-数据集市)","kps":[{"id":"kp_023","sec":"2.1.3","title":"存储和数据库基础","tags":["重要"],"body":"<strong>存储技术</strong>：<ul><li>直接附加存储（DAS）</li><li>网络附加存储（NAS）</li><li>存储区域网络（SAN）</li></ul><strong>数据库</strong>是长期存储在计算机内、有组织的、可共享的数据集合。数据库管理系统（DBMS）提供数据定义、数据操作、数据库运行管理等功能。"},{"id":"kp_024","sec":"2.1.3","title":"数据库层次模型","tags":["重要"],"body":"在数据库管理系统中，<strong>层次模型</strong>使用<strong>树形结构</strong>来表示数据间的层次关系。<br><br>常见数据模型：<ul><li><strong>层次模型</strong>：树形结构</li><li><strong>网状模型</strong>：有向图结构</li><li><strong>关系模型</strong>：二维表结构（最常用）</li><li><strong>面向对象模型</strong>：对象和类</li></ul>"}]},{"sec":"2.1.4","title":"信息安全","page":66,"summary":"CIA三属性(保密性-完整性-可用性)、安全机制(加密-数字签名-访问控制-数据完整性-交换认证-流量填充-路由控制-公证-流量分析)","kps":[{"id":"kp_025","sec":"2.1.4","title":"信息安全基础","tags":["重要"],"body":"<strong>信息安全</strong>强调信息在存储、处理和传输过程中的保密性、完整性和可用性。<ul><li><strong>保密性</strong>：信息不被未授权访问</li><li><strong>完整性</strong>：信息不被篡改</li><li><strong>可用性</strong>：信息在需要时可访问</li></ul>信息安全保障还包括<strong>可控性</strong>和<strong>不可抵赖性</strong>。"}]},{"sec":"2.1.5","title":"信息技术的发展","page":75,"summary":"信息技术发展趋势(网络化-智能化-服务化-融合化)","kps":[{"id":"kp_026","sec":"2.1.5","title":"信息技术的发展趋势","tags":["重要"],"body":"信息技术的发展趋势：<ul><li><strong>高速化</strong>：5G/6G通信、高速计算</li><li><strong>网络化</strong>：万物互联</li><li><strong>智能化</strong>：人工智能广泛应用</li><li><strong>综合化</strong>：多种技术融合</li><li><strong>个人化</strong>：终端设备个人化</li></ul>新一代信息技术呈现出<strong>融合、智能、绿色、安全</strong>的发展特征。"}]}],"kps":[]},{"sec":"2.2","title":"新一代信息技术及应用","page":76,"subs":[{"sec":"2.2.1","title":"物联网","page":76,"summary":"物联网架构(感知层-网络层-应用层)、关键技术(RFID-传感器-无线传感器网络-M2M)","kps":[{"id":"kp_027","sec":"2.2.1","title":"物联网三层架构","tags":["重要","高频"],"body":"物联网分为<strong>感知层、网络层、应用层</strong>三层。<br><br><strong>网络层</strong>：利用无线和有线网络对采集的数据进行编码、认证和传输，广泛覆盖的移动通信网络是实现物联网的基础设施，<strong>是物联网三层中标准化程度最高、产业化能力最强、最成熟的部分</strong>，关键在于为物联网应用特征进行优化和改进，形成协同感知的网络。"}]},{"sec":"2.2.2","title":"云计算","page":77,"summary":"云计算服务模式(IaaS-PaaS-SaaS)、部署模式(公有-私有-混合-社区)、关键特征(按需自助服务-广泛网络访问-资源池化-快速弹性-可计量服务)","kps":[{"id":"kp_028","sec":"2.2.2","title":"云计算服务类型 IaaS/PaaS/SaaS/DaaS","tags":["重要","高频"],"body":"按照云计算服务提供的资源层次，分为四种服务类型：<ol><li><strong>IaaS（基础设施即服务）</strong>：向用户提供计算能力、存储空间等基础设施服务。单纯出租资源，盈利能力有限。</li><li><strong>PaaS（平台即服务）</strong>：向用户提供虚拟的操作系统、数据库管理系统、Web应用等平台化服务。重点不在于直接经济效益，更注重构建产业生态。</li><li><strong>SaaS（软件即服务）</strong>：向用户提供应用软件、组件、工作流等虚拟化软件服务。采用Web技术和SOA架构，多租户、可定制。</li><li><strong>DaaS（数据即服务）</strong>：数据聚合抽象，把数据转换成通用信息。（了解即可）</li></ol>"},{"id":"kp_029","sec":"2.2.2","title":"云计算部署模式","tags":["重要"],"body":"云计算的部署模式：<ul><li><strong>公有云</strong>：由第三方提供，面向公众</li><li><strong>私有云</strong>：由单一组织独占使用</li><li><strong>社区云</strong>：由若干组织共同使用</li><li><strong>混合云</strong>：结合两种或以上部署模式</li></ul>云计算的特征：宽带网络和快速接入服务、快速弹性部署、资源动态分配、可测量的服务等。"}]},{"sec":"2.2.3","title":"大数据","page":81,"summary":"大数据特征(5V:大量-高速-多样-低价值密度-真实性)、技术架构(采集-存储-处理-分析-可视化)、MapReduce/Spark","kps":[{"id":"kp_030","sec":"2.2.3","title":"大数据技术四个环节","tags":["重要","高频"],"body":"大数据技术主要包括<strong>数据采集、数据存储、数据管理、数据分析与挖掘</strong>四个环节。<ul><li><strong>数据采集</strong>：主要使用ETL（数据抽取工具）</li><li><strong>数据存储</strong>：结构化数据、非结构化数据和半结构化数据的存储与访问</li><li><strong>数据管理</strong>：数据清洗、整合、治理等</li><li><strong>数据分析与挖掘</strong>：统计分析、机器学习等</li></ul>大数据特征（5V）：<strong>大量、高速、多样、低价值密度、真实性</strong>。"}]},{"sec":"2.2.4","title":"区块链","page":83,"summary":"区块链核心特征(去中心化-不可篡改-可追溯-公开透明)、类型(公有链-联盟链-私有链)、共识机制(PoW-PoS-DPBft)、智能合约","kps":[{"id":"kp_031","sec":"2.2.4","title":"区块链","tags":["重要","高频"],"body":"<strong>区块链</strong>是分布式数据存储、点对点传输、共识机制、加密算法等计算机技术的新型应用模式。<ul><li><strong>去中心化</strong>：无中心节点，数据分布式存储</li><li><strong>不可篡改</strong>：通过密码学保证数据不可修改</li><li><strong>可追溯</strong>：所有交易记录可查</li><li><strong>匿名性</strong>：参与者身份可匿名</li></ul>区块链分为<strong>公有链、联盟链、私有链</strong>三种类型。共识机制包括PoW、PoS、DPoS等。"}]},{"sec":"2.2.5","title":"人工智能","page":87,"summary":"AI分类(弱AI-强AI-超AI)、技术(机器学习-深度学习-自然语言处理-计算机视觉-知识图谱)","kps":[{"id":"kp_032","sec":"2.2.5","title":"人工智能","tags":["重要","高频"],"body":"<strong>人工智能（AI）</strong>是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的技术科学。<ul><li><strong>机器学习</strong>：让计算机从数据中学习规律</li><li><strong>深度学习</strong>：基于神经网络的多层学习</li><li><strong>自然语言处理</strong>：让计算机理解和生成人类语言</li><li><strong>计算机视觉</strong>：让计算机\"看\"和理解图像</li><li><strong>知识图谱</strong>：结构化表示知识</li></ul>AI发展三阶段：运算智能→感知智能→认知智能。"}]},{"sec":"2.2.6","title":"虚拟现实","page":90,"summary":"VR/AR/MR区别、关键技术(实时渲染-全景视频-空间定位-手势识别)","kps":[{"id":"kp_033","sec":"2.2.6","title":"虚拟现实","tags":["重要"],"body":"<strong>虚拟现实（VR）</strong>是一种可以创建和体验虚拟世界的计算机仿真系统。<ul><li><strong>沉浸感</strong>：用户身临其境的感觉</li><li><strong>交互性</strong>：用户与虚拟环境的互动</li><li><strong>想象力</strong>：启发创造性思维</li></ul>相关技术：<ul><li><strong>VR</strong>（虚拟现实）：完全虚拟环境</li><li><strong>AR</strong>（增强现实）：虚拟信息叠加到现实</li><li><strong>MR</strong>（混合现实）：虚拟与现实融合</li><li><strong>XR</strong>（扩展现实）：VR/AR/MR的统称</li></ul>"}]}],"kps":[]},{"sec":"2.3","title":"新一代信息技术发展展望","page":91,"subs":[{"sec":"2.3","title":"新一代信息技术发展展望","page":91,"summary":"新一代信息技术发展趋势:融合化(技术间相互融合)、智能化(AI驱动)、服务化(按需服务)、生态化(构建产业生态)。信息技术与其他领域深度融合推动社会变革","kps":[{"id":"kp_034","sec":"2.3","title":"新一代信息技术发展展望","tags":["重要"],"body":"新一代信息技术发展展望：<ul><li><strong>深度融合</strong>：各项技术之间的融合渗透</li><li><strong>智能化</strong>：AI成为通用技术</li><li><strong>云化</strong>：云原生成为主流</li><li><strong>安全可信</strong>：安全与发展并重</li></ul>信息技术与各行业深度融合，推动数字化转型和产业升级。技术发展呈现\"大智云移物链\"（大数据、人工智能、云计算、移动互联网、物联网、区块链）协同发展的格局。"}]}],"kps":[]},{"sec":"2.4","title":"本章练习","page":93,"subs":[],"kps":[]}]},{"n":3,"name":"信息技术服务","start_page":95,"sections":[{"sec":"3.1","title":"内含与外延","page":95,"subs":[{"sec":"3.1.1","title":"服务的特征","page":95,"summary":"服务特征(无形性-不可分离性-不可存储性-异质性-不可所有权转移)","kps":[{"id":"kp_035","sec":"3.1.1","title":"服务的特征","tags":["重要"],"body":"<strong>服务</strong>是具有无形性、不可分离性、异质性（差异性）、不可存储性（易逝性）等特征的经济活动。<ul><li><strong>无形性</strong>：服务在被购买前看不到、尝不到、摸不着</li><li><strong>不可分离性</strong>：服务的生产和消费同时进行</li><li><strong>异质性</strong>：服务质量受提供者、时间、地点等因素影响</li><li><strong>不可存储性</strong>：服务不能被存储以备后用</li></ul>"}]},{"sec":"3.1.2","title":"IT服务的内涵","page":96,"summary":"IT服务定义:供方为需方提供IT能力、IT服务能力、服务过程、服务成果","kps":[{"id":"kp_036","sec":"3.1.2","title":"IT服务的内涵","tags":["重要"],"body":"<strong>IT服务</strong>是指供方为需方提供满足业务需求的信息系统开发、建设、运维等服务活动。<ul><li><strong>基础环境</strong>：支撑IT服务运行的基础设施和网络环境</li><li><strong>硬件</strong>：服务器、存储、网络设备等</li><li><strong>软件</strong>：系统软件、中间件、应用软件等</li><li><strong>服务</strong>：IT服务本身就是核心</li></ul>IT服务是供方与需方之间就IT相关活动产生的一种交互关系。"}]},{"sec":"3.1.3","title":"IT服务的外延","page":96,"summary":"IT服务分类:运行维护-运营服务-IT咨询设计-云服务-数据服务-网信安全-其他IT服务","kps":[{"id":"kp_037","sec":"3.1.3","title":"IT服务的外延","tags":["重要"],"body":"<strong>IT服务的外延</strong>包括IT服务的分类和范围：<ul><li><strong>按内容划分</strong>：软件开发服务、信息系统集成服务、运行维护服务、信息技术咨询服务、信息技术培训服务等</li><li><strong>按对象划分</strong>：面向组织的IT服务、面向公众的IT服务</li><li><strong>按方式划分</strong>：在线服务、现场服务、远程服务</li></ul>IT服务外延涵盖软件、硬件、网络、数据等各维度。"}]},{"sec":"3.1.4","title":"IT服务业的特征","page":97,"summary":"知识密集-技术密集-人才密集-高创新性-高增长性-强外部性(依赖三大外部条件)","kps":[{"id":"kp_038","sec":"3.1.4","title":"IT服务业的特征","tags":["重要"],"body":"<strong>IT服务业的特征</strong>：<ul><li><strong>知识密集型</strong>：依赖专业人才和知识</li><li><strong>高附加值</strong>：通过技术创新创造价值</li><li><strong>人才需求量大</strong>：对高素质人才依赖度高</li><li><strong>创新驱动</strong>：技术更新迭代快</li><li><strong>产业融合</strong>：与各行业深度融合</li></ul>"}]}],"kps":[{"id":"kp_387","sec":"3.1.5","title":"IT服务的外部关联性","tags":["重要","高频"],"body":"<strong>IT服务的外部关联性</strong>（系统集成项目管理工程师教程P96）：<br><br>IT服务依赖于<strong>国民经济和良性竞争的市场环境</strong>的形成，依赖于<strong>社会信息网络</strong>的不断进步，依赖于<strong>政府相应的政策支撑</strong>、配套人才的培养和产业链上下游组织IT应用的逐渐完善。<br><br><strong>核心要点</strong>：<ul><li>IT服务与<strong>外部宏观环境</strong>强关联，而非仅供方内部活动</li><li>依赖三大外部条件：<strong>经济环境</strong>（国民经济+市场竞争）、<strong>基础设施</strong>（社会信息网络）、<strong>政策支撑</strong>（政府政策+人才培养+产业链）</li><li>这是IT服务<strong>外部关联性</strong>的关键体现，区别于供方与需方的内部供需关联</li></ul>考试常考\"哪项不属于外部关联性\"——注意区分<strong>供方内部活动</strong>和<strong>外部环境依赖</strong>。"}]},{"sec":"3.2","title":"原理与组成","page":97,"subs":[{"sec":"3.2.1","title":"IT服务原理","page":98,"summary":"IT服务原理:供需双方通过IT能力-服务过程-服务成果达成目标","kps":[{"id":"kp_039","sec":"3.2.1","title":"IT服务原理","tags":["重要"],"body":"<strong>IT服务原理</strong>是IT服务供方通过IT服务能力为IT服务需方提供IT服务的内在规律。<ul><li>IT服务能力是供方提供IT服务的基础</li><li>IT服务需求是需方对IT服务的期望</li><li>IT服务过程是供方为需方提供IT服务的活动</li><li>IT服务结果是IT服务产生的效果</li></ul>核心是<strong>以需方需求为导向</strong>，通过供方的服务能力满足需方的业务需求。"}]},{"sec":"3.2.2","title":"组成要素","page":98,"summary":"IT服务四要素(人员PP-流程PE-技术PT-资源PR)、IT服务能力(服务技术-服务过程-人员-资源)","kps":[{"id":"kp_040","sec":"3.2.2","title":"IT服务组成要素","tags":["重要"],"body":"IT服务的<strong>四要素</strong>：<ol><li><strong>人员</strong>：IT服务的人员能力、知识和技能</li><li><strong>流程</strong>：规范化的服务流程和管理流程</li><li><strong>技术</strong>：IT服务所需的技术和工具</li><li><strong>资源</strong>：IT服务所需的基础设施、数据等</li></ol>四个要素相互配合，共同保障IT服务的质量和效率。<strong>人员是核心</strong>，流程是保障，技术是手段，资源是基础。"}]}],"kps":[]},{"sec":"3.3","title":"服务生命周期","page":102,"subs":[{"sec":"3.3.1","title":"战略规划","page":103,"summary":"服务战略规划内容(产品-组织-流程-人员-资源-规范-安全)","kps":[{"id":"kp_041","sec":"3.3.1","title":"IT服务战略规划","tags":["重要"],"body":"<strong>战略规划</strong>阶段是IT服务生命周期的第一个阶段。<ul><li><strong>识别需求</strong>：分析需方的业务需求和IT需求</li><li><strong>明确服务</strong>：确定IT服务的范围、目标和内容</li><li><strong>可行性分析</strong>：技术可行性、经济可行性等</li><li><strong>制定计划</strong>：IT服务的实施计划</li></ul>战略规划的目标是确保IT服务与业务需求一致。"}]},{"sec":"3.3.2","title":"设计实现","page":105,"summary":"服务设计实现内容(架构设计-功能设计-过程设计-资源设计)","kps":[{"id":"kp_042","sec":"3.3.2","title":"IT服务设计实现","tags":["重要"],"body":"<strong>设计实现</strong>阶段是IT服务生命周期的第二个阶段。<ul><li><strong>服务设计</strong>：设计IT服务的流程、架构和方案</li><li><strong>服务实现</strong>：通过开发、集成等方式实现IT服务</li><li><strong>服务部署</strong>：将IT服务部署到生产环境</li><li><strong>服务交付</strong>：将IT服务交付给需方使用</li></ul>设计实现确保IT服务满足战略规划阶段确定的需求。"}]},{"sec":"3.3.3","title":"运营提升","page":107,"summary":"运营提升目标(服务持续-质量提升-安全可靠-降本增效-满意提升)","kps":[{"id":"kp_043","sec":"3.3.3","title":"IT服务运营提升","tags":["重要"],"body":"<strong>运营提升</strong>阶段是IT服务生命周期的第三个阶段。<ul><li><strong>运营管理</strong>：保障IT服务的持续稳定运行</li><li><strong>持续改进</strong>：不断优化和提升IT服务质量</li><li><strong>性能优化</strong>：提升IT服务的性能和效率</li><li><strong>成本控制</strong>：优化IT服务的成本</li></ul>运营提升确保IT服务持续满足需方的业务需求。"}]},{"sec":"3.3.4","title":"退役终止","page":109,"summary":"退役终止流程(评估-计划-执行-移交-终止)","kps":[{"id":"kp_044","sec":"3.3.4","title":"IT服务退役终止","tags":["重要"],"body":"<strong>退役终止</strong>阶段是IT服务生命周期的最后一个阶段。<ul><li><strong>退役决策</strong>：评估IT服务是否需要终止</li><li><strong>数据迁移</strong>：将数据迁移到新系统或归档</li><li><strong>服务终止</strong>：正式终止IT服务</li><li><strong>经验总结</strong>：总结IT服务的经验教训</li></ul>退役终止确保IT服务平稳退出，不影响需方的业务运营。"}]}],"kps":[]},{"sec":"3.4","title":"服务标准化","page":110,"subs":[{"sec":"3.4.1","title":"服务产业化","page":110,"summary":"IT服务业产业化特征","kps":[{"id":"kp_045","sec":"3.4.1","title":"IT服务产业化三阶段","tags":["重要","高频"],"body":"IT服务的产业化进程分为<strong>产品服务化、服务标准化和服务产品化</strong>三个阶段。"}]},{"sec":"3.4.2","title":"服务标准","page":112,"summary":"IT服务标准体系(基础标准-管理标准-服务标准-安全标准-行业应用标准)","kps":[{"id":"kp_046","sec":"3.4.2","title":"IT服务标准","tags":["重要"],"body":"<strong>IT服务标准体系</strong>（ITSS）是我国自主研发的信息技术服务标准体系。<ul><li><strong>基础标准</strong>：术语、分类等</li><li><strong>服务管控标准</strong>：服务等级、评价等</li><li><strong>服务业务标准</strong>：针对各类IT服务的标准</li><li><strong>服务安全标准</strong>：安全保障要求</li><li><strong>服务外包标准</strong>：外包服务规范</li></ul>ITSS包括人员、流程、技术、资源四个核心要素。"}]}],"kps":[]},{"sec":"3.5","title":"服务质量评价","page":115,"subs":[{"sec":"3.5.1","title":"相关方模型","page":115,"summary":"从需方-供方-监管方三视角评价IT服务质量","kps":[{"id":"kp_047","sec":"3.5.1","title":"服务质量评价 - 干系人模型","tags":["重要"],"body":"<strong>干系人模型</strong>从IT服务各干系人的视角评价IT服务质量。<ul><li><strong>需方</strong>：IT服务的最终使用者，关注服务是否满足需求</li><li><strong>供方</strong>：IT服务的提供者，关注服务交付效率和质量</li><li><strong>监管方</strong>：监管IT服务合规性</li></ul>不同干系人对IT服务质量有不同的评价视角和标准。"}]},{"sec":"3.5.2","title":"互动模型","page":116,"summary":"IT服务互动特性(接触性-响应性-透明性-适应性-可信性)","kps":[{"id":"kp_048","sec":"3.5.2","title":"服务质量评价 - 互动模型","tags":["重要"],"body":"<strong>互动模型</strong>描述IT服务过程中供方与需方的交互关系。<ul><li>IT服务是供方与需方<strong>互动</strong>的过程</li><li>服务质量在互动过程中产生和体现</li><li>包括<strong>服务接触、服务传递、服务反馈</strong>等环节</li></ul>互动模型强调IT服务的<strong>交互性</strong>和<strong>过程性</strong>。"}]},{"sec":"3.5.3","title":"质量模型","page":117,"summary":"IT服务质量评价模型(功能性-安全性-可靠性-响应性-有形性-友好性)","kps":[{"id":"kp_049","sec":"3.5.3","title":"服务质量评价 - 质量模型","tags":["重要","高频"],"body":"<strong>IT服务质量模型</strong>从多个维度评价IT服务质量：<ul><li><strong>可用性</strong>：IT服务在需要时能被访问的程度</li><li><strong>可靠性</strong>：IT服务持续稳定运行的能力</li><li><strong>响应性</strong>：IT服务对需求的响应速度</li><li><strong>安全性</strong>：IT服务保障信息安全的程度</li><li><strong>可恢复性</strong>：IT服务故障后的恢复能力</li><li><strong>符合性</strong>：IT服务符合标准的程度</li></ul>"}]}],"kps":[]},{"sec":"3.6","title":"服务发展","page":118,"subs":[{"sec":"3.6.1","title":"发展环境","page":118,"summary":"政策-市场-技术-人才四大环境","kps":[{"id":"kp_050","sec":"3.6.1","title":"IT服务发展环境","tags":["重要"],"body":"<strong>IT服务发展环境</strong>包括：<ul><li><strong>政策环境</strong>：国家政策法规对IT服务的影响</li><li><strong>经济环境</strong>：经济发展水平对IT服务的需求</li><li><strong>技术环境</strong>：新一代信息技术推动IT服务发展</li><li><strong>社会环境</strong>：数字化转型对IT服务的需求</li></ul>良好的发展环境是IT服务健康发展的基础。"}]},{"sec":"3.6.2","title":"发展现状与趋势","page":119,"summary":"云计算-大数据-物联网-AI融合推动IT服务创新","kps":[{"id":"kp_051","sec":"3.6.2","title":"IT服务发展现状与趋势","tags":["重要"],"body":"<strong>IT服务发展趋势</strong>：<ul><li><strong>云化</strong>：基于云计算的IT服务成为主流</li><li><strong>智能化</strong>：AI驱动的IT服务智能化</li><li><strong>服务化</strong>：从产品向服务转型</li><li><strong>融合化</strong>：与各行业深度融合</li><li><strong>标准化</strong>：ITSS等标准体系日益完善</li></ul>"}]}],"kps":[]},{"sec":"3.7","title":"服务集成与实践","page":121,"subs":[{"sec":"3.7.1","title":"实践背景","page":122,"summary":"服务集成的业务背景和意义","kps":[{"id":"kp_052","sec":"3.7.1","title":"IT服务集成与实践背景","tags":["重要"],"body":"<strong>IT服务集成</strong>是将各类IT服务整合为综合解决方案的过程。<ul><li>随着信息化深入，单一IT服务难以满足复杂业务需求</li><li>需要将多种IT服务集成，形成整体解决方案</li><li>服务集成涉及技术、流程、人员等多维度整合</li></ul>"}]},{"sec":"3.7.2","title":"服务产品与组合","page":125,"summary":"服务产品化(标准化-模块化)、服务产品组合策略","kps":[{"id":"kp_053","sec":"3.7.2","title":"服务产品与组合","tags":["重要"],"body":"<strong>服务产品</strong>是将IT服务标准化、产品化的结果。<ul><li><strong>服务产品化</strong>：将定制化服务转化为标准产品</li><li><strong>产品服务化</strong>：将产品以服务方式提供</li></ul><strong>服务组合</strong>是将多个服务产品组合，形成满足特定需求的解决方案。服务组合管理确保服务组合与业务需求匹配。"}]},{"sec":"3.7.3","title":"项目组织与里程碑计划","page":129,"summary":"项目组织结构、里程碑设置","kps":[{"id":"kp_054","sec":"3.7.3","title":"项目组织与里程碑计划","tags":["重要"],"body":"<strong>IT服务项目组织</strong>包括：<ul><li><strong>项目组织架构</strong>：项目经理、技术团队、服务团队等</li><li><strong>角色职责</strong>：明确各角色的职责和分工</li><li><strong>里程碑计划</strong>：确定项目关键节点和交付物</li></ul>里程碑是项目进度管理的重要工具，用于标记关键事件或阶段性成果。"}]},{"sec":"3.7.4","title":"项目风险识别与控制","page":132,"summary":"风险识别方法、风险控制策略","kps":[{"id":"kp_055","sec":"3.7.4","title":"项目风险识别与控制","tags":["重要"],"body":"<strong>IT服务项目风险</strong>管理包括：<ul><li><strong>风险识别</strong>：识别项目中的技术风险、管理风险、商务风险等</li><li><strong>风险评估</strong>：评估风险的概率和影响</li><li><strong>风险应对</strong>：制定风险应对策略（规避、转移、减轻、接受）</li><li><strong>风险监控</strong>：持续监控风险状态</li></ul>IT服务项目常见风险：需求变更风险、技术风险、人员风险、进度风险等。"}]}],"kps":[]},{"sec":"3.8","title":"本章练习","page":134,"subs":[],"kps":[]}]},{"n":4,"name":"信息系统架构","start_page":136,"sections":[{"sec":"4.1","title":"架构基础","page":136,"subs":[{"sec":"4.1.1","title":"指导思想","page":136,"summary":"架构设计指导思想","kps":[{"id":"kp_056","sec":"4.1.1","title":"架构设计指导思想","tags":["重要"],"body":"<strong>信息系统架构设计</strong>的指导思想：<ul><li>以<strong>业务需求</strong>为导向</li><li>以<strong>信息化规划</strong>为基础</li><li>以<strong>系统工程</strong>方法为指导</li><li>以<strong>标准化</strong>为手段</li><li>以<strong>安全可靠</strong>为保障</li></ul>架构设计需要统筹考虑业务、技术、安全、标准等多方面因素。"}]},{"sec":"4.1.2","title":"设计原则","page":136,"summary":"架构设计原则","kps":[{"id":"kp_057","sec":"4.1.2","title":"架构设计原则","tags":["重要"],"body":"<strong>信息系统架构设计原则</strong>：<ul><li><strong>开放性</strong>：采用开放标准和技术</li><li><strong>可扩展性</strong>：支持业务和技术发展</li><li><strong>可复用性</strong>：组件化、模块化设计</li><li><strong>可管理性</strong>：便于运维管理</li><li><strong>安全性</strong>：保障信息安全</li><li><strong>可靠性</strong>：保障系统稳定运行</li><li><strong>高可用性</strong>：保障业务连续性</li></ul>"}]},{"sec":"4.1.3","title":"建设目标","page":137,"summary":"架构建设目标","kps":[{"id":"kp_058","sec":"4.1.3","title":"架构设计建设目标","tags":["重要"],"body":"<strong>信息系统架构建设目标</strong>：<ul><li>构建<strong>统一、规范、安全、高效</strong>的信息系统</li><li>实现<strong>业务融合</strong>，消除信息孤岛</li><li>实现<strong>数据共享</strong>，提升数据价值</li><li>实现<strong>服务复用</strong>，降低开发和运维成本</li><li>实现<strong>灵活扩展</strong>，支撑业务持续发展</li></ul>"}]},{"sec":"4.1.4","title":"总体框架","page":138,"summary":"架构总体框架(业务架构-应用架构-数据架构-技术架构)","kps":[{"id":"kp_059","sec":"4.1.4","title":"架构总体框架","tags":["重要"],"body":"<strong>信息系统架构总体框架</strong>采用\"框架-模型-模式\"三层递进：<ul><li><strong>架构框架</strong>：总体性、全局性的架构设计</li><li><strong>架构模型</strong>：针对特定场景的架构设计</li><li><strong>架构模式</strong>：可复用的架构设计经验</li></ul>总体框架包括<strong>系统架构、应用架构、数据架构、技术架构</strong>等视图。"}]}],"kps":[]},{"sec":"4.2","title":"系统架构","page":140,"subs":[{"sec":"4.2.1","title":"架构定义","page":140,"summary":"系统架构定义","kps":[{"id":"kp_060","sec":"4.2.1","title":"系统架构定义","tags":["重要"],"body":"<strong>系统架构</strong>是系统各组成部分及其相互关系的描述。<ul><li>定义系统的<strong>组件</strong>及其<strong>关系</strong></li><li>定义系统的<strong>行为</strong>和<strong>约束</strong></li><li>定义系统的<strong>环境</strong>和<strong>边界</strong></li></ul>系统架构是系统设计的基础，决定了系统的质量和特性。"}]},{"sec":"4.2.2","title":"架构分类","page":141,"summary":"集中式架构-分布式架构(客户端/服务器-三层C/S-浏览器/服务器)","kps":[{"id":"kp_061","sec":"4.2.2","title":"系统架构分类","tags":["重要"],"body":"<strong>系统架构分类</strong>：<ul><li><strong>集中式架构</strong>：所有功能集中在单一节点</li><li><strong>分布式架构</strong>：功能分布在多个节点</li><li><strong>面向服务架构(SOA)</strong>：以服务为核心</li><li><strong>微服务架构</strong>：将应用拆分为小型服务</li><li><strong>云原生架构</strong>：面向云环境设计</li></ul>"}]},{"sec":"4.2.3","title":"一般原理","page":143,"summary":"系统架构设计的一般原理","kps":[{"id":"kp_062","sec":"4.2.3","title":"系统架构一般原理","tags":["重要"],"body":"<strong>系统架构设计的一般原理</strong>：<ul><li><strong>抽象</strong>：提取关键特征，忽略无关细节</li><li><strong>封装</strong>：隐藏内部实现，暴露接口</li><li><strong>信息隐藏</strong>：模块内部信息不对外暴露</li><li><strong>模块化</strong>：将系统分解为独立模块</li><li><strong>关注点分离</strong>：不同关注点分开处理</li><li><strong>高内聚低耦合</strong>：模块内功能紧密相关，模块间依赖少</li></ul>"}]},{"sec":"4.2.4","title":"常用架构模型","page":144,"summary":"管道-过滤器模型、客户/服务器模型、分层模型、MVC模型、代理模型、事件驱动模型","kps":[{"id":"kp_063","sec":"4.2.4","title":"分层模式架构特点","tags":["重要","高频"],"body":"<strong>分层模式</strong>：采用层次化的组织方式，每一层都为上一层提供服务，并使用下一层提供的功能。<ul><li>每一层<strong>依赖于它的下层服务</strong>，为<strong>上层</strong>提供服务（非为各层服务）</li><li>每一层允许用不同方法实现，只要保证接口一致性</li><li>通过接口提供服务，实现层与层之间的解耦</li><li>允许复杂问题逐步分层实现，降低系统复杂性</li></ul>"},{"id":"kp_064","sec":"4.2.4","title":"常用架构模型 - 其他模式","tags":["重要"],"body":"除分层模式外，常用架构模型还包括：<ul><li><strong>管道-过滤器模式</strong>：数据流式处理</li><li><strong>客户/服务器模式(C/S)</strong>：客户端请求，服务器响应</li><li><strong>浏览器/服务器模式(B/S)</strong>：基于Web的三层架构</li><li><strong>面向对象模式</strong>：以对象为基本单元</li><li><strong>事件驱动模式</strong>：基于事件触发</li><li><strong>MVC模式</strong>：模型-视图-控制器分离</li><li><strong>微核模式</strong>：核心+插件</li></ul>"}]},{"sec":"4.2.5","title":"规划与设计","page":147,"summary":"架构规划与设计方法和流程","kps":[{"id":"kp_065","sec":"4.2.5","title":"组织战略规划体系特性","tags":["重要"],"body":"组织战略规划分为长期规划和短期规划两种。<ul><li><strong>长期规划</strong>：相对稳定，如调整产品结构等</li><li><strong>短期规划</strong>：根据长期规划目的制订，容易根据环境、组织运作情况改变，如决定新产品类型</li></ul><strong>组织的战略规划体系不是比较稳定的</strong>，会随着市场环境、组织目标等因素的变化而调整。"}]},{"sec":"4.2.6","title":"价值驱动的体系结构","page":153,"summary":"价值驱动的架构设计方法","kps":[{"id":"kp_066","sec":"4.2.6","title":"价值驱动的体系结构","tags":["重要"],"body":"<strong>价值驱动的体系结构</strong>强调架构设计应围绕<strong>价值创造</strong>展开：<ul><li>架构设计以<strong>业务价值</strong>为导向</li><li>关注架构对<strong>组织战略</strong>的支撑</li><li>平衡<strong>短期价值</strong>与<strong>长期价值</strong></li><li>通过架构治理保障价值持续交付</li></ul>价值驱动架构是<strong>ABCD</strong>（Architecture Business Capability Design）等方法的核心理念。"}]}],"kps":[]},{"sec":"4.3","title":"应用架构","page":156,"subs":[{"sec":"4.3.1","title":"基本原则","page":156,"summary":"应用架构设计原则","kps":[{"id":"kp_067","sec":"4.3.1","title":"应用架构基本原则","tags":["重要"],"body":"<strong>应用架构设计基本原则</strong>：<ul><li><strong>业务导向</strong>：应用架构支撑业务需求</li><li><strong>松耦合</strong>：应用间依赖最小化</li><li><strong>高内聚</strong>：应用内功能紧密相关</li><li><strong>可复用</strong>：公共能力沉淀复用</li><li><strong>可扩展</strong>：支持业务灵活扩展</li><li><strong>标准化</strong>：遵循统一技术标准和规范</li></ul>"}]},{"sec":"4.3.2","title":"分层分组","page":156,"summary":"应用架构分层(展示层-业务层-数据层)","kps":[{"id":"kp_068","sec":"4.3.2","title":"应用架构分层分组","tags":["重要"],"body":"<strong>应用架构分层分组</strong>：<ul><li><strong>展现层</strong>：用户交互界面</li><li><strong>应用层</strong>：业务逻辑处理</li><li><strong>服务层</strong>：公共业务服务</li><li><strong>数据层</strong>：数据访问和存储</li><li><strong>基础设施层</strong>：底层支撑</li></ul>分组按<strong>业务域</strong>划分应用，实现业务功能的聚合和内聚。"}]}],"kps":[]},{"sec":"4.4","title":"数据架构","page":158,"subs":[{"sec":"4.4.1","title":"发展演进","page":158,"summary":"数据架构发展历程","kps":[{"id":"kp_069","sec":"4.4.1","title":"数据架构发展演进","tags":["重要"],"body":"<strong>数据架构发展演进</strong>：<ol><li><strong>文件系统</strong>阶段：数据以文件方式存储</li><li><strong>数据库系统</strong>阶段：数据以数据库方式管理</li><li><strong>数据仓库</strong>阶段：面向主题、分析型数据存储</li><li><strong>数据湖</strong>阶段：原始数据统一存储</li><li><strong>湖仓一体</strong>阶段：融合数据湖和数据仓库优势</li></ol>"}]},{"sec":"4.4.2","title":"基本原则","page":159,"summary":"数据架构设计原则","kps":[{"id":"kp_070","sec":"4.4.2","title":"数据架构基本原则","tags":["重要"],"body":"<strong>数据架构设计基本原则</strong>：<ul><li><strong>数据统一管理</strong>：统一数据标准和口径</li><li><strong>数据共享</strong>：促进数据跨域共享</li><li><strong>数据安全</strong>：保障数据全生命周期安全</li><li><strong>数据质量</strong>：保障数据准确、完整、一致</li><li><strong>可扩展</strong>：支持数据量和数据类型的扩展</li><li><strong>分类分级</strong>：按敏感程度分类管理</li></ul>"}]},{"sec":"4.4.3","title":"架构举例","page":160,"summary":"典型数据架构案例","kps":[{"id":"kp_071","sec":"4.4.3","title":"数据架构举例","tags":["重要"],"body":"<strong>数据架构示例</strong>：<ul><li><strong>操作型数据存储(ODS)</strong>：面向操作型应用</li><li><strong>数据仓库(DW)</strong>：面向分析型应用，存储历史数据</li><li><strong>数据集市(DM)</strong>：面向特定主题或部门</li><li><strong>大数据平台</strong>：处理海量异构数据</li></ul>典型的数据架构遵循\"采集-存储-计算-服务\"的数据流。"}]}],"kps":[]},{"sec":"4.5","title":"技术架构","page":161,"subs":[{"sec":"4.5.1","title":"基本原则","page":161,"summary":"技术架构设计原则","kps":[{"id":"kp_072","sec":"4.5.1","title":"技术架构基本原则","tags":["重要"],"body":"<strong>技术架构设计基本原则</strong>：<ul><li><strong>标准化</strong>：采用主流技术标准</li><li><strong>开放性</strong>：支持开放接口和协议</li><li><strong>可扩展性</strong>：支持水平和垂直扩展</li><li><strong>高可用性</strong>：消除单点故障</li><li><strong>安全性</strong>：多层级安全保障</li><li><strong>可运维性</strong>：便于监控和管理</li></ul>"}]},{"sec":"4.5.2","title":"架构举例","page":162,"summary":"典型技术架构案例","kps":[{"id":"kp_073","sec":"4.5.2","title":"技术架构举例","tags":["重要"],"body":"<strong>技术架构示例</strong>：<ul><li><strong>基础设施层</strong>：服务器、存储、网络设备</li><li><strong>平台服务层</strong>：中间件、数据库、消息队列</li><li><strong>容器编排层</strong>：Docker、Kubernetes</li><li><strong>微服务网格</strong>：服务注册发现、负载均衡、熔断</li><li><strong>DevOps工具链</strong>：CI/CD、监控、日志</li></ul>"}]}],"kps":[]},{"sec":"4.6","title":"网络架构","page":163,"subs":[{"sec":"4.6.1","title":"基本原则","page":163,"summary":"网络架构设计原则","kps":[{"id":"kp_074","sec":"4.6.1","title":"网络架构基本原则","tags":["重要"],"body":"<strong>网络架构设计基本原则</strong>：<ul><li><strong>可靠性</strong>：网络冗余设计，避免单点故障</li><li><strong>安全性</strong>：多层次安全防护</li><li><strong>可扩展性</strong>：支持网络规模扩展</li><li><strong>可管理性</strong>：便于网络监控和管理</li><li><strong>高性能</strong>：满足带宽和延迟需求</li><li><strong>标准化</strong>：遵循国际和国家标准</li></ul>"}]},{"sec":"4.6.2","title":"局域网架构","page":163,"summary":"LAN架构设计","kps":[{"id":"kp_075","sec":"4.6.2","title":"局域网架构","tags":["重要"],"body":"<strong>局域网(LAN)</strong>架构通常采用层次化设计：<ul><li><strong>接入层</strong>：连接终端设备，提供网络接入</li><li><strong>汇聚层</strong>：汇聚接入层流量，实现策略控制</li><li><strong>核心层</strong>：高速数据转发，连接汇聚层</li></ul>常见的局域网技术：<strong>以太网、Wi-Fi、VLAN</strong>等。大型园区网通常采用三层架构，中小型网络可简化为二层。"}]},{"sec":"4.6.3","title":"广域网架构","page":166,"summary":"WAN架构设计","kps":[{"id":"kp_076","sec":"4.6.3","title":"广域网架构","tags":["重要"],"body":"<strong>广域网(WAN)</strong>架构连接不同地理位置的网络。<ul><li><strong>专线</strong>：点对点专用线路，如MSTP、OTN</li><li><strong>VPN</strong>：基于公网构建虚拟专用网络，如IPSec VPN、MPLS VPN</li><li><strong>SD-WAN</strong>：软件定义广域网，智能选路</li></ul>广域网设计需考虑带宽、延迟、可靠性和成本等因素。"}]},{"sec":"4.6.4","title":"移动通信网架构","page":170,"summary":"5G组网架构","kps":[{"id":"kp_077","sec":"4.6.4","title":"移动通信网架构","tags":["重要"],"body":"<strong>移动通信网</strong>架构演进：<ul><li><strong>2G</strong>：数字语音，GSM/CDMA</li><li><strong>3G</strong>：移动数据，WCDMA/CDMA2000/TD-SCDMA</li><li><strong>4G</strong>：移动互联网，LTE/LTE-Advanced</li><li><strong>5G</strong>：万物互联，三大场景：eMBB（增强移动宽带）、uRLLC（超低时延高可靠）、mMTC（海量机器通信）</li></ul>5G网络采用<strong>NSA（非独立组网）</strong>和<strong>SA（独立组网）</strong>两种模式。"}]},{"sec":"4.6.5","title":"软件定义网络","page":172,"summary":"SDN架构(应用层-控制层-基础设施层)","kps":[{"id":"kp_078","sec":"4.6.5","title":"软件定义网络(SDN)","tags":["重要","高频"],"body":"<strong>SDN(Software Defined Network)</strong>是一种新型网络架构，将网络控制面与数据面分离。<ul><li><strong>应用层</strong>：网络应用</li><li><strong>控制层</strong>：SDN控制器，集中控制网络</li><li><strong>基础设施层(数据层)</strong>：网络设备，负责数据转发</li></ul>特点：<strong>控制与转发分离、开放可编程接口、集中控制</strong>。<br>SDN的关键技术：<strong>OpenFlow协议、NETCONF/YANG</strong>等。"}]}],"kps":[]},{"sec":"4.7","title":"安全架构","page":172,"subs":[{"sec":"4.7.1","title":"安全威胁","page":173,"summary":"安全威胁分类","kps":[{"id":"kp_079","sec":"4.7.1","title":"安全威胁","tags":["重要"],"body":"<strong>安全威胁</strong>类型：<ul><li><strong>网络攻击</strong>：DDoS、SQL注入、跨站脚本等</li><li><strong>恶意软件</strong>：病毒、木马、勒索软件等</li><li><strong>社会工程学</strong>：钓鱼攻击等</li><li><strong>内部威胁</strong>：内部人员有意或无意泄露</li><li><strong>物理威胁</strong>：自然灾害、设备故障等</li></ul>威胁来源包括黑客、竞争对手、内部人员、自然灾害等。"}]},{"sec":"4.7.2","title":"定义和范围","page":174,"summary":"安全架构定义","kps":[{"id":"kp_080","sec":"4.7.2","title":"安全架构定义和范围","tags":["重要"],"body":"<strong>安全架构</strong>是为保障信息系统安全而设计的体系结构。<ul><li><strong>物理安全</strong>：机房、设备等物理层面的安全</li><li><strong>网络安全</strong>：网络传输和访问的安全</li><li><strong>主机安全</strong>：操作系统和服务器的安全</li><li><strong>应用安全</strong>：应用程序的安全</li><li><strong>数据安全</strong>：数据的保密性、完整性、可用性</li><li><strong>管理安全</strong>：安全管理制度和流程</li></ul>安全架构遵循<strong>纵深防御</strong>原则，多层级安全防护。"}]},{"sec":"4.7.3","title":"整体架构设计","page":175,"summary":"WPDRRC模型","kps":[{"id":"kp_081","sec":"4.7.3","title":"安全整体架构设计","tags":["重要"],"body":"<strong>安全整体架构设计</strong>遵循纵深防御策略：<ul><li><strong>安全防护</strong>：身份认证、访问控制、加密等</li><li><strong>安全检测</strong>：入侵检测、安全审计等</li><li><strong>安全响应</strong>：事件响应、应急处置等</li><li><strong>安全恢复</strong>：灾备恢复、业务连续性等</li></ul>安全架构设计应遵循<strong>等级保护</strong>要求，与业务架构同步规划。"}]},{"sec":"4.7.4","title":"网络安全架构设计","page":179,"summary":"网络安全架构分层设计","kps":[{"id":"kp_082","sec":"4.7.4","title":"网络安全架构设计","tags":["重要"],"body":"<strong>网络安全架构设计</strong>包括：<ul><li><strong>边界安全</strong>：防火墙、入侵检测/防御(IDS/IPS)</li><li><strong>网络隔离</strong>：DMZ、网络分段、VLAN隔离</li><li><strong>访问控制</strong>：网络访问控制(NAC)、VPN</li><li><strong>流量安全</strong>：流量加密、DPI深度包检测</li><li><strong>安全管理</strong>：安全运营中心(SOC)、SIEM</li></ul>"}]},{"sec":"4.7.5","title":"数据库系统安全设计","page":184,"summary":"数据库安全设计","kps":[{"id":"kp_083","sec":"4.7.5","title":"数据库系统安全设计","tags":["重要"],"body":"<strong>数据库系统安全设计</strong>包括：<ul><li><strong>身份认证</strong>：强密码策略、多因子认证</li><li><strong>访问控制</strong>：最小权限原则、角色访问控制(RBAC)</li><li><strong>数据加密</strong>：传输加密(TLS)、存储加密(TDE)</li><li><strong>审计追踪</strong>：数据库审计日志</li><li><strong>数据脱敏</strong>：敏感数据脱敏处理</li><li><strong>备份恢复</strong>：定期备份和容灾</li></ul>"}]},{"sec":"4.7.6","title":"安全架构设计案例分析","page":187,"summary":"案例分析","kps":[{"id":"kp_084","sec":"4.7.6","title":"安全架构设计案例分析","tags":["案例"],"body":"<strong>安全架构设计案例</strong>要点：<ul><li>分析业务需求和安全风险</li><li>确定安全保护等级</li><li>设计纵深防御体系</li><li>选择安全产品和技术</li><li>制定安全管理策略</li><li>规划安全运营流程</li></ul>案例通常涉及<strong>电子政务、金融、医疗</strong>等行业的安全架构设计，需结合等保2.0要求。"}]}],"kps":[]},{"sec":"4.8","title":"云原生架构","page":189,"subs":[{"sec":"4.8.1","title":"发展概述","page":189,"summary":"云原生发展历程","kps":[{"id":"kp_085","sec":"4.8.1","title":"云原生发展概述","tags":["重要"],"body":"<strong>云原生(Cloud Native)</strong>是面向云环境设计和运行应用的方法论。<ul><li>云原生发展经历了<strong>容器化→微服务→DevOps→持续交付</strong>的演进</li><li>CNCF（云原生计算基金会）是推动云原生发展的核心组织</li><li>云原生已成为云计算发展的主流方向</li></ul>云原生的代表技术包括<strong>容器、服务网格、微服务、不可变基础设施、声明式API</strong>等。"}]},{"sec":"4.8.2","title":"架构定义","page":191,"summary":"云原生架构定义","kps":[{"id":"kp_086","sec":"4.8.2","title":"云原生架构定义","tags":["重要"],"body":"<strong>云原生架构</strong>是基于云原生技术构建的、充分利用云平台弹性和分布式优势的架构。<ul><li><strong>容器</strong>：轻量级虚拟化，如Docker</li><li><strong>微服务</strong>：应用拆分为小型独立服务</li><li><strong>服务网格</strong>：如Istio，管理服务间通信</li><li><strong>不可变基础设施</strong>：基础设施以代码方式管理</li><li><strong>声明式API</strong>：如Kubernetes YAML</li></ul>"}]},{"sec":"4.8.3","title":"基本原则","page":192,"summary":"云原生设计原则(不可变基础设施-声明式API-微服务-无服务)","kps":[{"id":"kp_087","sec":"4.8.3","title":"云原生服务化原则","tags":["重要","高频"],"body":"<strong>服务化原则</strong>：当代码规模超出小团队的合作范围时，就有必要进行服务化拆分，包括拆分为<strong>微服务架构、小服务(MiniService)架构</strong>等。<ul><li>通过服务化架构把不同生命周期的模块分离，分别进行业务迭代</li><li>避免迭代频繁模块被慢速模块拖慢，加快整体进度和提升系统稳定性</li><li>以面向接口编程，服务内部功能高度内聚</li><li>模块间通过公共功能模块的提取增加软件复用程度</li></ul>"}]},{"sec":"4.8.4","title":"常用架构模式","page":194,"summary":"微服务架构-容器化-DevOps-持续交付","kps":[{"id":"kp_088","sec":"4.8.4","title":"云原生常用架构模式","tags":["重要"],"body":"<strong>云原生常用架构模式</strong>：<ul><li><strong>服务治理</strong>：服务注册发现、负载均衡、熔断降级、链路追踪</li><li><strong>弹性伸缩</strong>：根据负载自动扩缩容</li><li><strong>故障容错</strong>：健康检查、自动恢复、故障隔离</li><li><strong>配置管理</strong>：集中配置、动态更新</li><li><strong>API网关</strong>：统一入口、认证鉴权、限流</li></ul>"}]},{"sec":"4.8.5","title":"云原生案例","page":197,"summary":"云原生实践案例","kps":[{"id":"kp_089","sec":"4.8.5","title":"云原生案例","tags":["案例"],"body":"<strong>云原生应用案例</strong>：<ul><li><strong>容器化部署</strong>：使用Docker+Kubernetes部署应用</li><li><strong>微服务改造</strong>：单体应用拆分为微服务</li><li><strong>DevOps流水线</strong>：CI/CD持续交付</li><li><strong>服务网格</strong>：Istio/Linkerd管理服务通信</li><li><strong>Serverless</strong>：无服务器架构，按需运行</li></ul>云原生技术已在互联网、金融、政务等领域广泛应用。"}]}],"kps":[]},{"sec":"4.9","title":"本章练习","page":200,"subs":[],"kps":[]}]},{"n":5,"name":"软件工程","start_page":202,"sections":[{"sec":"5.1","title":"软件工程定义","page":202,"subs":[{"sec":"5.1","title":"软件工程定义","page":202,"summary":"软件工程定义:将系统化、规范化、可度量的方法应用于软件的开发、运行和维护。三要素:方法(技术方法)、工具(自动/半自动工具)、过程(活动序列)。软件工程化是实现软件产业化的基础","kps":[{"id":"kp_090","sec":"5.1","title":"软件工程定义","tags":["重要"],"body":"<strong>软件工程</strong>是将系统化的、规范化的、可度量的方法应用于软件的开发、运行和维护的过程。<ul><li><strong>方法</strong>：完成软件开发的各项任务的技术方法</li><li><strong>工具</strong>：为方法提供自动化或半自动化支持</li><li><strong>过程</strong>：为获得高质量软件所执行的一系列任务框架</li></ul>软件工程三要素：<strong>方法、工具、过程</strong>。"}]}],"kps":[]},{"sec":"5.2","title":"软件需求","page":202,"subs":[{"sec":"5.2.1","title":"需求的层次","page":203,"summary":"业务需求-用户需求-系统需求(功能+非功能)","kps":[{"id":"kp_091","sec":"5.2.1","title":"软件需求的层次","tags":["重要"],"body":"软件需求分为多个层次：<ul><li><strong>业务需求</strong>：反映组织或客户高层次的目标</li><li><strong>用户需求</strong>：用户使用系统需要完成的任务描述</li><li><strong>系统需求</strong>（功能需求）：系统应该具备的功能</li><li><strong>非功能需求</strong>：性能、安全、可靠性等质量属性</li><li><strong>设计约束</strong>：技术选择、标准法规等限制</li></ul>"}]},{"sec":"5.2.2","title":"质量功能部署","page":203,"summary":"QFD(常规需求-期望需求-意外需求)","kps":[{"id":"kp_092","sec":"5.2.2","title":"质量功能部署(QFD)","tags":["重要"],"body":"<strong>质量功能部署(QFD)</strong>是一种将用户需求转化为产品需求的方法。<ul><li><strong>常规需求</strong>：用户明确需求的功能</li><li><strong>期望需求</strong>：用户未明确但期望的功能</li><li><strong>意外需求</strong>：用户未意识到的功能</li></ul>QFD通过\"质量屋\"(House of Quality)矩阵将用户需求映射到技术特征。"}]},{"sec":"5.2.3","title":"需求获取","page":204,"summary":"用户访谈-问卷调查-观察-原型-头脑风暴","kps":[{"id":"kp_093","sec":"5.2.3","title":"软件需求获取","tags":["重要"],"body":"<strong>需求获取</strong>是从用户和干系人收集需求的过程，常用方法：<ul><li><strong>用户访谈</strong>：一对一或小组访谈</li><li><strong>问卷调查</strong>：大规模需求收集</li><li><strong>现场观察</strong>：观察用户工作流程</li><li><strong>原型法</strong>：快速构建原型验证需求</li><li><strong>头脑风暴</strong>：集思广益</li><li><strong>JAD联合需求开发</strong>：研讨会形式</li></ul>"}]},{"sec":"5.2.4","title":"需求分析","page":204,"summary":"结构化分析(SA:DFD-DD-数据字典-加工说明-ER图)、面向对象分析(OOA)","kps":[{"id":"kp_094","sec":"5.2.4","title":"软件需求定义与特征","tags":["重要"],"body":"<strong>软件需求</strong>是针对待解决问题的特性的描述。<ul><li><strong>所定义的需求必须可以被验证</strong></li><li>资源有限时，可以通过优先级对需求进行权衡</li><li>通过需求分析，可以<strong>检测和解决需求之间的冲突</strong></li><li>发现系统的边界</li><li>详细描述出系统需求</li></ul>"}]},{"sec":"5.2.5","title":"需求规格说明书","page":208,"summary":"SRS内容与作用","kps":[{"id":"kp_095","sec":"5.2.5","title":"需求规格说明书(SRS)","tags":["重要"],"body":"<strong>需求规格说明书(SRS)</strong>是需求分析阶段的产物，是软件需求的核心文档。<ul><li><strong>功能需求</strong>：系统应提供的功能</li><li><strong>非功能需求</strong>：性能、安全等质量属性</li><li><strong>设计约束</strong>：技术限制条件</li><li><strong>接口需求</strong>：用户接口、硬件接口等</li></ul>SRS的<strong>IEEE 830标准</strong>规定了需求文档的基本结构。"}]},{"sec":"5.2.6","title":"需求变更","page":210,"summary":"需求变更管理流程(CCB)","kps":[{"id":"kp_096","sec":"5.2.6","title":"需求变更","tags":["重要"],"body":"<strong>需求变更</strong>管理是需求工程的重要组成部分。<ul><li><strong>变更控制</strong>：通过CCB（变更控制委员会）审批变更</li><li><strong>变更影响分析</strong>：评估变更对成本、进度、质量的影响</li><li><strong>变更追溯</strong>：跟踪变更的来源和影响</li></ul>需求变更应遵循<strong>变更控制流程</strong>：提出变更→评估影响→审批→实施→验证。"}]},{"sec":"5.2.7","title":"需求跟踪","page":212,"summary":"需求跟踪矩阵(需求-设计-代码-测试)","kps":[{"id":"kp_097","sec":"5.2.7","title":"需求跟踪","tags":["重要"],"body":"<strong>需求跟踪</strong>是建立需求与设计、代码、测试用例等之间关系的过程。<ul><li><strong>前向跟踪</strong>：需求→设计→实现→测试</li><li><strong>后向跟踪</strong>：测试→实现→设计→需求</li><li><strong>需求跟踪矩阵(RTM)</strong>：记录需求与各制品的双向追溯关系</li></ul>需求跟踪确保每个需求都被实现和验证，变更影响可追溯。"}]}],"kps":[]},{"sec":"5.3","title":"软件设计","page":212,"subs":[{"sec":"5.3.1","title":"结构化设计","page":213,"summary":"SD方法:面向数据流的设计、变换流-事务流、HIPO图","kps":[{"id":"kp_098","sec":"5.3.1","title":"结构化设计","tags":["重要"],"body":"<strong>结构化设计</strong>是一种面向数据流的设计方法。<ul><li><strong>自顶向下、逐步求精</strong>的设计策略</li><li><strong>模块化</strong>：将系统分解为模块</li><li><strong>抽象</strong>：不同层次关注不同细节</li><li><strong>信息隐藏</strong>：模块内部细节对外隐藏</li><li><strong>高内聚低耦合</strong>：模块设计的基本原则</li></ul>主要工具：<strong>数据流图(DFD)、结构图、数据字典</strong>等。"}]},{"sec":"5.3.2","title":"面向对象设计","page":216,"summary":"OOD:类-对象-继承-多态-封装、设计原则(SOLID)","kps":[{"id":"kp_099","sec":"5.3.2","title":"面向对象设计 - 继承","tags":["重要","高频"],"body":"<strong>继承</strong>是从已有的类中派生出新的类，新的类能吸收已有类的数据属性和行为，并能扩展新的能力。<ul><li><strong>类</strong>是实例的抽象，<strong>对象</strong>是现实世界中某个实体的抽象</li><li>类是生成对象的模板</li><li>如：学生是一个类，大学生继承学生类，大学生张三就是一个对象</li></ul>面向对象三大特性：<strong>封装、继承、多态</strong>。"}]},{"sec":"5.3.3","title":"统一建模语言","page":217,"summary":"UML:13种图(用例-类-对象-构件-部署-活动-状态-顺序-通信-定时等)、关系(关联-依赖-泛化-实现)","kps":[{"id":"kp_100","sec":"5.3.3","title":"UML统一建模语言","tags":["重要","高频"],"body":"<strong>UML</strong>（Unified Modeling Language）是一种<strong>可视化的建模语言</strong>。<br><br>UML的图分为两大类：<ul><li><strong>结构图(静态)</strong>：类图、对象图、组件图、部署图、包图</li><li><strong>行为图(动态)</strong>：用例图、活动图、状态图、顺序图、协作图</li></ul>UML通过关系（关联、依赖、泛化、实现）描述元素间关系。"}]},{"sec":"5.3.4","title":"设计模式","page":220,"summary":"创建型-结构型-行为型23种设计模式","kps":[{"id":"kp_101","sec":"5.3.4","title":"设计模式","tags":["重要","高频"],"body":"<strong>设计模式</strong>是面向对象设计中反复使用的设计经验总结。GoF 23种设计模式分为三类：<ul><li><strong>创建型模式</strong>：对象创建，如工厂方法、抽象工厂、单例、建造者、原型</li><li><strong>结构型模式</strong>：类和对象组合，如适配器、桥接、组合、装饰器、外观、享元、代理</li><li><strong>行为型模式</strong>：对象间通信，如责任链、命令、解释器、迭代器、中介者、备忘录、观察者、状态、策略、模板方法、访问者</li></ul>"}]}],"kps":[]},{"sec":"5.4","title":"软件实现","page":220,"subs":[{"sec":"5.4.1","title":"软件配置管理","page":220,"summary":"配置项-基线-变更控制-版本控制","kps":[{"id":"kp_102","sec":"5.4.1","title":"软件配置管理","tags":["重要","高频"],"body":"<strong>软件配置管理(SCM)</strong>是管理软件变更的过程。<ul><li><strong>配置项</strong>：源代码、文档、数据等可管理的单元</li><li><strong>基线</strong>：已正式审定、作为后续开发基础的一组配置项</li><li><strong>配置库</strong>：动态库(开发库)、受控库(主库)、静态库、备份库</li><li><strong>变更控制</strong>：通过CCB审批变更</li><li><strong>配置审计</strong>：功能配置审计、物理配置审计</li></ul>"}]},{"sec":"5.4.2","title":"软件编码","page":221,"summary":"编码规范与风格","kps":[{"id":"kp_103","sec":"5.4.2","title":"软件编码","tags":["重要"],"body":"<strong>软件编码</strong>是将设计转化为可执行程序的过程。<ul><li><strong>编程规范</strong>：遵循统一的编码标准</li><li><strong>代码审查</strong>：同行评审发现缺陷</li><li><strong>静态分析</strong>：工具自动检查代码质量</li><li><strong>结对编程</strong>：两人协作编程（敏捷开发）</li><li><strong>重构</strong>：在不改变外部行为前提下改善内部结构</li></ul>编码阶段应注重<strong>可读性、可维护性、可测试性</strong>。"}]},{"sec":"5.4.3","title":"软件测试","page":222,"summary":"测试方法(静态-动态/白盒-黑盒-灰盒/单元-集成-系统-验收)、测试V模型","kps":[{"id":"kp_104","sec":"5.4.3","title":"软件测试","tags":["重要","高频"],"body":"<strong>软件测试</strong>是为发现程序错误而执行程序的过程。测试分类：<ul><li><strong>按阶段</strong>：单元测试、集成测试、系统测试、验收测试</li><li><strong>按方法</strong>：白盒测试（路径覆盖、语句覆盖）、黑盒测试（等价类划分、边界值分析）、灰盒测试</li><li><strong>按方向</strong>：功能测试、性能测试、安全测试</li></ul>测试原则：<strong>尽早测试、穷尽测试不可能、缺陷集群性、杀虫剂悖论</strong>。"}]}],"kps":[]},{"sec":"5.5","title":"部署交付","page":225,"subs":[{"sec":"5.5.1","title":"软件部署","page":225,"summary":"部署模式","kps":[{"id":"kp_105","sec":"5.5.1","title":"软件部署","tags":["重要"],"body":"<strong>软件部署</strong>是将软件从开发环境发布到生产环境的过程。<ul><li><strong>部署方式</strong>：手动部署、自动部署、蓝绿部署、金丝雀发布(灰度发布)</li><li><strong>部署策略</strong>：全量部署、增量部署、滚动部署</li><li><strong>回滚机制</strong>：部署失败时快速回退</li></ul>现代部署强调<strong>自动化</strong>和<strong>可重复性</strong>。"}]},{"sec":"5.5.2","title":"软件交付","page":226,"summary":"交付流程","kps":[{"id":"kp_106","sec":"5.5.2","title":"发布管理和交付活动任务","tags":["重要","高频"],"body":"发布管理和交付活动的主要任务：<ul><li>有效控制软件产品和文档的发行和交付</li><li>在软件产品的生存期内妥善保存代码和文档的<strong>母拷贝</strong></li><li>包括<strong>存储、复制、打包、交付、重建</strong></li></ul><strong>注意</strong>：确定可交付成果的正确性通常是在<strong>质量保证和质量控制过程</strong>完成的，不是发布管理和交付活动的主要任务。"}]},{"sec":"5.5.3","title":"持续交付","page":226,"summary":"持续交付理念","kps":[{"id":"kp_107","sec":"5.5.3","title":"持续交付","tags":["重要"],"body":"<strong>持续交付(CD)</strong>是一种软件工程方法，确保软件可以随时被安全地发布到生产环境。<ul><li><strong>持续集成(CI)</strong>：代码频繁合并到主干，自动构建和测试</li><li><strong>持续交付(CD)</strong>：CI基础上，自动部署到类生产环境，随时可发布</li><li><strong>流水线</strong>：构建→测试→部署的自动化流程</li></ul>持续交付的核心理念：<strong>每次变更都是可发布的</strong>。"}]},{"sec":"5.5.4","title":"持续部署","page":227,"summary":"持续部署","kps":[{"id":"kp_108","sec":"5.5.4","title":"持续部署","tags":["重要"],"body":"<strong>持续部署(CD)</strong>是持续交付的进一步延伸，每次代码变更通过测试后自动部署到生产环境。<ul><li>比持续交付更进一步：<strong>自动发布</strong>到生产环境</li><li>需要完善的<strong>自动化测试</strong>保障</li><li>需要<strong>灰度发布</strong>和<strong>快速回滚</strong>能力</li><li>需要完善的<strong>监控告警</strong>体系</li></ul>持续部署是DevOps实践的高级阶段。"}]},{"sec":"5.5.5","title":"部署和交付的新趋势","page":228,"summary":"DevOps-云原生部署","kps":[{"id":"kp_109","sec":"5.5.5","title":"部署和交付的新趋势","tags":["重要"],"body":"<strong>部署和交付新趋势</strong>：<ul><li><strong>DevOps</strong>：开发运维一体化，强调协作和自动化</li><li><strong>GitOps</strong>：以Git为唯一真源的基础设施即代码</li><li><strong>Serverless</strong>：无服务器部署，按需运行</li><li><strong>容器化部署</strong>：Docker+Kubernetes</li><li><strong>微服务部署</strong>：独立部署、独立扩展</li><li><strong>AIOps</strong>：AI驱动的智能运维</li></ul>"}]}],"kps":[]},{"sec":"5.6","title":"软件质量管理","page":228,"subs":[{"sec":"5.6","title":"软件质量管理","page":228,"summary":"软件质量管理:贯穿软件生命周期全过程的质量保证活动。包括质量计划-质量保证-质量控制-质量改进。核心是预防胜于检查,持续改进,客户满意。关注过程质量(开发过程)和产品质量(交付物)","kps":[{"id":"kp_110","sec":"5.6","title":"软件质量定义","tags":["重要"],"body":"<strong>软件质量</strong>指的是软件特性的总和，是软件满足用户需求的能力，即遵从用户需求，达到用户满意。<br><br>软件质量包括三部分：<ul><li><strong>内部质量</strong></li><li><strong>外部质量</strong></li><li><strong>使用质量</strong></li></ul>"},{"id":"kp_111","sec":"5.6","title":"管理评审的目的","tags":["重要"],"body":"<strong>管理评审</strong>的目的是<strong>监控进展，决定计划和进度的状态，或评价用于达到目标所用管理方法的有效性</strong>。"}]}],"kps":[]},{"sec":"5.7","title":"软件过程能力成熟度","page":230,"subs":[{"sec":"5.7.1","title":"成熟度模型","page":230,"summary":"CMMI","kps":[{"id":"kp_112","sec":"5.7.1","title":"软件过程能力成熟度模型","tags":["重要"],"body":"<strong>软件过程能力成熟度模型(CMM)</strong>是评估软件过程能力的框架。<ul><li><strong>CMM</strong>：美国卡内基梅隆大学提出，5个等级</li><li><strong>CMMI</strong>：CMM的升级集成版本</li><li><strong>CSMM</strong>：中国自主的软件过程能力成熟度模型</li></ul>CMMI有两种表示方式：<strong>阶段式</strong>（5个成熟度等级）和<strong>连续式</strong>（能力等级0-3）。"}]},{"sec":"5.7.2","title":"成熟度等级","page":231,"summary":"CMMI 5级(初始-已管理-已定义-量化管理-优化)","kps":[{"id":"kp_113","sec":"5.7.2","title":"软件成熟度等级","tags":["重要","高频"],"body":"CMMI<strong>阶段式</strong>5个成熟度等级：<ol><li><strong>初始级(1)</strong>：过程无序，成功依赖个人努力</li><li><strong>已管理级(2)</strong>：建立了基本的项目管理过程</li><li><strong>已定义级(3)</strong>：组织级标准过程已建立并使用</li><li><strong>量化管理级(4)</strong>：使用统计和量化技术管理过程</li><li><strong>优化级(5)</strong>：关注过程改进和创新</li></ol>CMMI<strong>连续式</strong>能力等级：0(不完整)、1(已执行)、2(已管理)、3(已定义)。"}]}],"kps":[]},{"sec":"5.8","title":"本章练习","page":232,"subs":[],"kps":[]}]},{"n":6,"name":"数据工程","start_page":234,"sections":[{"sec":"6.1","title":"数据采集和预处理","page":234,"subs":[{"sec":"6.1.1","title":"数据采集","page":234,"summary":"数据采集方法分类","kps":[{"id":"kp_114","sec":"6.1.1","title":"数据采集","tags":["重要"],"body":"<strong>数据采集</strong>是数据工程的第一步，从各种数据源获取原始数据。<ul><li><strong>内部数据</strong>：业务系统数据库、日志文件等</li><li><strong>外部数据</strong>：公开数据、爬虫数据、API接口数据</li><li><strong>物联网数据</strong>：传感器、设备采集数据</li></ul>常用工具：<strong>Flume（日志采集）、Sqoop（关系数据库采集）、Kafka（消息队列）、Logstash</strong>等。"}]},{"sec":"6.1.2","title":"数据预处理","page":235,"summary":"数据预处理目的","kps":[{"id":"kp_115","sec":"6.1.2","title":"数据预处理","tags":["重要"],"body":"<strong>数据预处理</strong>是对采集的原始数据进行清洗和标准化处理。<ul><li><strong>数据清洗</strong>：去除重复、填补缺失、纠正错误</li><li><strong>数据转换</strong>：格式转换、编码统一</li><li><strong>数据集成</strong>：多源数据整合</li><li><strong>数据归约</strong>：减少数据量但保持完整性</li></ul>ETL（Extract-Transform-Load）是数据预处理的核心过程。"}]},{"sec":"6.1.3","title":"数据预处理方法","page":235,"summary":"数据清洗-数据转换-数据集成-数据归约","kps":[{"id":"kp_116","sec":"6.1.3","title":"数据预处理方法","tags":["重要"],"body":"<strong>数据预处理方法</strong>：<ul><li><strong>缺失值处理</strong>：删除、均值填充、回归填充</li><li><strong>异常值处理</strong>：3σ原则、箱线图检测</li><li><strong>数据标准化</strong>：Min-Max标准化、Z-score标准化</li><li><strong>数据离散化</strong>：等宽、等频、聚类</li><li><strong>数据变换</strong>：对数变换、平滑变换</li><li><strong>特征选择</strong>：过滤法、包装法、嵌入法</li></ul>"}]}],"kps":[]},{"sec":"6.2","title":"数据存储及管理","page":236,"subs":[{"sec":"6.2.1","title":"数据存储","page":236,"summary":"存储介质与技术","kps":[{"id":"kp_117","sec":"6.2.1","title":"数据存储","tags":["重要"],"body":"<strong>数据存储</strong>技术根据数据类型选择不同方案：<ul><li><strong>结构化数据</strong>：关系数据库（MySQL、Oracle）</li><li><strong>半结构化数据</strong>：NoSQL（MongoDB、Redis）</li><li><strong>非结构化数据</strong>：对象存储（HDFS、S3）</li><li><strong>分布式存储</strong>：HDFS、Ceph</li></ul>存储类型对比：DAS、NAS、SAN。存储介质包括<strong>机械硬盘(HDD)、固态硬盘(SSD)、磁带</strong>等。"}]},{"sec":"6.2.2","title":"数据归档","page":238,"summary":"归档策略","kps":[{"id":"kp_118","sec":"6.2.2","title":"数据归档","tags":["重要"],"body":"<strong>数据归档</strong>是将不常访问的数据从主存储迁移到归档存储的过程。<ul><li><strong>目的</strong>：释放主存储空间、降低存储成本、满足合规要求</li><li><strong>归档策略</strong>：按时间、按访问频率</li><li><strong>归档介质</strong>：磁带、光盘、低成本硬盘</li><li><strong>归档管理</strong>：索引、检索、恢复</li></ul>归档数据应保持完整性和可读性。"}]},{"sec":"6.2.3","title":"数据备份","page":238,"summary":"完全备份-增量备份-差分备份","kps":[{"id":"kp_119","sec":"6.2.3","title":"数据备份","tags":["重要","高频"],"body":"<strong>数据备份</strong>是防止数据丢失的重要手段。备份策略：<ul><li><strong>完全备份</strong>：备份所有数据，恢复快但占用空间大</li><li><strong>增量备份</strong>：只备份上次备份后变化的数据</li><li><strong>差分备份</strong>：备份上次完全备份后变化的数据</li></ul>备份类型：<strong>热备份（在线备份）、冷备份（离线备份）</strong>。<br><strong>3-2-1原则</strong>：3份数据、2种介质、1份异地。"}]},{"sec":"6.2.4","title":"数据容灾","page":240,"summary":"RPO(恢复点目标)/RTO(恢复时间目标)、容灾等级(1-6级)","kps":[{"id":"kp_120","sec":"6.2.4","title":"容灾系统指标 RPO与RTO","tags":["重要","高频","计算"],"body":"衡量容灾系统有两个主要指标：<ul><li><strong>RPO</strong>（Recovery Point Object，恢复点目标）：代表当灾难发生时<strong>允许丢失的数据量</strong></li><li><strong>RTO</strong>（Recovery Time Object，恢复时间目标）：代表<strong>系统恢复的时间</strong></li></ul>数据容灾的关键技术主要包括<strong>远程镜像技术和快照技术</strong>。<br><br><strong>注意区分</strong>：远程镜像技术是实现容灾的技术手段，异地容灾是部署模式，数据备份策略是保障手段，<strong>均非衡量指标</strong>。"}]}],"kps":[]},{"sec":"6.3","title":"数据治理和建模","page":241,"subs":[{"sec":"6.3.1","title":"元数据","page":241,"summary":"元数据定义与分类(技术-业务-操作)","kps":[{"id":"kp_121","sec":"6.3.1","title":"元数据","tags":["重要"],"body":"<strong>元数据(Metadata)</strong>是描述数据的数据。<ul><li><strong>技术元数据</strong>：表结构、字段类型、索引等</li><li><strong>业务元数据</strong>：业务术语、指标定义等</li><li><strong>管理元数据</strong>：数据权限、数据流向等</li></ul>元数据管理是数据治理的基础，提供数据血缘追踪、数据字典等功能。"}]},{"sec":"6.3.2","title":"数据标准化","page":242,"summary":"数据标准体系","kps":[{"id":"kp_122","sec":"6.3.2","title":"数据标准化","tags":["重要"],"body":"<strong>数据标准化</strong>是统一数据格式和口径的过程。<ul><li><strong>数据格式标准化</strong>：日期、编码等格式统一</li><li><strong>数据编码标准化</strong>：主数据编码、行业编码</li><li><strong>数据口径标准化</strong>：指标定义统一</li><li><strong>数据交换标准</strong>：如XML、JSON格式规范</li></ul>数据标准化是数据共享和互操作的基础。"}]},{"sec":"6.3.3","title":"数据质量","page":243,"summary":"数据质量要素(完整性-准确性-一致性-唯一性-及时性-有效性)","kps":[{"id":"kp_123","sec":"6.3.3","title":"数据质量","tags":["重要"],"body":"<strong>数据质量</strong>是衡量数据满足使用要求的程度。数据质量维度：<ul><li><strong>完整性</strong>：数据是否缺失</li><li><strong>准确性</strong>：数据是否正确</li><li><strong>一致性</strong>：数据是否矛盾</li><li><strong>及时性</strong>：数据是否最新</li><li><strong>唯一性</strong>：数据是否重复</li><li><strong>有效性</strong>：数据是否符合规则</li></ul>数据质量管理是一个<strong>持续循环</strong>的过程。"}]},{"sec":"6.3.4","title":"数据模型","page":244,"summary":"概念模型-逻辑模型-物理模型","kps":[{"id":"kp_124","sec":"6.3.4","title":"数据模型","tags":["重要"],"body":"<strong>数据模型</strong>是对现实世界数据特征的抽象。<ul><li><strong>概念模型</strong>：面向业务用户，如E-R图</li><li><strong>逻辑模型</strong>：面向设计人员，如关系模型、层次模型、网状模型</li><li><strong>物理模型</strong>：面向实现，描述表结构、索引等</li></ul>数据模型的三个层次：<strong>概念模型→逻辑模型→物理模型</strong>。"}]},{"sec":"6.3.5","title":"数据建模","page":245,"summary":"建模方法(ER-维度-面向对象)","kps":[{"id":"kp_125","sec":"6.3.5","title":"数据建模","tags":["重要"],"body":"<strong>数据建模</strong>是创建数据模型的过程。<ul><li><strong>需求分析</strong>：理解业务需求</li><li><strong>概念建模</strong>：识别实体和关系</li><li><strong>逻辑建模</strong>：设计表结构和关系</li><li><strong>物理建模</strong>：设计物理存储结构</li></ul>常用建模方法：<strong>三范式建模(3NF)、维度建模(星型/雪花型)</strong>。<br>OLTP用三范式，OLAP用维度建模。"}]}],"kps":[]},{"sec":"6.4","title":"数据仓库和数据资产","page":246,"subs":[{"sec":"6.4.1","title":"数据仓库","page":246,"summary":"数据仓库特点(面向主题-集成-相对稳定-反映历史)","kps":[{"id":"kp_126","sec":"6.4.1","title":"数据仓库","tags":["重要","高频"],"body":"<strong>数据仓库(Data Warehouse)</strong>是面向主题的、集成的、相对稳定的、反映历史变化的数据集合，用于支持管理决策。<br><br>四个特性：<ul><li><strong>面向主题</strong>：按业务主题组织数据</li><li><strong>集成</strong>：整合多源数据</li><li><strong>相对稳定</strong>：数据一旦进入不再修改</li><li><strong>反映历史变化</strong>：包含历史数据</li></ul>数据仓库架构：数据源→ETL→ODS→DW→DM→前端工具。<br><img src=\"assets/image.png\">"}]},{"sec":"6.4.2","title":"主题库","page":247,"summary":"主题库建设","kps":[{"id":"kp_127","sec":"6.4.2","title":"主题库","tags":["重要"],"body":"<strong>主题库</strong>是围绕特定业务主题组织的数据集合。<ul><li><strong>主题</strong>是较高层次上将企业信息系统中的数据综合、归类后的分析对象</li><li>如：客户主题、产品主题、财务主题</li><li>主题库的数据来源于<strong>数据仓库</strong></li><li>主题库面向特定分析需求</li></ul>主题库是数据仓库的组成部分，支持特定领域的数据分析。"}]},{"sec":"6.4.3","title":"数据资产管理","page":247,"summary":"数据资产管理框架","kps":[{"id":"kp_128","sec":"6.4.3","title":"数据资产管理","tags":["重要"],"body":"<strong>数据资产管理</strong>是对数据资产进行全生命周期管理的过程。<ul><li><strong>数据资产盘点</strong>：梳理数据资产清单</li><li><strong>数据资产编目</strong>：建立数据资产目录</li><li><strong>数据资产估值</strong>：评估数据资产价值</li><li><strong>数据资产运营</strong>：数据资产交易和变现</li><li><strong>数据资产治理</strong>：数据资产质量管理</li></ul>数据资产管理的目标是<strong>实现数据资产价值最大化</strong>。"}]},{"sec":"6.4.4","title":"数据资源编目","page":248,"summary":"数据资源编目方法","kps":[{"id":"kp_129","sec":"6.4.4","title":"数据资源编目","tags":["重要"],"body":"<strong>数据资源编目</strong>是对数据资源进行分类和编目管理。<ul><li><strong>元数据管理</strong>：描述数据资源</li><li><strong>分类分级</strong>：按类别和敏感程度分类</li><li><strong>编目体系</strong>：建立树状编目结构</li><li><strong>检索服务</strong>：支持关键词、分类检索</li></ul>数据资源编目是数据共享和开放的基础。"}]}],"kps":[]},{"sec":"6.5","title":"数据分析及应用","page":249,"subs":[{"sec":"6.5.1","title":"数据集成","page":249,"summary":"ETL/ELT","kps":[{"id":"kp_130","sec":"6.5.1","title":"数据集成","tags":["重要"],"body":"<strong>数据集成</strong>是将多源异构数据整合为统一视图的过程。<ul><li><strong>ETL</strong>：抽取-转换-加载</li><li><strong>ELT</strong>：抽取-加载-转换（先加载后转换）</li><li><strong>数据联邦</strong>：虚拟集成，不移动数据</li><li><strong>数据复制</strong>：源数据复制到目标</li><li><strong>API集成</strong>：通过接口获取数据</li></ul>常用工具：<strong>Informatica、DataX、Sqoop、Kettle</strong>等。"}]},{"sec":"6.5.2","title":"数据挖掘","page":251,"summary":"分类-聚类-回归-关联-时间序列","kps":[{"id":"kp_131","sec":"6.5.2","title":"数据挖掘","tags":["重要","高频"],"body":"<strong>数据挖掘</strong>是从大量数据中发现隐藏的、有价值的模式和知识的过程。<ul><li><strong>分类</strong>：决策树、朴素贝叶斯、SVM</li><li><strong>聚类</strong>：K-Means、DBSCAN</li><li><strong>关联规则</strong>：Apriori、FP-Growth</li><li><strong>回归</strong>：线性回归、逻辑回归</li><li><strong>时序分析</strong>：ARIMA</li></ul>数据挖掘流程：<strong>CRISP-DM</strong>（业务理解→数据理解→数据准备→建模→评估→部署）。"}]},{"sec":"6.5.3","title":"数据服务","page":253,"summary":"数据服务化","kps":[{"id":"kp_132","sec":"6.5.3","title":"数据服务","tags":["重要"],"body":"<strong>数据服务</strong>是将数据能力以服务方式提供给应用系统。<ul><li><strong>数据API</strong>：RESTful接口提供数据访问</li><li><strong>数据订阅</strong>：消息队列方式推送数据</li><li><strong>数据共享</strong>：数据交换平台</li><li><strong>DaaS</strong>：数据即服务</li></ul>数据服务的目标是实现数据的<strong>一次接入、多次复用</strong>。"}]},{"sec":"6.5.4","title":"数据可视化","page":254,"summary":"可视化方法与工具","kps":[{"id":"kp_133","sec":"6.5.4","title":"数据可视化","tags":["重要"],"body":"<strong>数据可视化</strong>是将数据转换为图形化表达的过程。<ul><li><strong>图表类型</strong>：柱状图、折线图、饼图、散点图、热力图、树图等</li><li><strong>可视化工具</strong>：ECharts、Tableau、PowerBI、Grafana</li><li><strong>大屏展示</strong>：数据大屏、指挥中心</li><li><strong>交互式分析</strong>：钻取、切片、旋转</li></ul>好的可视化应遵循<strong>简洁、准确、美观、有效</strong>原则。"}]}],"kps":[]},{"sec":"6.6","title":"数据脱敏和分类分级","page":255,"subs":[{"sec":"6.6.1","title":"数据脱敏","page":255,"summary":"脱敏方法(掩码-替换-混淆-泛化)","kps":[{"id":"kp_134","sec":"6.6.1","title":"数据脱敏","tags":["重要"],"body":"<strong>数据脱敏</strong>是对敏感数据进行变形处理，保护隐私信息。<ul><li><strong>静态脱敏</strong>：对存储数据进行脱敏，永久性</li><li><strong>动态脱敏</strong>：对访问时实时脱敏，按权限返回不同数据</li></ul>脱敏方法：<ul><li><strong>掩码</strong>：如手机号显示为138****8888</li><li><strong>替换</strong>：用虚拟值替换</li><li><strong>置乱</strong>：随机打乱</li><li><strong>截断</strong>：截取部分数据</li><li><strong>加密</strong>：可逆/不可逆加密</li></ul>"}]},{"sec":"6.6.2","title":"数据分类","page":256,"summary":"数据分类方法","kps":[{"id":"kp_135","sec":"6.6.2","title":"数据分类","tags":["重要"],"body":"<strong>数据分类</strong>是按数据的属性和用途进行分门别类。<ul><li><strong>按性质</strong>：公开数据、内部数据、敏感数据、涉密数据</li><li><strong>按业务</strong>：客户数据、财务数据、运营数据</li><li><strong>按结构</strong>：结构化、半结构化、非结构化</li></ul>数据分类是数据分级和差异化保护的基础。"}]},{"sec":"6.6.3","title":"数据分级","page":257,"summary":"数据分级标准","kps":[{"id":"kp_136","sec":"6.6.3","title":"数据分级","tags":["重要"],"body":"<strong>数据分级</strong>是按数据的重要程度和敏感程度确定保护级别。<ul><li><strong>公开级</strong>：可公开发布</li><li><strong>内部级</strong>：限组织内部使用</li><li><strong>敏感级</strong>：涉及个人隐私或商业秘密</li><li><strong>涉密级</strong>：涉及国家安全</li></ul>不同级别数据采取不同的安全保护措施，实现<strong>分类分级管理</strong>。"}]}],"kps":[]},{"sec":"6.7","title":"本章练习","page":257,"subs":[],"kps":[]}]},{"n":7,"name":"软硬件系统集成","start_page":259,"sections":[{"sec":"7.1","title":"系统集成基础","page":259,"subs":[{"sec":"7.1","title":"系统集成基础","page":259,"summary":"系统集成基础:系统集成是将计算机软件、硬件、通信网络、数据等按整体目标组织起来发挥整体效益。分类:基础设施集成、软件集成、数据集成、应用集成。遵循开放性、标准化、可扩展性、可管理性原则","kps":[{"id":"kp_137","sec":"7.1","title":"系统集成基础","tags":["重要"],"body":"<strong>系统集成</strong>是将计算机软件、硬件、网络通信等技术和设备整合为满足用户需求的、一体化的系统过程。<ul><li><strong>目标</strong>：整体性能最优、总体拥有成本最低</li><li><strong>特点</strong>：跨学科、跨技术、跨平台</li><li><strong>原则</strong>：开放性、标准化、可扩展性、可靠性、安全性</li></ul>系统集成包括<strong>基础设施集成、软件集成、数据集成、应用集成</strong>等。"}]}],"kps":[]},{"sec":"7.2","title":"基础设施集成","page":261,"subs":[{"sec":"7.2.1","title":"弱电工程","page":261,"summary":"弱电系统组成(综合布线-安防-广播-会议)","kps":[{"id":"kp_138","sec":"7.2.1","title":"弱电工程","tags":["重要"],"body":"<strong>弱电工程</strong>是建筑智能化系统的基础，工作电压一般在36V以下。主要子系统：<ul><li><strong>综合布线系统</strong>：建筑物内通信线路</li><li><strong>安防系统</strong>：视频监控、门禁、报警</li><li><strong>楼宇自控系统</strong>：空调、照明、电梯控制</li><li><strong>公共广播系统</strong>：背景音乐、应急广播</li><li><strong>机房工程</strong>：UPS、精密空调、防静电</li></ul>"}]},{"sec":"7.2.2","title":"网络集成","page":263,"summary":"网络集成方案设计","kps":[{"id":"kp_139","sec":"7.2.2","title":"网络集成","tags":["重要"],"body":"<strong>网络集成</strong>是构建计算机网络系统的过程。<ul><li><strong>网络设计</strong>：需求分析→拓扑设计→设备选型</li><li><strong>层次化设计</strong>：核心层、汇聚层、接入层</li><li><strong>网络设备</strong>：路由器、交换机、防火墙、负载均衡器</li><li><strong>网络协议</strong>：TCP/IP、OSPF、BGP等</li></ul>网络集成需考虑<strong>可靠性、安全性、可扩展性、性能</strong>。"}]},{"sec":"7.2.3","title":"数据中心集成","page":264,"summary":"数据中心集成内容","kps":[{"id":"kp_140","sec":"7.2.3","title":"数据中心集成","tags":["重要"],"body":"<strong>数据中心集成</strong>是构建数据中心（机房）的工程。<ul><li><strong>机房设施</strong>：装修、供电、空调、消防、安防</li><li><strong>IT基础设施</strong>：服务器、存储、网络</li><li><strong>等级标准</strong>：GB 50174《数据中心设计规范》A/B/C三级</li><li><strong>TIA-942标准</strong>：Tier I~IV四个等级</li></ul>数据中心选址应考虑：地理位置、电力供应、通信条件、自然环境等因素。"}]}],"kps":[]},{"sec":"7.3","title":"软件集成","page":266,"subs":[{"sec":"7.3.1","title":"基础软件集成","page":266,"summary":"OS-数据库-中间件集成","kps":[{"id":"kp_141","sec":"7.3.1","title":"基础软件集成","tags":["重要"],"body":"<strong>基础软件集成</strong>包括操作系统、数据库、中间件等基础软件的集成。<ul><li><strong>操作系统</strong>：Windows、Linux、国产操作系统</li><li><strong>数据库</strong>：Oracle、MySQL、国产数据库</li><li><strong>中间件</strong>：应用服务器、消息队列、缓存</li><li><strong>集成要点</strong>：兼容性、性能、可靠性、安全</li></ul>信创（信息技术应用创新）背景下，国产基础软件集成是重要趋势。"}]},{"sec":"7.3.2","title":"应用软件集成","page":271,"summary":"应用系统集成方法","kps":[{"id":"kp_142","sec":"7.3.2","title":"应用软件集成","tags":["重要","高频"],"body":"<strong>应用软件集成</strong>是实现不同应用系统间互操作和数据共享的过程。<ul><li><strong>数据集成</strong>：ETL、数据交换、数据总线</li><li><strong>应用集成</strong>：API接口、消息中间件</li><li><strong>界面集成</strong>：门户 Portal、单点登录(SSO)</li><li><strong>流程集成</strong>：工作流引擎、BPM</li></ul>集成模式：<strong>点对点、星型(ESB总线)、微服务</strong>等。"}]},{"sec":"7.3.3","title":"其他软件集成","page":275,"summary":"其他软件集成","kps":[{"id":"kp_143","sec":"7.3.3","title":"其他软件集成","tags":["重要"],"body":"<strong>其他软件集成</strong>主要包括：<ul><li><strong>安全软件集成</strong>：防火墙、入侵检测、杀毒、WAF等安全设备的集成管理</li><li><strong>运维管理集成</strong>：监控系统、日志系统、工单系统的集成</li><li><strong>文档管理集成</strong>：OA与文档管理系统的集成</li></ul>这些集成需要考虑<strong>兼容性、安全性、可管理性</strong>。"}]}],"kps":[]},{"sec":"7.4","title":"业务应用集成","page":276,"subs":[{"sec":"7.4","title":"业务应用集成","page":276,"summary":"业务应用集成:将不同业务应用系统通过接口、数据、流程等方式整合,实现业务协同。集成层次:表示集成(界面)、数据集成(数据库)、控制集成(应用逻辑)、过程集成(业务流程)。企业应用集成EAI是典型场景","kps":[{"id":"kp_144","sec":"7.4","title":"业务应用集成","tags":["重要","案例"],"body":"<strong>业务应用集成</strong>是将各类应用系统整合，支撑端到端业务流程。<ul><li><strong>业务流程整合</strong>：跨系统流程贯通</li><li><strong>数据贯通</strong>：主数据统一、数据一致性</li><li><strong>服务复用</strong>：公共能力服务化</li><li><strong>统一门户</strong>：一体化用户入口</li></ul>典型案例：<strong>电子政务一体化平台、企业ERP集成、智慧城市一体化</strong>等。业务应用集成是系统集成的最高层次。"}]}],"kps":[]},{"sec":"7.5","title":"本章练习","page":278,"subs":[],"kps":[]}]},{"n":8,"name":"信息安全工程","start_page":279,"sections":[{"sec":"8.1","title":"信息安全管理","page":279,"subs":[{"sec":"8.1.1","title":"保障要求","page":279,"summary":"信息安全保障要求","kps":[{"id":"kp_145","sec":"8.1.1","title":"信息安全CIA三属性","tags":["重要","高频"],"body":"信息安全属性和目标是：<strong>Confidentiality, Integrity, and Availability</strong>，即<strong>保密性、完整性和可用性</strong>，这是信息安全的三个基本属性和目标。<ul><li><strong>保密性</strong>（Confidentiality）：确保信息不被未授权访问</li><li><strong>完整性</strong>（Integrity）：保证信息不被篡改</li><li><strong>可用性</strong>（Availability）：保证信息在需要时可访问</li></ul>"},{"id":"kp_146","sec":"8.1.1","title":"信息安全保障要求","tags":["重要"],"body":"<strong>信息安全保障要求</strong>遵循<strong>纵深防御</strong>策略，从多层面保障安全：<ul><li><strong>人员安全</strong>：安全意识培训、背景调查</li><li><strong>物理安全</strong>：机房门禁、环境监控</li><li><strong>网络安全</strong>：防火墙、IDS/IPS、VPN</li><li><strong>主机安全</strong>：系统加固、漏洞修复</li><li><strong>应用安全</strong>：身份认证、访问控制</li><li><strong>数据安全</strong>：加密、备份、脱敏</li></ul>安全保障还包括<strong>检测、响应、恢复</strong>三个环节（PDR模型扩展）。"}]},{"sec":"8.1.2","title":"管理内容","page":280,"summary":"安全管理内容(安全策略-组织安全-资产管理-人员安全-物理环境-通信-操作-访问控制-开发-维护-业务连续性)","kps":[{"id":"kp_147","sec":"8.1.2","title":"信息安全管理内容","tags":["重要"],"body":"<strong>信息安全管理内容</strong>包括：<ul><li><strong>安全策略</strong>：制定信息安全方针和策略</li><li><strong>安全组织</strong>：建立安全管理组织架构</li><li><strong>安全人员</strong>：人员安全管理和培训</li><li><strong>安全制度</strong>：制定安全管理制度和流程</li><li><strong>安全运营</strong>：日常安全运营和事件处置</li><li><strong>安全审计</strong>：安全合规审计</li></ul>"},{"id":"kp_148","sec":"8.1.2","title":"应用系统保密技术四原则","tags":["重要"],"body":"应用系统常用的保密技术：<ol><li><strong>最小授权原则</strong></li><li><strong>防暴露</strong></li><li><strong>信息加密</strong></li><li><strong>物理保密</strong></li></ol>"},{"id":"kp_149","sec":"8.1.2","title":"安全和保密层次四层","tags":["重要"],"body":"应用系统运行中涉及的安全和保密层次包括：<ol><li><strong>系统级安全</strong>：系统整体安全策略和防护，如操作系统安全</li><li><strong>资源访问安全</strong>：对系统资源（文件、数据库等）的访问控制</li><li><strong>功能性安全</strong>：系统功能的安全运行，防止功能被滥用或破坏</li><li><strong>数据域安全</strong>：数据本身的安全保护，如保密性、完整性</li></ol>"}]},{"sec":"8.1.3","title":"管理体系","page":285,"summary":"ISMS信息安全管理体系","kps":[{"id":"kp_150","sec":"8.1.3","title":"信息安全管理体系","tags":["重要","法规"],"body":"<strong>信息安全管理体系(ISMS)</strong>是基于风险评估的信息安全管理方法。<ul><li><strong>ISO 27001</strong>：信息安全管理体系国际标准</li><li><strong>PDCA循环</strong>：Plan-Do-Check-Act 持续改进</li><li><strong>风险评估</strong>：识别资产、威胁、脆弱性、风险</li><li><strong>风险处置</strong>：规避、转移、降低、接受</li></ul>ISMS的核心是<strong>风险管理</strong>，通过管理和技术结合保障安全。"}]},{"sec":"8.1.4","title":"等级保护","page":287,"summary":"等级保护5级(自主-指导-监督-强制-专控)、定级要素","kps":[{"id":"kp_151","sec":"8.1.4","title":"等级保护五级安全保护能力","tags":["重要","高频","法规"],"body":"《信息安全技术网络安全等级保护基本要求》(GB/T 22239-2019)规定五级保护能力：<ul><li><strong>第一级</strong>：防护免受个人、拥有很少资源的威胁源攻击。损害后<strong>能恢复部分功能</strong>。</li><li><strong>第二级</strong>：防护免受外部小型组织、少量资源威胁源攻击。能发现安全漏洞和处置事件。损害后<strong>能在一段时间内恢复部分功能</strong>。</li><li><strong>第三级</strong>：在统一安全策略下防护免受外部有组织团体、较丰富资源威胁源攻击。能及时发现、监测攻击行为。损害后<strong>能较快恢复绝大部分功能</strong>。</li><li><strong>第四级</strong>：在统一安全策略下防护免受国家级别、敌对组织、丰富资源威胁源攻击。损害后<strong>能迅速恢复所有功能</strong>。</li><li><strong>第五级</strong>：标准中未给出具体内容</li></ul>"}]}],"kps":[]},{"sec":"8.2","title":"信息安全系统","page":290,"subs":[{"sec":"8.2.1","title":"安全机制","page":291,"summary":"安全机制(加密-数字签名-访问控制-数据完整性-交换认证-流量填充-路由控制-公证-流量分析)","kps":[{"id":"kp_152","sec":"8.2.1","title":"安全机制","tags":["重要"],"body":"<strong>安全机制</strong>是实现安全服务的具体技术手段。<ul><li><strong>加密机制</strong>：对称加密(AES)、非对称加密(RSA)、哈希(MD5/SHA)</li><li><strong>数字签名机制</strong>：身份认证、防抵赖</li><li><strong>访问控制机制</strong>：自主访问控制(DAC)、强制访问控制(MAC)、基于角色的访问控制(RBAC)</li><li><strong>数据完整性机制</strong>：校验和、MAC</li><li><strong>认证交换机制</strong>：Kerberos、证书</li><li><strong>流量填充机制</strong>：防止流量分析</li><li><strong>路由控制机制</strong>：选择安全路径</li><li><strong>公证机制</strong>：第三方公证</li></ul>"}]},{"sec":"8.2.2","title":"安全服务","page":292,"summary":"安全服务(认证-访问控制-数据保密性-数据完整性-抗抵赖)","kps":[{"id":"kp_153","sec":"8.2.2","title":"安全服务","tags":["重要"],"body":"<strong>安全服务</strong>是安全机制提供的功能，ISO 7498-2定义了五大安全服务：<ol><li><strong>认证(鉴别)服务</strong>：实体认证、数据源认证</li><li><strong>访问控制服务</strong>：防止未授权访问</li><li><strong>数据保密性服务</strong>：防止信息泄露</li><li><strong>数据完整性服务</strong>：防止数据篡改</li><li><strong>抗抵赖服务</strong>：防止发送方或接收方否认</li></ol>安全服务通过安全机制实现，是安全架构的核心组成部分。"}]}],"kps":[]},{"sec":"8.3","title":"工程体系架构","page":293,"subs":[{"sec":"8.3.1","title":"安全工程基础","page":293,"summary":"安全工程基础概念","kps":[{"id":"kp_154","sec":"8.3.1","title":"安全工程基础","tags":["重要"],"body":"<strong>信息安全系统工程</strong>是系统工程方法在信息安全领域的应用。<ul><li><strong>系统安全工程</strong>：将安全需求融入系统生命周期</li><li><strong>安全工程过程</strong>：发现安全需求→定义系统安全→设计安全架构→实施安全控制→评估安全有效性</li><li><strong>基本原则</strong>：安全应贯穿系统全生命周期，安全是系统工程的一部分</li></ul>安全工程强调<strong>安全左移</strong>（在设计和开发阶段考虑安全）。"}]},{"sec":"8.3.2","title":"ISSE-CMM基础","page":295,"summary":"ISSE-CMM能力成熟度模型","kps":[{"id":"kp_155","sec":"8.3.2","title":"ISSE-CMM基础","tags":["重要"],"body":"<strong>ISSE-CMM</strong>（Information System Security Engineering Capability Maturity Model）是信息系统安全工程能力成熟度模型。<ul><li>由<strong>ISO</strong>发布，用于评估安全工程能力</li><li>关注<strong>安全工程过程</strong>的能力评估</li><li>将安全工程过程分为若干<strong>过程域</strong></li><li>定义了<strong>5个能力等级</strong>（0-4级）</li></ul>ISSE-CMM强调<strong>过程改进</strong>和安全工程能力提升。"}]},{"sec":"8.3.3","title":"ISSE过程","page":295,"summary":"ISSE工程过程(发现信息保护需求-定义系统安全需求-设计系统安全体系结构-实施安全设计)","kps":[{"id":"kp_156","sec":"8.3.3","title":"ISSE过程","tags":["重要"],"body":"<strong>ISSE过程</strong>是信息系统安全工程过程，包括以下阶段：<ol><li><strong>发现安全需求</strong>：识别安全目标、需求和约束</li><li><strong>定义系统安全</strong>：制定安全策略和方案</li><li><strong>设计安全架构</strong>：设计安全体系结构</li><li><strong>实施安全控制</strong>：部署安全措施和机制</li><li><strong>评估安全有效性</strong>：评估安全措施是否有效</li></ol>ISSE过程强调安全与系统工程<strong>同步进行</strong>。"}]},{"sec":"8.3.4","title":"ISSE-CMM体系结构","page":298,"summary":"ISSE-CMM体系结构","kps":[{"id":"kp_157","sec":"8.3.4","title":"ISSE-CMM体系结构","tags":["重要"],"body":"<strong>ISSE-CMM体系结构</strong>由<strong>域维度</strong>和<strong>能力维度</strong>构成：<ul><li><strong>域维度（横向）</strong>：定义安全工程的<strong>过程域</strong>，如安全风险评估、安全需求分析、安全方案设计等</li><li><strong>能力维度（纵向）</strong>：定义每个过程域的<strong>能力等级</strong>：<ol><li>0级：未执行级</li><li>1级：非正式执行级</li><li>2级：计划跟踪级</li><li>3级：充分定义级</li><li>4级：量化控制级</li></ol></li></ul>两个维度构成二维模型，评估组织在各个过程域的能力水平。"}]}],"kps":[]},{"sec":"8.4","title":"本章练习","page":301,"subs":[],"kps":[]}]},{"n":9,"name":"项目管理概论","start_page":303,"sections":[{"sec":"9.1","title":"PMBOK的发展","page":303,"subs":[{"sec":"9.1","title":"PMBOK的发展","page":303,"summary":"PMBOK的发展:PMBOK(Project Management Body of Knowledge)由PMI发布,自1996年第一版以来经历多次演进。第6版引入敏捷实践,第7版基于原则重构。中国系统集成项目管理工程师教程以PMBOK第6版为核心框架","kps":[{"id":"kp_201","sec":"9.1","title":"PMBOK的发展历程","tags":["重要"],"body":"<strong>PMBOK</strong>（Project Management Body of Knowledge，项目管理知识体系指南）由美国项目管理协会（PMI）发布。<ul><li>1996年正式发布第1版</li><li>PMBOK第6版（2017）引入<strong>敏捷项目管理</strong>内容，包含49个过程、5大过程组、10大知识领域</li><li>PMBOK第7版（2021）实现重大变革：从基于过程的方法转向<strong>基于原则和基于绩效域</strong>的方法，不再以过程组为核心组织方式</li></ul>PMBOK的发展体现了项目管理从规范化、标准化向价值导向、适应性方向演进的趋势。"}]}],"kps":[]},{"sec":"9.2","title":"项目基本要素","page":304,"subs":[{"sec":"9.2.1","title":"项目基础","page":304,"summary":"项目定义(临时性-独特性-渐进明细)、项目目标(范围-进度-成本-质量)","kps":[{"id":"kp_203","sec":"9.2.1","title":"项目基础 - 临时性与独特性","tags":["重要","高频"],"body":"<strong>项目</strong>是为创造独特的产品、服务或成果而进行的<strong>临时性</strong>工作。<ul><li><strong>临时性</strong>：项目有明确的开始和结束时间。结束时指项目的产品/服务按计划完成，或项目被终止，或需求消失。临时性不意味着持续时间短。</li><li><strong>独特性</strong>：项目所创造的产品、服务或成果是独特的。即使使用相同资源，不同项目也存在差异。</li><li><strong>渐进明细</strong>：项目的目标和范围随着项目和有关环境信息的不断积累而逐步细化。项目逐步完善的特点与项目范围和临时性密切相关。</li></ul><strong>项目与运营的区别</strong>：运营是<strong>持续不断、重复进行</strong>的活动（如生产流水线），项目是临时性、独特性的工作。"}]},{"sec":"9.2.2","title":"项目管理","page":306,"summary":"项目管理定义(5过程组-10知识领域-49过程)","kps":[{"id":"kp_204","sec":"9.2.2","title":"项目管理定义与五大过程组","tags":["重要","高频"],"body":"<strong>项目管理</strong>是将知识、技能、工具与技术应用于项目活动，以满足项目的要求。<br><br>项目管理通过<strong>5大过程组、10大知识领域、49个过程</strong>来实现：<ul><li><strong>5大过程组</strong>：启动过程组、规划过程组、执行过程组、监控过程组、收尾过程组</li><li><strong>10大知识领域</strong>：整合管理、范围管理、进度管理、成本管理、质量管理、资源管理、沟通管理、风险管理、采购管理、干系人（干系人）管理</li></ul>项目管理需在相互竞争的<strong>范围、进度、成本、质量、资源、风险</strong>等制约因素之间寻求平衡。"}]},{"sec":"9.2.3","title":"项目成功的标准","page":307,"summary":"传统标准(铁三角:时间-成本-范围-质量)、现代标准(干系人满意度-价值)","kps":[{"id":"kp_205","sec":"9.2.3","title":"项目成功的标准","tags":["重要"],"body":"<strong>项目成功的标准</strong>因项目和干系人不同而异，需要项目开始时<strong>明确并达成共识</strong>。<ul><li><strong>传统标准</strong>：时间（进度）、成本（预算）、范围、质量——即项目\"铁三角\"</li><li><strong>现代/扩展标准</strong>：干系人满意度、项目目标实现、商业价值创造、社会效益、可持续性</li></ul>项目成功标准不是一成不变的，应在项目生命周期中持续评估。项目成功不仅取决于项目经理，还取决于组织、干系人、产品所有者等。"}]},{"sec":"9.2.4","title":"项目、项目集、项目组合和运营管理之间的关系","page":308,"summary":"项目集(相关项目集合)、项目组合(战略目标下的项目/项目集/运营组合)","kps":[{"id":"kp_206","sec":"9.2.4","title":"项目/项目集/项目组合和运营管理之间的关系","tags":["重要","高频"],"body":"<ul><li><strong>项目集（Program）</strong>：一组相互关联且被协调管理的<strong>项目、子项目集和项目集活动</strong>，目的是获得单个项目单独管理无法获得的收益。侧重对项目间依赖关系的管理。</li><li><strong>项目组合（Portfolio）</strong>：为实现战略目标而集中管理的<strong>项目、项目集、子项目组合和运营</strong>的集合。侧重战略对齐和资源优化。</li><li><strong>运营管理</strong>：负责<strong>持续、重复</strong>的生产活动，关注业务连续性。不属于项目组合的\"组件\"范畴，但项目可改善运营。</li></ul><strong>层级关系</strong>：战略 → 项目组合 → 项目集 → 项目。项目集和项目都为实现战略目标服务。"}]},{"sec":"9.2.5","title":"项目运行环境","page":312,"summary":"EEF事业环境因素(内部+外部)、OPA组织过程资产","kps":[{"id":"kp_207","sec":"9.2.5","title":"项目运行环境 - EEF与OPA","tags":["重要"],"body":"项目运行环境由<strong>事业环境因素(EEF)</strong>（EEF）和<strong>组织过程资产(OPA)</strong>（OPA）构成。<br><br><strong>事业环境因素(EEF)（EEF）</strong>：项目团队无法控制、将影响/限制/指挥项目的影响因素。<ul><li><strong>内部的</strong>：组织文化/结构/治理、设施/资源、信息系统软件、员工能力等</li><li><strong>外部的</strong>：市场环境、政府/行业标准、法律/法规要求、政治环境、文化和社会影响等</li></ul><strong>组织过程资产(OPA)（OPA）</strong>：组织使用的政策、过程、模板、知识库等。<ul><li>过程、政策、流程和程序</li><li>组织知识库（经验教训、历史信息等）</li></ul>"}]},{"sec":"9.2.6","title":"组织系统","page":314,"summary":"组织结构类型(职能型-矩阵型-项目型)、PMO类型(支持型-控制型-指令型)","kps":[{"id":"kp_208","sec":"9.2.6","title":"组织系统 - 组织结构与PMO类型","tags":["重要","高频"],"body":"<strong>组织结构类型</strong>（按项目经理权力递增）：<ol><li><strong>职能型</strong>：项目经理权力很弱，按职能划分部门</li><li><strong>弱矩阵型</strong>：项目经理权力弱</li><li><strong>平衡矩阵型</strong>：项目经理权力中等</li><li><strong>强矩阵型</strong>：项目经理权力强</li><li><strong>项目型</strong>：项目经理权力很强</li><li><strong>复合型</strong>：多种结构混合</li></ol><strong>PMO（项目管理办公室）三种类型</strong>按管控力度划分：<ul><li><strong>支持型</strong>：提供模板、培训、咨询，管控力度<strong>最弱</strong></li><li><strong>控制型</strong>：制定统一流程标准，要求项目遵循，具备一定管控权</li><li><strong>指令型</strong>：直接管理项目，项目经理由PMO任命并向其汇报，管控力度<strong>最强</strong></li></ul><img src=\"assets/image 2.png\">"}]},{"sec":"9.2.7","title":"项目管理和产品管理","page":317,"summary":"项目(临时-独特)vs产品(持续-迭代)","kps":[{"id":"kp_209","sec":"9.2.7","title":"项目管理和产品管理","tags":["重要"],"body":"<ul><li><strong>项目管理</strong>：临时性、独特性，关注\"按时按预算交付既定范围的成果\"</li><li><strong>产品管理</strong>：关注产品从构思到退出市场的<strong>整个生命周期</strong>，具有持续性、迭代性，关注产品价值最大化和市场竞争力</li></ul>一个产品生命周期内可以包含多个项目，产品管理可能需要开展或包含项目管理。两者均需适应变化、关注价值创造、涉及干系人管理，但<strong>时间属性不同</strong>（临时 vs 持续）。"}]}],"kps":[{"id":"kp_202","sec":"9.2","title":"项目基本要素总览","tags":["重要"],"body":"项目的<strong>基本要素</strong>决定了项目特征及实施方式。基本要素包括：<ol><li><strong>项目基础</strong>：临时性、独特性、渐进明细</li><li><strong>项目管理</strong>：将知识、技能、工具与技术应用于项目活动</li><li><strong>项目成功的标准</strong>：现代项目关注价值和干系人满意度</li><li><strong>项目/项目集/项目组合/运营管理关系</strong></li><li><strong>项目运行环境</strong>：事业环境因素(EEF)EEF与组织过程资产(OPA)OPA</li><li><strong>组织系统</strong>：组织结构类型与PMO</li><li><strong>项目管理和产品管理</strong>：临时性与持续性</li></ol>事业环境因素(EEF)分为内部和外部两类，共同影响项目开展。<img src=\"assets/image 1.png\">"}]},{"sec":"9.3","title":"项目经理的角色","page":318,"subs":[{"sec":"9.3","title":"项目经理的角色","page":318,"summary":"项目经理的角色:项目经理是项目成功的关键人物,职责包括:技术-业务-项目三重能力。角色定位:战略和项目之间纽带、团队领导、沟通协调者、问题解决者。影响力来源:正式(职位)、非正式(专业、参照)","kps":[{"id":"kp_210","sec":"9.3","title":"项目经理的角色与能力","tags":["重要"],"body":"<strong>项目经理</strong>由执行组织委派，负责领导团队实现项目目标。<br><br><strong>影响力范围</strong>：<ul><li>项目内：领导项目团队</li><li>组织内/跨组织：与职能经理互动，影响组织</li><li>行业和跨学科：在专业领域发展，参与跨学科合作</li></ul><strong>项目经理的能力（PMI人才三角）</strong>：<ol><li><strong>技术项目管理技能</strong>：有效运用项目管理知识实现成果</li><li><strong>领导力</strong>：指导、激励和带领团队</li><li><strong>战略和商业管理技能</strong>：帮助项目实现商业价值</li></ol>"}]}],"kps":[]},{"sec":"9.4","title":"项目生命周期和项目阶段","page":318,"subs":[{"sec":"9.4.1","title":"定义与特征","page":318,"summary":"生命周期特征(成本/人力先低后高再低-风险先高后低-干系人影响先强后弱-变更代价先低后高)","kps":[{"id":"kp_211","sec":"9.4.1","title":"项目生命周期定义与特征","tags":["重要","高频"],"body":"<strong>项目生命周期</strong>：项目从启动到收尾所经历的一系列阶段。<br><br><strong>特征</strong>：<ul><li>成本和人力投入在项目开始时<strong>较低</strong>，随工作进展而<strong>逐渐增加</strong>，在项目接近收尾时<strong>迅速回落</strong></li><li><strong>风险和不确定性</strong>在项目开始时<strong>最大</strong>，随项目进展而<strong>逐渐减少</strong></li><li><strong>干系人影响项目最终产品特性的能力</strong>在项目开始时<strong>最强</strong>，随项目进展而<strong>逐渐减弱</strong></li><li><strong>变更和纠错代价</strong>随项目进展而<strong>逐渐增加</strong></li></ul>项目阶段通常按顺序排列，阶段的结束以<strong>阶段评审/阶段关口</strong>为标志。"}]},{"sec":"9.4.2","title":"生命周期类型","page":320,"summary":"预测型(瀑布)-迭代型(增量)-适应型(敏捷)-混合型","kps":[{"id":"kp_212","sec":"9.4.2","title":"项目生命周期类型","tags":["重要","高频"],"body":"<ol><li><strong>预测型（瀑布型）</strong>：范围、进度和成本在项目早期阶段确定，按顺序执行。适用于需求明确、变更少的项目。</li><li><strong>迭代型</strong>：通过一系列重复循环活动来增加产品功能，按时间逐步完善。关注正确性。</li><li><strong>增量型</strong>：渐进地增加产品功能，按预定时间段逐步交付。关注速度。</li><li><strong>适应型（敏捷型）</strong>：<strong>迭代+增量</strong>，短周期(冲刺)迭代，每次迭代交付可用的产品增量。响应频繁变更。</li><li><strong>混合型</strong>：预测型与适应型的结合，不同部分采用不同生命周期。</li></ul><strong>辨析</strong>：迭代型关注功能完善，增量型关注分批交付，适应型兼具两者且强调短迭代和快速反馈。"}]}],"kps":[]},{"sec":"9.5","title":"项目立项管理","page":322,"subs":[{"sec":"9.5.1","title":"项目建议与立项申请","page":322,"summary":"项目建议书内容","kps":[{"id":"kp_213","sec":"9.5.1","title":"项目建议与立项申请","tags":["重要"],"body":"<strong>项目建议书</strong>是项目建设单位向上级主管部门提交的申请，是对项目的设想和概要分析。内容一般包括：<ol><li>项目名称、必要性和依据</li><li>项目概况（建设方案、规模、地点等）</li><li>投资估算和资金筹措</li><li>项目进度建议</li><li>项目效益初步分析</li></ol><strong>立项申请</strong>经主管部门批准后，项目进入可行性研究阶段。"}]},{"sec":"9.5.2","title":"项目可行性研究","page":323,"summary":"机会研究-初步研究-详细研究;技术-经济-社会可行性","kps":[{"id":"kp_214","sec":"9.5.2","title":"可行性研究三阶段与七项内容","tags":["重要","高频"],"body":"<strong>可行性研究三阶段</strong>（由浅入深）：<ol><li><strong>机会可行性研究</strong>：对投资项目或投资方提出建议，寻找最佳投资机会，目的是<strong>激发投资者兴趣</strong></li><li><strong>初步可行性研究</strong>：在机会研究基础上进一步判断项目是否有进行详细可行性研究的必要性。<strong>某些情况下可省去</strong></li><li><strong>详细可行性研究</strong>：深入分析项目各方面，<strong>费时、费力、需要资金支持</strong>，是最终决策依据</li></ol><strong>可行性研究七项内容</strong>：<ol><li>投资必要性</li><li>技术可行性</li><li>财务可行性</li><li>组织可行性</li><li>经济可行性</li><li>社会可行性</li><li>风险因素及对策</li></ol><strong>注意</strong>：项目真实性评价一般在前期立项环节核实，<strong>不属于</strong>可行性研究内容。"}]},{"sec":"9.
