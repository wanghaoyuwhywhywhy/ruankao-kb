function buildTOC(){
  const toc=document.getElementById('toc');
  let h='';
  DATA.forEach(ch=>{
    h+='<div class="toc-ch" onclick="scrollToCh('+ch.n+')">第'+ch.n+'章 '+ch.name+'</div>';
    ch.sections.forEach(s=>{
      h+='<div class="toc-sec" onclick="scrollToSec('+ch.n+',\''+s.sec+'\')">§ '+s.sec+' '+s.title+'</div>';
    });
  });
  toc.innerHTML=h;
}

function buildMain(){
  const main=document.getElementById('main');
  let h='';
  DATA.forEach(ch=>{
    h+='<div class="ch-block" id="ch'+ch.n+'">';
    h+='<h2 class="ch-title">第'+ch.n+'章 · '+ch.name+'</h2>';
    h+='<div class="ch-page">📖 起始页码: P'+ch.start_page+'</div>';
    ch.sections.forEach(sec=>{
      h+='<div class="sec-block" id="sec'+ch.n+'_'+sec.sec+'">';
      h+='<div class="sec-header" onclick="toggleSec(this)"><span class="sec-arrow">▶</span><span class="sec-num">§ '+sec.sec+'</span><span class="sec-title">'+sec.title+'</span><span class="sec-page">P'+sec.page+'</span></div>';
      h+='<div class="sec-content">';
      if(sec.subs && sec.subs.length>0){
        sec.subs.forEach(sub=>{
          h+='<div class="sub-item"><div class="sub-header"><span class="sub-num">'+sub.sec+'</span><span class="sub-title">'+sub.title+'</span><span class="sub-page">P'+sub.page+'</span></div>';
          if(sub.summary){
            h+='<div class="sub-summary">'+sub.summary+'</div>';
          }
          h+='</div>';
        });
      } else {
        h+='<div class="sub-summary" style="color:var(--text-dim)">（本节内容详见教程课本）</div>';
      }
      h+='</div></div>';
    });
    h+='</div>';
  });
  main.innerHTML=h;
}

function toggleSec(el){
  const arrow=el.querySelector('.sec-arrow');
  const content=el.nextElementSibling;
  if(content){
    content.classList.toggle('show');
    if(arrow)arrow.classList.toggle('open');
  }
}

function scrollToCh(n){
  document.getElementById('ch'+n).scrollIntoView({behavior:'smooth'});
  if(window.innerWidth<=768)toggleSidebar();
}

function scrollToSec(n,sec){
  const el=document.getElementById('sec'+n+'_'+sec);
  if(el){
    el.scrollIntoView({behavior:'smooth'});
    const content=el.querySelector('.sec-content');
    const arrow=el.querySelector('.sec-arrow');
    if(content&&!content.classList.contains('show')){
      content.classList.add('show');
      if(arrow)arrow.classList.add('open');
    }
  }
  if(window.innerWidth<=768)toggleSidebar();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarMask').classList.toggle('show');
}

buildTOC();
buildMain();
</script>
