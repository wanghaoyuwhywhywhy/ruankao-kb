5.3","title":"项目评估与决策","page":331,"summary":"项目评估与决策方法","kps":[{"id":"kp_215","sec":"9.5.3","title":"项目评估与决策","tags":["重要"],"body":"<strong>项目评估</strong>是在项目可行性研究基础上，由<strong>第三方（如咨询机构、银行）</strong>进行的审查评价。<br><br><strong>评估目的</strong>：审查可行性研究报告的<strong>可靠性、真实性和客观性</strong>，为项目决策提供依据。<br><br><strong>评估内容</strong>：项目概况、市场、规模、选址、资源、技术、财务、经济、社会等各方面的审核。<br><br><strong>项目决策</strong>：根据评估结果，决定项目是否立项。评估和决策为项目是否启动提供最终依据。"}]}],"kps":[]},{"sec":"9.6","title":"项目管理过程组","page":333,"subs":[{"sec":"9.6","title":"项目管理过程组","page":333,"summary":"项目管理过程组:五大过程组构成项目生命周期管理框架。启动过程组(定义新项目)-规划过程组(明确目标范围)-执行过程组(完成工作)-监控过程组(跟踪调整)-收尾过程组(结束项目)。过程组间非纯线性,有迭代和重叠","kps":[{"id":"kp_216","sec":"9.6","title":"项目管理五大过程组","tags":["重要","高频"],"body":"5大过程组及其关系：<ol><li><strong>启动过程组</strong>：定义并授权项目或阶段，识别干系人，制定项目章程</li><li><strong>规划过程组</strong>：明确项目范围、优化目标、制订计划</li><li><strong>执行过程组</strong>：整合人员和其他资源，按计划执行工作</li><li><strong>监控过程组</strong>：定期测量和监控进展，识别偏差，采取纠正措施</li><li><strong>收尾过程组</strong>：正式接受产品/服务，有序结束项目</li></ol><strong>特征</strong>：过程组并非离散、孤立的事件，而是相互重叠的活动。监控过程组贯穿项目始终。规划过程组与执行过程组重叠最多。"}]}],"kps":[]},{"sec":"9.7","title":"项目管理原则","page":336,"subs":[{"sec":"9.7","title":"项目管理原则","page":336,"summary":"项目管理原则:12项基本原则(第7版):勤勉的管家-团队-干系人-价值-系统思考-领导力-裁剪-质量-复杂性-风险-适应力-变革。原则指导行为,过程组+知识领域落地实施","kps":[{"id":"kp_217","sec":"9.7","title":"项目管理12项原则（PMBOK第7版）","tags":["重要"],"body":"PMBOK第7版提出的12项项目管理原则：<ol><li><strong>勤勉、尊重和关爱的管家</strong>：以节约、社会和环境责任方式行事</li><li>营造协作的团队环境</li><li>与干系人有效互动</li><li>聚焦价值</li><li>识别、评估和响应系统交互</li><li>展现领导力行为</li><li>裁剪（Tailoring）</li><li>将质量融入过程和可交付成果</li><li>驾驭复杂性</li><li>优化风险应对</li><li>拥抱适应性和韧性</li><li>为实现预期的未来状态而驱动变革</li></ol>"}]}],"kps":[]},{"sec":"9.8","title":"项目管理知识领域","page":349,"subs":[{"sec":"9.8","title":"项目管理知识领域","page":349,"summary":"项目管理知识领域:10大知识领域涵盖项目管理全部专业内容。整合(整体协调)-范围(做什么)-进度(何时做)-成本(花多少钱)-质量(达到标准)-资源(用人用物)-沟通(信息流通)-风险(应对不确定)-采购(外部获取)-干系人(管理期望)","kps":[{"id":"kp_218","sec":"9.8","title":"10大知识领域与49个过程","tags":["重要","高频"],"body":"<strong>10大知识领域</strong>：<ol><li><strong>整合管理</strong>：制定章程、制订计划、指导执行、管理知识、实施整体变更控制、结束项目</li><li><strong>范围管理</strong>：规划范围、收集需求、定义范围、创建WBS、确认范围、控制范围</li><li><strong>进度管理</strong>：规划进度、定义活动、排列顺序、估算持续时间、制订进度计划、控制进度</li><li><strong>成本管理</strong>：规划成本、估算成本、制定预算、控制成本</li><li><strong>质量管理</strong>：规划质量、管理质量、控制质量</li><li><strong>资源管理</strong>：规划资源、估算活动资源、获取资源、建设团队、管理团队、控制资源</li><li><strong>沟通管理</strong>：规划沟通、管理沟通、监督沟通</li><li><strong>风险管理</strong>：规划风险、识别风险、实施定性风险分析、实施定量风险分析、规划风险应对、实施风险应对、监督风险</li><li><strong>采购管理</strong>：规划采购、实施采购、控制采购</li><li><strong>干系人管理</strong>：识别干系人、规划干系人参与、管理干系人参与、监督干系人参与</li></ol>合计49个过程。<img src=\"assets/image 4.png\">"}]}],"kps":[]},{"sec":"9.9","title":"价值交付系统","page":351,"subs":[{"sec":"9.9","title":"价值交付系统","page":351,"summary":"价值交付系统:项目不仅交付可量化成果,更交付价值。价值=客户获得的收益(财务+社会+环境)。系统由战略(商业目标)-项目组合(选择对齐)-项目集(协同效益)-项目(产出成果)构成。强调成果导向和持续价值创造","kps":[{"id":"kp_219","sec":"9.9","title":"价值交付系统组件","tags":["重要","高频"],"body":"<strong>价值交付系统</strong>是组织用于实现战略目标、创造价值的体系。<br><br><strong>价值交付组件</strong>（可单独或共同使用以创造价值）包括：<ol><li><strong>项目组合</strong></li><li><strong>项目集</strong></li><li><strong>项目</strong></li><li><strong>产品</strong></li><li><strong>运营</strong></li></ol>这些组件共同组成符合组织战略的价值交付系统。<br><br><strong>注意</strong>：战略是指导价值创造的<strong>理念层面</strong>内容，市场环境是<strong>外部因素</strong>，<strong>均不是</strong>价值交付组件本身。<img src=\"assets/image 3.png\">"}]}],"kps":[]},{"sec":"9.10","title":"本章练习","page":353,"subs":[],"kps":[]}]},{"n":10,"name":"启动过程组","start_page":354,"sections":[{"sec":"10.1","title":"制定项目章程","page":355,"subs":[],"kps":[],"itto":{"i":["商业文件","协议","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","人际关系与团队技能","会议"],"o":["项目章程","假设日志"]}},{"sec":"10.2","title":"识别干系人","page":358,"subs":[],"kps":[],"itto":{"i":["项目章程","商业文件","项目管理计划","项目文件","协议","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","数据分析","数据表现","会议"],"o":["干系人登记册","变更请求","项目管理计划更新","项目文件更新"]}},{"sec":"10.3","title":"启动过程组的重点工作","page":362,"subs":[{"sec":"10.3.1","title":"项目启动会议","page":362,"summary":"启动会议目的与内容","kps":[{"id":"kp_225","sec":"10.3.1","title":"项目启动会议","tags":["重要"],"body":"<strong>项目启动会议</strong>是项目正式启动的标志，由项目经理召集。<br><br>会议目的：<ul><li>正式宣布项目成立</li><li>传达项目章程内容、项目目标</li><li>明确各成员角色和职责</li><li>建立沟通机制和工作方式</li><li>统一认识，增强团队凝聚力</li></ul>启动会议的召开标志着<strong>项目从启动阶段进入规划/执行阶段</strong>。"}]},{"sec":"10.3.2","title":"关注价值和目标","page":363,"summary":"价值导向-明确目标-尽早识别干系人","kps":[{"id":"kp_226","sec":"10.3.2","title":"启动过程组 - 关注价值和目标","tags":["重要"],"body":"启动过程组的核心是<strong>关注价值和目标</strong>。<ul><li><strong>价值导向</strong>：项目立项应以创造业务价值为核心，通过商业论证明确预期收益</li><li><strong>明确目标</strong>：通过项目章程明确项目目标、关键里程碑</li><li><strong>识别所有干系人</strong>：确保关键干系人早期介入，避免后期变更代价高昂</li></ul>启动过程组要避免\"为立项而立项\"，应保证项目与组织战略对齐，价值贡献清晰可衡量。"}]}],"kps":[]},{"sec":"10.4","title":"本章练习","page":364,"subs":[],"kps":[]}]},{"n":11,"name":"规划过程组","start_page":365,"sections":[{"sec":"11.1","title":"制订项目管理计划","page":366,"subs":[],"kps":[],"itto":{"i":["项目章程","其他规划过程的输出","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","人际关系与团队技能","会议"],"o":["项目管理计划"]}},{"sec":"11.2","title":"规划范围管理","page":370,"subs":[],"kps":[],"itto":{"i":["项目章程","项目管理计划","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据分析","会议"],"o":["范围管理计划","需求管理计划"]}},{"sec":"11.3","title":"收集需求","page":374,"subs":[],"kps":[],"itto":{"i":["项目章程","项目管理计划","项目文件","商业文件","协议","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","数据分析","决策","数据表现","原型法"],"o":["需求文件","需求跟踪矩阵"]}},{"sec":"11.4","title":"定义范围","page":378,"subs":[],"kps":[],"itto":{"i":["项目章程","项目管理计划","需求文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据分析","决策","产品分析","人际关系与团队技能"],"o":["项目范围说明书","项目文件更新"]}},{"sec":"11.5","title":"创建WBS","page":380,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","分解"],"o":["范围基准","WBS词典","项目文件更新"]}},{"sec":"11.6","title":"规划进度管理","page":383,"subs":[],"kps":[],"itto":{"i":["项目章程","项目管理计划","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据分析","会议"],"o":["进度管理计划"]}},{"sec":"11.7","title":"定义活动","page":385,"subs":[],"kps":[],"itto":{"i":["项目管理计划","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","分解","滚动式规划","会议"],"o":["活动清单","活动属性","里程碑清单","变更请求","项目管理计划更新"]}},{"sec":"11.8","title":"排列活动顺序","page":387,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["紧前关系绘图法","确定和整合依赖关系","提前量和滞后量","项目管理信息系统"],"o":["项目进度网络图","项目文件更新"]}},{"sec":"11.9","title":"估算活动持续时间","page":390,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","类比估算","参数估算","三点估算","自下而上估算","数据分析","决策","会议"],"o":["持续时间估算","估算依据","项目文件更新"]}},{"sec":"11.10","title":"制订进度计划","page":394,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","协议","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["进度网络分析","关键路径法","资源优化","数据分析","提前量和滞后量","进度压缩","计划评审技术","项目管理信息系统","敏捷发布规划"],"o":["进度基准","项目进度计划","进度数据","项目日历","变更请求","项目管理计划更新","项目文件更新"]}},{"sec":"11.11","title":"规划成本管理","page":402,"subs":[],"kps":[],"itto":{"i":["项目章程","项目管理计划","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据分析","会议"],"o":["成本管理计划"]}},{"sec":"11.12","title":"估算成本","page":405,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","类比估算","参数估算","自下而上估算","三点估算","数据分析","项目管理信息系统","决策"],"o":["成本估算","估算依据","项目文件更新"]}},{"sec":"11.13","title":"制定预算","page":408,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","商业文件","协议","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["成本汇总","历史信息审核","专家判断","资金限制平衡","融资"],"o":["成本基准","项目资金需求","项目文件更新"]}},{"sec":"11.14","title":"规划质量管理","page":410,"subs":[],"kps":[{"id":"kp_386","sec":"11.14.0","title":"质量管理基本概念 - 质量方针与质量体系","tags":["重要","高频"],"body":"<strong>质量管理</strong>（Quality Management）：确定质量方针、目标和职责，并通过质量体系中的<strong>质量规划、质量保证、质量控制、质量改进</strong>来实现所有管理职能的全部活动。<br><br><strong>核心定义</strong>：质量管理是指为了实现质量目标而进行的所有质量性质的活动，即在<strong>质量方面指挥和控制</strong>的活动。<br><br><strong>质量管理四大过程（质量体系）</strong>：<ol><li><strong>质量规划</strong>（规划质量管理）：确定质量标准及如何达到标准</li><li><strong>质量保证</strong>（管理质量）：按计划开展质量活动，确保过程合规</li><li><strong>质量控制</strong>（控制质量）：监控结果、判断是否符合质量标准</li><li><strong>质量改进</strong>：持续改进质量体系和过程</li></ol><strong>质量方针与质量目标</strong>：质量方针是组织在质量方面的宗旨和方向；质量目标是质量方针的具体化、可测量化目标。<br><br><strong>关联记忆</strong>：规划定标准 → 保证抓过程 → 控制验结果 → 改进促提升。"}],"itto":{"i":["项目章程","项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","数据分析","决策","数据表现","测试与检查的规划","会议"],"o":["质量管理计划","质量测量指标","项目管理计划更新","项目文件更新"]}},{"sec":"11.15","title":"规划资源管理","page":417,"subs":[],"kps":[{"id":"kp_388","sec":"11.15.4","title":"组织结构图、RAM与资源日历 - 三种职责描述形式","tags":["重要","高频"],"body":"<strong>组织结构图和职位描述</strong>（系统集成项目管理工程师教程）：可使用多种形式描述项目的角色和职责，<strong>最常用的有三种</strong>：<br><br><strong>1. 层次结构图</strong>：<ul><li>自上而下展示团队成员在组织结构中的<strong>层次关系</strong></li><li>也能反映<strong>个人与其承担工作</strong>之间的联系</li><li>示例：OBS（组织分解结构）、WBS（工作分解结构）</li></ul><strong>2. 责任分配矩阵（RAM）</strong>：<ul><li>明确<strong>团队成员和工作任务</strong>之间的责任关系</li><li>能直接反映<strong>谁对哪项工作负责</strong></li><li><strong>RACI矩阵</strong>：Responsible执行 / Accountable负责 / Consult咨询 / Inform知情</li></ul><strong>3. 文本格式</strong>：<ul><li>用文字详细描述角色、职责、权限</li><li>适合需要详细说明的场景</li></ul><br><strong>资源日历</strong>：<ul><li>展示资源（人员、设备）的<strong>可用时间</strong></li><li>是资源可用性的时间窗口，<strong>不能反映个人与工作的关联</strong></li><li>考试常考：哪种工具不能反映团队成员与工作之间的联系？→ <strong>资源日历</strong></li></ul><strong>核心原则</strong>：每个工作包只有一个明确的责任人，每个成员清楚自己的角色和职责。"}],"itto":{"i":["项目章程","项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据表现","组织理论","会议"],"o":["资源管理计划","团队章程","项目文件更新"]}},{"sec":"11.16","title":"估算活动资源","page":420,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","自下而上估算","类比估算","参数估算","数据分析","项目管理信息系统","会议"],"o":["资源需求","估算依据","资源分解结构","项目文件更新"]}},{"sec":"11.17","title":"规划沟通管理","page":422,"subs":[],"kps":[],"itto":{"i":["项目章程","项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","沟通需求分析","沟通技术","沟通模型","沟通方法","人际关系与团队技能","数据表现","会议"],"o":["沟通管理计划","项目管理计划更新","项目文件更新"]}},{"sec":"11.18","title":"规划风险管理","page":425,"subs":[{"sec":"11.18.1","title":"风险基本概念","page":426,"summary":"风险定义(不确定性-影响)、风险分类(性质-可控程度-认知程度)、风险三要素(事件-概率-影响)","kps":[{"id":"kp_270","sec":"11.18.1","title":"风险基本概念 - 特性、属性与分类","tags":["重要","高频"],"body":"<strong>风险</strong>：一个可能发生、可能不发生的事件，一旦发生会对项目目标产生积极或消极影响。<br><br><strong>风险核心属性三要素</strong>：<ul><li><strong>随机性</strong>：发生时间、影响程度不确定</li><li><strong>相对性</strong>：同一风险对不同主体影响不同</li><li><strong>可变性</strong>：风险随项目进展发生变化</li></ul><strong>风险特性辨析</strong>：<ul><li><strong>相对性</strong>：同风险对不同主体影响不同</li><li><strong>紧迫性</strong>：需被应对的紧急程度</li><li><strong>关联性</strong>：一个风险可能引发连锁风险</li><li><strong>可控性</strong>：能否人为干预控制</li></ul><strong>风险分类全集</strong>：<ul><li>按<strong>可预测性</strong>：已知风险、可预测风险、不可预测风险</li><li>按<strong>后果</strong>：纯粹风险、投机风险</li><li>按<strong>来源</strong>：自然风险、人为风险</li><li>按<strong>影响范围</strong>：局部风险、总体风险</li><li>按<strong>后果承担者</strong>：业主/政府/承包商/投资方/设计/监理/供应商/担保方/保险方风险</li></ul><img src=\"assets/IMG_0115.png\">"}]}],"kps":[],"itto":{"i":["项目章程","项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据分析","会议"],"o":["风险管理计划"]}},{"sec":"11.19","title":"识别风险","page":432,"subs":[],"kps":[{"id":"kp_384","sec":"11.19.4","title":"假设分析详解 - 检验假设有效性","tags":["重要"],"body":"<strong>假设分析</strong>：每个项目及其计划都是基于一套<strong>假想、设想或假设</strong>构建的。<br><br><strong>假设分析的目的</strong>：检验假设条件在项目中的<strong>有效性</strong>，并识别因其中的<strong>不准确、不稳定、不一致或不完整</strong>而导致的项目风险。<br><br><strong>假设分析步骤</strong>：<ol><li>识别项目假设（如资源假设、技术假设、时间假设、成本假设）</li><li>评估假设的有效性（准确？稳定？一致？完整？）</li><li>确定假设失效可能造成的风险</li><li>将假设失效的风险纳入风险登记册</li></ol><strong>典型假设示例</strong>：\"核心开发人员不会离职\"\"项目所需硬件按时到位\"\"需求变更次数不超过预期\"——这些假设一旦不成立，就会转化为风险。"}],"itto":{"i":["项目管理计划","项目文件","协议","采购文档","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","数据分析","人际关系与团队技能","提示清单","SWOT分析","根本原因分析"],"o":["风险登记册","风险报告","项目文件更新"]}},{"sec":"11.20","title":"实施定性风险分析","page":436,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","数据分析","人际关系与团队技能","风险分类","数据表现","会议"],"o":["项目文件更新"]}},{"sec":"11.21","title":"实施定量风险分析","page":439,"subs":[],"kps":[{"id":"kp_292","sec":"11.21","title":"风险管理综合例题（11.18-11.21）","tags":["重要","案例"],"body":"风险管理过程例题集合，覆盖风险识别、定性分析、定量分析与应对策略。<br><br><strong>核心要点</strong>：<ol><li>风险识别：使用SWOT、文档审核、核对单等</li><li>定性分析：概率-影响矩阵排序</li><li>定量分析：敏感性分析、蒙特卡洛模拟</li><li>应对策略：消极风险（规避/转移/减轻/接受）、积极风险（开拓/分享/提高/接受）</li></ol>以下为例题图解：<br><img src=\"assets/image 5.png\"><br><img src=\"assets/image 6.png\"><br><img src=\"assets/image 7.png\"><br><img src=\"assets/image 8.png\"><br><img src=\"assets/image 9.png\"><br><img src=\"assets/image 10.png\"><br><img src=\"assets/image 11.png\"><br><img src=\"assets/image 12.png\"><br><img src=\"assets/image 13.png\"><br><img src=\"assets/image 14.png\">"}],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","人际关系与团队技能","不确定性表现与分析","项目管理信息系统"],"o":["项目文件更新"]}},{"sec":"11.22","title":"规划风险应对","page":445,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","人际关系与团队技能","威胁应对策略","机会应对策略","应急应对策略","整体风险应对策略","数据分析","决策"],"o":["变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"11.23","title":"规划采购管理","page":449,"subs":[{"sec":"11.23.3","title":"合同类型","page":454,"summary":"总价合同(固定-总价加经济价格调整-总价加激励)、成本补偿合同(成本加费用-成本加固定费用-成本加激励-成本加奖励)、工料合同","kps":[{"id":"kp_287","sec":"11.23.3","title":"合同类型选择与适用场景","tags":["重要","高频","案例"],"body":"<ul><li><strong>总价合同</strong>（固定价格合同）：适用于<strong>工程量不太大且能精确计算、工期较短、技术不太复杂、风险不大</strong>的项目。要求发包人准备详细全面的设计图纸。<ul><li>固定总价合同FFP：最常用</li><li>总价加经济价格调整合同FPIF：长期合同应对通胀</li></ul></li><li><strong>成本补偿合同</strong>：适用于<ul><li>需立即开展工作的项目</li><li>项目内容及技术经济指标未确定的项目</li><li>风险大的项目</li></ul>包括成本加固定费用CPFF、成本加激励费用CPIF、成本加奖励费用CPAF</li><li><strong>工料合同</strong>（框架合同）：兼具成本补偿和总价合同特点，适用于<strong>工作性质清楚，但具体工作量无法准确确定</strong>的项目</li><li><strong>单价合同</strong>：适用于工程量不确定，工作内容和技术难度变化不大的项目</li></ul>"}]},{"sec":"11.23.4","title":"合同内容","page":458,"summary":"合同条款与条件","kps":[{"id":"kp_288","sec":"11.23.4","title":"合同内容与关键条款","tags":["重要","法规"],"body":"<strong>合同</strong>是平等主体的自然人、法人、其他组织之间设立、变更、终止民事权利义务关系的协议。<br><br><strong>合同主要内容</strong>：<ol><li>当事人名称/住所</li><li>标的（合同客体，如货物、服务）</li><li>数量</li><li>质量</li><li>价款或报酬</li><li>履行期限、地点和方式</li><li>违约责任</li><li>解决争议的方法</li></ol><strong>合同的特征</strong>：是一种法律行为、双方/多方行为、当事人在平等自愿基础上达成、以设立/变更/终止民事关系为目的。"}]}],"kps":[],"itto":{"i":["项目章程","商业文件","项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","数据分析","供方选择分析","会议"],"o":["采购管理计划","采购策略","招标文件","采购工作说明书","供方选择标准","自制或外购决策","独立成本估算","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"11.24","title":"规划干系人参与","page":459,"subs":[],"kps":[],"itto":{"i":["项目章程","项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据收集","数据分析","决策","数据表现","会议"],"o":["干系人参与计划"]}},{"sec":"11.25","title":"本章练习","page":462,"subs":[],"kps":[]}]},{"n":12,"name":"执行过程组","start_page":465,"sections":[{"sec":"12.1","title":"指导与管理项目工作","page":466,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","项目管理信息系统","会议"],"o":["可交付成果","工作绩效数据","问题日志","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"12.2","title":"管理项目知识","page":470,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","可交付成果","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","知识管理","信息管理","人际关系与团队技能"],"o":["经验教训登记册","项目管理计划更新","组织过程资产(OPA)更新"]}},{"sec":"12.3","title":"管理质量","page":472,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","组织过程资产(OPA)"],"t":["数据收集","数据分析","决策","数据表现","审计","面向X的设计","问题解决","质量改进方法"],"o":["质量报告","测试与评估文件","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"12.4","title":"获取资源","page":478,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","决策","人际关系与团队技能","预分派","虚拟团队"],"o":["项目团队派工单","资源日历","变更请求","项目管理计划更新","项目文件更新","事业环境因素(EEF)更新","组织过程资产(OPA)更新"]}},{"sec":"12.5","title":"建设团队","page":481,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["集中办公","虚拟团队","沟通技术","人际关系与团队技能","认可与奖励","培训","个人和团队评估","组织工具"],"o":["团队绩效评价","变更请求","项目管理计划更新","项目文件更新","事业环境因素(EEF)更新","组织过程资产(OPA)更新"]}},{"sec":"12.6","title":"管理团队","page":483,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","工作绩效报告","团队绩效评价","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["人际关系与团队技能","项目管理信息系统"],"o":["变更请求","项目管理计划更新","项目文件更新","事业环境因素(EEF)更新","组织过程资产(OPA)更新"]}},{"sec":"12.7","title":"管理沟通","page":486,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","工作绩效报告","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["沟通技术","沟通方法","沟通技能","人际关系与团队技能","信息管理","项目管理信息系统","会议","专家判断"],"o":["项目沟通记录","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"12.8","title":"实施风险应对","page":489,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件"],"t":["专家判断","人际关系与团队技能","应急计划与弹回计划","触发条件识别"],"o":["变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"12.9","title":"实施采购","page":490,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","卖方建议书","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","广告","投标人会议","数据分析","人际关系与团队技能"],"o":["选定的卖方","协议","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新","事业环境因素(EEF)更新"]}},{"sec":"12.10","title":"管理干系人参与","page":493,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","沟通技能","人际关系与团队技能","基本规则","会议"],"o":["变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"12.11","title":"本章练习","page":495,"subs":[],"kps":[]}]},{"n":13,"name":"监控过程组","start_page":497,"sections":[{"sec":"13.1","title":"控制质量","page":498,"subs":[],"kps":[],"itto":{"i":["项目管理计划","项目文件","批准的变更请求","可交付成果","工作绩效数据","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["数据收集","数据分析","检查","测试与评估","数据表现","会议"],"o":["质量控制测量结果","核实的可交付成果","工作绩效信息","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"13.2","title":"确认范围","page":502,"subs":[{"sec":"13.2.1","title":"确认范围的关键内容","page":503,"summary":"确认范围vs控制质量(确认范围是验收可交付成果-控制质量是检查正确性)","kps":[{"id":"kp_317","sec":"13.2.1","title":"确认范围的关键内容与五步骤","tags":["重要","高频"],"body":"<strong>确认范围</strong>：正式验收已完成的可交付成果的过程。<br><br><strong>确认范围五步骤</strong>：<ol><li>确定需要进行确认范围的时间</li><li>识别确认范围需要哪些投入</li><li>确定范围正式被接受的标准和要素</li><li>确定确认范围会议的组织步骤</li><li>组织确认范围会议</li></ol><strong>确认范围 vs 控制质量</strong>：确认范围关注<strong>可交付成果的验收</strong>（外部客户视角）；控制质量关注<strong>可交付成果的正确性</strong>（内部团队视角）。控制质量先于确认范围。<strong>确认范围 vs 核实范围</strong>：核实由质量部门或项目经理内部确认；确认由客户或发起人正式接受。"}]}],"kps":[],"itto":{"i":["项目管理计划","项目文件","核实的可交付成果","工作绩效数据"],"t":["检查","决策"],"o":["验收的可交付成果","工作绩效信息","变更请求","项目文件更新"]}},{"sec":"13.3","title":"控制范围","page":505,"subs":[{"sec":"13.3","title":"控制范围","page":505,"summary":"控制范围:监督项目和产品范围状态,管理范围变更。主要输入:项目管理计划-需求文件-需求跟踪矩阵-工作绩效数据-OPA。主要工具:数据分析(偏差分析-趋势分析)。主要输出:工作绩效信息-变更请求","kps":[]}],"kps":[{"id":"kp_320","sec":"13.3.1","title":"控制范围的主要输入","tags":["重要"],"body":"<strong>控制范围</strong>输入：项目管理计划（范围管理计划、范围基准、需求管理计划）、项目文件（经验教训登记册、需求文件、需求跟踪矩阵）、工作绩效数据、组织过程资产(OPA)。"},{"id":"kp_321","sec":"13.3.2","title":"控制范围的主要输出","tags":["重要"],"body":"<strong>控制范围</strong>输出：工作绩效信息、<strong>变更请求</strong>（范围变更时）、项目管理计划更新（范围基准）、项目文件更新（经验教训登记册、需求文件、需求跟踪矩阵）。<br><br><strong>范围蔓延（Scope Creep</strong>）：未经控制的范围扩大，是控制范围需要防范的核心问题。"}],"itto":{"i":["项目管理计划","项目文件","工作绩效数据","组织过程资产(OPA)"],"t":["数据分析","偏差分析","趋势分析"],"o":["工作绩效信息","变更请求","项目管理计划更新","项目文件更新"]}},{"sec":"13.4","title":"控制进度","page":508,"subs":[{"sec":"13.4","title":"控制进度","page":508,"summary":"控制进度:监督项目进度状态,管理进度变更。主要输入:项目管理计划-进度数据-工作绩效数据-OPA。主要工具:数据分析(挣值分析-迭代燃尽图-绩效审查-趋势分析-偏差分析)-关键路径法-项目管理信息系统-资源优化-进度压缩-计划评审技术。主要输出:工作绩效信息-进度预测-变更请求","kps":[]}],"kps":[{"id":"kp_322","sec":"13.4.1","title":"控制进度的主要输入","tags":["重要"],"body":"<strong>控制进度</strong>输入：项目管理计划（进度管理计划、进度基准、范围基准、绩效测量基准）、项目文件（经验教训登记册、项目进度计划、里程碑清单、风险登记册）、工作绩效数据、组织过程资产(OPA)。"},{"id":"kp_323","sec":"13.4.2","title":"控制进度主要工具 - 赶工vs快速跟进vs资源平衡vs平滑","tags":["重要","高频","案例"],"body":"<strong>赶工（Crashing）</strong> — 用成本换时间<ul><li>通过增加资源（加人、加班、加急费用）压缩关键路径上活动持续时间</li><li>只能在关键路径上使用；活动本身可通过增加资源缩短时间</li><li>优点：直接有效；缺点：成本增加，收益递减</li></ul><strong>快速跟进（Fast Tracking）</strong> — 用风险换时间<ul><li>将正常按顺序进行的活动改为部分并行开展</li><li>只能用于存在\"软逻辑关系\"（非强制性依赖）的活动</li><li>优点：不直接增加成本；缺点：增加返工风险和协调成本</li></ul><strong>资源平衡（Resource Leveling）</strong><ul><li>根据资源制约因素调整开始和完成日期</li><li><strong>可能导致关键路径改变，通常会延长项目工期</strong></li></ul><strong>资源平滑（Resource Smoothing）</strong><ul><li>在保持项目总时长不变前提下微调活动日期</li><li><strong>不会改变关键路径，完工日期不延迟</strong>。活动只在自由和总浮动时间内调整</li></ul><strong>其他工具</strong>：进度压缩、进度网络分析、绩效审查、偏差分析、假设情景分析。"},{"id":"kp_324","sec":"13.4.3","title":"控制进度的主要输出","tags":["重要"],"body":"<strong>控制进度</strong>输出：工作绩效信息、进度预测、变更请求、项目管理计划更新（进度基准、进度管理计划）、项目文件更新（经验教训登记册、风险登记册、里程碑清单）、组织过程资产(OPA)更新。"}],"itto":{"i":["项目管理计划","项目文件","工作绩效数据","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["数据分析","挣值分析","迭代燃尽图","绩效审查","项目管理信息系统","资源优化","进度压缩"],"o":["工作绩效信息","进度预测","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"13.5","title":"控制成本","page":511,"subs":[{"sec":"13.5","title":"控制成本","page":511,"summary":"控制成本:监督项目成本状态,管理成本变更。主要输入:项目管理计划-工作绩效数据-OPA。主要工具:数据分析(挣值分析EVA:PV/EV/AC/SV/CV/SPI/CPI/EAC/ETC/VAC-偏差分析-趋势分析-储备分析)。主要输出:工作绩效信息-成本预测-变更请求","kps":[]}],"kps":[{"id":"kp_325","sec":"13.5.1","title":"控制成本的主要输入","tags":["重要"],"body":"<strong>控制成本</strong>输入：项目管理计划（成本管理计划、成本基准、绩效测量基准）、项目文件（经验教训登记册、项目资金需求、风险登记册）、工作绩效数据、组织过程资产(OPA)。"},{"id":"kp_326","sec":"13.5.2","title":"控制成本主要工具 - EVM挣值管理公式全集","tags":["重要","计算","高频"],"body":"<strong>基础指标</strong><div class=\"formula\">PV（计划值）= 计划工作量 × 预算单价</div><div class=\"formula\">EV（挣值）= 实际验收合格量 × 预算单价</div><div class=\"formula\">AC（实际成本）= Σ(实际资源消耗 × 结算单价)</div><div class=\"formula\">BAC（完工预算）= 经批准的项目总预算基线（不含应急储备）</div><br><strong>偏差指标</strong><div class=\"formula\">CV（成本偏差）= EV − AC　（正值=成本结余，负值=超支）</div><div class=\"formula\">SV（进度偏差）= EV − PV　（负值=进度滞后）</div><br><strong>绩效指数</strong><div class=\"formula\">CPI（成本绩效指数）= EV / AC</div><div class=\"formula\">SPI（进度绩效指数）= EV / PV</div><br><strong>预测指标</strong><div class=\"formula\">ETC（非典型偏差）= BAC − EV</div><div class=\"formula\">ETC（典型偏差）= (BAC − EV) / CPI</div><div class=\"formula\">EAC（完工估算）= AC + ETC　或　EAC = BAC / CPI</div><div class=\"formula\">VAC（完工偏差）= BAC − EAC</div><br><strong>成本控制工具</strong>：回归分析、趋势分析、偏差分析。"},{"id":"kp_327","sec":"13.5.3","title":"控制成本的主要输出","tags":["重要"],"body":"<strong>控制成本</strong>输出：工作绩效信息、成本预测、变更请求、项目管理计划更新（成本基准、成本管理计划）、项目文件更新（经验教训登记册、风险登记册）、组织过程资产(OPA)更新。"}],"itto":{"i":["项目管理计划","项目文件","工作绩效数据","组织过程资产(OPA)"],"t":["专家判断","数据分析","挣值分析","趋势分析","偏差分析","储备分析","项目管理信息系统"],"o":["工作绩效信息","成本预测","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"13.6","title":"控制资源","page":515,"subs":[{"sec":"13.6","title":"控制资源","page":515,"summary":"控制资源:确保项目所需物理资源可用,监督资源使用。主要输入:项目管理计划-工作绩效数据-OPA。主要工具:数据分析(备选方案分析-成本效益分析-绩效审查-趋势分析)-问题解决-人际关系与团队技能(谈判-影响力)-项目管理信息系统。主要输出:工作绩效信息-变更请求","kps":[]}],"kps":[{"id":"kp_328","sec":"13.6.1","title":"控制资源的主要输入","tags":["重要"],"body":"<strong>控制资源</strong>输入：项目管理计划（资源管理计划）、项目文件（经验教训登记册、物质资源分配单、项目进度计划、资源分解结构、风险登记册）、工作绩效数据、组织过程资产(OPA)。<br><br><strong>控制资源</strong>：确保物理资源按计划获得和使用，关注材料/设备使用情况。<strong>管理团队</strong>针对人力资源，控制资源针对物理资源。"}],"itto":{"i":["项目管理计划","项目文件","工作绩效数据","协议","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["数据分析","问题解决","人际关系与团队技能","项目管理信息系统"],"o":["工作绩效信息","资源需求更新","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"13.7","title":"监督沟通","page":518,"subs":[{"sec":"13.7","title":"监督沟通","page":518,"summary":"监督沟通:确保信息收集-生成-流转-存储-检索-处置符合沟通管理计划。主要输入:项目管理计划-项目文件-工作绩效数据-EEF-OPA。主要工具:专家判断-项目管理信息系统-数据分析(干系人参与度评估矩阵)-人际关系与团队技能(观察-交谈)。主要输出:工作绩效信息-变更请求","kps":[]}],"kps":[{"id":"kp_329","sec":"13.7.1","title":"监督沟通的主要输入","tags":["重要"],"body":"<strong>监督沟通</strong>输入：项目管理计划（沟通管理计划）、项目文件（经验教训登记册、问题日志、项目沟通记录）、工作绩效数据、组织过程资产(OPA)。<br><br><strong>监督沟通</strong>：确保项目和干系人的信息需求得到满足。"}],"itto":{"i":["项目管理计划","项目文件","工作绩效数据","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据分析","人际关系与团队技能","项目管理信息系统","沟通方法","会议"],"o":["工作绩效信息","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"13.8","title":"监督风险","page":520,"subs":[{"sec":"13.8","title":"监督风险","page":520,"summary":"监督风险:监督风险应对计划实施,评估风险计划有效性,识别新风险。主要输入:项目管理计划-项目文件-工作绩效数据-EEF-OPA。主要工具:数据分析(技术绩效分析-储备分析)。主要输出:工作绩效信息-变更请求","kps":[]}],"kps":[{"id":"kp_330","sec":"13.8.1","title":"监督风险的主要输入","tags":["重要"],"body":"<strong>监督风险</strong>输入：项目管理计划（风险管理计划、进度/成本/绩效基准）、项目文件（经验教训登记册、风险登记册、风险报告）、工作绩效数据、工作绩效报告、组织过程资产(OPA)。"},{"id":"kp_331","sec":"13.8.2","title":"监督风险主要工具 - 六项工具","tags":["重要","高频"],"body":"<strong>监督风险</strong>的工具与技术（六项）：<ol><li><strong>风险再评估</strong>：识别新风险、重新评估现有风险、关闭已过时风险</li><li><strong>风险审计</strong>：检查风险应对措施有效性</li><li><strong>偏差和趋势分析</strong>：用EVM数据分析偏差趋势</li><li><strong>技术绩效测量</strong>：将技术成果与计划比较</li><li><strong>储备分析</strong>：检查剩余应急储备是否充足</li><li><strong>会议</strong>：风险状态评审会</li></ol>"},{"id":"kp_332","sec":"13.8.3","title":"监督风险的主要输出","tags":["重要"],"body":"<strong>监督风险</strong>输出：工作绩效信息、变更请求、项目管理计划更新、项目文件更新（风险登记册、风险报告、经验教训登记册）、组织过程资产(OPA)更新。"}],"itto":{"i":["项目管理计划","项目文件","工作绩效数据","工作绩效报告","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["数据分析","技术绩效测量","审计","会议","专家判断"],"o":["工作绩效信息","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新","事业环境因素(EEF)更新"]}},{"sec":"13.9","title":"控制采购","page":524,"subs":[{"sec":"13.9","title":"控制采购","page":524,"summary":"控制采购:管理采购关系,监督合同执行,实施适当变更。主要输入:项目管理计划-项目文件-采购文档-协议-工作绩效数据-EEF-OPA。主要工具:专家判断-数据分析(绩效审查-挣值分析-趋势分析)-检查-审计。主要输出:采购关闭-工作绩效信息-变更请求","kps":[]}],"kps":[{"id":"kp_333","sec":"13.9.1","title":"控制采购的主要输入","tags":["重要"],"body":"<strong>控制采购</strong>输入：项目管理计划（采购管理计划）、项目文件（假设日志、经验教训登记册、里程碑清单、质量报告、需求文件、风险登记册、干系人登记册）、协议、采购文件、批准的变更请求、工作绩效数据、组织过程资产(OPA)。"},{"id":"kp_334","sec":"13.9.2","title":"控制采购的主要工具与技术","tags":["重要"],"body":"<strong>控制采购</strong>工具与技术：合同变更控制系统、采购审计、<strong>采购绩效审查</strong>（卖方履约检查）、检查、<strong>数据绩效</strong>（挣值）、支付系统、索赔管理（<strong>ADR替代争议解决</strong>：基于协商的调解、仲裁）、记录管理系统。<br><br><strong>索赔原则</strong>：必须以书面形式提出；按合同约定处理；协商不成走仲裁/诉讼。"},{"id":"kp_335","sec":"13.9.3","title":"控制采购定义与主要输出","tags":["重要"],"body":"<strong>控制采购</strong>是管理采购关系、<strong>监督合同绩效</strong>、实施必要的变更和纠偏，以及关闭合同的过程。<br><br>输出：采购关闭、工作绩效信息、变更请求、项目管理计划更新、项目文件更新、组织过程资产(OPA)更新。<br><br><strong>合同收尾</strong>：完成合同结算、解决所有未决事项、正式关闭合同。需确认产品符合合同要求，并完成交接。"}],"itto":{"i":["项目管理计划","项目文件","协议","变更请求","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","索赔管理","数据分析","检查","审计","绩效审查","支付系统"],"o":["采购关闭的协议","买方履约文档","工作绩效信息","采购文档更新","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"13.10","title":"实施整体变更控制","page":528,"subs":[],"kps":[{"id":"kp_338","sec":"13.10.3","title":"监督干系人参与的主要输出","tags":["重要"],"body":"<strong>监督干系人参与</strong>输出：工作绩效信息、变更请求、项目管理计划更新、项目文件更新（经验教训登记册、问题日志、风险登记册、干系人登记册）、组织过程资产(OPA)更新。"},{"id":"kp_344","sec":"13.10","title":"绩效评估六种方法","tags":["重要","高频"],"body":"<strong>绩效评估六法</strong>：<ol><li><strong>排序法</strong>：根据工作绩效评估高低排序。适用于工作内容单一或相同员工较多时。</li><li><strong>硬性分布法</strong>：将评估结果分档，按<strong>分档档次和分档比例</strong>分派。成本低但标准模糊、主观性高。</li><li><strong>尺度评价表法</strong>：把绩效评估每项内容定量分解打分，合计总分。适用于组织管理人员。</li><li><strong>关键事件法</strong>：收集\"重要事件\"形成书面记录并整理分析。<strong>通常与其他方法结合使用，不单独使用</strong>。</li><li><strong>平衡计分卡法</strong>：通过<strong>财务、客户、内部运营、学习与成长</strong>4个角度，将战略目标落实为可操作的衡量指标。广泛用于团队和个人。</li><li><strong>目标管理法</strong>：通过事先设定目标、制订计划评估完成情况。包括目标确定、计划执行、检查调整、完成评价。广泛用于团队和个人。</li></ol>"}],"itto":{"i":["项目管理计划","工作绩效报告","变更请求","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","变更控制工具","数据分析","决策","会议"],"o":["批准的变更请求","变更日志","项目管理计划更新","项目文件更新"]}},{"sec":"13.11","title":"监控项目工作","page":531,"subs":[{"sec":"13.11","title":"监控项目工作","page":531,"summary":"监控项目工作:跟踪-审查-调整项目进展,评估整体绩效。主要输入:项目管理计划-项目文件-工作绩效信息-协议-EEF-OPA。主要工具:专家判断-数据分析(备选方案分析-成本效益分析-挣值分析-根本原因分析-趋势分析-偏差分析)-决策-会议。主要输出:工作绩效报告-变更请求","kps":[]}],"kps":[{"id":"kp_339","sec":"13.11.1","title":"监控项目工作的主要输入","tags":["重要"],"body":"<strong>监控项目工作</strong>输入：项目管理计划（各子计划）、项目文件（经验教训、进度/成本/质量/绩效报告、风险登记册）、工作绩效信息、协议、事业环境因素(EEF)、组织过程资产(OPA)。"},{"id":"kp_340","sec":"13.11.2","title":"监控项目工作的主要工具与技术","tags":["重要"],"body":"<strong>监控项目工作</strong>工具：专家判断、数据收集（经验教训、偏差分析）、数据分析（备选方案、根因、趋势、偏差）、决策、会议、PMIS。<br><br><strong>监控项目工作</strong>：跟踪、审查和报告整体项目进展，实现对项目绩效的总体把握，包括比较实际绩效与计划基准、评估绩效、提出变更请求。"},{"id":"kp_341","sec":"13.11.3","title":"监控项目工作的主要输出","tags":["重要"],"body":"<strong>监控项目工作</strong>输出：工作绩效报告、<strong>变更请求</strong>（纠正措施/预防措施/缺陷补救）、项目管理计划更新、项目文件更新（经验教训登记册、风险登记册、进度/成本预测）。"}],"itto":{"i":["项目管理计划","项目文件","工作绩效信息","协议","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","数据分析","决策","会议"],"o":["工作绩效报告","变更请求","项目管理计划更新","项目文件更新"]}},{"sec":"13.12","title":"监督干系人参与","page":533,"subs":[{"sec":"13.12","title":"监督干系人参与","page":533,"summary":"监督干系人参与:监督干系人关系,调整参与策略。主要输入:项目管理计划-项目文件-工作绩效数据-EEF-OPA。主要工具:数据分析(备选方案分析-根因分析-干系人分析)-决策-数据表现-沟通技能(反馈)-人际关系与团队技能。主要输出:工作绩效信息-变更请求","kps":[]}],"kps":[{"id":"kp_342","sec":"13.12.1","title":"实施整体变更控制的主要输入","tags":["重要"],"body":"<strong>实施整体变更控制</strong>输入：项目管理计划（变更/配置/范围/进度/成本/质量管理计划）、项目文件（经验教训登记册、项目基准、变更日志、需求文件、风险登记册）、工作绩效报告、变更请求、事业环境因素(EEF)、组织过程资产(OPA)。"},{"id":"kp_343","sec":"13.12.2","title":"实施整体变更控制的主要输出","tags":["重要","高频"],"body":"<strong>实施整体变更控制</strong>输出：<strong>批准的变更请求</strong>、项目文件更新（变更日志）、项目管理计划更新、项目文件更新。<br><br><strong>变更控制的核心原则</strong>：<ol><li>任何变更必须经<strong>CCB（变更控制委员会）</strong>批准</li><li>变更请求必须书面提出</li><li>变更必须评估对范围/进度/成本/质量的影响</li><li>批准后更新基准，未批准则维持原状</li><li>变更关闭必须记录并通知干系人</li></ol><strong>变更请求类型</strong>：纠正措施、预防措施、缺陷补救、更新。"}],"itto":{"i":["项目管理计划","项目文件","工作绩效数据","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["数据分析","决策","数据表现","沟通技能","人际关系与团队技能","基本规则","会议","专家判断"],"o":["工作绩效信息","干系人参与计划更新","变更请求","项目管理计划更新","项目文件更新","组织过程资产(OPA)更新"]}},{"sec":"13.13","title":"本章练习","page":534,"subs":[],"kps":[]}]},{"n":14,"name":"收尾过程组","start_page":537,"sections":[{"sec":"14.1","title":"结束项目或阶段","page":537,"subs":[{"sec":"14.1","title":"结束项目或阶段","page":537,"summary":"结束项目或阶段:完结项目或阶段活动。主要输入:项目章程-项目管理计划-项目文件-验收的可交付成果-协议-OPA。主要工具:专家判断-数据分析(备选方案分析-根因分析-偏差分析)-会议。主要输出:最终产品-服务-成果移交-最终报告-OPA更新","kps":[]}],"kps":[{"id":"kp_345","sec":"14.1.1","title":"结束项目和阶段的主要输入","tags":["重要"],"body":"<strong>结束项目或阶段</strong>输入：项目章程、项目管理计划、项目文件（变更日志、经验教训登记册、里程碑清单、质量报告、风险登记册、干系人登记册等）、验收的可交付成果、协议、采购文件、组织过程资产(OPA)。"},{"id":"kp_346","sec":"14.1.2","title":"结束项目和阶段的主要输出","tags":["重要"],"body":"<strong>结束项目或阶段</strong>输出：<ol><li><strong>项目或阶段收尾文件</strong>：包括客户/发起人正式接受的证明</li><li><strong>最终产品、服务或成果移交</strong></li><li><strong>最终报告</strong>：项目总结</li><li>组织过程资产(OPA)更新：经验教训、项目档案、项目收尾信息等</li></ol>"}],"itto":{"i":["项目章程","项目管理计划","项目文件","验收的可交付成果","采购文档","组织过程资产(OPA)"],"t":["专家判断","数据分析","会议"],"o":["最终产品/服务/成果移交","最终报告","组织过程资产(OPA)更新"]}},{"sec":"14.2","title":"结束采购","page":541,"subs":[{"sec":"14.2","title":"结束采购","page":541,"summary":"结束采购:完结单次采购活动。主要输入:项目管理计划-采购文档-协议-OPA。主要工具:数据分析(采购谈判-回归分析-绩效审查-趋势分析-挣值分析)。主要输出:结束的采购-OPA更新(档案-经验教训)","kps":[]}],"kps":[{"id":"kp_347","sec":"14.2.1","title":"收尾重点工作 - 项目验收","tags":["重要"],"body":"<strong>项目验收</strong>是项目收尾的核心环节，包括：<ul><li>确认正式验收阶段已经完成</li><li>核实所有可交付成果已被客户/发起人正式接受</li><li>完成验收测试、系统集成测试</li><li>客户签字确认</li></ul><strong>验收标准</strong>：应符合项目范围说明书和合同规定的验收标准。<br><br><strong>验收主体</strong>：项目发起人或客户正式签字验收。"},{"id":"kp_348","sec":"14.2.2","title":"收尾重点工作 - 项目移交","tags":["重要"],"body":"<strong>项目移交</strong>包括：<ul><li>移交<strong>可交付成果</strong>（产品/服务/系统）</li><li>移交<strong>相关文档</strong>（需求/设计/测试/用户手册/维护文档等）</li><li>移交<strong>源代码/数据</strong>（按合同约定）</li><li>移交<strong>运维责任</strong>给运维团队或客户</li><li><strong>培训</strong>客户/运维人员</li></ul>移交前应确保接收方具备接收和维护能力。"},{"id":"kp_349","sec":"14.2.3","title":"收尾重点工作 - 项目总结会内容","tags":["重要","高频"],"body":"<strong>项目总结会</strong>应讨论如下内容（七项）：<ol><li>项目目标</li><li>技术绩效</li><li>成本绩效</li><li>进度计划绩效</li><li>项目的沟通</li><li>识别问题和解决问题</li><li>意见和改进建议</li></ol><strong>注意</strong>：<strong>需交付的内容</strong>不属于总结会议关注内容。需交付的内容在规划阶段已明确，收尾验收阶段已完成核验；项目总结会议聚焦于执行过程的复盘、经验教训的提炼。<br><br>总结会应形成<strong>经验教训文档</strong>纳入组织过程资产(OPA)。"}],"itto":{"i":["项目管理计划","项目文件","协议","采购文档","事业环境因素(EEF)","组织过程资产(OPA)"],"t":["专家判断","索赔管理","数据分析","检查","审计","绩效审查","支付系统"],"o":["采购关闭的协议","买方履约文档","采购文档更新","组织过程资产(OPA)更新"]}},{"sec":"14.3","title":"本章练习","page":545,"subs":[],"kps":[]}]},{"n":15,"name":"组织保障","start_page":546,"sections":[{"sec":"15.1","title":"配置管理","page":547,"subs":[{"sec":"15.1","title":"配置管理","page":547,"summary":"配置管理:标识-控制-记录-审计配置项。配置项包括产品组件、文档、环境、过程。基线是经过正式审查和批准的规格说明。配置管理系统:标识配置项-基线管理-变更控制-状态报告-审计。配置库类型:动态库(开发库)-受控库(主库)-静态库(产品库)","kps":[]}],"kps":[{"id":"kp_350","sec":"15.1.1","title":"信息和文档基本概念","tags":["重要"],"body":"<strong>信息</strong>：经处理、解释后对人有意义、能指导行动的数据。<strong>文档</strong>：数据在其媒介上的记录，可以是纸质或电子。<br><br><strong>信息/文档分类</strong>：<ul><li>按<strong>用途</strong>分：开发文档、管理文档、用户文档</li><li>按<strong>保密级别</strong>分：公开、内部、秘密、机密、绝密</li></ul><strong>文档管理</strong>：对文档进行分类、编号、存储、检索、控制、归档的全过程。"},{"id":"kp_351","sec":"15.1.2","title":"信息(文档)管理规则和方法","tags":["重要"],"body":"<strong>文档管理规则</strong>：<ul><li>建立文档管理规范和制度</li><li>明确文档责任人</li><li>规定文档格式、编号规则</li><li>制定版本控制规则</li><li>建立文档库和索引</li><li>制定借阅、复制、销毁规则</li></ul><strong>管理方法</strong>：分级分类、版本控制、访问权限、定期审查、归档备份。<br><br><strong>归档</strong>：项目完成后，将项目相关文档移交档案管理部门永久保存。"}]},{"sec":"15.2","title":"变更管理","page":556,"subs":[{"sec":"15.2","title":"变更管理","page":556,"summary":"变更管理:项目变更控制委员会CCB负责审批变更。变更流程:提交变更申请-CCB评估-批准或拒绝-执行变更-验证变更-关闭变更。变更分类:范围变更、进度变更、成本变更、质量变更。变更控制原则:整体变更控制(评估影响)-预防为主(基线保护)-分级控制(权限)","kps":[]}],"kps":[{"id":"kp_352","sec":"15.2.1","title":"配置管理基本概念 - 配置库四种类型","tags":["重要","高频"],"body":"<strong>配置项（CI）</strong>：配置管理的对象，可以是硬件、软件、文档等。<br><br><strong>配置库四种类型</strong>：<ul><li><strong>动态库</strong>（开发库、程序库、工作库）：保存开发人员当前正在开发的配置实体。是软件工程师的工作区，由工程师控制。</li><li><strong>受控库</strong>（主库、系统库）：管理当前基线和控制对基线的变更。</li><li><strong>静态库</strong>：保存已发布/归档的配置项</li><li><strong>备份库</strong>：备份所有配置项</li></ul><strong>基线（Baseline）</strong>：经过正式评审和批准的配置项版本，作为后续变更的基础。"},{"id":"kp_353","sec":"15.2.2","title":"配置管理角色与职责 - CCB","tags":["重要"],"body":"<strong>CCB</strong>（Change Control Board，变更控制委员会）由企业或项目组的主要成员组成，根据实际需要不同，可以设置：<ul><li>组织的变更控制委员会</li><li>项目的变更控制委员会</li><li>其他形式的变更控制委员会</li></ul><strong>某些情况下不需要常设</strong>。<br><br><strong>配置管理员（CMO）</strong>：负责配置管理日常工作。<strong>配置项作者</strong>：开发配置项并对其负责。<strong>配置控制委员会</strong>：批准基线、批准变更。"},{"id":"kp_354","sec":"15.2.3","title":"配置管理的目标与方针","tags":["重要"],"body":"<strong>配置管理目标</strong>：<ul><li>记录产品的演变历史</li><li>保证产品在生命周期内的一致性、可追踪性</li><li>避免产品在版本演化中失效</li><li>及时准确地反映产品的状态</li></ul><strong>配置管理方针</strong>：所有配置项应被唯一标识、版本控制、变更受控、可追溯、可审计。"},{"id":"kp_355","sec":"15.2.4","title":"配置管理六大活动与计划内容","tags":["重要","高频"],"body":"<strong>配置管理六大活动</strong>：<ol><li>制定配置管理计划</li><li>配置标识</li><li>配置控制</li><li>配置状态报告</li><li>配置审计</li><li>发布管理和交付</li></ol><strong>配置管理计划主要内容（四项）</strong>：<ol><li>配置管理活动</li><li>实施这些活动的规范和流程</li><li>实施这些活动的进度安排</li><li>负责实施这些活动的人员或组织，以及他们和其他组织的关系</li></ol>"}]},{"sec":"15.3","title":"本章练习","page":568,"subs":[],"kps":[{"id":"kp_356","sec":"15.3.1","title":"变更管理基本概念","tags":["重要"],"body":"<strong>变更</strong>：在项目实施过程中，对项目计划/范围/进度/成本等基准的调整。<br><br><strong>变更管理</strong>：通过规范化的流程控制变更，确保变更可控、可追溯、可审计。<br><br><strong>变更产生的根源</strong>：外部环境变化、需求/范围变化、技术方案调整、资源变化、风险事件、法律法规变化等。<img src=\"assets/IMG_0117.png\">"},{"id":"kp_357","sec":"15.3.2","title":"变更管理的角色与职责","tags":["重要"],"body":"<strong>变更相关角色</strong>：<ul><li><strong>变更申请人</strong>：提出变更请求</li><li><strong>项目经理</strong>：评估变更影响、组织CCB评审</li><li><strong>CCB（变更控制委员会）</strong>：批准/否决/延期变更</li><li><strong>变更实施人</strong>：执行批准的变更</li><li><strong>配置管理员</strong>：记录变更、更新配置项</li></ul>"},{"id":"kp_358","sec":"15.3.3","title":"变更管理的工作程序","tags":["重要","高频"],"body":"<strong>变更管理工作流程</strong>：<ol><li><strong>提出变更申请</strong>：书面提出，填写变更申请单</li><li><strong>变更评估</strong>：项目经理评估影响范围、成本、进度、风险</li><li><strong>变更决策</strong>：CCB审查并决策（接受/拒绝/延期）</li><li><strong>实施变更</strong>：按批准方案执行</li><li><strong>变更验证</strong>：验证变更结果符合要求</li><li><strong>变更关闭</strong>：更新配置、文档、基准，通知干系人</li></ol><strong>原则</strong>：变更必须先评估后批准、先批准后实施、变更必须可追溯。"},{"id":"kp_359","sec":"15.3.4","title":"变更控制 - 版本管理、配置审计与范围变更原因","tags":["重要","高频"],"body":"<strong>版本管理内容</strong>：<ul><li>配置项状态变迁规则</li><li>配置项版本号标识</li><li>配置项版本控制</li></ul><strong>并非等同于</strong>对项目中配置项基线的变更控制。<br><br><strong>配置项审计</strong>（两种）：<ul><li><strong>功能配置审计</strong>：验证配置项的实际功能是否满足需求</li><li><strong>物理配置审计</strong>：验证配置项的物理特征（如文件结构、构建状态）是否正确</li></ul><strong>变更过程中的配置管理活动</strong>（三项）：<ol><li>配置项识别</li><li>配置状态记录</li><li>配置确认与审计</li></ol><strong>范围变更原因五条</strong>：<ol><li>客户需求不明确、需求增加或变更</li><li>范围定义不清、WBS分解不完善</li><li>技术方案不合理，需要优化改进</li><li>市场、政策、外部环境发生变化</li><li>前期需求调研、分析论证不充分</li></ol>"},{"id":"kp_360","sec":"15.3.5","title":"版本发布和回退计划","tags":["重要"],"body":"<strong>版本发布</strong>：将新版本配置项正式发布给用户或部署到生产环境的过程。<br><br><strong>发布流程</strong>：<ol><li>发布准备：制定发布计划、回退计划</li><li>发布实施：部署、安装、配置</li><li>发布验证：测试验证功能正常</li><li>发布通知：告知干系人</li></ol><strong>回退计划</strong>：当发布失败或出现严重问题时，将系统恢复到上一可用版本的计划。<br><br><strong>回退原则</strong>：必须预先制定、必须可执行、必须经过测试。<strong>回退触发条件</strong>：发布后出现严重故障、功能异常、性能不达标等。"}]}]},{"n":16,"name":"监理基础知识","start_page":569,"sections":[{"sec":"16.1","title":"监理的意义和作用","page":569,"subs":[{"sec":"16.1","title":"监理的意义和作用","page":569,"summary":"监理的意义和作用:信息系统工程监理是受业主委托,依据法律法规和技术标准,对信息系统工程实施监督和管理。目的:确保质量、进度、成本、安全目标实现。作用:监督-控制-协调-评价。监理依据:法律法规-技术标准-合同-设计文件","kps":[{"id":"kp_361","sec":"16.1","title":"监理的意义和作用","tags":["重要","法规"],"body":"<strong>信息系统工程监理</strong>：由具备相应资质的第三方机构，受业主单位委托，依据法律法规和合同，对信息系统工程实施过程进行监督和管理。<br><br><strong>监理的作用</strong>：<ul><li>保障工程质量、进度、成本目标的实现</li><li>协调业主与承建单位之间的关系</li><li>降低项目风险，提高项目成功率</li><li>提供专业咨询和技术支持</li><li>规范项目管理，保障投资效益</li></ul>"}]}],"kps":[]},{"sec":"16.2","title":"监理相关概念","page":571,"subs":[{"sec":"16.2","title":"监理相关概念","page":571,"summary":"监理相关概念:四控三管一协调。四控:质量控制-进度控制-成本控制-变更控制。三管:合同管理-信息管理-安全管理。一协调:组织协调(业主-承建-相关方)。监理范围:设计-实施-验收全生命周期。监理单位资质分级","kps":[{"id":"kp_362","sec":"16.2","title":"监理相关概念","tags":["重要","法规"],"body":"<strong>三方法律关系</strong>：<ul><li><strong>业主单位</strong>（建设单位）：项目投资方/委托方，与承建单位签订承建合同，与监理单位签订监理合同</li><li><strong>承建单位</strong>：承担项目建设的单位，与业主签订承建合同</li><li><strong>监理单位</strong>：受业主委托，独立于业主和承建单位的第三方</li></ul><strong>监理独立性</strong>：监理单位应独立于承建单位，不得与承建单位有隶属关系或利益关系。<br><br><strong>监理工程师</strong>：经监理单位授权，具体执行监理任务的专业人员。"}]}],"kps":[]},{"sec":"16.3","title":"监理组织","page":573,"subs":[{"sec":"16.3","title":"监理组织","page":573,"summary":"监理组织:组织形式包括:总监理工程师负责制-按专业分工-矩阵式。监理机构组成:总监理工程师-总监理工程师代表-专业监理工程师-监理员。监理设施:检测设备-通信工具-交通工具-办公设备","kps":[{"id":"kp_363","sec":"16.3","title":"监理依据","tags":["重要","法规"],"body":"<strong>监理依据</strong>：<ol><li><strong>法律法规</strong>：国家法律、行政法规、地方法规</li><li><strong>标准规范</strong>：国家标准、行业标准、企业标准</li><li><strong>合同文件</strong>：监理合同、承建合同</li><li><strong>设计文件</strong>：项目设计/方案/需求文档</li><li><strong>用户需求</strong>：经确认的需求文件</li></ol>监理应<strong>依据事实、依据合同、依据标准</strong>开展工作。"}]}],"kps":[]},{"sec":"16.4","title":"监理工程师","page":577,"subs":[{"sec":"16.4","title":"监理工程师","page":577,"summary":"监理工程师:总监理工程师(全面负责)需要高级资质。专业监理工程师负责专业领域。监理工程师职责:编制监理规划-审核开工-审查方案-质量进度成本控制-组织验收-编制报告。职业道德:公正-客观-独立-科学","kps":[{"id":"kp_364","sec":"16.4","title":"监理内容（四控三管一协调）","tags":["重要","法规","高频"],"body":"<strong>监理主要内容（四控三管一协调）</strong>：<ul><li><strong>四控制</strong>：质量控制、进度控制、投资（成本）控制、变更控制</li><li><strong>三管理</strong>：合同管理、信息/文档管理、安全管理</li><li><strong>一协调</strong>：协调业主、承建单位等各方关系</li></ul><strong>监理阶段</strong>：设计阶段监理、实施阶段监理、验收阶段监理。"}]}],"kps":[]},{"sec":"16.5","title":"本章练习","page":579,"subs":[],"kps":[{"id":"kp_365","sec":"16.5.1","title":"监理合同签署时机","tags":["重要","高频","法规"],"body":"<strong>监理合同应在承建合同签署前完成</strong>。<br><br><strong>原因</strong>：监理的核心职责是对项目实施过程进行监督管理，需在项目正式启动前明确监理范围、职责和要求。承建合同签署后项目已进入执行阶段，若此时才签订监理合同，会导致监理工作无法同步介入，失去前期把控的意义。<br><br>从流程逻辑来看，应先确定监理方并签订监理合同，再由监理协助业主审核承建合同条款。<br><br><strong>监理合同内容</strong>：监理范围、监理服务期、双方权利义务、监理费用、违约责任、争议解决方式。"},{"id":"kp_366","sec":"16.5.2","title":"监理服务能力评估","tags":["重要","法规"],"body":"<strong>监理单位资质等级</strong>：分为<strong>甲级、乙级、丙级</strong>三级。<ul><li><strong>甲级</strong>：可承担各类信息系统工程监理业务</li><li><strong>乙级</strong>：可承担中等规模及以下</li><li><strong>丙级</strong>：可承担小型</li></ul><strong>监理服务能力要素</strong>：人员能力、技术能力、管理能力、财务能力、业绩。<br><br>监理单位应具备<strong>独立法人资格</strong>、<strong>相应专业技术人员</strong>、<strong>必要的技术装备</strong>、<strong>完善的管理体系</strong>。"}]}]},{"n":17,"name":"法律法规和标准规范","start_page":580,"sections":[{"sec":"17.1","title":"法律法规","page":580,"subs":[{"sec":"17.1","title":"法律法规","page":580,"summary":"法律法规:主要法律包括:合同法(调整合同关系)、招标投标法(规范招投标活动)、政府采购法(规范政府采购)、著作权法(保护软件著作权)、网络安全法(2017施行,关键信息基础设施保护)、数据安全法(2021施行)、个人信息保护法(2021施行)。法律层级:法律-行政法规-地方性法规-规章","kps":[]}],"kps":[{"id":"kp_367","sec":"17.1.1","title":"法与法律基本概念","tags":["重要","法规"],"body":"<strong>法</strong>：由国家制定或认可、以国家强制力保证实施、调整社会关系的行为规范总和。<br><br><strong>法律</strong>（广义）：与\"法\"同义，指所有规范性法律文件。<strong>法律</strong>（狭义）：仅指<strong>全国人大及其常委会</strong>制定的规范性文件。<br><br><strong>法律的特征</strong>：<ul><li>由国家制定或认可</li><li>由国家强制力保证实施</li><li>具有普遍约束力</li><li>规定权利和义务</li></ul>"},{"id":"kp_368","sec":"17.1.2","title":"法律体系","tags":["重要","法规"],"body":"<strong>中国特色社会主义法律体系</strong>：以<strong>宪法</strong>为核心，包括法律、行政法规、地方性法规、自治条例和单行条例。<br><br><strong>法律部门</strong>（七大部门）：<ol><li>宪法及宪法相关法</li><li><strong>民商法</strong>：如《民法典》《公司法》《合同法》（已并入民法典）</li><li>行政法：如《政府采购法》《招标投标法》</li><li>经济法</li><li>社会法：如《劳动法》《劳动合同法》</li><li>刑法</li><li>诉讼与非诉讼程序法</li></ol>"},{"id":"kp_369","sec":"17.1.3","title":"法的效力","tags":["重要","法规"],"body":"<strong>法的效力</strong>：法律的适用范围，包括对人、对事、空间、时间效力。<br><br><strong>效力层级</strong>（从高到低）：<ol><li><strong>宪法</strong>（最高）</li><li><strong>法律</strong>（全国人大及其常委会）</li><li><strong>行政法规</strong>（国务院）</li><li><strong>地方性法规</strong>（地方人大）</li><li><strong>规章</strong>（部门规章、地方政府规章）</li></ol><strong>效力原则</strong>：<ul><li><strong>上位法优于下位法</strong></li><li><strong>新法优于旧法</strong></li><li><strong>特别法优于一般法</strong></li><li>法律不溯及既往（特殊例外除外）</li></ul>"},{"id":"kp_370","sec":"17.1.4","title":"法律法规体系的效力层级","tags":["重要","法规"],"body":"<strong>效力冲突解决原则</strong>：<ul><li><strong>宪法 > 法律 > 行政法规 > 地方性法规/规章</strong></li><li>同一机关制定：新法 > 旧法、特别法 > 一般法</li><li>部门规章与地方性法规冲突：由国务院提出意见，认为应适用地方性法规的，适用地方性法规</li><li>部门规章与地方政府规章冲突：由国务院裁决</li><li>地方性法规与地方政府规章：地方性法规 > 同级地方政府规章</li></ul>"},{"id":"kp_371","sec":"17.1.5","title":"信息系统项目管理常用法律 - 政府采购与招投标","tags":["重要","高频","法规"],"body":"<strong>政府采购方式</strong>（依据《政府采购法》）：<ol><li><strong>公开招标</strong></li><li><strong>邀请招标</strong></li><li><strong>竞争性谈判</strong></li><li><strong>单一来源采购</strong></li><li><strong>询价</strong></li><li>国务院政府采购监督管理部门认定的其他方式</li></ol><strong>招投标程序（七步）</strong>：<ol><li>招标人采用公开招标方式的，应当发布招标公告；采用邀请招标方式的，应当向<strong>三个以上</strong>具备承担招标项目能力的、资信良好的特定法人或其他组织发出投标邀请书</li><li>招标人根据招标项目具体情况，可以组织潜在投标人踏勘项目现场</li><li>投标人投标</li><li>开标</li><li>评标</li><li>确定中标人</li><li>订立合同</li></ol><strong>评标委员会</strong>：由具有高级职称或同等专业水平的技术、经济等相关领域专家，招标人和招标机构代表等<strong>5人以上单数</strong>组成，其中经济、技术等方面专家人数不得少于总数的<strong>2/3</strong>。<br><br><strong>方案邀请书</strong>：用于征求潜在供应商建议的文件<br><strong>报价邀请书</strong>：用来征求潜在供应商报价的文件"},{"id":"kp_385","sec":"17.1.6","title":"常用评标方法 - 加权打分法·筛选系统·独立估算","tags":["重要","高频","法规"],"body":"<strong>常用评标方法</strong>（依据系统集成项目管理工程师教程P491）：<br><br><strong>（1）加权打分法</strong>（最常用）：<br>用具有<strong>不同权重</strong>的各评标标准，对各投标文件进行打分，然后<strong>加权汇总</strong>，得到各潜在卖方的排名顺序。选择<strong>得分最高</strong>的潜在卖方中标。<br><br><strong>（2）筛选系统</strong>：<br>通过<strong>多轮过滤</strong>，逐步淘汰达不到既定标准的投标商，直到剩下一家。用于淘汰的标准<strong>逐轮提高</strong>。最后剩下的那家，就是中标者。<br><br><strong>（3）独立估算</strong>：<br>把潜在卖方的<strong>报价</strong>与买方事先编制的<strong>独立成本估算</strong>（标底）进行比较，选择与标底<strong>最接近</strong>的报价中标。<br><br><strong>招标文件类</strong>：<ul><li><strong>信息邀请书（RFI）</strong>：用于征求潜在供应商信息</li><li><strong>报价邀请书（RFQ）</strong>：用来征求潜在供应商报价的文件</li><li><strong>建议邀请书（RFP）</strong>：用于征求潜在供应商建议的文件</li></ul>以上三者<strong>都属于招标文件</strong>。"}]},{"sec":"17.2","title":"标准规范","page":585,"subs":[{"sec":"17.2","title":"标准规范","page":585,"summary":"标准规范:国家标准GB、行业标准、地方标准DB、企业标准Q。强制性标准(人身财产安全)和推荐性标准(自愿采用)。ISO/IEC/JTC1:信息技术国际标准。软件工程标准:GB/T 8566(生存周期)、GB/T 8567(文档要求)、GB/T 16260(质量模型)。系统集成资质:计算机信息系统集成资质分级","kps":[]}],"kps":[{"id":"kp_372","sec":"17.2.1","title":"标准和标准化基本概念","tags":["重要","法规"],"body":"<strong>标准</strong>：为在一定范围内获得最佳秩序，经协商一致制定并经公认机构批准，共同使用和重复使用的规范性文件。<br><br><strong>标准化</strong>：制定、发布和实施标准的过程。包括制定、发布、实施、监督。<br><br><strong>标准化的目的</strong>：<ul><li>建立最佳秩序</li><li>保证产品质量和安全</li><li>促进技术进步和贸易</li><li>实现互换性和兼容性</li><li>提高经济效益和社会效益</li></ul><strong>标准化原则</strong>：协商一致、共同使用、重复使用。"},{"id":"kp_373","sec":"17.2.2","title":"标准分级与标准分类","tags":["重要","法规","高频"],"body":"<strong>标准分级</strong>（依据《标准化法》）：<ol><li><strong>国家标准（GB）</strong>：全国范围内统一的技术要求</li><li><strong>行业标准</strong>：行业范围内统一的技术要求</li><li><strong>地方标准（DB）</strong>：省、自治区、直辖市范围</li><li><strong>团体标准</strong>：由社会团体制定</li><li><strong>企业标准（Q）</strong>：企业内部使用</li></ol><strong>标准分类（按约束力）</strong>：<ul><li><strong>强制性标准</strong>：必须执行，如安全、卫生、环保标准</li><li><strong>推荐性标准</strong>（GB/T）：鼓励采用，自愿执行</li></ul><strong>标准化指导性技术文件</strong>（GB/Z）：用于尚未成熟的技术。"},{"id":"kp_374","sec":"17.2.3","title":"我国标准的编号及名称","tags":["重要","法规"],"body":"<strong>标准编号格式</strong>：标准代号 + 顺序号 + 发布年号<br><br><strong>国家标准</strong>：<ul><li><strong>GB ××××—YYYY</strong>：强制性国家标准</li><li><strong>GB/T ××××—YYYY</strong>：推荐性国家标准</li><li><strong>GB/Z ××××—YYYY</strong>：国家标准化指导性技术文件</li></ul><strong>行业标准</strong>：如电子信息行业标准<strong>SJ/T</strong>、通信行业标准<strong>YD/T</strong>、工程建设行业标准等<br><br><strong>地方标准</strong>：<strong>DB××/T ××××—YYYY</strong><br><strong>企业标准</strong>：<strong>Q/××× ××××—YYYY</strong>"},{"id":"kp_375","sec":"17.2.4","title":"我国标准的有效期","tags":["重要","法规"],"body":"<strong>标准有效期（标龄）</strong>：标准从实施之日起到废止或被替代的时间段。<br><br>我国国家标准复审周期：<ul><li>一般标准复审周期为<strong>5年</strong></li><li>推荐性标准复审可适当延长</li></ul><strong>复审结果</strong>：<ul><li><strong>确认有效</strong>：继续使用</li><li><strong>修订</strong>：修改后重新发布</li><li><strong>废止</strong>：不再使用</li></ul><strong>标准废止情形</strong>：技术落后、被新标准替代、不再适应需求。"},{"id":"kp_376","sec":"17.2.5","title":"信息系统集成项目管理常用标准规范","tags":["重要","法规"],"body":"<strong>常用国家标准</strong>：<ul><li><strong>GB/T 8566</strong>：信息技术 软件生存周期过程</li><li><strong>GB/T 8567</strong>：计算机软件文档编制规范</li><li><strong>GB/T 16260</strong>：系统与软件工程 系统与软件质量要求和评价（SQuaRE）</li><li><strong>GB/T 16680</strong>：软件文档管理指南</li><li><strong>GB/T 22239</strong>：信息安全技术 网络安全等级保护基本要求</li><li><strong>GB/T 28827.1</strong>：信息技术服务 运行维护 通用要求</li><li><strong>GB/T 29264</strong>：信息技术服务 分类与代码</li><li><strong>GB/T 8567</strong>、<strong>GB/T 9385</strong>：软件需求/设计相关</li></ul><strong>常用行业标准</strong>：SJ/T 软件工程类标准、YD/T 通信类标准。"}]},{"sec":"17.3","title":"本章练习","page":594,"subs":[],"kps":[]}]},{"n":18,"name":"职业道德规范","start_page":595,"sections":[{"sec":"18.1","title":"职业道德","page":595,"subs":[{"sec":"18.1","title":"职业道德","page":595,"summary":"职业道德:项目经理职业道德基本准则:诚实守信(不隐瞒-不虚报)、客观公正(独立客观)、恪尽职守(勤勉尽责)、严守秘密(商业机密)、廉洁自律(不收受不当利益)。遵守国家法律法规,维护公共利益","kps":[{"id":"kp_377","sec":"18.1","title":"职业道德基本概念","tags":["重要"],"body":"<strong>道德</strong>：社会生活中人们应遵循的行为准则和规范总和。<strong>职业道德</strong>：从事一定职业的人员在职业活动中应遵循的行为规范总和。<br><br><strong>职业道德特征</strong>：<ul><li>普遍性：所有职业都应遵守</li><li>行业性：不同行业有具体规范</li><li>规范性：以准则、公约形式呈现</li><li>自律性：依靠内心信念和舆论维持</li></ul><strong>职业道德核心</strong>：爱岗敬业、诚实守信、服务群众、奉献社会。"}]}],"kps":[]},{"sec":"18.2","title":"岗位职责","page":596,"subs":[{"sec":"18.2","title":"岗位职责","page":596,"summary":"岗位职责:项目经理职责:实现项目目标(范围-进度-成本-质量)、管理团队、沟通协调、风险应对、变更控制、采购管理。技术经理职责:技术方案决策、技术评审、代码质量。质量经理职责:质量计划、质量保证、质量控制","kps":[{"id":"kp_378","sec":"18.2","title":"项目管理工程师职业道德规范","tags":["重要","高频"],"body":"<strong>系统集成项目管理工程师职业道德规范</strong>：<ol><li><strong>遵守法律法规</strong>：严格遵守国家法律法规和行业规范</li><li><strong>诚实守信</strong>：客观真实地报告项目情况，不弄虚作假</li><li><strong>勤勉尽责</strong>：认真履行职责，维护项目和干系人利益</li><li><strong>公正公平</strong>：对待团队成员、供应商、干系人公正，不徇私舞弊</li><li><strong>保护机密</strong>：保守项目商业秘密和技术秘密</li><li><strong>避免利益冲突</strong>：主动回避可能影响公正判断的利益关系</li><li><strong>持续学习</strong>：不断提升专业能力，跟踪技术和管理发展</li><li><strong>尊重知识产权</strong>：遵守知识产权法律法规，不侵权盗版</li><li><strong>承担社会责任</strong>：关注项目对社会、环境的影响</li></ol>"}]}],"kps":[]},{"sec":"18.3","title":"团队责任","page":597,"subs":[{"sec":"18.3","title":"团队责任","page":597,"summary":"团队责任:团队协作准则:共享信息(透明公开)、互相支持(补位协助)、尊重差异(多元包容)、承担责任(不推诿)、共同决策(参与决策)。冲突解决:直面-妥协-缓和-强制-撤退。团队建设阶段:形成-震荡-规范-成熟-解散","kps":[{"id":"kp_379","sec":"18.3","title":"项目管理工程师岗位职责","tags":["重要"],"body":"<strong>项目管理工程师岗位职责</strong>：<ul><li><strong>项目规划</strong>：制定项目章程、项目管理计划，明确项目目标、范围、进度、成本</li><li><strong>资源管理</strong>：组建项目团队，分配资源，协调各方</li><li><strong>过程管理</strong>：执行、监控项目工作，控制变更</li><li><strong>风险管理</strong>：识别、分析、应对项目风险</li><li><strong>沟通协调</strong>：管理干系人期望，保持有效沟通</li><li><strong>质量管理</strong>：规划、保证和控制项目质量</li><li><strong>采购管理</strong>：规划、实施、控制采购</li><li><strong>项目收尾</strong>：验收、移交、总结项目</li></ul>"}]}],"kps":[]},{"sec":"18.4","title":"项目组织内外责任","page":598,"subs":[{"sec":"18.4","title":"项目组织内外责任","page":598,"summary":"项目组织内外责任:对内责任:对项目团队负责(提供资源-保护团队-公正评价)。对外责任:对业主/客户负责(交付价值-满足需求)、对供方负责(公平交易-按合同付款)、对社会负责(遵守法律-保护环境)。平衡各方利益是项目成功关键","kps":[{"id":"kp_380","sec":"18.4","title":"项目管理工程师对项目团队的责任","tags":["重要"],"body":"<strong>对项目团队的责任</strong>：<ol><li><strong>提供清晰方向</strong>：明确项目目标、成员角色职责</li><li><strong>营造良好环境</strong>：建立积极、协作、信任的团队氛围</li><li><strong>提供资源支持</strong>：保障团队所需资源、工具、培训</li><li><strong>公平对待</strong>：公正评价绩效，合理激励奖励</li><li><strong>关心成长</strong>：关注成员职业发展，提供学习机会</li><li><strong>保护团队</strong>：保护团队免受不合理要求和不必要干扰</li><li><strong>处理冲突</strong>：及时、合理处理团队内部冲突</li><li><strong>尊重成员</strong>：尊重每位成员的人格、文化、专业贡献</li></ol>"}]}],"kps":[]},{"sec":"18.5","title":"行为安全意识","page":599,"subs":[{"sec":"18.5","title":"行为安全意识","page":599,"summary":"行为安全意识:信息安全意识:不泄露-不传播敏感信息,使用强密码,定期更换,不在非工作渠道讨论工作。物理安全意识:数据中心出入管理,设备使用规范。操作安全:权限最小化,操作留痕,定期审计。应急意识:制定应急预案,定期演练","kps":[{"id":"kp_381","sec":"18.5","title":"提升个人道德修养水平","tags":["重要"],"body":"<strong>提升个人道德修养</strong>的方法：<ol><li><strong>加强学习</strong>：学习法律法规、行业规范、职业道德理论</li><li><strong>以身作则</strong>：在项目实践中率先垂范，成为榜样</li><li><strong>自我反省</strong>：定期反思自身行为，及时纠正</li><li><strong>接受监督</strong>：主动接受组织、同事、干系人监督</li><li><strong>参与培训</strong>：参加职业道德、合规培训</li><li><strong>建立诚信档案</strong>：记录个人职业诚信表现</li><li><strong>参与行业交流</strong>：向优秀同行学习</li></ol><strong>道德修养的核心</strong>：<strong>内化于心、外化于行</strong>——将职业道德规范内化为价值观，自觉落实到日常工作中。"}]}],"kps":[]},{"sec":"18.6","title":"本章练习","page":600,"subs":[],"kps":[]}]}];

function buildTOC(){
  const toc=document.getElementById('toc');
  let h='';
  DATA.forEach(ch=>{
    const kpTotal=ch.sections.reduce((a,s)=>a+(s.kps?s.kps.length:0)+(s.subs?s.subs.reduce((b,sub)=>b+(sub.kps?sub.kps.length:0),0):0),0);
    h+='<div class="toc-ch" onclick="scrollToCh('+ch.n+')">第'+ch.n+'章 '+ch.name+' <span style="color:var(--green);font-size:11px">('+kpTotal+')</span></div>';
    ch.sections.forEach(s=>{
      const cnt=(s.kps?s.kps.length:0)+(s.subs?s.subs.reduce((b,sub)=>b+(sub.kps?sub.kps.length:0),0):0);
      h+='<div class="toc-sec" onclick="scrollToSec('+ch.n+',\''+s.sec+'\')">§ '+s.sec+' '+s.title+(cnt>0?' <span style="color:var(--green)">['+cnt+']</span>':'')+'</div>';
    });
  });
  toc.innerHTML=h;
}

function renderKps(kps){
  if(!kps||kps.length===0)return '';
  let h='';
  kps.forEach(kp=>{
    let tags='';
    (kp.tags||[]).forEach(t=>{tags+='<span class="kp-tag tag-'+t+'">'+t+'</span>'});
    h+='<div class="kp-item"><div class="kp-header"><span class="kp-sec">'+kp.sec+'</span><span class="kp-title">'+kp.title+'</span><div class="kp-tags">'+tags+'</div></div><div class="kp-body">'+kp.body+'</div></div>';
  });
  return h;
}

let searchTerm='';let activeTags=[];
function getAllTags(){
  const tags=new Set();
  DATA.forEach(ch=>{
    ch.sections.forEach(sec=>{
      (sec.kps||[]).forEach(kp=>(kp.tags||[]).forEach(t=>tags.add(t)));
      (sec.subs||[]).forEach(sub=>(sub.kps||[]).forEach(kp=>(kp.tags||[]).forEach(t=>tags.add(t))));
    });
  });
  return [...tags];
}
function buildTagFilter(){
  const tf=document.getElementById('tagFilter');
  const tags=getAllTags();
  let h='';
  tags.forEach(t=>{
    const active=activeTags.includes(t)?'active':'';
    h+='<button class="tag-btn tag-'+t+' '+active+'" data-tag="'+t+'" onclick="toggleTag(\''+t+'\')">'+t+'</button>';
  });
  tf.innerHTML=h;
}
function toggleTag(t){
  const i=activeTags.indexOf(t);
  if(i>=0)activeTags.splice(i,1);else activeTags.push(t);
  buildTagFilter();buildMain();
}
function kpMatches(kp){
  if(activeTags.length>0){
    const hasTag=activeTags.some(t=>(kp.tags||[]).includes(t));
    if(!hasTag)return false;
  }
  if(searchTerm){
    const s=searchTerm.toLowerCase();
    const hay=(kp.title+' '+kp.body+' '+kp.sec).toLowerCase();
    if(!hay.includes(s))return false;
  }
  return true;
}
function buildMain(){
  const main=document.getElementById('content');
  let h='';let totalShown=0;
  DATA.forEach(ch=>{
    let chHasContent=false;
    let chKpTotal=0;
    let chHtml='';
    ch.sections.forEach(sec=>{
      let secHtml='';let secHasKp=false;
      const subKps=sec.subs?sec.subs.flatMap(sub=>sub.kps||[]):[];
      const allKps=(sec.kps||[]).concat(subKps);
      const shownKps=allKps.filter(kpMatches);
      if(shownKps.length>0)secHasKp=true;
      // 章节标题和ITTO也参与搜索（仅搜索词非空时才做文本匹配）
      const ittoText=sec.itto?(sec.itto.i.concat(sec.itto.t,sec.itto.o).join('、')):'';
      const secMatch=searchTerm?(sec.title+sec.sec+ittoText).toLowerCase().includes(searchTerm.toLowerCase()):false;
      if(!secMatch&&!secHasKp&&!(activeTags.length>0)){
        // 没有搜索时显示全部
      }
      if(activeTags.length>0||searchTerm){
        if(!secMatch&&!secHasKp)return;
      }
      chKpTotal+=shownKps.length;
      totalShown+=shownKps.length;
      chHasContent=true;
      const totalKps=shownKps.length;
      secHtml+='<div class="sec-block" id="sec'+ch.n+'_'+sec.sec+'">';
      secHtml+='<div class="sec-header" onclick="toggleSec(this)"><span class="sec-arrow">▶</span><span class="sec-num">§ '+sec.sec+'</span><span class="sec-title">'+sec.title+'</span><span class="sec-page">P'+sec.page+'</span>'+(totalKps>0?'<span class="sec-kp-count">● '+totalKps+'</span>':'')+'</div>';
      secHtml+='<div class="sec-content show">';
      if(sec.itto){
        secHtml+='<div class="itto-block">';
        secHtml+='<div class="itto-row"><span class="itto-label itto-in">输入</span><span class="itto-items">'+sec.itto.i.join('、')+'</span></div>';
        secHtml+='<div class="itto-row"><span class="itto-label itto-tool">工具</span><span class="itto-items">'+sec.itto.t.join('、')+'</span></div>';
        secHtml+='<div class="itto-row"><span class="itto-label itto-out">输出</span><span class="itto-items">'+sec.itto.o.join('、')+'</span></div>';
        secHtml+='</div>';
      }
      if(sec.subs && sec.subs.length>0){
        sec.subs.forEach(sub=>{
          const skps=(sub.kps||[]).filter(kpMatches);
          if(activeTags.length>0||searchTerm){if(skps.length===0&&!(sub.summary&&sub.summary.toLowerCase().includes(searchTerm.toLowerCase())))return}
          secHtml+='<div class="sub-item"><div class="sub-header"><span class="sub-num">'+sub.sec+'</span><span class="sub-title">'+sub.title+'</span><span class="sub-page">P'+sub.page+'</span>'+(skps.length>0?'<span class="sub-kp-count">● '+skps.length+'</span>':'')+'</div>';
          if(sub.summary){secHtml+='<div class="sub-summary">'+sub.summary+'</div>'}
          secHtml+=renderKps(skps);
          secHtml+='</div>';
        });
      }
      secHtml+=renderKps((sec.kps||[]).filter(kpMatches));
      secHtml+='</div></div>';
      chHtml+=secHtml;
    });
    if(chHasContent||(!activeTags.length&&!searchTerm)){
      h+='<div class="ch-block" id="ch'+ch.n+'">';
      h+='<h2 class="ch-title">第'+ch.n+'章 · '+ch.name+'</h2>';
      h+='<div class="ch-page">📖 P'+ch.start_page+'起 · 共 '+chKpTotal+' 个知识点</div>';
      h+=chHtml;
      h+='</div>';
    }
  });
  main.innerHTML=h;
  const info=document.getElementById('searchInfo');
  if(searchTerm||activeTags.length>0){
    info.textContent='找到 '+totalShown+' 个匹配的知识点';
  }else{
    info.textContent='';
  }
}
function handleSearch(){
  searchTerm=document.getElementById('searchInput').value.trim();
  buildMain();
}

function toggleSec(el){
  const arrow=el.querySelector('.sec-arrow');
  const content=el.nextElementSibling;
  if(content){content.classList.toggle('show');if(arrow)arrow.classList.toggle('open')}
}
function scrollToCh(n){
  document.getElementById('ch'+n).scrollIntoView({behavior:'smooth'});
  if(window.innerWidth<=768)toggleSidebar();
}
function scrollToSec(n,sec){
  const el=document.getElementById('sec'+n+'_'+sec);
  if(el){
    el.scrollIntoView({behavior:'smooth'});
    const content=el.querySelector('.sec-content');
    const arrow=el.querySelector('.sec-arrow');
    if(content&&!content.classList.contains('show')){content.classList.add('show');if(arrow)arrow.classList.add('open')}
  }
  if(window.innerWidth<=768)toggleSidebar();
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarMask').classList.toggle('show');
}
buildTOC();
buildTagFilter();
buildMain();
</script>
</body>
</html>
