{ id:'kp_251', ch:11, sec:'11.10.2', title:'制订进度计划工具 - 关键路径法与时差公式', tags:['重要','计算','高频'],
  body:`<strong>关键路径法（CPM）</strong>：网络图中持续时间最长的路径，决定项目最短工期。关键路径上活动总时差为零或负。<br><br><strong>时差公式</strong>：<div class="formula">自由时差（自由浮动时间）= 紧后工作最早开始时间 − 本工作的最早完成时间</div><div class="formula">总时差（总浮动时间）= 最迟开始 − 最早开始 = 最迟完成 − 最早完成</div><br><strong>关键术语</strong>：<ul><li><strong>最早开始ES / 最早完成EF</strong>：正向推算（加法）</li><li><strong>最迟开始LS / 最迟完成LF</strong>：逆向推算（减法）</li><li>EF = ES + 持续时间</li><li>LS = LF − 持续时间</li></ul><strong>其他工具</strong>：关键链法、资源优化技术（资源平衡/平滑）、进度压缩（赶工/快速跟进）、进度网络分析。`
},

{ id:'kp_252', ch:11, sec:'11.10.3', title:'制订进度计划的主要输出', tags:['重要'],
  body:`<strong>制订进度计划</strong>输出：<ol><li><strong>进度基准</strong>：经批准的进度模型，作为测量和监控进度绩效的基准</li><li><strong>项目进度计划</strong>：可以是<strong>横道图（甘特图）、里程碑图、进度网络图</strong></li><li><strong>进度数据</strong>：描述和控制进度的信息</li><li>项目日历</li><li>项目管理计划更新</li><li>项目文件更新</li></ol>`
},

{ id:'kp_253', ch:11, sec:'11.11.1', title:'规划成本管理的主要输入', tags:['重要'],
  body:`<strong>规划成本管理</strong>输入：项目章程、项目管理计划（进度管理计划、风险管理计划）、事业环境因素、组织过程资产。`
},

{ id:'kp_254', ch:11, sec:'11.11.2', title:'规划成本管理的主要输出', tags:['重要'],
  body:`<strong>规划成本管理</strong>输出：<strong>成本管理计划</strong>，描述如何规划、估算、预算和控制项目成本。包括计量单位、精确度、准确度、组织程序链接、控制临界值、绩效测量规则（如EVM规则）、报告格式等。`
},

{ id:'kp_255', ch:11, sec:'11.12.1', title:'估算成本的主要输入', tags:['重要'],
  body:`<strong>估算成本</strong>输入：项目管理计划（成本管理计划、质量管理计划）、项目文件（成本估算、需求文件、风险登记册等）、事业环境因素、组织过程资产。`
},

{ id:'kp_256', ch:11, sec:'11.12.2', title:'估算成本的主要输出', tags:['重要'],
  body:`<strong>估算成本</strong>输出：<ol><li><strong>成本估算</strong>：包括对完成活动所需资源的定量估算，应包含<strong>应急储备</strong></li><li><strong>估算依据</strong>：记录假设、限制、方法</li><li>项目文件更新（假设日志、经验教训登记册、风险登记册）</li></ol><strong>估算方法</strong>：类比估算、参数估算、自下而上估算、三点估算、储备分析。`
},

{ id:'kp_257', ch:11, sec:'11.13.1', title:'制定预算的主要输入', tags:['重要'],
  body:`<strong>制定预算</strong>输入：项目管理计划（成本管理计划、资源管理计划、范围基准）、项目文件、商业文件（商业论证、效益管理计划）、协议、事业环境因素、组织过程资产。`
},

{ id:'kp_258', ch:11, sec:'11.13.2', title:'制定预算主要输出 - 成本基准与管理储备', tags:['重要','高频'],
  body:`<strong>制定预算</strong>输出：<strong>成本基准</strong>、项目资金需求、项目文件更新。<br><br><strong>关键概念</strong>：<ul><li><strong>应急储备</strong>：应对<strong>已识别</strong>风险，<strong>包含在成本估算和成本基准中</strong>。由项目经理控制</li><li><strong>管理储备</strong>：应对<strong>未识别</strong>风险（未知-未知），<strong>不包含在成本估算和成本基准中</strong>，由高层控制。使用前需批准</li><li><strong>项目预算 = 成本基准 + 管理储备</strong></li></ul><strong>成本基准构成</strong>：各工作包成本估算（含应急储备）汇总 + 项目层面的应急储备。<br><br><strong>注意</strong>：管理储备不包含在估算和基准中，应急储备包含在估算和基准中。`
},

{ id:'kp_259', ch:11, sec:'11.14.1', title:'规划质量管理的主要输入', tags:['重要'],
  body:`<strong>规划质量管理</strong>输入：项目章程、项目管理计划（质量管理计划）、项目文件（风险登记册、相关方登记册、需求文件）、事业环境因素、组织过程资产。`
},

{ id:'kp_260', ch:11, sec:'11.14.2', title:'规划质量管理的主要工具与技术', tags:['重要','高频'],
  body:`<strong>规划质量管理</strong>的工具与技术：<ol><li><strong>成本收益分析法</strong>（成本效益分析）：比较成本与收益，确定最优方案</li><li><strong>质量成本法（COQ）</strong>：包括一致性成本（预防成本、评价成本）和非一致性成本（内部失败、外部失败）</li><li><strong>标杆对照</strong>：与可比项目对照</li><li><strong>实验设计（DOE）</strong>：确定影响产品/过程质量的因素，是一种统计方法</li><li>其他工具：<strong>头脑风暴、力场分析、名义小组技术</strong></li></ol>`
},

{ id:'kp_261', ch:11, sec:'11.14.3', title:'规划质量管理的主要输出', tags:['重要'],
  body:`<strong>规划质量管理</strong>输出：<ol><li><strong>质量管理计划</strong>：描述如何实施适用的政策、程序和指南以实现质量目标</li><li><strong>质量测量指标</strong>：描述项目或产品属性及验证方法，如缺陷密度、故障率、可用性等</li><li>项目管理计划更新</li><li>项目文件更新（风险登记册、经验教训登记册）</li></ol>`
},

{ id:'kp_262', ch:11, sec:'11.15.1', title:'规划资源管理主要输入 - 影响因素', tags:['重要'],
  body:`<strong>规划资源管理</strong>（含人力资源计划）的输入受以下因素影响：<br><br><strong>事业环境因素</strong>（6项，对编制人力资源计划产生重要影响）：<ol><li>组织、文化和结构</li><li>现有的人力资源与人力资源政策</li><li>后勤保障</li><li>人事管理政策</li><li>市场条件</li><li>人际关系及政治因素</li></ol><strong>组织过程资产</strong>（4项，影响编制过程）：<ol><li>组织的标准流程、政策和角色描述</li><li>组织结构图与岗位描述的模板</li><li>以往项目中与组织结构有关的经验教训</li><li>团队和项目执行组织内用于解决问题的升级程序</li></ol>`
},

{ id:'kp_263', ch:11, sec:'11.15.2', title:'规划资源管理的主要工具与技术', tags:['重要'],
  body:`<strong>规划资源管理</strong>工具与技术：<ol><li><strong>专家判断</strong></li><li><strong>数据表现</strong>：<ul><li><strong>层级图</strong>：工作分解结构WBS、组织分解结构OBS、资源分解结构RBS</li><li><strong>责任分配矩阵（RAM）</strong>：展示项目资源对工作包的责任，<strong>RACI图</strong>（执行Responsible/负责Accountable/咨询Consult/知情Inform）</li><li>文本形式</li></ul></li><li><strong>组织理论</strong>：描述人员/团队行为方式</li><li>会议</li></ol>`
},

{ id:'kp_264', ch:11, sec:'11.15.3', title:'规划资源管理的主要输出', tags:['重要'],
  body:`<strong>规划资源管理</strong>输出：<ol><li><strong>资源管理计划</strong>：识别/获取/管理/监督资源的方法，包括团队资源、团队组建、培训、团队绩效评价等</li><li><strong>团队章程</strong>：团队价值观、沟通指南、决策标准、冲突解决、会议指南、团队共识等</li><li>项目管理计划更新</li><li>项目文件更新（假设日志、经验教训登记册、风险登记册）</li></ol>`
},

{ id:'kp_265', ch:11, sec:'11.16.1', title:'估算活动资源的主要输入', tags:['重要'],
  body:`<strong>估算活动资源</strong>输入：项目管理计划（资源管理计划、范围基准）、项目文件（活动清单、活动属性、资源日历、假设日志、风险登记册）、事业环境因素、组织过程资产。`
},

{ id:'kp_266', ch:11, sec:'11.16.2', title:'估算活动资源的主要输出', tags:['重要'],
  body:`<strong>估算活动资源</strong>输出：<ol><li><strong>资源需求</strong>：明确工作包所需资源的类型和数量</li><li><strong>估算依据</strong></li><li>项目文件更新（活动清单、活动属性、资源分解结构、假设日志、经验教训登记册）</li></ol><strong>资源分解结构（RBS）</strong>：按类别和类型对资源进行层级展示。`
},

{ id:'kp_267', ch:11, sec:'11.17.1', title:'规划沟通管理的主要输入', tags:['重要'],
  body:`<strong>规划沟通管理</strong>输入：项目章程、项目管理计划、项目文件（相关方登记册、需求文件、风险登记册）、事业环境因素、组织过程资产。`
},

{ id:'kp_268', ch:11, sec:'11.17.2', title:'规划沟通管理的主要工具与技术', tags:['重要','高频'],
  body:`<strong>规划沟通管理</strong>工具与技术：<ol><li><strong>专家判断</strong></li><li>沟通需求分析</li><li><strong>沟通技术</strong>：根据信息敏感度、可用性等选择</li><li><strong>沟通模型</strong>：发送方-编码-媒介-解码-接收方-反馈</li><li><strong>沟通方法</strong>（详见kp_308）</li><li><strong>人际关系与团队技能</strong>：如<strong>沟通风格评估</strong>、政治意识、文化意识</li><li>数据表现</li><li>会议</li></ol><strong>沟通渠道数公式</strong>：n(n−1)/2，n为人数。`
},

{ id:'kp_269', ch:11, sec:'11.17.3', title:'规划沟通管理的主要输出', tags:['重要'],
  body:`<strong>规划沟通管理</strong>输出：<ol><li><strong>沟通管理计划</strong>：包括干系人沟通要求、沟通内容、原因、频率、发起方、格式/媒介、保密级别等</li><li>项目管理计划更新</li><li>项目文件更新（相关方登记册、经验教训登记册）</li></ol>`
},

{ id:'kp_270', ch:11, sec:'11.18.1', title:'风险基本概念 - 特性、属性与分类', tags:['重要','高频'],
  body:`<strong>风险</strong>：一个可能发生、可能不发生的事件，一旦发生会对项目目标产生积极或消极影响。<br><br><strong>风险核心属性三要素</strong>：<ul><li><strong>随机性</strong>：发生时间、影响程度不确定</li><li><strong>相对性</strong>：同一风险对不同主体影响不同</li><li><strong>可变性</strong>：风险随项目进展发生变化</li></ul><strong>风险特性辨析</strong>：<ul><li><strong>相对性</strong>：同风险对不同主体影响不同</li><li><strong>紧迫性</strong>：需被应对的紧急程度</li><li><strong>关联性</strong>：一个风险可能引发连锁风险</li><li><strong>可控性</strong>：能否人为干预控制</li></ul><strong>风险分类全集</strong>：<ul><li>按<strong>可预测性</strong>：已知风险、可预测风险、不可预测风险</li><li>按<strong>后果</strong>：纯粹风险、投机风险</li><li>按<strong>来源</strong>：自然风险、人为风险</li><li>按<strong>影响范围</strong>：局部风险、总体风险</li><li>按<strong>后果承担者</strong>：业主/政府/承包商/投资方/设计/监理/供应商/担保方/保险方风险</li></ul><img src="assets/IMG_0115.png">`
},

,

{ id:'kp_382', ch:11, sec:'11.18.2', title:'风险三维分类 - 性质·可控程度·认知程度', tags:['重要','高频'],
  body:`<strong>风险三维分类</strong>（考试高频考点，需区分三个维度）：<br><br><strong>一、按风险的性质</strong>：<ul><li><strong>自然风险</strong>：由自然力量引起，如地震、洪水、台风、火灾等</li><li><strong>人为风险</strong>：由人的活动引起，包括行为风险、经济风险、技术风险、政治风险、法律风险等</li><li><strong>社会风险</strong>：由社会冲突、治安问题等引起</li></ul><strong>二、按风险的可控程度</strong>：<ul><li><strong>可控风险</strong>：通过项目管理活动可以控制和降低的风险，如进度风险、成本风险、质量风险</li><li><strong>半可控风险</strong>：可在一定程度上控制的风险，如供应商交付风险、人员流失风险</li><li><strong>不可控风险</strong>：超出项目团队控制范围的风险，如地震、战争、政策突变、国际市场剧变等</li></ul><strong>三、按风险的认知程度</strong>：<ul><li><strong>已知风险</strong>：项目团队已经识别、知道其存在的风险，可纳入风险管理计划</li><li><strong>未知风险</strong>：项目团队尚未识别或无法预见的风险，需通过管理储备应对</li></ul>项目风险管理的重点是<strong>将未知风险转化为已知风险</strong>，将不可控风险转化为可控或半可控风险。`
}

{ id:'kp_271', ch:11, sec:'11.18.2', title:'纯粹风险 vs 投机风险', tags:['重要','高频'],
  body:`<ul><li><strong>纯粹风险</strong>（只有损失一种后果）：不能带来机会、无获得利益可能。<br>两种可能后果：造成损失和不造成损失。造成的损失是绝对的损失。</li><li><strong>投机风险</strong>（可能有损失也可能有收益）：既可能带来机会、获得利益，又隐含威胁、造成损失。<br>三种可能后果：造成损失、不造成损失和获得利益。</li></ul><strong>纯粹风险和投机风险在一定条件下可以相互转化</strong>。项目管理人员必须避免投机风险转化为纯粹风险。风险不是零和游戏。<br><br>纯粹风险示例：火灾、地震。投机风险示例：投资股票。`
},

{ id:'kp_272', ch:11, sec:'11.18.3', title:'规划风险管理的主要输入与输出', tags:['重要'],
  body:`<strong>规划风险管理</strong>输入：项目章程、项目管理计划、项目文件（相关方登记册）、事业环境因素、组织过程资产。<br><br><strong>输出</strong>：<strong>风险管理计划</strong>，内容包括：<ul><li>方法论</li><li>角色和职责</li><li>预算（应急储备和管理储备）</li><li>时间安排（何时开展风险管理活动）</li><li>风险类别（RBS风险分解结构）</li><li>风险概率和影响定义</li><li>概率影响矩阵</li><li>相关方风险偏好/容忍度/临界值</li><li>报告格式、跟踪方式</li></ul>`
},

{ id:'kp_273', ch:11, sec:'11.19.1', title:'识别风险的主要输入', tags:['重要'],
  body:`<strong>识别风险</strong>输入：项目管理计划（风险管理计划、范围/进度/成本/质量/资源管理计划）、项目文件（假设日志、风险登记册、需求文件、持续时间/成本/资源估算、相关方登记册、问题日志、经验教训登记册）、协议、采购文件、事业环境因素、组织过程资产。`
},

{ id:'kp_274', ch:11, sec:'11.19.2', title:'识别风险主要工具 - SWOT与识别原则', tags:['重要','高频'],
  body:`<strong>识别风险</strong>工具与技术：文档审核、信息收集技术（头脑风暴、德尔菲、访谈、SWOT）、核对单分析、假设分析、图解技术（因果图、流程图、影响图）、SWOT分析、专家判断。<br><br><strong>SWOT分析</strong>：<ul><li><strong>S</strong>trength - 优势</li><li><strong>W</strong>eakness - 劣势</li><li><strong>O</strong>pportunity - 机会</li><li><strong>T</strong>hreats - 威胁</li></ul>从<strong>内部</strong>（优势/劣势）和<strong>外部</strong>（机会/威胁）两方面识别风险。<br><br><strong>风险识别五条原则</strong>：<ol><li>由粗及细，由细及粗</li><li>严格界定风险内涵并考虑风险因素之间的相关性</li><li>先怀疑，后排除</li><li>排除与确认并重。对于肯定不能排除但又不能肯定予以确认的风险按确认考虑</li><li>必要时，可作实验论证</li></ol>`
},

,

{ id:'kp_383', ch:11, sec:'11.19.3', title:'风险图解技术详解 - 因果图·流程图·影响图', tags:['重要','高频'],
  body:`<strong>风险图解技术</strong>是识别风险的重要工具，包括三类：<br><br><strong>（1）因果图</strong>（又称<strong>石川图</strong>或<strong>鱼骨图</strong>）：<ul><li>用于<strong>识别风险的起因</strong>，分析风险的根本原因</li><li>主干为风险事件（"鱼头"），分支为各类原因（人/机/料/法/环/测等）</li><li>同样用于<strong>管理质量</strong>中的根因分析</li></ul><strong>（2）系统或过程流程图</strong>：<ul><li>显示系统各要素之间的<strong>相互联系及因果传导机制</strong></li><li>通过展示流程步骤、决策点、输入输出，发现可能出问题的环节</li><li>常用于识别<strong>过程中</strong>的风险</li></ul><strong>（3）影响图</strong>：<ul><li>用图形方式表示<strong>变量与结果之间的因果关系、事件时间顺序及其他关系</strong></li><li>是决策树分析、敏感性分析的可视化基础</li><li>也用于<strong>实施定量风险分析</strong></li></ul><strong>关联记忆</strong>：因果图找原因，流程图找环节，影响图找因果链。`
}
,

{ id:'kp_384', ch:11, sec:'11.19.4', title:'假设分析详解 - 检验假设有效性', tags:['重要'],
  body:`<strong>假设分析</strong>：每个项目及其计划都是基于一套<strong>假想、设想或假设</strong>构建的。<br><br><strong>假设分析的目的</strong>：检验假设条件在项目中的<strong>有效性</strong>，并识别因其中的<strong>不准确、不稳定、不一致或不完整</strong>而导致的项目风险。<br><br><strong>假设分析步骤</strong>：<ol><li>识别项目假设（如资源假设、技术假设、时间假设、成本假设）</li><li>评估假设的有效性（准确？稳定？一致？完整？）</li><li>确定假设失效可能造成的风险</li><li>将假设失效的风险纳入风险登记册</li></ol><strong>典型假设示例</strong>："核心开发人员不会离职""项目所需硬件按时到位""需求变更次数不超过预期"——这些假设一旦不成立，就会转化为风险。`
}

{ id:'kp_275', ch:11, sec:'11.19.3', title:'识别风险的主要输出', tags:['重要'],
  body:`<strong>识别风险</strong>输出：<ol><li><strong>风险登记册</strong>：记录已识别风险、潜在风险应对措施</li><li>项目文件更新（假设日志、问题日志、经验教训登记册）</li></ol>风险登记册内容：风险编号、类别、描述、概率、影响、应对策略、责任人等。`
},

{ id:'kp_276', ch:11, sec:'11.20.1', title:'实施定性风险分析的主要输入', tags:['重要'],
  body:`<strong>实施定性风险分析</strong>输入：项目管理计划（风险管理计划）、项目文件（风险登记册、假设日志、风险报告）、事业环境因素、组织过程资产。`
},

{ id:'kp_277', ch:11, sec:'11.20.2', title:'实施定性风险分析的主要工具与技术', tags:['重要'],
  body:`<strong>实施定性风险分析</strong>工具：<ol><li><strong>专家判断</strong></li><li><strong>数据收集</strong>：访谈</li><li><strong>数据分析</strong>：<ul><li><strong>风险数据质量评估</strong></li><li><strong>风险概率和影响评估</strong></li><li><strong>其他风险参数评估</strong>（紧迫性、邻近性、潜伏期）</li></ul></li><li><strong>人际关系与团队技能</strong>：引导</li><li><strong>风险分类</strong>：按风险来源、影响范围等分类</li><li><strong>数据表现</strong>：概率-影响矩阵、风险分层图、层级图</li></ol><strong>概率-影响矩阵</strong>：对风险按概率和影响进行分级（低/中/高），决定应对优先级。`
},

{ id:'kp_278', ch:11, sec:'11.20.3', title:'实施定性风险分析的主要输出', tags:['重要'],
  body:`<strong>实施定性风险分析</strong>输出：项目文件更新（风险登记册、风险报告、假设日志、问题日志、经验教训登记册）。<br><br>更新内容：风险优先级排序、分类、趋势分析、需进一步分析的风险。`
},

{ id:'kp_279', ch:11, sec:'11.21.1', title:'实施定量风险分析的主要输入', tags:['重要'],
  body:`<strong>实施定量风险分析</strong>输入：项目管理计划（风险管理计划、进度/成本管理计划）、项目文件（风险登记册、风险报告、假设日志、持续时间/成本估算）、事业环境因素、组织过程资产。`
},

{ id:'kp_280', ch:11, sec:'11.21.2', title:'实施定量风险分析主要工具 - 敏感性分析', tags:['重要','高频'],
  body:`<strong>实施定量风险分析</strong>工具与技术：<ol><li><strong>数据收集</strong>：访谈</li><li><strong>人际关系与团队技能</strong>：引导</li><li><strong>不确定性的表现方式</strong>：连续概率分布、离散分布</li><li><strong>数据分析</strong>：<ul><li><strong>敏感性分析</strong>：确定对项目结果具有<strong>最大潜在影响</strong>的风险。常用<strong>龙卷风图</strong>展示</li><li><strong>决策树分析</strong>：用于多方案选择</li><li><strong>影响图</strong></li><li><strong>模拟</strong>：<strong>蒙特卡洛分析</strong>，通过多次迭代模拟项目结果分布</li></ul></li><li><strong>专家判断</strong></li></ol><strong>敏感性分析</strong>让项目经理确定哪些风险对项目目标影响最大，便于优先应对。<img src="assets/image 15.png">`
},

{ id:'kp_281', ch:11, sec:'11.21.3', title:'实施定量风险分析的主要输出', tags:['重要'],
  body:`<strong>实施定量风险分析</strong>输出：项目文件更新（风险报告）。<br><br>更新内容包括：对整体项目风险暴露的量化、实现目标的概率、按优先级排序的量化风险、趋势分析结果。`
},

{ id:'kp_282', ch:11, sec:'11.22.1', title:'规划风险应对的主要输入', tags:['重要'],
  body:`<strong>规划风险应对</strong>输入：项目管理计划（风险管理计划、资源/进度/成本/质量管理计划）、项目文件（风险登记册、风险报告、经验教训登记册、假设日志、项目团队派工单、相关方登记册）、事业环境因素、组织过程资产。`
},

{ id:'kp_283', ch:11, sec:'11.22.2', title:'规划风险应对主要工具 - 应对策略', tags:['重要','高频'],
  body:`<strong>威胁（消极风险）的应对策略</strong>（4+1）：<ol><li><strong>规避</strong>：消除威胁，调整项目计划绕开风险</li><li><strong>转移</strong>：把风险责任转给第三方，如买保险、外包</li><li><strong>减轻</strong>：降低概率或影响，如增加测试</li><li><strong>接受</strong>：不采取措施，分<strong>主动接受</strong>（建立应急储备）和<strong>被动接受</strong>（不行动）</li><li><strong>上报</strong>：超出项目经理权限，交给项目集/组合层处理</li></ol><strong>机会（积极风险）的应对策略</strong>（4+1）：<ol><li><strong>开拓</strong>：确保机会实现</li><li><strong>分享</strong>：与第三方分享机会，如合作联盟</li><li><strong>提高</strong>：提升机会概率或正面影响</li><li><strong>接受</strong>：不主动追求</li><li><strong>上报</strong></li></ol><strong>工具</strong>：专家判断、数据收集、人际关系与团队技能、应对策略、应急应对策略、专家判断、数据分析（备选方案、成本效益）。`
},

{ id:'kp_284', ch:11, sec:'11.22.3', title:'规划风险应对的主要输出', tags:['重要'],
  body:`<strong>规划风险应对</strong>输出：<ol><li>项目管理计划更新（进度、成本、质量、资源管理计划变更）</li><li>项目文件更新（风险登记册、风险报告、假设日志、经验教训登记册、成本预测、进度预测）</li><li><strong>协议</strong>（如保险合同）</li></ol>`
},

{ id:'kp_285', ch:11, sec:'11.23.1', title:'规划采购管理的主要输入', tags:['重要'],
  body:`<strong>规划采购管理</strong>输入：项目章程、商业文件（商业论证、效益管理计划）、项目管理计划（范围/质量/资源管理计划）、项目文件（需求文件、风险登记册、相关方登记册、里程碑清单等）、事业环境因素、组织过程资产。`
},

{ id:'kp_286', ch:11, sec:'11.23.2', title:'规划采购管理主要输出 - 采购十步骤', tags:['重要','高频'],
  body:`<strong>规划采购管理</strong>输出：采购管理计划、采购策略、<strong>采购工作说明书（SOW）</strong>、招标文件、独立成本估算、供方选择标准、自制或外购决策。<br><br><strong>采购步骤十步</strong>：<ol><li>准备采购工作说明书（SOW）或工作大纲（TOR）</li><li>准备高层级的成本估算，制定预算</li><li>发布招标广告</li><li>确定合格卖方的名单</li><li>准备并发布招标文件</li><li>由卖方准备并提交建议书</li><li>对建议书开展技术（包括质量）评估</li><li>对建议书开展成本评估</li><li>准备最终的综合评估报告（包括质量及成本），选出中标建议书</li><li>结束谈判，买方和卖方签署合同</li></ol><img src="assets/IMG_0113.png">`
},

{ id:'kp_287', ch:11, sec:'11.23.3', title:'合同类型选择与适用场景', tags:['重要','高频','案例'],
  body:`<ul><li><strong>总价合同</strong>（固定价格合同）：适用于<strong>工程量不太大且能精确计算、工期较短、技术不太复杂、风险不大</strong>的项目。要求发包人准备详细全面的设计图纸。<ul><li>固定总价合同FFP：最常用</li><li>总价加经济价格调整合同FPIF：长期合同应对通胀</li></ul></li><li><strong>成本补偿合同</strong>：适用于<ul><li>需立即开展工作的项目</li><li>项目内容及技术经济指标未确定的项目</li><li>风险大的项目</li></ul>包括成本加固定费用CPFF、成本加激励费用CPIF、成本加奖励费用CPAF</li><li><strong>工料合同</strong>（框架合同）：兼具成本补偿和总价合同特点，适用于<strong>工作性质清楚，但具体工作量无法准确确定</strong>的项目</li><li><strong>单价合同</strong>：适用于工程量不确定，工作内容和技术难度变化不大的项目</li></ul>`
},

{ id:'kp_288', ch:11, sec:'11.23.4', title:'合同内容与关键条款', tags:['重要','法规'],
  body:`<strong>合同</strong>是平等主体的自然人、法人、其他组织之间设立、变更、终止民事权利义务关系的协议。<br><br><strong>合同主要内容</strong>：<ol><li>当事人名称/住所</li><li>标的（合同客体，如货物、服务）</li><li>数量</li><li>质量</li><li>价款或报酬</li><li>履行期限、地点和方式</li><li>违约责任</li><li>解决争议的方法</li></ol><strong>合同的特征</strong>：是一种法律行为、双方/多方行为、当事人在平等自愿基础上达成、以设立/变更/终止民事关系为目的。`
},

{ id:'kp_289', ch:11, sec:'11.24.1', title:'规划干系人参与的主要输入', tags:['重要'],
  body:`<strong>规划干系人参与</strong>输入：项目章程、项目管理计划（沟通、相关方参与管理计划）、项目文件（假设日志、风险登记册、变更日志、问题日志、相关方登记册、项目进度计划）、协议、事业环境因素、组织过程资产。`
},

{ id:'kp_290', ch:11, sec:'11.24.2', title:'规划干系人参与主要工具与技术', tags:['重要','高频'],
  body:`<strong>规划干系人参与</strong>工具与技术：<ol><li><strong>专家判断</strong></li><li><strong>数据收集</strong>：标杆对照、假设和制约因素分析</li><li><strong>数据分析</strong>：<ul><li><strong>相关方参与度评估矩阵</strong>：当前 vs 期望参与程度</li><li>根原因分析</li><li>假设条件/制约因素</li></ul></li><li><strong>决策</strong></li><li><strong>数据表现</strong>：参与度评估矩阵</li><li><strong>人际关系与团队技能</strong>：<ul><li><strong>会议</strong>（引导、谈判、冲突管理）</li></ul></li><li>会议</li></ol><strong>参与度五分类</strong>：不知道、抵制、中立、支持、领导。分析当前与期望差距，确定应对策略。<img src="assets/IMG_0112.png">`
},

{ id:'kp_291', ch:11, sec:'11.24.3', title:'规划干系人参与的主要输出', tags:['重要'],
  body:`<strong>规划干系人参与</strong>输出：<ol><li><strong>相关方参与计划</strong>：描述促进相关方有效参与项目的方法</li><li>项目管理计划更新</li><li>项目文件更新（假设日志、风险登记册、相关方登记册、经验教训登记册）</li></ol>`
},

{ id:'kp_292', ch:11, sec:'11.21', title:'风险管理综合例题（11.18-11.21）', tags:['重要','案例'],
  body:`风险管理过程例题集合，覆盖风险识别、定性分析、定量分析与应对策略。<br><br><strong>核心要点</strong>：<ol><li>风险识别：使用SWOT、文档审核、核对单等</li><li>定性分析：概率-影响矩阵排序</li><li>定量分析：敏感性分析、蒙特卡洛模拟</li><li>应对策略：消极风险（规避/转移/减轻/接受）、积极风险（开拓/分享/提高/接受）</li></ol>以下为例题图解：<br><img src="assets/image 5.png"><br><img src="assets/image 6.png"><br><img src="assets/image 7.png"><br><img src="assets/image 8.png"><br><img src="assets/image 9.png"><br><img src="assets/image 10.png"><br><img src="assets/image 11.png"><br><img src="assets/image 12.png"><br><img src="assets/image 13.png"><br><img src="assets/image 14.png">`
},

// ==================== 第12章 执行过程组 ====================
{ id:'kp_293', ch:12, sec:'12.1.1', title:'指导与管理项目工作的主要输入', tags:['重要'],
  body:`<strong>指导与管理项目工作</strong>输入：项目管理计划（各子计划）、项目文件（变更日志、经验教训登记册、里程碑清单、风险登记册、相关方登记册）、批准的变更请求、事业环境因素、组织过程资产。`
},

{ id:'kp_294', ch:12, sec:'12.1.2', title:'指导与管理项目工作的主要输出', tags:['重要'],
  body:`<strong>指导与管理项目工作</strong>输出：<ol><li><strong>可交付成果</strong></li><li><strong>工作绩效数据</strong>：最原始的绩效数据</li><li><strong>问题日志</strong>：记录和监督问题</li><li><strong>变更请求</strong></li><li>项目管理计划更新</li><li>项目文件更新</li><li><strong>组织过程资产更新</strong></li></ol>`
},

{ id:'kp_295', ch:12, sec:'12.2.1', title:'管理项目知识的主要输入', tags:['重要'],
  body:`<strong>管理项目知识</strong>输入：项目管理计划、项目文件（经验教训登记册、相关方登记册、团队章程、资源分解结构等）、可交付成果、事业环境因素、组织过程资产。`
},

{ id:'kp_296', ch:12, sec:'12.2.2', title:'管理项目知识主要输出 - 知识管理五环节', tags:['重要','高频'],
  body:`<strong>管理项目知识</strong>输出：<ol><li><strong>经验教训登记册</strong></li><li>项目管理计划更新</li><li>组织过程资产更新</li></ol><strong>知识管理过程五环节</strong>：<ol><li><strong>知识获取与集成</strong></li><li><strong>知识组织与存储</strong></li><li><strong>知识分享</strong></li><li><strong>知识转移与应用</strong></li><li><strong>知识管理审计</strong></li></ol><strong>显性知识 vs 隐性知识</strong>：显性知识可用文字/图表表达；隐性知识是经验、直觉等，需通过人际互动传递。`
},

{ id:'kp_297', ch:12, sec:'12.3.1', title:'管理质量的主要输入', tags:['重要'],
  body:`<strong>管理质量</strong>（质量保证QA）输入：项目管理计划（质量管理计划）、项目文件（经验教训登记册、质量控制测量结果、风险登记册、相关方登记册）、<strong>可交付成果</strong>（来自控制质量输出）。`
},

{ id:'kp_298', ch:12, sec:'12.3.2', title:'管理质量的主要工具与技术', tags:['重要'],
  body:`<strong>管理质量</strong>工具与技术：<ol><li><strong>数据收集</strong>：核对单</li><li><strong>数据分析</strong>：备选方案分析、文件分析、过程分析、根因分析</li><li><strong>决策</strong>：多标准决策分析</li><li><strong>数据表现</strong>：亲和图、因果图、流程图、直方图、矩阵图、散点图</li><li><strong>审计</strong>：质量审计</li><li><strong>面向X的设计</strong>（DFX）</li><li><strong>问题解决</strong></li><li><strong>质量改进方法</strong>：PDCA循环</li></ol><strong>质量保证活动基本内容</strong>：制定质量标准、制定质量控制流程、提出质量保证方法技术、建立质量保证体系。`
},

{ id:'kp_299', ch:12, sec:'12.3.3', title:'管理质量的主要输出', tags:['重要'],
  body:`<strong>管理质量</strong>输出：<ol><li><strong>质量报告</strong></li><li><strong>测试与评估文件</strong></li><li><strong>变更请求</strong></li><li>项目管理计划更新</li><li>项目文件更新（经验教训登记册、风险登记册）</li></ol>`
},

{ id:'kp_300', ch:12, sec:'12.4.1', title:'获取资源的主要输入', tags:['重要'],
  body:`<strong>获取资源</strong>输入：项目管理计划（资源管理计划、采购管理计划）、项目文件（资源需求、资源日历、相关方登记册等）、事业环境因素、组织过程资产。`
},

{ id:'kp_301', ch:12, sec:'12.4.2', title:'获取资源的主要工具与技术', tags:['重要'],
  body:`<strong>获取资源</strong>工具与技术：<ol><li><strong>预分派</strong>：在竞标过程中承诺或项目章程指定</li><li><strong>虚拟团队</strong>：借助网络通信工具协作，拓展人才获取范围</li><li>谈判：与职能经理、其他项目团队、外部供应商谈判</li><li>获取资源：</li><li><strong>人际关系与团队技能</strong>：谈判</li><li><strong>决策</strong>：多标准决策分析</li></ol>`
},

{ id:'kp_302', ch:12, sec:'12.4.3', title:'获取资源主要输出 - 项目团队派工单', tags:['重要'],
  body:`<strong>获取资源</strong>输出：<strong>项目团队派工单</strong>、资源日历、变更请求、项目管理计划/文件更新、事业环境因素更新、组织过程资产更新。<br><br><strong>项目团队派工单</strong>：记录团队成员及其在项目中的<strong>角色和职责</strong>，可包括项目团队名单，还需要把人员名称插入项目管理计划的其他部分，如项目组织图和进度计划。`
},

{ id:'kp_303', ch:12, sec:'12.5.1', title:'建设团队的主要输入', tags:['重要'],
  body:`<strong>建设团队</strong>输入：项目管理计划（资源管理计划）、项目文件（经验教训登记册、项目团队派工单、资源日历、团队章程）、事业环境因素、组织过程资产。`
},

{ id:'kp_304', ch:12, sec:'12.5.2', title:'建设团队主要输出与工具技术', tags:['重要','高频'],
  body:`<strong>建设团队</strong>的工具与技术：<ul><li><strong>人际关系技能</strong></li><li><strong>培训</strong></li><li><strong>团队建设活动</strong></li><li><strong>基本规则</strong></li><li><strong>集中办公</strong>（Colocation）</li><li><strong>认可和奖励</strong></li><li><strong>人事测评工具</strong>（如MBTI、DISC）</li></ul>输出：团队绩效评价、变更请求、项目管理计划/文件更新、事业环境因素/组织过程资产更新。<br><br><strong>团队发展阶段（塔克曼模型）</strong>：形成→震荡→规范→成熟→解散。<img src="assets/image 16.png">`
},

{ id:'kp_305', ch:12, sec:'12.6.1', title:'管理团队的主要输入', tags:['重要'],
  body:`<strong>管理团队</strong>输入：项目管理计划（资源管理计划）、项目文件（经验教训登记册、问题日志、项目团队派工单、团队章程）、工作绩效报告、团队绩效评价、变更请求、事业环境因素、组织过程资产。`
},

{ id:'kp_306', ch:12, sec:'12.6.2', title:'管理团队主要工具 - 团队管理八要点与五种权力', tags:['重要','高频','案例'],
  body:`<strong>团队管理八要点</strong>：<ol><li>明确<strong>角色职责、分工清晰</strong>（RAM责任分配矩阵）</li><li>建立清晰<strong>团队规则与沟通机制</strong></li><li>加强培训，提升成员能力</li><li>开展团队建设活动，增强凝聚力信任</li><li>建立合理激励、认可奖励机制</li><li>定期绩效评估，公平考核</li><li>及时、合理处理团队冲突</li><li>营造积极、开放、合作的团队氛围</li></ol><strong>项目经理五种权力</strong>：<ul><li><strong>职位权力</strong> ← 组织授权</li><li><strong>惩罚权力</strong> ← 组织授权</li><li><strong>奖励权力</strong> ← 组织授权</li><li><strong>专家权力</strong> ← 管理者自身</li><li><strong>参照权力</strong> ← 管理者自身</li></ul><strong>X理论与Y理论</strong>：X基于"人性本恶"假设强调<strong>惩罚</strong>；Y基于"人性本善"假设注重<strong>以人为本、激励</strong>。<br><br><strong>冲突解决五方法</strong>：撤退/回避、缓和/包容、妥协/调解、强迫/命令、合作/解决问题（最理想）。`
},

{ id:'kp_307', ch:12, sec:'12.7.1', title:'管理沟通的主要输入', tags:['重要'],
  body:`<strong>管理沟通</strong>输入：项目管理计划（沟通管理计划）、项目文件（经验教训登记册、问题日志、质量报告、风险报告）、工作绩效报告、事业环境因素、组织过程资产。`
},

{ id:'kp_308', ch:12, sec:'12.7.2', title:'管理沟通主要工具 - 沟通方法三类', tags:['重要','高频'],
  body:`<strong>沟通方法三类</strong>：<ol><li><strong>交互式沟通</strong>：在两方或多方之间进行多向信息交换。<strong>确保全体参与者对特定话题达成共识的最有效的方法</strong>。包括会议、电话、即时通信、视频会议等。</li><li><strong>推式沟通</strong>：把信息发送给需要接收信息的特定接收方。可确保信息的发送，但<strong>不能确保信息送达受众或被目标受众理解</strong>。包括信件、备忘录、报告、电子邮件、传真、语音邮件、日志、新闻稿等。</li><li><strong>拉式沟通</strong>：用于信息量很大或受众很多的情况。要求接收者自主自行地访问信息内容。包括企业内网、电子在线课程、经验教训数据库、知识库等。</li></ol><strong>沟通模型</strong>：发送方-编码-媒介-解码-接收方-反馈-噪声。`
},

{ id:'kp_309', ch:12, sec:'12.7.3', title:'管理沟通的主要输出', tags:['重要'],
  body:`<strong>管理沟通</strong>输出：项目沟通记录、项目管理计划更新、项目文件更新（经验教训登记册、问题日志、风险登记册、相关方登记册）、组织过程资产更新。`
},

{ id:'kp_310', ch:12, sec:'12.8.1', title:'实施风险应对的主要输入', tags:['重要'],
  body:`<strong>实施风险应对</strong>输入：项目管理计划（风险管理计划、变更管理计划、成本/进度/资源管理计划）、项目文件（经验教训登记册、风险登记册、风险报告、相关方登记册）、事业环境因素、组织过程资产。<br><br><strong>实施风险应对</strong>是确保商定的风险应对计划得到执行的过程，提升积极风险概率、降低消极风险概率。`
},

{ id:'kp_311', ch:12, sec:'12.9.1', title:'实施采购的主要输入', tags:['重要'],
  body:`<strong>实施采购</strong>输入：项目管理计划（采购管理计划、资源管理计划、范围/进度/成本基准）、项目文件（经验教训登记册、需求文件、风险登记册、采购文件、供方选择标准、独立成本估算）、卖方建议书、事业环境因素、组织过程资产。`
},

{ id:'kp_312', ch:12, sec:'12.9.2', title:'实施采购的主要输出', tags:['重要'],
  body:`<strong>实施采购</strong>输出：<ol><li><strong>选定的卖方</strong></li><li><strong>协议</strong>（合同）</li><li><strong>变更请求</strong></li><li>项目管理计划更新</li><li>项目文件更新（经验教训登记册、相关方登记册、风险登记册、采购文件）</li><li>组织过程资产更新</li></ol>`
},

{ id:'kp_313', ch:12, sec:'12.10.1', title:'管理干系人参与的主要输入', tags:['重要'],
  body:`<strong>管理相关方参与</strong>输入：项目管理计划（沟通、相关方参与、变更管理计划）、项目文件（变更日志、问题日志、经验教训登记册、相关方登记册、风险登记册）、事业环境因素、组织过程资产。<br><br>目的：提高相关方支持、降低相关方抵制。<img src="assets/image 17.png">`
},

// ==================== 第13章 监控过程组 ====================
{ id:'kp_314', ch:13, sec:'13.1.1', title:'控制质量的主要输入（七项）', tags:['重要','高频'],
  body:`<strong>控制质量</strong>输入（七项）：<ol><li><strong>项目管理计划（质量管理计划）</strong></li><li><strong>项目文件（经验教训登记册、质量测量指标、测试与评估文件）</strong></li><li><strong>批准的变更请求</strong>（实施后需核实）</li><li><strong>可交付成果</strong>（待核实的）</li><li><strong>工作绩效数据</strong></li><li><strong>事业环境因素</strong></li><li><strong>组织过程资产</strong></li></ol>`
},

{ id:'kp_315', ch:13, sec:'13.1.2', title:'控制质量主要工具 - 数据表现七大图', tags:['重要','高频'],
  body:`<strong>控制质量的数据表现</strong>主要七大图：<strong>亲和图、因果图、流程图、直方图、矩阵图、散点图</strong>。<br><br>重点图解工具：<ul><li><strong>直方图</strong>：描述集中趋势、分散程度和统计分布形状，正常呈正态分布。<strong>不考虑时间影响</strong>。</li><li><strong>帕累托图</strong>：用来<strong>识别造成大多数问题的少数重要原因</strong>（二八定律）。</li><li><strong>控制图</strong>：确定一个过程是否稳定，或是否具有可预测的绩效。<strong>七点原则</strong>：均值单边连续七点或七点连续单调上升或下降均为失控，超出控制<strong>上下限</strong>也为失控。一旦过程失控，停止查找非随机原因。</li><li><strong>散点图</strong>：显示两个变量之间是否有关系，一条斜线上的数据点距离越近，相关性越密切。</li><li><strong>因果图（鱼骨图）</strong>：分析问题根本原因</li><li><strong>流程图</strong>：用于发现过程缺陷</li></ul><img src="assets/IMG_0116.png">`
},

{ id:'kp_316', ch:13, sec:'13.1.3', title:'控制质量的主要输出', tags:['重要','高频'],
  body:`<strong>控制质量</strong>输出：<ol><li><strong>质量控制测量结果</strong>：把质量控制活动的执行情况记录下来，形成书面报告</li><li><strong>核实的可交付成果</strong>：<strong>最重要的输出</strong>，经检查确认正确、符合要求，可拿去给客户验收</li><li><strong>工作绩效信息</strong>：原始数据整理分析后的汇报信息</li><li><strong>变更请求</strong>：检查发现问题，申请返工或采取纠正措施</li><li><strong>计划或文件更新</strong>：更新项目管理计划或项目文件</li><li><strong>确认的变更</strong></li><li><strong>组织过程资产更新</strong></li></ol>`
},

{ id:'kp_317', ch:13, sec:'13.2.1', title:'确认范围的关键内容与五步骤', tags:['重要','高频'],
  body:`<strong>确认范围</strong>：正式验收已完成的可交付成果的过程。<br><br><strong>确认范围五步骤</strong>：<ol><li>确定需要进行确认范围的时间</li><li>识别确认范围需要哪些投入</li><li>确定范围正式被接受的标准和要素</li><li>确定确认范围会议的组织步骤</li><li>组织确认范围会议</li></ol><strong>确认范围 vs 控制质量</strong>：确认范围关注<strong>可交付成果的验收</strong>（外部客户视角）；控制质量关注<strong>可交付成果的正确性</strong>（内部团队视角）。控制质量先于确认范围。<strong>确认范围 vs 核实范围</strong>：核实由质量部门或项目经理内部确认；确认由客户或发起人正式接受。`
},

{ id:'kp_318', ch:13, sec:'13.2.2', title:'确认范围的主要输入', tags:['重要'],
  body:`<strong>确认范围</strong>输入：项目管理计划（范围管理计划、需求管理计划）、项目文件（经验教训登记册、质量报告、需求文件、需求跟踪矩阵）、<strong>核实的可交付成果</strong>（来自控制质量过程）、工作绩效数据。`
},

{ id:'kp_319', ch:13, sec:'13.2.3', title:'确认范围的主要输出', tags:['重要'],
  body:`<strong>确认范围</strong>输出：验收的可交付成果、工作绩效信息、变更请求、项目文件更新（经验教训登记册）。<br><br><strong>验收的可交付成果</strong>：经客户/发起人正式接受的成果，传递给收尾过程。未被接受则发起变更请求。`
},

{ id:'kp_320', ch:13, sec:'13.3.1', title:'控制范围的主要输入', tags:['重要'],
  body:`<strong>控制范围</strong>输入：项目管理计划（范围管理计划、范围基准、需求管理计划）、项目文件（经验教训登记册、需求文件、需求跟踪矩阵）、工作绩效数据、组织过程资产。`
},

{ id:'kp_321', ch:13, sec:'13.3.2', title:'控制范围的主要输出', tags:['重要'],
  body:`<strong>控制范围</strong>输出：工作绩效信息、<strong>变更请求</strong>（范围变更时）、项目管理计划更新（范围基准）、项目文件更新（经验教训登记册、需求文件、需求跟踪矩阵）。<br><br><strong>范围蔓延（Scope Creep</strong>）：未经控制的范围扩大，是控制范围需要防范的核心问题。`
},

{ id:'kp_322', ch:13, sec:'13.4.1', title:'控制进度的主要输入', tags:['重要'],
  body:`<strong>控制进度</strong>输入：项目管理计划（进度管理计划、进度基准、范围基准、绩效测量基准）、项目文件（经验教训登记册、项目进度计划、里程碑清单、风险登记册）、工作绩效数据、组织过程资产。`
},

{ id:'kp_323', ch:13, sec:'13.4.2', title:'控制进度主要工具 - 赶工vs快速跟进vs资源平衡vs平滑', tags:['重要','高频','案例'],
  body:`<strong>赶工（Crashing）</strong> — 用成本换时间<ul><li>通过增加资源（加人、加班、加急费用）压缩关键路径上活动持续时间</li><li>只能在关键路径上使用；活动本身可通过增加资源缩短时间</li><li>优点：直接有效；缺点：成本增加，收益递减</li></ul><strong>快速跟进（Fast Tracking）</strong> — 用风险换时间<ul><li>将正常按顺序进行的活动改为部分并行开展</li><li>只能用于存在"软逻辑关系"（非强制性依赖）的活动</li><li>优点：不直接增加成本；缺点：增加返工风险和协调成本</li></ul><strong>资源平衡（Resource Leveling）</strong><ul><li>根据资源制约因素调整开始和完成日期</li><li><strong>可能导致关键路径改变，通常会延长项目工期</strong></li></ul><strong>资源平滑（Resource Smoothing）</strong><ul><li>在保持项目总时长不变前提下微调活动日期</li><li><strong>不会改变关键路径，完工日期不延迟</strong>。活动只在自由和总浮动时间内调整</li></ul><strong>其他工具</strong>：进度压缩、进度网络分析、绩效审查、偏差分析、假设情景分析。`
},

{ id:'kp_324', ch:13, sec:'13.4.3', title:'控制进度的主要输出', tags:['重要'],
  body:`<strong>控制进度</strong>输出：工作绩效信息、进度预测、变更请求、项目管理计划更新（进度基准、进度管理计划）、项目文件更新（经验教训登记册、风险登记册、里程碑清单）、组织过程资产更新。`
},

{ id:'kp_325', ch:13, sec:'13.5.1', title:'控制成本的主要输入', tags:['重要'],
  body:`<strong>控制成本</strong>输入：项目管理计划（成本管理计划、成本基准、绩效测量基准）、项目文件（经验教训登记册、项目资金需求、风险登记册）、工作绩效数据、组织过程资产。`
},

{ id:'kp_326', ch:13, sec:'13.5.2', title:'控制成本主要工具 - EVM挣值管理公式全集', tags:['重要','计算','高频'],
  body:`<strong>基础指标</strong><div class="formula">PV（计划值）= 计划工作量 × 预算单价</div><div class="formula">EV（挣值）= 实际验收合格量 × 预算单价</div><div class="formula">AC（实际成本）= Σ(实际资源消耗 × 结算单价)</div><div class="formula">BAC（完工预算）= 经批准的项目总预算基线（不含应急储备）</div><br><strong>偏差指标</strong><div class="formula">CV（成本偏差）= EV − AC　（正值=成本结余，负值=超支）</div><div class="formula">SV（进度偏差）= EV − PV　（负值=进度滞后）</div><br><strong>绩效指数</strong><div class="formula">CPI（成本绩效指数）= EV / AC</div><div class="formula">SPI（进度绩效指数）= EV / PV</div><br><strong>预测指标</strong><div class="formula">ETC（非典型偏差）= BAC − EV</div><div class="formula">ETC（典型偏差）= (BAC − EV) / CPI</div><div class="formula">EAC（完工估算）= AC + ETC　或　EAC = BAC / CPI</div><div class="formula">VAC（完工偏差）= BAC − EAC</div><br><strong>成本控制工具</strong>：回归分析、趋势分析、偏差分析。`
},

{ id:'kp_327', ch:13, sec:'13.5.3', title:'控制成本的主要输出', tags:['重要'],
  body:`<strong>控制成本</strong>输出：工作绩效信息、成本预测、变更请求、项目管理计划更新（成本基准、成本管理计划）、项目文件更新（经验教训登记册、风险登记册）、组织过程资产更新。`
},

{ id:'kp_328', ch:13, sec:'13.6.1', title:'控制资源的主要输入', tags:['重要'],
  body:`<strong>控制资源</strong>输入：项目管理计划（资源管理计划）、项目文件（经验教训登记册、物质资源分配单、项目进度计划、资源分解结构、风险登记册）、工作绩效数据、组织过程资产。<br><br><strong>控制资源</strong>：确保物理资源按计划获得和使用，关注材料/设备使用情况。<strong>管理团队</strong>针对人力资源，控制资源针对物理资源。`
},

{ id:'kp_329', ch:13, sec:'13.7.1', title:'监督沟通的主要输入', tags:['重要'],
  body:`<strong>监督沟通</strong>输入：项目管理计划（沟通管理计划）、项目文件（经验教训登记册、问题日志、项目沟通记录）、工作绩效数据、组织过程资产。<br><br><strong>监督沟通</strong>：确保项目和干系人的信息需求得到满足。`
},

{ id:'kp_330', ch:13, sec:'13.8.1', title:'监督风险的主要输入', tags:['重要'],
  body:`<strong>监督风险</strong>输入：项目管理计划（风险管理计划、进度/成本/绩效基准）、项目文件（经验教训登记册、风险登记册、风险报告）、工作绩效数据、工作绩效报告、组织过程资产。`
},

{ id:'kp_331', ch:13, sec:'13.8.2', title:'监督风险主要工具 - 六项工具', tags:['重要','高频'],
  body:`<strong>监督风险</strong>的工具与技术（六项）：<ol><li><strong>风险再评估</strong>：识别新风险、重新评估现有风险、关闭已过时风险</li><li><strong>风险审计</strong>：检查风险应对措施有效性</li><li><strong>偏差和趋势分析</strong>：用EVM数据分析偏差趋势</li><li><strong>技术绩效测量</strong>：将技术成果与计划比较</li><li><strong>储备分析</strong>：检查剩余应急储备是否充足</li><li><strong>会议</strong>：风险状态评审会</li></ol>`
},

{ id:'kp_332', ch:13, sec:'13.8.3', title:'监督风险的主要输出', tags:['重要'],
  body:`<strong>监督风险</strong>输出：工作绩效信息、变更请求、项目管理计划更新、项目文件更新（风险登记册、风险报告、经验教训登记册）、组织过程资产更新。`
},

{ id:'kp_333', ch:13, sec:'13.9.1', title:'控制采购的主要输入', tags:['重要'],
  body:`<strong>控制采购</strong>输入：项目管理计划（采购管理计划）、项目文件（假设日志、经验教训登记册、里程碑清单、质量报告、需求文件、风险登记册、相关方登记册）、协议、采购文件、批准的变更请求、工作绩效数据、组织过程资产。`
},

{ id:'kp_334', ch:13, sec:'13.9.2', title:'控制采购的主要工具与技术', tags:['重要'],
  body:`<strong>控制采购</strong>工具与技术：合同变更控制系统、采购审计、<strong>采购绩效审查</strong>（卖方履约检查）、检查、<strong>数据绩效</strong>（挣值）、支付系统、索赔管理（<strong>ADR替代争议解决</strong>：基于协商的调解、仲裁）、记录管理系统。<br><br><strong>索赔原则</strong>：必须以书面形式提出；按合同约定处理；协商不成走仲裁/诉讼。`
},

{ id:'kp_335', ch:13, sec:'13.9.3', title:'控制采购定义与主要输出', tags:['重要'],
  body:`<strong>控制采购</strong>是管理采购关系、<strong>监督合同绩效</strong>、实施必要的变更和纠偏，以及关闭合同的过程。<br><br>输出：采购关闭、工作绩效信息、变更请求、项目管理计划更新、项目文件更新、组织过程资产更新。<br><br><strong>合同收尾</strong>：完成合同结算、解决所有未决事项、正式关闭合同。需确认产品符合合同要求，并完成交接。`
},

{ id:'kp_336', ch:13, sec:'13.10.1', title:'监督干系人参与的主要输入', tags:['重要'],
  body:`<strong>监督相关方参与</strong>输入：项目管理计划（资源/沟通/相关方参与管理计划）、项目文件（问题日志、经验教训登记册、项目沟通记录、风险登记册、相关方登记册）、工作绩效数据、工作绩效报告、事业环境因素、组织过程资产。`
},

{ id:'kp_337', ch:13, sec:'13.10.2', title:'监督干系人参与的主要工具与技术', tags:['重要'],
  body:`<strong>监督相关方参与</strong>工具：数据收集（反馈、标杆对照）、数据分析（备选方案、根因、相关方分析）、决策（多标准决策）、数据表现（参与度评估矩阵）、人际关系与团队技能（积极倾听、文化/政治意识、会议）、会议。`
},

{ id:'kp_338', ch:13, sec:'13.10.3', title:'监督干系人参与的主要输出', tags:['重要'],
  body:`<strong>监督相关方参与</strong>输出：工作绩效信息、变更请求、项目管理计划更新、项目文件更新（经验教训登记册、问题日志、风险登记册、相关方登记册）、组织过程资产更新。`
},

{ id:'kp_339', ch:13, sec:'13.11.1', title:'监控项目工作的主要输入', tags:['重要'],
  body:`<strong>监控项目工作</strong>输入：项目管理计划（各子计划）、项目文件（经验教训、进度/成本/质量/绩效报告、风险登记册）、工作绩效信息、协议、事业环境因素、组织过程资产。`
},

{ id:'kp_340', ch:13, sec:'13.11.2', title:'监控项目工作的主要工具与技术', tags:['重要'],
  body:`<strong>监控项目工作</strong>工具：专家判断、数据收集（经验教训、偏差分析）、数据分析（备选方案、根因、趋势、偏差）、决策、会议、PMIS。<br><br><strong>监控项目工作</strong>：跟踪、审查和报告整体项目进展，实现对项目绩效的总体把握，包括比较实际绩效与计划基准、评估绩效、提出变更请求。`
},

{ id:'kp_341', ch:13, sec:'13.11.3', title:'监控项目工作的主要输出', tags:['重要'],
  body:`<strong>监控项目工作</strong>输出：工作绩效报告、<strong>变更请求</strong>（纠正措施/预防措施/缺陷补救）、项目管理计划更新、项目文件更新（经验教训登记册、风险登记册、进度/成本预测）。`
},

{ id:'kp_342', ch:13, sec:'13.12.1', title:'实施整体变更控制的主要输入', tags:['重要'],
  body:`<strong>实施整体变更控制</strong>输入：项目管理计划（变更/配置/范围/进度/成本/质量管理计划）、项目文件（经验教训登记册、项目基准、变更日志、需求文件、风险登记册）、工作绩效报告、变更请求、事业环境因素、组织过程资产。`
},

{ id:'kp_343', ch:13, sec:'13.12.2', title:'实施整体变更控制的主要输出', tags:['重要','高频'],
  body:`<strong>实施整体变更控制</strong>输出：<strong>批准的变更请求</strong>、项目文件更新（变更日志）、项目管理计划更新、项目文件更新。<br><br><strong>变更控制的核心原则</strong>：<ol><li>任何变更必须经<strong>CCB（变更控制委员会）</strong>批准</li><li>变更请求必须书面提出</li><li>变更必须评估对范围/进度/成本/质量的影响</li><li>批准后更新基准，未批准则维持原状</li><li>变更关闭必须记录并通知相关方</li></ol><strong>变更请求类型</strong>：纠正措施、预防措施、缺陷补救、更新。`
},

{ id:'kp_344', ch:13, sec:'13.10', title:'绩效评估六种方法', tags:['重要','高频'],
  body:`<strong>绩效评估六法</strong>：<ol><li><strong>排序法</strong>：根据工作绩效评估高低排序。适用于工作内容单一或相同员工较多时。</li><li><strong>硬性分布法</strong>：将评估结果分档，按<strong>分档档次和分档比例</strong>分派。成本低但标准模糊、主观性高。</li><li><strong>尺度评价表法</strong>：把绩效评估每项内容定量分解打分，合计总分。适用于组织管理人员。</li><li><strong>关键事件法</strong>：收集"重要事件"形成书面记录并整理分析。<strong>通常与其他方法结合使用，不单独使用</strong>。</li><li><strong>平衡计分卡法</strong>：通过<strong>财务、客户、内部运营、学习与成长</strong>4个角度，将战略目标落实为可操作的衡量指标。广泛用于团队和个人。</li><li><strong>目标管理法</strong>：通过事先设定目标、制订计划评估完成情况。包括目标确定、计划执行、检查调整、完成评价。广泛用于团队和个人。</li></ol>`
},

// ==================== 第14章 收尾过程组 ====================
{ id:'kp_345', ch:14, sec:'14.1.1', title:'结束项目和阶段的主要输入', tags:['重要'],
  body:`<strong>结束项目或阶段</strong>输入：项目章程、项目管理计划、项目文件（变更日志、经验教训登记册、里程碑清单、质量报告、风险登记册、相关方登记册等）、验收的可交付成果、协议、采购文件、组织过程资产。`
},

{ id:'kp_346', ch:14, sec:'14.1.2', title:'结束项目和阶段的主要输出', tags:['重要'],
  body:`<strong>结束项目或阶段</strong>输出：<ol><li><strong>项目或阶段收尾文件</strong>：包括客户/发起人正式接受的证明</li><li><strong>最终产品、服务或成果移交</strong></li><li><strong>最终报告</strong>：项目总结</li><li>组织过程资产更新：经验教训、项目档案、项目收尾信息等</li></ol>`
},

{ id:'kp_347', ch:14, sec:'14.2.1', title:'收尾重点工作 - 项目验收', tags:['重要'],
  body:`<strong>项目验收</strong>是项目收尾的核心环节，包括：<ul><li>确认正式验收阶段已经完成</li><li>核实所有可交付成果已被客户/发起人正式接受</li><li>完成验收测试、系统集成测试</li><li>客户签字确认</li></ul><strong>验收标准</strong>：应符合项目范围说明书和合同规定的验收标准。<br><br><strong>验收主体</strong>：项目发起人或客户正式签字验收。`
},

{ id:'kp_348', ch:14, sec:'14.2.2', title:'收尾重点工作 - 项目移交', tags:['重要'],
  body:`<strong>项目移交</strong>包括：<ul><li>移交<strong>可交付成果</strong>（产品/服务/系统）</li><li>移交<strong>相关文档</strong>（需求/设计/测试/用户手册/维护文档等）</li><li>移交<strong>源代码/数据</strong>（按合同约定）</li><li>移交<strong>运维责任</strong>给运维团队或客户</li><li><strong>培训</strong>客户/运维人员</li></ul>移交前应确保接收方具备接收和维护能力。`
},

{ id:'kp_349', ch:14, sec:'14.2.3', title:'收尾重点工作 - 项目总结会内容', tags:['重要','高频'],
  body:`<strong>项目总结会</strong>应讨论如下内容（七项）：<ol><li>项目目标</li><li>技术绩效</li><li>成本绩效</li><li>进度计划绩效</li><li>项目的沟通</li><li>识别问题和解决问题</li><li>意见和改进建议</li></ol><strong>注意</strong>：<strong>需交付的内容</strong>不属于总结会议关注内容。需交付的内容在规划阶段已明确，收尾验收阶段已完成核验；项目总结会议聚焦于执行过程的复盘、经验教训的提炼。<br><br>总结会应形成<strong>经验教训文档</strong>纳入组织过程资产。`
},

// ==================== 第15章 组织保障 ====================
{ id:'kp_350', ch:15, sec:'15.1.1', title:'信息和文档基本概念', tags:['重要'],
  body:`<strong>信息</strong>：经处理、解释后对人有意义、能指导行动的数据。<strong>文档</strong>：数据在其媒介上的记录，可以是纸质或电子。<br><br><strong>信息/文档分类</strong>：<ul><li>按<strong>用途</strong>分：开发文档、管理文档、用户文档</li><li>按<strong>保密级别</strong>分：公开、内部、秘密、机密、绝密</li></ul><strong>文档管理</strong>：对文档进行分类、编号、存储、检索、控制、归档的全过程。`
},

{ id:'kp_351', ch:15, sec:'15.1.2', title:'信息(文档)管理规则和方法', tags:['重要'],
  body:`<strong>文档管理规则</strong>：<ul><li>建立文档管理规范和制度</li><li>明确文档责任人</li><li>规定文档格式、编号规则</li><li>制定版本控制规则</li><li>建立文档库和索引</li><li>制定借阅、复制、销毁规则</li></ul><strong>管理方法</strong>：分级分类、版本控制、访问权限、定期审查、归档备份。<br><br><strong>归档</strong>：项目完成后，将项目相关文档移交档案管理部门永久保存。`
},

{ id:'kp_352', ch:15, sec:'15.2.1', title:'配置管理基本概念 - 配置库四种类型', tags:['重要','高频'],
  body:`<strong>配置项（CI）</strong>：配置管理的对象，可以是硬件、软件、文档等。<br><br><strong>配置库四种类型</strong>：<ul><li><strong>动态库</strong>（开发库、程序库、工作库）：保存开发人员当前正在开发的配置实体。是软件工程师的工作区，由工程师控制。</li><li><strong>受控库</strong>（主库、系统库）：管理当前基线和控制对基线的变更。</li><li><strong>静态库</strong>：保存已发布/归档的配置项</li><li><strong>备份库</strong>：备份所有配置项</li></ul><strong>基线（Baseline）</strong>：经过正式评审和批准的配置项版本，作为后续变更的基础。`
},

{ id:'kp_353', ch:15, sec:'15.2.2', title:'配置管理角色与职责 - CCB', tags:['重要'],
  body:`<strong>CCB</strong>（Change Control Board，变更控制委员会）由企业或项目组的主要成员组成，根据实际需要不同，可以设置：<ul><li>组织的变更控制委员会</li><li>项目的变更控制委员会</li><li>其他形式的变更控制委员会</li></ul><strong>某些情况下不需要常设</strong>。<br><br><strong>配置管理员（CMO）</strong>：负责配置管理日常工作。<strong>配置项作者</strong>：开发配置项并对其负责。<strong>配置控制委员会</strong>：批准基线、批准变更。`
},

{ id:'kp_354', ch:15, sec:'15.2.3', title:'配置管理的目标与方针', tags:['重要'],
  body:`<strong>配置管理目标</strong>：<ul><li>记录产品的演变历史</li><li>保证产品在生命周期内的一致性、可追踪性</li><li>避免产品在版本演化中失效</li><li>及时准确地反映产品的状态</li></ul><strong>配置管理方针</strong>：所有配置项应被唯一标识、版本控制、变更受控、可追溯、可审计。`
},

{ id:'kp_355', ch:15, sec:'15.2.4', title:'配置管理六大活动与计划内容', tags:['重要','高频'],
  body:`<strong>配置管理六大活动</strong>：<ol><li>制定配置管理计划</li><li>配置标识</li><li>配置控制</li><li>配置状态报告</li><li>配置审计</li><li>发布管理和交付</li></ol><strong>配置管理计划主要内容（四项）</strong>：<ol><li>配置管理活动</li><li>实施这些活动的规范和流程</li><li>实施这些活动的进度安排</li><li>负责实施这些活动的人员或组织，以及他们和其他组织的关系</li></ol>`
},

{ id:'kp_356', ch:15, sec:'15.3.1', title:'变更管理基本概念', tags:['重要'],
  body:`<strong>变更</strong>：在项目实施过程中，对项目计划/范围/进度/成本等基准的调整。<br><br><strong>变更管理</strong>：通过规范化的流程控制变更，确保变更可控、可追溯、可审计。<br><br><strong>变更产生的根源</strong>：外部环境变化、需求/范围变化、技术方案调整、资源变化、风险事件、法律法规变化等。<img src="assets/IMG_0117.png">`
},

{ id:'kp_357', ch:15, sec:'15.3.2', title:'变更管理的角色与职责', tags:['重要'],
  body:`<strong>变更相关角色</strong>：<ul><li><strong>变更申请人</strong>：提出变更请求</li><li><strong>项目经理</strong>：评估变更影响、组织CCB评审</li><li><strong>CCB（变更控制委员会）</strong>：批准/否决/延期变更</li><li><strong>变更实施人</strong>：执行批准的变更</li><li><strong>配置管理员</strong>：记录变更、更新配置项</li></ul>`
},

{ id:'kp_358', ch:15, sec:'15.3.3', title:'变更管理的工作程序', tags:['重要','高频'],
  body:`<strong>变更管理工作流程</strong>：<ol><li><strong>提出变更申请</strong>：书面提出，填写变更申请单</li><li><strong>变更评估</strong>：项目经理评估影响范围、成本、进度、风险</li><li><strong>变更决策</strong>：CCB审查并决策（接受/拒绝/延期）</li><li><strong>实施变更</strong>：按批准方案执行</li><li><strong>变更验证</strong>：验证变更结果符合要求</li><li><strong>变更关闭</strong>：更新配置、文档、基准，通知相关方</li></ol><strong>原则</strong>：变更必须先评估后批准、先批准后实施、变更必须可追溯。`
},

{ id:'kp_359', ch:15, sec:'15.3.4', title:'变更控制 - 版本管理、配置审计与范围变更原因', tags:['重要','高频'],
  body:`<strong>版本管理内容</strong>：<ul><li>配置项状态变迁规则</li><li>配置项版本号标识</li><li>配置项版本控制</li></ul><strong>并非等同于</strong>对项目中配置项基线的变更控制。<br><br><strong>配置项审计</strong>（两种）：<ul><li><strong>功能配置审计</strong>：验证配置项的实际功能是否满足需求</li><li><strong>物理配置审计</strong>：验证配置项的物理特征（如文件结构、构建状态）是否正确</li></ul><strong>变更过程中的配置管理活动</strong>（三项）：<ol><li>配置项识别</li><li>配置状态记录</li><li>配置确认与审计</li></ol><strong>范围变更原因五条</strong>：<ol><li>客户需求不明确、需求增加或变更</li><li>范围定义不清、WBS分解不完善</li><li>技术方案不合理，需要优化改进</li><li>市场、政策、外部环境发生变化</li><li>前期需求调研、分析论证不充分</li></ol>`
},

{ id:'kp_360', ch:15, sec:'15.3.5', title:'版本发布和回退计划', tags:['重要'],
  body:`<strong>版本发布</strong>：将新版本配置项正式发布给用户或部署到生产环境的过程。<br><br><strong>发布流程</strong>：<ol><li>发布准备：制定发布计划、回退计划</li><li>发布实施：部署、安装、配置</li><li>发布验证：测试验证功能正常</li><li>发布通知：告知相关方</li></ol><strong>回退计划</strong>：当发布失败或出现严重问题时，将系统恢复到上一可用版本的计划。<br><br><strong>回退原则</strong>：必须预先制定、必须可执行、必须经过测试。<strong>回退触发条件</strong>：发布后出现严重故障、功能异常、性能不达标等。`
},

// ==================== 第16章 监理基础知识 ====================
{ id:'kp_361', ch:16, sec:'16.1', title:'监理的意义和作用', tags:['重要','法规'],
  body:`<strong>信息系统工程监理</strong>：由具备相应资质的第三方机构，受业主单位委托，依据法律法规和合同，对信息系统工程实施过程进行监督和管理。<br><br><strong>监理的作用</strong>：<ul><li>保障工程质量、进度、成本目标的实现</li><li>协调业主与承建单位之间的关系</li><li>降低项目风险，提高项目成功率</li><li>提供专业咨询和技术支持</li><li>规范项目管理，保障投资效益</li></ul>`
},

{ id:'kp_362', ch:16, sec:'16.2', title:'监理相关概念', tags:['重要','法规'],
  body:`<strong>三方法律关系</strong>：<ul><li><strong>业主单位</strong>（建设单位）：项目投资方/委托方，与承建单位签订承建合同，与监理单位签订监理合同</li><li><strong>承建单位</strong>：承担项目建设的单位，与业主签订承建合同</li><li><strong>监理单位</strong>：受业主委托，独立于业主和承建单位的第三方</li></ul><strong>监理独立性</strong>：监理单位应独立于承建单位，不得与承建单位有隶属关系或利益关系。<br><br><strong>监理工程师</strong>：经监理单位授权，具体执行监理任务的专业人员。`
},

{ id:'kp_363', ch:16, sec:'16.3', title:'监理依据', tags:['重要','法规'],
  body:`<strong>监理依据</strong>：<ol><li><strong>法律法规</strong>：国家法律、行政法规、地方法规</li><li><strong>标准规范</strong>：国家标准、行业标准、企业标准</li><li><strong>合同文件</strong>：监理合同、承建合同</li><li><strong>设计文件</strong>：项目设计/方案/需求文档</li><li><strong>用户需求</strong>：经确认的需求文件</li></ol>监理应<strong>依据事实、依据合同、依据标准</strong>开展工作。`
},

{ id:'kp_364', ch:16, sec:'16.4', title:'监理内容（四控三管一协调）', tags:['重要','法规','高频'],
  body:`<strong>监理主要内容（四控三管一协调）</strong>：<ul><li><strong>四控制</strong>：质量控制、进度控制、投资（成本）控制、变更控制</li><li><strong>三管理</strong>：合同管理、信息/文档管理、安全管理</li><li><strong>一协调</strong>：协调业主、承建单位等各方关系</li></ul><strong>监理阶段</strong>：设计阶段监理、实施阶段监理、验收阶段监理。`
},

{ id:'kp_365', ch:16, sec:'16.5.1', title:'监理合同签署时机', tags:['重要','高频','法规'],
  body:`<strong>监理合同应在承建合同签署前完成</strong>。<br><br><strong>原因</strong>：监理的核心职责是对项目实施过程进行监督管理，需在项目正式启动前明确监理范围、职责和要求。承建合同签署后项目已进入执行阶段，若此时才签订监理合同，会导致监理工作无法同步介入，失去前期把控的意义。<br><br>从流程逻辑来看，应先确定监理方并签订监理合同，再由监理协助业主审核承建合同条款。<br><br><strong>监理合同内容</strong>：监理范围、监理服务期、双方权利义务、监理费用、违约责任、争议解决方式。`
},

{ id:'kp_366', ch:16, sec:'16.5.2', title:'监理服务能力评估', tags:['重要','法规'],
  body:`<strong>监理单位资质等级</strong>：分为<strong>甲级、乙级、丙级</strong>三级。<ul><li><strong>甲级</strong>：可承担各类信息系统工程监理业务</li><li><strong>乙级</strong>：可承担中等规模及以下</li><li><strong>丙级</strong>：可承担小型</li></ul><strong>监理服务能力要素</strong>：人员能力、技术能力、管理能力、财务能力、业绩。<br><br>监理单位应具备<strong>独立法人资格</strong>、<strong>相应专业技术人员</strong>、<strong>必要的技术装备</strong>、<strong>完善的管理体系</strong>。`
},

// ==================== 第17章 法律法规和标准规范 ====================
{ id:'kp_367', ch:17, sec:'17.1.1', title:'法与法律基本概念', tags:['重要','法规'],
  body:`<strong>法</strong>：由国家制定或认可、以国家强制力保证实施、调整社会关系的行为规范总和。<br><br><strong>法律</strong>（广义）：与"法"同义，指所有规范性法律文件。<strong>法律</strong>（狭义）：仅指<strong>全国人大及其常委会</strong>制定的规范性文件。<br><br><strong>法律的特征</strong>：<ul><li>由国家制定或认可</li><li>由国家强制力保证实施</li><li>具有普遍约束力</li><li>规定权利和义务</li></ul>`
},

{ id:'kp_368', ch:17, sec:'17.1.2', title:'法律体系', tags:['重要','法规'],
  body:`<strong>中国特色社会主义法律体系</strong>：以<strong>宪法</strong>为核心，包括法律、行政法规、地方性法规、自治条例和单行条例。<br><br><strong>法律部门</strong>（七大部门）：<ol><li>宪法及宪法相关法</li><li><strong>民商法</strong>：如《民法典》《公司法》《合同法》（已并入民法典）</li><li>行政法：如《政府采购法》《招标投标法》</li><li>经济法</li><li>社会法：如《劳动法》《劳动合同法》</li><li>刑法</li><li>诉讼与非诉讼程序法</li></ol>`
},

{ id:'kp_369', ch:17, sec:'17.1.3', title:'法的效力', tags:['重要','法规'],
  body:`<strong>法的效力</strong>：法律的适用范围，包括对人、对事、空间、时间效力。<br><br><strong>效力层级</strong>（从高到低）：<ol><li><strong>宪法</strong>（最高）</li><li><strong>法律</strong>（全国人大及其常委会）</li><li><strong>行政法规</strong>（国务院）</li><li><strong>地方性法规</strong>（地方人大）</li><li><strong>规章</strong>（部门规章、地方政府规章）</li></ol><strong>效力原则</strong>：<ul><li><strong>上位法优于下位法</strong></li><li><strong>新法优于旧法</strong></li><li><strong>特别法优于一般法</strong></li><li>法律不溯及既往（特殊例外除外）</li></ul>`
},

{ id:'kp_370', ch:17, sec:'17.1.4', title:'法律法规体系的效力层级', tags:['重要','法规'],
  body:`<strong>效力冲突解决原则</strong>：<ul><li><strong>宪法 > 法律 > 行政法规 > 地方性法规/规章</strong></li><li>同一机关制定：新法 > 旧法、特别法 > 一般法</li><li>部门规章与地方性法规冲突：由国务院提出意见，认为应适用地方性法规的，适用地方性法规</li><li>部门规章与地方政府规章冲突：由国务院裁决</li><li>地方性法规与地方政府规章：地方性法规 > 同级地方政府规章</li></ul>`
},

{ id:'kp_371', ch:17, sec:'17.1.5', title:'信息系统项目管理常用法律 - 政府采购与招投标', tags:['重要','高频','法规'],
  body:`<strong>政府采购方式</strong>（依据《政府采购法》）：<ol><li><strong>公开招标</strong></li><li><strong>邀请招标</strong></li><li><strong>竞争性谈判</strong></li><li><strong>单一来源采购</strong></li><li><strong>询价</strong></li><li>国务院政府采购监督管理部门认定的其他方式</li></ol><strong>招投标程序（七步）</strong>：<ol><li>招标人采用公开招标方式的，应当发布招标公告；采用邀请招标方式的，应当向<strong>三个以上</strong>具备承担招标项目能力的、资信良好的特定法人或其他组织发出投标邀请书</li><li>招标人根据招标项目具体情况，可以组织潜在投标人踏勘项目现场</li><li>投标人投标</li><li>开标</li><li>评标</li><li>确定中标人</li><li>订立合同</li></ol><strong>评标委员会</strong>：由具有高级职称或同等专业水平的技术、经济等相关领域专家，招标人和招标机构代表等<strong>5人以上单数</strong>组成，其中经济、技术等方面专家人数不得少于总数的<strong>2/3</strong>。<br><br><strong>方案邀请书</strong>：用于征求潜在供应商建议的文件<br><strong>报价邀请书</strong>：用来征求潜在供应商报价的文件`
},

,

{ id:'kp_385', ch:17, sec:'17.1.6', title:'常用评标方法 - 加权打分法·筛选系统·独立估算', tags:['重要','高频','法规'],
  body:`<strong>常用评标方法</strong>（依据系统集成项目管理工程师教程P491）：<br><br><strong>（1）加权打分法</strong>（最常用）：<br>用具有<strong>不同权重</strong>的各评标标准，对各投标文件进行打分，然后<strong>加权汇总</strong>，得到各潜在卖方的排名顺序。选择<strong>得分最高</strong>的潜在卖方中标。<br><br><strong>（2）筛选系统</strong>：<br>通过<strong>多轮过滤</strong>，逐步淘汰达不到既定标准的投标商，直到剩下一家。用于淘汰的标准<strong>逐轮提高</strong>。最后剩下的那家，就是中标者。<br><br><strong>（3）独立估算</strong>：<br>把潜在卖方的<strong>报价</strong>与买方事先编制的<strong>独立成本估算</strong>（标底）进行比较，选择与标底<strong>最接近</strong>的报价中标。<br><br><strong>招标文件类</strong>：<ul><li><strong>信息邀请书（RFI）</strong>：用于征求潜在供应商信息</li><li><strong>报价邀请书（RFQ）</strong>：用来征求潜在供应商报价的文件</li><li><strong>建议邀请书（RFP）</strong>：用于征求潜在供应商建议的文件</li></ul>以上三者<strong>都属于招标文件</strong>。`
}

{ id:'kp_372', ch:17, sec:'17.2.1', title:'标准和标准化基本概念', tags:['重要','法规'],
  body:`<strong>标准</strong>：为在一定范围内获得最佳秩序，经协商一致制定并经公认机构批准，共同使用和重复使用的规范性文件。<br><br><strong>标准化</strong>：制定、发布和实施标准的过程。包括制定、发布、实施、监督。<br><br><strong>标准化的目的</strong>：<ul><li>建立最佳秩序</li><li>保证产品质量和安全</li><li>促进技术进步和贸易</li><li>实现互换性和兼容性</li><li>提高经济效益和社会效益</li></ul><strong>标准化原则</strong>：协商一致、共同使用、重复使用。`
},

{ id:'kp_373', ch:17, sec:'17.2.2', title:'标准分级与标准分类', tags:['重要','法规','高频'],
  body:`<strong>标准分级</strong>（依据《标准化法》）：<ol><li><strong>国家标准（GB）</strong>：全国范围内统一的技术要求</li><li><strong>行业标准</strong>：行业范围内统一的技术要求</li><li><strong>地方标准（DB）</strong>：省、自治区、直辖市范围</li><li><strong>团体标准</strong>：由社会团体制定</li><li><strong>企业标准（Q）</strong>：企业内部使用</li></ol><strong>标准分类（按约束力）</strong>：<ul><li><strong>强制性标准</strong>：必须执行，如安全、卫生、环保标准</li><li><strong>推荐性标准</strong>（GB/T）：鼓励采用，自愿执行</li></ul><strong>标准化指导性技术文件</strong>（GB/Z）：用于尚未成熟的技术。`
},

{ id:'kp_374', ch:17, sec:'17.2.3', title:'我国标准的编号及名称', tags:['重要','法规'],
  body:`<strong>标准编号格式</strong>：标准代号 + 顺序号 + 发布年号<br><br><strong>国家标准</strong>：<ul><li><strong>GB ××××—YYYY</strong>：强制性国家标准</li><li><strong>GB/T ××××—YYYY</strong>：推荐性国家标准</li><li><strong>GB/Z ××××—YYYY</strong>：国家标准化指导性技术文件</li></ul><strong>行业标准</strong>：如电子信息行业标准<strong>SJ/T</strong>、通信行业标准<strong>YD/T</strong>、工程建设行业标准等<br><br><strong>地方标准</strong>：<strong>DB××/T ××××—YYYY</strong><br><strong>企业标准</strong>：<strong>Q/××× ××××—YYYY</strong>`
},

{ id:'kp_375', ch:17, sec:'17.2.4', title:'我国标准的有效期', tags:['重要','法规'],
  body:`<strong>标准有效期（标龄）</strong>：标准从实施之日起到废止或被替代的时间段。<br><br>我国国家标准复审周期：<ul><li>一般标准复审周期为<strong>5年</strong></li><li>推荐性标准复审可适当延长</li></ul><strong>复审结果</strong>：<ul><li><strong>确认有效</strong>：继续使用</li><li><strong>修订</strong>：修改后重新发布</li><li><strong>废止</strong>：不再使用</li></ul><strong>标准废止情形</strong>：技术落后、被新标准替代、不再适应需求。`
},

{ id:'kp_376', ch:17, sec:'17.2.5', title:'信息系统集成项目管理常用标准规范', tags:['重要','法规'],

// ==================== 第18章 职业道德规范 ====================
{ id:'kp_377', ch:18, sec:'18.1', title:'职业道德基本概念', tags:['重要'],
  body:`<strong>道德</strong>：社会生活中人们应遵循的行为准则和规范总和。<strong>职业道德</strong>：从事一定职业的人员在职业活动中应遵循的行为规范总和。<br><br><strong>职业道德特征</strong>：<ul><li>普遍性：所有职业都应遵守</li><li>行业性：不同行业有具体规范</li><li>规范性：以准则、公约形式呈现</li><li>自律性：依靠内心信念和舆论维持</li></ul><strong>职业道德核心</strong>：爱岗敬业、诚实守信、服务群众、奉献社会。`
},

{ id:'kp_378', ch:18, sec:'18.2', title:'项目管理工程师职业道德规范', tags:['重要','高频'],
  body:`<strong>系统集成项目管理工程师职业道德规范</strong>：<ol><li><strong>遵守法律法规</strong>：严格遵守国家法律法规和行业规范</li><li><strong>诚实守信</strong>：客观真实地报告项目情况，不弄虚作假</li><li><strong>勤勉尽责</strong>：认真履行职责，维护项目和相关方利益</li><li><strong>公正公平</strong>：对待团队成员、供应商、相关方公正，不徇私舞弊</li><li><strong>保护机密</strong>：保守项目商业秘密和技术秘密</li><li><strong>避免利益冲突</strong>：主动回避可能影响公正判断的利益关系</li><li><strong>持续学习</strong>：不断提升专业能力，跟踪技术和管理发展</li><li><strong>尊重知识产权</strong>：遵守知识产权法律法规，不侵权盗版</li><li><strong>承担社会责任</strong>：关注项目对社会、环境的影响</li></ol>`
},

{ id:'kp_379', ch:18, sec:'18.3', title:'项目管理工程师岗位职责', tags:['重要'],
  body:`<strong>项目管理工程师岗位职责</strong>：<ul><li><strong>项目规划</strong>：制定项目章程、项目管理计划，明确项目目标、范围、进度、成本</li><li><strong>资源管理</strong>：组建项目团队，分配资源，协调各方</li><li><strong>过程管理</strong>：执行、监控项目工作，控制变更</li><li><strong>风险管理</strong>：识别、分析、应对项目风险</li><li><strong>沟通协调</strong>：管理相关方期望，保持有效沟通</li><li><strong>质量管理</strong>：规划、保证和控制项目质量</li><li><strong>采购管理</strong>：规划、实施、控制采购</li><li><strong>项目收尾</strong>：验收、移交、总结项目</li></ul>`
},

{ id:'kp_380', ch:18, sec:'18.4', title:'项目管理工程师对项目团队的责任', tags:['重要'],
  body:`<strong>对项目团队的责任</strong>：<ol><li><strong>提供清晰方向</strong>：明确项目目标、成员角色职责</li><li><strong>营造良好环境</strong>：建立积极、协作、信任的团队氛围</li><li><strong>提供资源支持</strong>：保障团队所需资源、工具、培训</li><li><strong>公平对待</strong>：公正评价绩效，合理激励奖励</li><li><strong>关心成长</strong>：关注成员职业发展，提供学习机会</li><li><strong>保护团队</strong>：保护团队免受不合理要求和不必要干扰</li><li><strong>处理冲突</strong>：及时、合理处理团队内部冲突</li><li><strong>尊重成员</strong>：尊重每位成员的人格、文化、专业贡献</li></ol>`

// ===================== 章节定义 =====================
const CHAPTERS = [
  { id: 0,  icon: '🏠', name: '首页总览', desc: '考试概况与知识模块导航' },
  { id: 1,  icon: '📊', name: '1. 信息化发展', desc: '十四五规划、数据价值化、智慧城市、数字中国' },
  { id: 2,  icon: '💻', name: '2. 信息技术发展', desc: 'TCP/IP、物联网、云计算、大数据、区块链、AI' },
  { id: 3,  icon: '🔧', name: '3. 信息技术服务', desc: 'IT服务产业化、服务生命周期、服务质量评价' },
  { id: 4,  icon: '🏗️', name: '4. 信息系统架构', desc: '架构基础、分层模式、云原生架构' },
  { id: 5,  icon: '🛠️', name: '5. 软件工程', desc: '需求、设计、UML、测试、部署交付、过程能力' },
  { id: 6,  icon: '💿', name: '6. 数据工程', desc: '数据采集存储、容灾RPO/RTO、数据治理' },
  { id: 7,  icon: '🔌', name: '7. 软硬件系统集成', desc: '基础设施集成、软件集成、业务应用集成' },
  { id: 8,  icon: '🔒', name: '8. 信息安全工程', desc: 'CIA三属性、等级保护、安全机制' },
  { id: 9,  icon: '🧭', name: '9. 项目管理概论', desc: 'PMO、可行性研究、价值交付系统' },
  { id: 10, icon: '🚀', name: '10. 启动过程组', desc: '项目章程、识别干系人' },
  { id: 11, icon: '📋', name: '11. 规划过程组', desc: 'WBS、时差公式、成本基准、风险分类、合同类型' },
  { id: 12, icon: '⚡', name: '12. 执行过程组', desc: '团队建设、五种权力、沟通方法' },
  { id: 13, icon: '📈', name: '13. 监控过程组', desc: 'EVM公式、七大图、赶工vs快速跟进' },
  { id: 14, icon: '🏁', name: '14. 收尾过程组', desc: '项目验收、总结会内容' },
  { id: 15, icon: '📑', name: '15. 组织保障', desc: '配置库、CCB、配置管理六大活动、变更管理' },
  { id: 16, icon: '⚖️', name: '16. 监理基础知识', desc: '监理合同时机、监理服务能力' },
  { id: 17, icon: '📜', name: '17. 法律法规和标准规范', desc: '政府采购方式、招投标程序、评标委员会' },
  { id: 18, icon: '🤝', name: '18. 职业道德规范', desc: '职业道德、岗位职责、团队责任' },
];

const ALL_TAGS = ['重要', '高频', '计算', '案例', '法规'];

let currentChapter = 0;
let activeTags = new Set();
let searchTerm = '';
let learnedSet = new Set(JSON.parse(localStorage.getItem('ruankao_learned') || '[]'));
let expandedSet = new Set();

function init() {
  renderChapterNav();
  renderTagFilter();
  renderMain();
  updateProgress();
}

function renderChapterNav() {
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = CHAPTERS.map(ch => {
    const count = ch.id === 0 ? KNOWLEDGE_DATA.length : KNOWLEDGE_DATA.filter(k => k.ch === ch.id).length;
    return `<div class="chapter-nav-item ${currentChapter === ch.id ? 'active' : ''}" onclick="selectChapter(${ch.id})">
      <span>${ch.icon} ${ch.name}</span>
      <span class="count">${count}</span>
    </div>`;
  }).join('');
}

function renderTagFilter() {
  const tf = document.getElementById('tagFilter');
  tf.innerHTML = ALL_TAGS.map(tag =>
    `<span class="tag-btn ${activeTags.has(tag) ? 'active' : ''}" onclick="toggleTag('${tag}')">${tag}</span>`
  ).join('');
}

function toggleTag(tag) {
  if (activeTags.has(tag)) activeTags.delete(tag);
  else activeTags.add(tag);
  renderTagFilter();
  renderMain();
}

function selectChapter(chId) {
  currentChapter = chId;
  renderChapterNav();
  renderMain();
  document.getElementById('main').scrollTop = 0;
  toggleSidebar(false);
}

function toggleSidebar(open) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  const shouldOpen = open === undefined ? !sb.classList.contains('open') : open;
  sb.classList.toggle('open', shouldOpen);
  ov.classList.toggle('show', shouldOpen);
}

function handleSearch() {
  searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
  renderMain();
}

function getFilteredKP() {
  let list = KNOWLEDGE_DATA;
  if (currentChapter !== 0) list = list.filter(k => k.ch === currentChapter);
  if (activeTags.size > 0) list = list.filter(k => k.tags && k.tags.some(t => activeTags.has(t)));
  if (searchTerm) {
    list = list.filter(k => {
      const text = (k.title + k.body).toLowerCase();
      return text.includes(searchTerm);
    });
  }
  return list;
}

function highlightText(text, term) {
  if (!term) return text;
  const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}

function renderMain() {
  const main = document.getElementById('main');
  if (currentChapter === 0 && !searchTerm && activeTags.size === 0) {
    renderHome(main);
    return;
  }
  let list = getFilteredKP();
  const ch = CHAPTERS.find(c => c.id === currentChapter);
  if (searchTerm || activeTags.size > 0) {
    main.innerHTML = `
      <div class="main-header">
        <h2>搜索结果</h2>
        <p>找到 ${list.length} 个知识点${searchTerm ? ' · 关键词："' + searchTerm + '"' : ''}${activeTags.size > 0 ? ' · 标签：' + [...activeTags].join('、') : ''}</p>
      </div>
      ${list.length === 0 ? '<div class="empty-state">未找到匹配的知识点</div>' : list.map(kp => renderKPCard(kp)).join('')}
    `;
  } else {
    main.innerHTML = `
      <div class="main-header">
        <h2>${ch.icon} ${ch.name}</h2>
        <p>${ch.desc} · ${list.length} 个知识点</p>
      </div>
      ${list.length === 0 ? '<div class="empty-state">本章暂无详细知识点记录，待补充</div>' : list.map(kp => renderKPCard(kp)).join('')}
    `;
  }
}

function renderHome(main) {
  const learned = learnedSet.size;
  const total = KNOWLEDGE_DATA.length;
  const importantCount = KNOWLEDGE_DATA.filter(k => k.tags && k.tags.includes('重要')).length;
  const highFreqCount = KNOWLEDGE_DATA.filter(k => k.tags && k.tags.includes('高频')).length;
  const calcCount = KNOWLEDGE_DATA.filter(k => k.tags && k.tags.includes('计算')).length;
  main.innerHTML = `
    <div class="main-header">
      <h2>系统集成项目管理工程师 · 备考知识库</h2>
      <p>软考中级 · 两科机考 · 各科45分合格 · 每年两次（约5月/11月） · 教程第3版 + 2024新大纲</p>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="num">${total}</div><div class="label">知识点总数</div></div>
      <div class="stat-card"><div class="num">${learned}</div><div class="label">已学知识点</div></div>
      <div class="stat-card"><div class="num">${importantCount}</div><div class="label">重要考点</div></div>
      <div class="stat-card"><div class="num">${highFreqCount}</div><div class="label">高频考点</div></div>
      <div class="stat-card"><div class="num">${calcCount}</div><div class="label">计算公式</div></div>
    </div>
    <div class="main-header" style="margin-top: 8px;">
      <h3 style="font-size:16px; margin-bottom:8px;">知识模块</h3>
    </div>
    <div class="modules-grid">
      ${CHAPTERS.filter(c => c.id !== 0).map(ch => {
        const count = KNOWLEDGE_DATA.filter(k => k.ch === ch.id).length;
        const learnedInCh = KNOWLEDGE_DATA.filter(k => k.ch === ch.id && learnedSet.has(k.id)).length;
        return `<div class="module-card" onclick="selectChapter(${ch.id})">
          <div class="icon">${ch.icon}</div>
          <div class="name">${ch.name}</div>
          <div class="meta">${count} 个知识点 · 已学 ${learnedInCh}/${count}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderKPCard(kp) {
  const isLearned = learnedSet.has(kp.id);
  const isExpanded = expandedSet.has(kp.id);
  let bodyHtml = kp.body || '<em>本章知识点待补充</em>';
  if (searchTerm) bodyHtml = highlightText(bodyHtml, searchTerm);
  return `
    <div class="kp-card ${isLearned ? 'learned' : ''} ${isExpanded ? 'expanded' : ''}" data-id="${kp.id}" onclick="toggleExpand('${kp.id}')">
      <div class="kp-card-header">
        <div class="kp-title">${kp.sec ? `<span class="kp-sec">${kp.sec}</span>` : ''}${searchTerm ? highlightText(kp.title, searchTerm) : kp.title}</div>
        <div class="kp-tags">${(kp.tags || []).map(t => `<span class="kp-tag ${t}">${t}</span>`).join('')}</div>
      </div>
      <div class="kp-body">${bodyHtml}</div>
      <div class="kp-card-actions" onclick="event.stopPropagation()">
        <button class="kp-btn learn-btn ${isLearned ? 'learned' : ''}" onclick="toggleLearned('${kp.id}')">${isLearned ? '✓ 已掌握' : '标记已掌握'}</button>
      </div>
    </div>
  `;
}

function toggleExpand(id) {
  if (expandedSet.has(id)) expandedSet.delete(id);
  else expandedSet.add(id);
  renderMain();
}

function toggleLearned(id) {
  if (learnedSet.has(id)) learnedSet.delete(id);
  else learnedSet.add(id);
  localStorage.setItem('ruankao_learned', JSON.stringify([...learnedSet]));
  updateProgress();
  renderMain();
  if (currentChapter === 0 && !searchTerm && activeTags.size === 0) {
    renderHome(document.getElementById('main'));
  }
}

function updateProgress() {
  const total = KNOWLEDGE_DATA.length;
  const learned = learnedSet.size;
  const pct = total > 0 ? Math.round(learned / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `已学 ${learned} / ${total} (${pct}%)`;
}

init();
</script>
