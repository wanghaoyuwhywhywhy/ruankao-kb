<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统集成项目管理工程师 · 备考知识库</title>
<style>
:root {
  --bg: #0f1419;
  --bg-card: #1a1f29;
  --bg-hover: #222834;
  --border: #2a3140;
  --text: #e0e0e0;
  --text-dim: #8b95a7;
  --primary: #4a9eff;
  --primary-dim: #2a6bb0;
  --accent: #f0a020;
  --success: #4caf50;
  --danger: #f44336;
  --tag-important: #ff6b6b;
  --tag-freq: #ffa726;
  --tag-calc: #42a5f5;
  --tag-case: #ab47bc;
  --tag-law: #66bb6a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 15px; color: var(--primary); margin-bottom: 4px; }
.sidebar-header p { font-size: 11px; color: var(--text-dim); }
.progress-bar-wrap { margin-top: 10px; }
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--success); border-radius: 3px; transition: width .3s; width: 0%; }
.progress-text { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.search-box input {
  width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 13px; outline: none;
}
.search-box input:focus { border-color: var(--primary); }
.search-box input::placeholder { color: var(--text-dim); }
.tag-filter { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; }
.tag-btn {
  font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border);
  background: transparent; color: var(--text-dim); cursor: pointer; transition: all .2s;
}
.tag-btn:hover { border-color: var(--primary); color: var(--primary); }
.tag-btn.active { background: var(--primary-dim); border-color: var(--primary); color: #fff; }
.chapter-nav { flex: 1; overflow-y: auto; }
.chapter-nav-item {
  padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text-dim);
  border-left: 3px solid transparent; transition: all .2s; display: flex; justify-content: space-between; align-items: center;
}
.chapter-nav-item:hover { background: var(--bg-hover); color: var(--text); }
.chapter-nav-item.active { border-left-color: var(--primary); color: var(--primary); background: var(--bg-hover); }
.chapter-nav-item .count { font-size: 11px; color: var(--text-dim); }
.chapter-nav-item.active .count { color: var(--primary); }
.main { flex: 1; overflow-y: auto; padding: 24px 32px; }
.main-header { margin-bottom: 24px; }
.main-header h2 { font-size: 22px; margin-bottom: 4px; }
.main-header p { font-size: 13px; color: var(--text-dim); }
.kp-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px 20px; margin-bottom: 12px; transition: all .2s; cursor: pointer;
}
.kp-card:hover { border-color: var(--primary-dim); background: var(--bg-hover); }
.kp-card.learned { border-color: var(--success); }
.kp-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.kp-card-actions { cursor: default; }
.kp-title { font-size: 15px; font-weight: 600; flex: 1; }
.kp-sec { font-size: 11px; color: var(--text-dim); background: var(--bg); padding: 2px 6px; border-radius: 3px; margin-right: 8px; font-weight: normal; }
.kp-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.kp-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
.kp-tag.重要 { background: rgba(255,107,107,.15); color: var(--tag-important); }
.kp-tag.高频 { background: rgba(255,167,38,.15); color: var(--tag-freq); }
.kp-tag.计算 { background: rgba(66,165,245,.15); color: var(--tag-calc); }
.kp-tag.案例 { background: rgba(171,71,188,.15); color: var(--tag-case); }
.kp-tag.法规 { background: rgba(102,187,106,.15); color: var(--tag-law); }
.kp-body { margin-top: 10px; font-size: 13px; line-height: 1.7; color: var(--text-dim); display: none; }
.kp-card.expanded .kp-body { display: block; }
.kp-body strong { color: var(--text); }
.kp-body ul, .kp-body ol { padding-left: 20px; margin: 6px 0; }
.kp-body li { margin: 3px 0; }
.kp-body .formula { background: var(--bg); border-radius: 4px; padding: 8px 12px; margin: 8px 0; font-family: 'SF Mono', Consolas, monospace; font-size: 13px; color: var(--accent); }
.kp-body img { max-width: 100%; border-radius: 6px; margin: 8px 0; }
.kp-card-actions { margin-top: 10px; display: flex; gap: 8px; }
.kp-btn {
  font-size: 11px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border);
  background: transparent; color: var(--text-dim); cursor: pointer; transition: all .2s;
}
.kp-btn:hover { border-color: var(--primary); color: var(--primary); }
.kp-btn.learn-btn.learned { background: var(--success); border-color: var(--success); color: #fff; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
.stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-card .label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.modules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.module-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: all .2s; }
.module-card:hover { border-color: var(--primary); background: var(--bg-hover); }
.module-card .icon { font-size: 24px; }
.module-card .name { font-size: 14px; font-weight: 600; margin: 8px 0 4px; }
.module-card .meta { font-size: 12px; color: var(--text-dim); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.highlight { background: rgba(74,158,255,.2); color: var(--primary); border-radius: 2px; padding: 0 2px; }

/* ===== 移动端适配 ===== */
.menu-toggle {
  display: none;
  position: fixed; top: 12px; left: 12px; z-index: 1001;
  width: 40px; height: 40px; border-radius: 8px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--primary); font-size: 20px; cursor: pointer;
  align-items: center; justify-content: center;
}
.overlay {
  display: none; position: fixed; inset: 0; z-index: 999;
  background: rgba(0,0,0,.5);
}
.overlay.show { display: block; }

@media (max-width: 768px) {
  body { flex-direction: column; }
  .menu-toggle { display: flex; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 280px; min-width: 280px;
    z-index: 1000;
    transform: translateX(-100%);
    transition: transform .25s ease;
  }
  .sidebar.open { transform: translateX(0); }
  .main { width: 100%; padding: 64px 16px 24px; }
  .main-header h2 { font-size: 18px; }
  .kp-card { padding: 14px; }
  .kp-title { font-size: 14px; }
  .stats-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .modules-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

  <div class="sidebar-header">

      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">已学 0 / 0 (0%)</div>
    </div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索知识点..." oninput="handleSearch()">
  </div>
  <div class="tag-filter" id="tagFilter"></div>
  <div class="chapter-nav" id="chapterNav"></div>
</div>

<script>
const KNOWLEDGE_DATA = [
// ---- 第1章 信息化发展 ----
{ id:'kp_001', ch:1, sec:'1.1.1', title:'信息的基本概念与特征', tags:['重要'],
  body:`<strong>信息</strong>是客观事物状态和运动特征的一种普遍形式，是对客观世界的描述。<ul><li><strong>客观性</strong>：信息是客观事物属性的真实反映</li><li><strong>普遍性</strong>：信息广泛存在于自然界和人类社会</li><li><strong>无限性</strong>：事物的变化是无限的，信息也是无限的</li><li><strong>动态性</strong>：信息随时间变化而变化</li><li><strong>依附性</strong>：信息必须依附于一定的载体</li><li><strong>共享性</strong>：信息可被多方共享，不会因共享而减少</li><li><strong>可传递性</strong>：信息可在空间和时间上转移</li><li><strong>可加工性</strong>：信息可通过加工提炼出新信息</li></ul><strong>数据</strong>是信息的载体和表达形式，<strong>信息</strong>是数据的内涵和语义解释。`
},
{ id:'kp_002', ch:1, sec:'1.1.1', title:'系统的六大特点', tags:['重要','高频'],
  body:`系统具有以下几个特点：<ol><li><strong>目的性</strong>：定义一个系统、组成一个系统或者抽象出一个系统，都有明确的目标或者目的，目标性决定了系统的功能。</li><li><strong>可嵌套性</strong>：系统可以包括若干子系统，系统之间也能够耦合成一个更大的系统。组成系统的部件也可以是系统。便于对系统进行分层、分部管理、研究或者建设。</li><li><strong>稳定性</strong>：受规则的约束，系统的内部结构和秩序应是可以预见的；系统的状态以及演化路径有限并能被预测；系统的功能发生作用导致的后果也是可以预估的。稳定性强的系统使得系统在受到外部作用的同时，内部结构和秩序仍然能够保持。</li><li><strong>开放性</strong>：系统的可访问性。这个特性决定了系统可以被外部环境识别，外部环境或者其他系统可以按照预定的方法，使用系统的功能或者影响系统的行为。体现在系统有可以清晰描述并被准确识别、理解的所谓接口层面上。</li><li><strong>脆弱性</strong>：与系统的稳定性相对应，即系统可能存在着丧失结构、功能、秩序的特性，往往是隐藏不易被外界感知的。脆弱性差的系统，一旦被侵入，整体性会被破坏，甚至面临崩溃，系统瓦解。</li><li><strong>健壮性</strong>：当系统面临干扰、输入错误、入侵等因素时，系统可能会出现非预期的状态而丧失原有功能、出现错误甚至表现出破坏功能。系统具有的能够抵御出现非预期状态的特性称为健壮性，也叫<strong>鲁棒性(robustness)</strong>。要求具有高可用性的信息系统，会采取<strong>冗余技术、容错技术、身份识别技术、可靠性技术</strong>等来抵御系统出现非预期的状态，保持系统的稳定性。</li></ol>`
},
{ id:'kp_003', ch:1, sec:'1.1.2', title:'信息系统基础', tags:['重要'],
  body:`<strong>信息系统</strong>是一种以处理信息为目的、由人、硬件、软件、网络和数据资源组成的有机整体。<ul><li><strong>基本功能</strong>：输入、存储、处理、输出、控制</li><li><strong>生命周期</strong>：立项规划、开发、运维、消亡四个阶段</li><li>信息系统建设是<strong>一项复杂的社会活动</strong>，具有目标性、整体性、层次性、开放性等特点</li></ul>信息系统的发展趋势：从简单到复杂、从单项到协同、从封闭到开放、从单机到网络。`
},
{ id:'kp_004', ch:1, sec:'1.1.3', title:'信息化基础及要素', tags:['重要'],
  body:`<strong>信息化</strong>是培育、发展以智能化工具为代表的新的生产力并使之造福社会的历史过程。<br><br>信息化体系的<strong>六要素</strong>：<ol><li><strong>信息技术应用</strong>（龙头，主阵地）</li><li><strong>信息技术和产业</strong>（物质基础）</li><li><strong>信息资源</strong>（核心任务，关键环节）</li><li><strong>信息网络</strong>（基础设施）</li><li><strong>信息化人才</strong>（成功之本，关键因素）</li><li><strong>信息化政策法规和标准规范</strong>（根本保障）</li></ol>`
},
{ id:'kp_005', ch:1, sec:'1.1.3', title:'信息化政策法规和标准规范的作用', tags:['重要'],
  body:`信息化政策法规和标准规范用于规范和协调信息化体系各要素之间关系，是国家信息化快速、持续、有序、健康发展的<strong>根本保障</strong>。`
},
{ id:'kp_006', ch:1, sec:'1.2.1', title:'新型基础设施建设（新基建）', tags:['重要','高频'],
  body:`<strong>新型基础设施建设</strong>（新基建）主要包括三个方面：<ol><li><strong>信息基础设施</strong>：以5G、物联网、工业互联网、人工智能、云计算、区块链等为代表，包括通信网络基础设施、新技术基础设施、算力基础设施等</li><li><strong>融合基础设施</strong>：深度应用互联网、大数据、人工智能等技术，支撑传统基础设施转型升级，如智能交通、智慧能源等</li><li><strong>创新基础设施</strong>：支撑科学研究、技术开发、产品研制的具有公益属性的基础设施，如重大科技基础设施、科教基础设施等</li></ol>`
},
{ id:'kp_007', ch:1, sec:'1.2.2', title:'工业互联网', tags:['重要'],
  body:`<strong>工业互联网</strong>是新一代信息通信技术与工业经济深度融合的新型基础设施、应用模式和工业生态。<ul><li><strong>网络</strong>：是基础，实现全要素、全系统、全产业链的互联互通</li><li><strong>平台</strong>：是核心，是工业全要素链接的枢纽和工业资源配置的核心</li><li><strong>数据</strong>：是要素，是工业互联网驱动制造业转型的关键</li><li><strong>安全</strong>：是保障，涵盖设备安全、网络安全、控制安全、应用安全、数据安全</li></ul>工业互联网平台体系包括<strong>边缘层、IaaS层、PaaS层、SaaS层</strong>。`
},
{ id:'kp_008', ch:1, sec:'1.2.3', title:'城市物联网', tags:['重要'],
  body:`<strong>城市物联网</strong>是智慧城市建设的重要支撑，通过物联网技术实现城市基础设施的智能化管理。<ul><li>支撑城市基础设施的泛在感知和智能管理</li><li>实现城市各领域信息系统的互联互通</li><li>是智慧城市的关键基础设施之一</li></ul>城市物联网与智慧城市密切相关，智慧城市的建设原则包括：<ul><li><strong>以人为本，务实推进</strong></li><li><strong>因地制宜，科学有序</strong></li><li><strong>市场为主，协同创新</strong></li><li><strong>可管可控，确保安全</strong></li></ul>`
},
{ id:'kp_009', ch:1, sec:'1.3.1', title:'农业农村现代化', tags:['重要'],
  body:`<strong>农业农村现代化</strong>是通过信息技术推动农业现代化建设。<ul><li>农业生产智能化：物联网、遥感技术在农业中的应用</li><li>农业经营网络化：电子商务推动农产品销售</li><li>农业管理数字化：农业大数据辅助决策</li><li>农业服务在线化：为农民提供在线技术服务</li></ul>通过数字乡村建设，缩小城乡数字鸿沟。`
},
{ id:'kp_010', ch:1, sec:'1.3.2', title:'工业现代化', tags:['重要'],
  body:`<strong>工业现代化</strong>是通过信息技术推动工业转型升级。<ul><li><strong>智能制造</strong>：工业4.0的核心，包括数字化、网络化、智能化</li><li><strong>两化融合</strong>：信息化与工业化的深度融合</li><li><strong>数字化转型</strong>：利用数字技术重塑工业生产流程</li></ul>通过工业互联网、工业大数据等技术，实现制造业高质量发展。`
},
{ id:'kp_011', ch:1, sec:'1.3.3', title:'服务现代化', tags:['重要'],
  body:`<strong>服务现代化</strong>是通过信息技术推动服务业转型升级。<ul><li><strong>传统服务业数字化</strong>：金融、物流、商贸等领域的数字化转型</li><li><strong>新兴服务业态</strong>：平台经济、共享经济等新业态</li><li><strong>服务型制造</strong>：制造业向服务环节延伸</li></ul>服务现代化推动生产性服务业向专业化和价值链高端延伸。`
},
{ id:'kp_012', ch:1, sec:'1.4.1', title:'数字经济', tags:['重要','高频'],
  body:`<strong>数字经济</strong>是以数据资源作为关键生产要素、以现代信息网络作为重要载体、以信息通信技术的有效使用作为效率提升和经济结构优化重要推动力的一系列经济活动。<br><br>数字经济包括：<ul><li><strong>数字产业化</strong>：数字技术本身形成的产业，如电子信息制造业、软件和信息技术服务业等</li><li><strong>产业数字化</strong>：利用数字技术对传统产业进行改造升级</li></ul>数据要素是数字经济的关键生产要素。`
},
{ id:'kp_013', ch:1, sec:'1.4.1', title:'《"十四五"国家信息化规划》数据要素资源体系', tags:['重要','法规'],
  body:`建立高效利用的数据要素资源体系，聚焦<strong>数据管理、共享开放、数据应用、授权许可、安全和隐私保护、风险管控</strong>等方面，探索多主体协同治理机制；加强数据收集、汇聚、存储、流通、应用等全生命周期的安全管理。建立<strong>数据分类分级管理制度</strong>和个人信息保护认证制度。`
},
{ id:'kp_014', ch:1, sec:'1.4.1', title:'《"十四五"两化深度融合规划》产业数字化与数字产业化', tags:['重要','法规'],
  body:`通过两化深度融合，推动<strong>产业数字化和数字产业化</strong>。<ul><li><strong>产业数字化</strong>：利用数字技术对传统产业进行改造升级</li><li><strong>数字产业化</strong>：数字技术本身形成产业</li></ul>两者相互促进，加快质量变革、效率变革和动力变革，赋能传统产业转型升级。`
},
{ id:'kp_015', ch:1, sec:'1.4.2', title:'数字政府', tags:['重要'],
  body:`<strong>数字政府</strong>是运用信息技术推进政府管理理念和方式变革、实现政府治理模式创新的新型政府运行模式。<ul><li><strong>协同办公</strong>：政府部门间业务协同</li><li><strong>政务服务</strong>："一网通办"、"最多跑一次"</li><li><strong>社会治理</strong>：依托大数据实现精准治理</li></ul>数字政府建设核心是<strong>数据驱动</strong>，实现政府决策科学化、社会治理精准化、公共服务高效化。`
},
{ id:'kp_016', ch:1, sec:'1.4.3', title:'数字社会与智慧城市', tags:['重要'],
  body:`<strong>数字社会</strong>是数字技术在社会领域的应用，包括数字教育、数字医疗、数字交通等。<br><br><strong>智慧城市</strong>基本原则：<ul><li><strong>以人为本，务实推进</strong></li><li><strong>因地制宜，科学有序</strong></li><li><strong>市场为主，协同创新</strong></li><li><strong>可管可控，确保安全</strong></li></ul>智慧城市是数字社会建设的重要载体，通过信息技术实现城市运行管理的智能化。`
},
{ id:'kp_017', ch:1, sec:'1.4.4', title:'数字生态', tags:['重要'],
  body:`<strong>数字生态</strong>是数字时代社会、经济、环境的协调发展生态系统。<ul><li>良好的数字生态是数字中国建设的重要保障</li><li>构建<strong>政府、平台、企业、用户</strong>多元参与的治理格局</li><li>完善数字治理规则，包括数据治理、算法治理等</li><li>维护网络安全和数据安全</li></ul>营造良好数字生态需要法律、技术、经济等多维度协同。`
},
{ id:'kp_018', ch:1, sec:'1.5.1', title:'数字化转型', tags:['重要'],
  body:`<strong>数字化转型</strong>是利用数字技术，实现组织业务模式、运营模式和组织文化的根本性变革。<ul><li><strong>数字化转换</strong>：信息从模拟到数字的转换</li><li><strong>数字化升级</strong>：业务流程的数字化优化</li><li><strong>数字化转型</strong>：商业模式和组织文化的根本变革</li></ul>数字化转型的关键是<strong>数据驱动</strong>，核心是<strong>组织变革</strong>。`
},
{ id:'kp_019', ch:1, sec:'1.5.1', title:'数据价值化三阶段', tags:['重要','高频'],
  body:`数据价值化以<strong>数据资源化</strong>为起点，经历<strong>数据资产化</strong>、<strong>数据资本化</strong>阶段，实现数据价值化的经济过程。<ol><li><strong>数据资源化</strong>：原始数据通过采集、清洗、整合等处理，使其成为具有应用价值的资源（起点）</li><li><strong>数据资产化</strong>：通过确权、定价、交易等机制，将其转化为可计量、可交易的资产</li><li><strong>数据资本化</strong>：数据资产参与生产经营并带来收益，作为资本投入经济活动实现增值（高级形态）</li></ol>`
},
{ id:'kp_020', ch:1, sec:'1.5.2', title:'元宇宙', tags:['重要'],
  body:`<strong>元宇宙</strong>是虚拟与现实高度融合的数字世界，是互联网的未来形态。<ul><li><strong>核心技术</strong>：区块链、交互技术、电子游戏技术、人工智能、网络及运算技术、物联网技术</li><li><strong>主要特征</strong>：沉浸式体验、虚实融合、开放创造、强社交性</li><li><strong>发展阶段</strong>：从数字孪生到数字原生再到虚实融合</li></ul>元宇宙被视为下一代互联网的重要发展方向。`
},

// ---- 第2章 信息技术发展 ----
{ id:'kp_021', ch:2, sec:'2.1.1', title:'计算机软硬件基础', tags:['重要'],
  body:`<strong>计算机系统</strong>由硬件系统和软件系统组成。<ul><li><strong>硬件</strong>：CPU、存储器、输入/输出设备</li><li><strong>软件</strong>：系统软件（操作系统、数据库管理系统等）、应用软件</li></ul>计算机基本结构遵循<strong>冯·诺依曼体系结构</strong>：运算器、控制器、存储器、输入设备、输出设备。程序和数据以同等地位存放在存储器中。`
},
{ id:'kp_022', ch:2, sec:'2.1.2', title:'TCP/IP四层模型 vs OSI七层模型', tags:['重要','高频'],
  body:`<strong>TCP/IP协议</strong>分为四层：网络接口层、网际层、传输层、应用层。<br><br><strong>OSI模型</strong>分为七层：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层。<br><br>TCP/IP协议的应用层相当于OSI模型的<strong>5-7层</strong>（会话层、表示层和应用层），因为TCP/IP的应用层包含了OSI模型中这三层的功能。`
},
{ id:'kp_023', ch:2, sec:'2.1.3', title:'存储和数据库基础', tags:['重要'],
  body:`<strong>存储技术</strong>：<ul><li>直接附加存储（DAS）</li><li>网络附加存储（NAS）</li><li>存储区域网络（SAN）</li></ul><strong>数据库</strong>是长期存储在计算机内、有组织的、可共享的数据集合。数据库管理系统（DBMS）提供数据定义、数据操作、数据库运行管理等功能。`
},
{ id:'kp_024', ch:2, sec:'2.1.3', title:'数据库层次模型', tags:['重要'],
  body:`在数据库管理系统中，<strong>层次模型</strong>使用<strong>树形结构</strong>来表示数据间的层次关系。<br><br>常见数据模型：<ul><li><strong>层次模型</strong>：树形结构</li><li><strong>网状模型</strong>：有向图结构</li><li><strong>关系模型</strong>：二维表结构（最常用）</li><li><strong>面向对象模型</strong>：对象和类</li></ul>`
},
{ id:'kp_025', ch:2, sec:'2.1.4', title:'信息安全基础', tags:['重要'],
  body:`<strong>信息安全</strong>强调信息在存储、处理和传输过程中的保密性、完整性和可用性。<ul><li><strong>保密性</strong>：信息不被未授权访问</li><li><strong>完整性</strong>：信息不被篡改</li><li><strong>可用性</strong>：信息在需要时可访问</li></ul>信息安全保障还包括<strong>可控性</strong>和<strong>不可抵赖性</strong>。`
},
{ id:'kp_026', ch:2, sec:'2.1.5', title:'信息技术的发展趋势', tags:['重要'],
  body:`信息技术的发展趋势：<ul><li><strong>高速化</strong>：5G/6G通信、高速计算</li><li><strong>网络化</strong>：万物互联</li><li><strong>智能化</strong>：人工智能广泛应用</li><li><strong>综合化</strong>：多种技术融合</li><li><strong>个人化</strong>：终端设备个人化</li></ul>新一代信息技术呈现出<strong>融合、智能、绿色、安全</strong>的发展特征。`
},
{ id:'kp_027', ch:2, sec:'2.2.1', title:'物联网三层架构', tags:['重要','高频'],
  body:`物联网分为<strong>感知层、网络层、应用层</strong>三层。<br><br><strong>网络层</strong>：利用无线和有线网络对采集的数据进行编码、认证和传输，广泛覆盖的移动通信网络是实现物联网的基础设施，<strong>是物联网三层中标准化程度最高、产业化能力最强、最成熟的部分</strong>，关键在于为物联网应用特征进行优化和改进，形成协同感知的网络。`
},
{ id:'kp_028', ch:2, sec:'2.2.2', title:'云计算服务类型 IaaS/PaaS/SaaS/DaaS', tags:['重要','高频'],
  body:`按照云计算服务提供的资源层次，分为四种服务类型：<ol><li><strong>IaaS（基础设施即服务）</strong>：向用户提供计算能力、存储空间等基础设施服务。单纯出租资源，盈利能力有限。</li><li><strong>PaaS（平台即服务）</strong>：向用户提供虚拟的操作系统、数据库管理系统、Web应用等平台化服务。重点不在于直接经济效益，更注重构建产业生态。</li><li><strong>SaaS（软件即服务）</strong>：向用户提供应用软件、组件、工作流等虚拟化软件服务。采用Web技术和SOA架构，多租户、可定制。</li><li><strong>DaaS（数据即服务）</strong>：数据聚合抽象，把数据转换成通用信息。（了解即可）</li></ol>`
},
{ id:'kp_029', ch:2, sec:'2.2.2', title:'云计算部署模式', tags:['重要'],
  body:`云计算的部署模式：<ul><li><strong>公有云</strong>：由第三方提供，面向公众</li><li><strong>私有云</strong>：由单一组织独占使用</li><li><strong>社区云</strong>：由若干组织共同使用</li><li><strong>混合云</strong>：结合两种或以上部署模式</li></ul>云计算的特征：宽带网络和快速接入服务、快速弹性部署、资源动态分配、可测量的服务等。`
},
{ id:'kp_030', ch:2, sec:'2.2.3', title:'大数据技术四个环节', tags:['重要','高频'],
  body:`大数据技术主要包括<strong>数据采集、数据存储、数据管理、数据分析与挖掘</strong>四个环节。<ul><li><strong>数据采集</strong>：主要使用ETL（数据抽取工具）</li><li><strong>数据存储</strong>：结构化数据、非结构化数据和半结构化数据的存储与访问</li><li><strong>数据管理</strong>：数据清洗、整合、治理等</li><li><strong>数据分析与挖掘</strong>：统计分析、机器学习等</li></ul>大数据特征（5V）：<strong>大量、高速、多样、低价值密度、真实性</strong>。`
},
{ id:'kp_031', ch:2, sec:'2.2.4', title:'区块链', tags:['重要','高频'],
  body:`<strong>区块链</strong>是分布式数据存储、点对点传输、共识机制、加密算法等计算机技术的新型应用模式。<ul><li><strong>去中心化</strong>：无中心节点，数据分布式存储</li><li><strong>不可篡改</strong>：通过密码学保证数据不可修改</li><li><strong>可追溯</strong>：所有交易记录可查</li><li><strong>匿名性</strong>：参与者身份可匿名</li></ul>区块链分为<strong>公有链、联盟链、私有链</strong>三种类型。共识机制包括PoW、PoS、DPoS等。`
},
{ id:'kp_032', ch:2, sec:'2.2.5', title:'人工智能', tags:['重要','高频'],
  body:`<strong>人工智能（AI）</strong>是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的技术科学。<ul><li><strong>机器学习</strong>：让计算机从数据中学习规律</li><li><strong>深度学习</strong>：基于神经网络的多层学习</li><li><strong>自然语言处理</strong>：让计算机理解和生成人类语言</li><li><strong>计算机视觉</strong>：让计算机"看"和理解图像</li><li><strong>知识图谱</strong>：结构化表示知识</li></ul>AI发展三阶段：运算智能→感知智能→认知智能。`
},
{ id:'kp_033', ch:2, sec:'2.2.6', title:'虚拟现实', tags:['重要'],
  body:`<strong>虚拟现实（VR）</strong>是一种可以创建和体验虚拟世界的计算机仿真系统。<ul><li><strong>沉浸感</strong>：用户身临其境的感觉</li><li><strong>交互性</strong>：用户与虚拟环境的互动</li><li><strong>想象力</strong>：启发创造性思维</li></ul>相关技术：<ul><li><strong>VR</strong>（虚拟现实）：完全虚拟环境</li><li><strong>AR</strong>（增强现实）：虚拟信息叠加到现实</li><li><strong>MR</strong>（混合现实）：虚拟与现实融合</li><li><strong>XR</strong>（扩展现实）：VR/AR/MR的统称</li></ul>`
},
{ id:'kp_034', ch:2, sec:'2.3', title:'新一代信息技术发展展望', tags:['重要'],
  body:`新一代信息技术发展展望：<ul><li><strong>深度融合</strong>：各项技术之间的融合渗透</li><li><strong>智能化</strong>：AI成为通用技术</li><li><strong>云化</strong>：云原生成为主流</li><li><strong>安全可信</strong>：安全与发展并重</li></ul>信息技术与各行业深度融合，推动数字化转型和产业升级。技术发展呈现"大智云移物链"（大数据、人工智能、云计算、移动互联网、物联网、区块链）协同发展的格局。`
},

// ---- 第3章 信息技术服务 ----
{ id:'kp_035', ch:3, sec:'3.1.1', title:'服务的特征', tags:['重要'],
  body:`<strong>服务</strong>是具有无形性、不可分离性、异质性（差异性）、不可存储性（易逝性）等特征的经济活动。<ul><li><strong>无形性</strong>：服务在被购买前看不到、尝不到、摸不着</li><li><strong>不可分离性</strong>：服务的生产和消费同时进行</li><li><strong>异质性</strong>：服务质量受提供者、时间、地点等因素影响</li><li><strong>不可存储性</strong>：服务不能被存储以备后用</li></ul>`
},
{ id:'kp_036', ch:3, sec:'3.1.2', title:'IT服务的内涵', tags:['重要'],
  body:`<strong>IT服务</strong>是指供方为需方提供满足业务需求的信息系统开发、建设、运维等服务活动。<ul><li><strong>基础环境</strong>：支撑IT服务运行的基础设施和网络环境</li><li><strong>硬件</strong>：服务器、存储、网络设备等</li><li><strong>软件</strong>：系统软件、中间件、应用软件等</li><li><strong>服务</strong>：IT服务本身就是核心</li></ul>IT服务是供方与需方之间就IT相关活动产生的一种交互关系。`
},
{ id:'kp_037', ch:3, sec:'3.1.3', title:'IT服务的外延', tags:['重要'],
  body:`<strong>IT服务的外延</strong>包括IT服务的分类和范围：<ul><li><strong>按内容划分</strong>：软件开发服务、信息系统集成服务、运行维护服务、信息技术咨询服务、信息技术培训服务等</li><li><strong>按对象划分</strong>：面向组织的IT服务、面向公众的IT服务</li><li><strong>按方式划分</strong>：在线服务、现场服务、远程服务</li></ul>IT服务外延涵盖软件、硬件、网络、数据等各维度。`
},
{ id:'kp_038', ch:3, sec:'3.1.4', title:'IT服务业的特征', tags:['重要'],
  body:`<strong>IT服务业的特征</strong>：<ul><li><strong>知识密集型</strong>：依赖专业人才和知识</li><li><strong>高附加值</strong>：通过技术创新创造价值</li><li><strong>人才需求量大</strong>：对高素质人才依赖度高</li><li><strong>创新驱动</strong>：技术更新迭代快</li><li><strong>产业融合</strong>：与各行业深度融合</li></ul>`
},
{ id:'kp_039', ch:3, sec:'3.2.1', title:'IT服务原理', tags:['重要'],
  body:`<strong>IT服务原理</strong>是IT服务供方通过IT服务能力为IT服务需方提供IT服务的内在规律。<ul><li>IT服务能力是供方提供IT服务的基础</li><li>IT服务需求是需方对IT服务的期望</li><li>IT服务过程是供方为需方提供IT服务的活动</li><li>IT服务结果是IT服务产生的效果</li></ul>核心是<strong>以需方需求为导向</strong>，通过供方的服务能力满足需方的业务需求。`
},
{ id:'kp_040', ch:3, sec:'3.2.2', title:'IT服务组成要素', tags:['重要'],
  body:`IT服务的<strong>四要素</strong>：<ol><li><strong>人员</strong>：IT服务的人员能力、知识和技能</li><li><strong>流程</strong>：规范化的服务流程和管理流程</li><li><strong>技术</strong>：IT服务所需的技术和工具</li><li><strong>资源</strong>：IT服务所需的基础设施、数据等</li></ol>四个要素相互配合，共同保障IT服务的质量和效率。<strong>人员是核心</strong>，流程是保障，技术是手段，资源是基础。`
},
{ id:'kp_041', ch:3, sec:'3.3.1', title:'IT服务战略规划', tags:['重要'],
  body:`<strong>战略规划</strong>阶段是IT服务生命周期的第一个阶段。<ul><li><strong>识别需求</strong>：分析需方的业务需求和IT需求</li><li><strong>明确服务</strong>：确定IT服务的范围、目标和内容</li><li><strong>可行性分析</strong>：技术可行性、经济可行性等</li><li><strong>制定计划</strong>：IT服务的实施计划</li></ul>战略规划的目标是确保IT服务与业务需求一致。`
},
{ id:'kp_042', ch:3, sec:'3.3.2', title:'IT服务设计实现', tags:['重要'],
  body:`<strong>设计实现</strong>阶段是IT服务生命周期的第二个阶段。<ul><li><strong>服务设计</strong>：设计IT服务的流程、架构和方案</li><li><strong>服务实现</strong>：通过开发、集成等方式实现IT服务</li><li><strong>服务部署</strong>：将IT服务部署到生产环境</li><li><strong>服务交付</strong>：将IT服务交付给需方使用</li></ul>设计实现确保IT服务满足战略规划阶段确定的需求。`
},
{ id:'kp_043', ch:3, sec:'3.3.3', title:'IT服务运营提升', tags:['重要'],
  body:`<strong>运营提升</strong>阶段是IT服务生命周期的第三个阶段。<ul><li><strong>运营管理</strong>：保障IT服务的持续稳定运行</li><li><strong>持续改进</strong>：不断优化和提升IT服务质量</li><li><strong>性能优化</strong>：提升IT服务的性能和效率</li><li><strong>成本控制</strong>：优化IT服务的成本</li></ul>运营提升确保IT服务持续满足需方的业务需求。`
},
{ id:'kp_044', ch:3, sec:'3.3.4', title:'IT服务退役终止', tags:['重要'],
  body:`<strong>退役终止</strong>阶段是IT服务生命周期的最后一个阶段。<ul><li><strong>退役决策</strong>：评估IT服务是否需要终止</li><li><strong>数据迁移</strong>：将数据迁移到新系统或归档</li><li><strong>服务终止</strong>：正式终止IT服务</li><li><strong>经验总结</strong>：总结IT服务的经验教训</li></ul>退役终止确保IT服务平稳退出，不影响需方的业务运营。`
},
{ id:'kp_045', ch:3, sec:'3.4.1', title:'IT服务产业化三阶段', tags:['重要','高频'],
  body:`IT服务的产业化进程分为<strong>产品服务化、服务标准化和服务产品化</strong>三个阶段。`
},
{ id:'kp_046', ch:3, sec:'3.4.2', title:'IT服务标准', tags:['重要'],
  body:`<strong>IT服务标准体系</strong>（ITSS）是我国自主研发的信息技术服务标准体系。<ul><li><strong>基础标准</strong>：术语、分类等</li><li><strong>服务管控标准</strong>：服务等级、评价等</li><li><strong>服务业务标准</strong>：针对各类IT服务的标准</li><li><strong>服务安全标准</strong>：安全保障要求</li><li><strong>服务外包标准</strong>：外包服务规范</li></ul>ITSS包括人员、流程、技术、资源四个核心要素。`
},
{ id:'kp_047', ch:3, sec:'3.5.1', title:'服务质量评价 - 相关方模型', tags:['重要'],
  body:`<strong>相关方模型</strong>从IT服务各相关方的视角评价IT服务质量。<ul><li><strong>需方</strong>：IT服务的最终使用者，关注服务是否满足需求</li><li><strong>供方</strong>：IT服务的提供者，关注服务交付效率和质量</li><li><strong>监管方</strong>：监管IT服务合规性</li></ul>不同相关方对IT服务质量有不同的评价视角和标准。`
},
{ id:'kp_048', ch:3, sec:'3.5.2', title:'服务质量评价 - 互动模型', tags:['重要'],
  body:`<strong>互动模型</strong>描述IT服务过程中供方与需方的交互关系。<ul><li>IT服务是供方与需方<strong>互动</strong>的过程</li><li>服务质量在互动过程中产生和体现</li><li>包括<strong>服务接触、服务传递、服务反馈</strong>等环节</li></ul>互动模型强调IT服务的<strong>交互性</strong>和<strong>过程性</strong>。`
},
{ id:'kp_049', ch:3, sec:'3.5.3', title:'服务质量评价 - 质量模型', tags:['重要','高频'],
  body:`<strong>IT服务质量模型</strong>从多个维度评价IT服务质量：<ul><li><strong>可用性</strong>：IT服务在需要时能被访问的程度</li><li><strong>可靠性</strong>：IT服务持续稳定运行的能力</li><li><strong>响应性</strong>：IT服务对需求的响应速度</li><li><strong>安全性</strong>：IT服务保障信息安全的程度</li><li><strong>可恢复性</strong>：IT服务故障后的恢复能力</li><li><strong>符合性</strong>：IT服务符合标准的程度</li></ul>`
},
{ id:'kp_050', ch:3, sec:'3.6.1', title:'IT服务发展环境', tags:['重要'],
  body:`<strong>IT服务发展环境</strong>包括：<ul><li><strong>政策环境</strong>：国家政策法规对IT服务的影响</li><li><strong>经济环境</strong>：经济发展水平对IT服务的需求</li><li><strong>技术环境</strong>：新一代信息技术推动IT服务发展</li><li><strong>社会环境</strong>：数字化转型对IT服务的需求</li></ul>良好的发展环境是IT服务健康发展的基础。`
},
{ id:'kp_051', ch:3, sec:'3.6.2', title:'IT服务发展现状与趋势', tags:['重要'],
  body:`<strong>IT服务发展趋势</strong>：<ul><li><strong>云化</strong>：基于云计算的IT服务成为主流</li><li><strong>智能化</strong>：AI驱动的IT服务智能化</li><li><strong>服务化</strong>：从产品向服务转型</li><li><strong>融合化</strong>：与各行业深度融合</li><li><strong>标准化</strong>：ITSS等标准体系日益完善</li></ul>`
},
{ id:'kp_052', ch:3, sec:'3.7.1', title:'IT服务集成与实践背景', tags:['重要'],
  body:`<strong>IT服务集成</strong>是将各类IT服务整合为综合解决方案的过程。<ul><li>随着信息化深入，单一IT服务难以满足复杂业务需求</li><li>需要将多种IT服务集成，形成整体解决方案</li><li>服务集成涉及技术、流程、人员等多维度整合</li></ul>`
},
{ id:'kp_053', ch:3, sec:'3.7.2', title:'服务产品与组合', tags:['重要'],
  body:`<strong>服务产品</strong>是将IT服务标准化、产品化的结果。<ul><li><strong>服务产品化</strong>：将定制化服务转化为标准产品</li><li><strong>产品服务化</strong>：将产品以服务方式提供</li></ul><strong>服务组合</strong>是将多个服务产品组合，形成满足特定需求的解决方案。服务组合管理确保服务组合与业务需求匹配。`
},
{ id:'kp_054', ch:3, sec:'3.7.3', title:'项目组织与里程碑计划', tags:['重要'],
  body:`<strong>IT服务项目组织</strong>包括：<ul><li><strong>项目组织架构</strong>：项目经理、技术团队、服务团队等</li><li><strong>角色职责</strong>：明确各角色的职责和分工</li><li><strong>里程碑计划</strong>：确定项目关键节点和交付物</li></ul>里程碑是项目进度管理的重要工具，用于标记关键事件或阶段性成果。`
},
{ id:'kp_055', ch:3, sec:'3.7.4', title:'项目风险识别与控制', tags:['重要'],
  body:`<strong>IT服务项目风险</strong>管理包括：<ul><li><strong>风险识别</strong>：识别项目中的技术风险、管理风险、商务风险等</li><li><strong>风险评估</strong>：评估风险的概率和影响</li><li><strong>风险应对</strong>：制定风险应对策略（规避、转移、减轻、接受）</li><li><strong>风险监控</strong>：持续监控风险状态</li></ul>IT服务项目常见风险：需求变更风险、技术风险、人员风险、进度风险等。`
},

// ---- 第4章 信息系统架构 ----
{ id:'kp_056', ch:4, sec:'4.1.1', title:'架构设计指导思想', tags:['重要'],
  body:`<strong>信息系统架构设计</strong>的指导思想：<ul><li>以<strong>业务需求</strong>为导向</li><li>以<strong>信息化规划</strong>为基础</li><li>以<strong>系统工程</strong>方法为指导</li><li>以<strong>标准化</strong>为手段</li><li>以<strong>安全可靠</strong>为保障</li></ul>架构设计需要统筹考虑业务、技术、安全、标准等多方面因素。`
},
{ id:'kp_057', ch:4, sec:'4.1.2', title:'架构设计原则', tags:['重要'],
  body:`<strong>信息系统架构设计原则</strong>：<ul><li><strong>开放性</strong>：采用开放标准和技术</li><li><strong>可扩展性</strong>：支持业务和技术发展</li><li><strong>可复用性</strong>：组件化、模块化设计</li><li><strong>可管理性</strong>：便于运维管理</li><li><strong>安全性</strong>：保障信息安全</li><li><strong>可靠性</strong>：保障系统稳定运行</li><li><strong>高可用性</strong>：保障业务连续性</li></ul>`
},
{ id:'kp_058', ch:4, sec:'4.1.3', title:'架构设计建设目标', tags:['重要'],
  body:`<strong>信息系统架构建设目标</strong>：<ul><li>构建<strong>统一、规范、安全、高效</strong>的信息系统</li><li>实现<strong>业务融合</strong>，消除信息孤岛</li><li>实现<strong>数据共享</strong>，提升数据价值</li><li>实现<strong>服务复用</strong>，降低开发和运维成本</li><li>实现<strong>灵活扩展</strong>，支撑业务持续发展</li></ul>`
},
{ id:'kp_059', ch:4, sec:'4.1.4', title:'架构总体框架', tags:['重要'],
  body:`<strong>信息系统架构总体框架</strong>采用"框架-模型-模式"三层递进：<ul><li><strong>架构框架</strong>：总体性、全局性的架构设计</li><li><strong>架构模型</strong>：针对特定场景的架构设计</li><li><strong>架构模式</strong>：可复用的架构设计经验</li></ul>总体框架包括<strong>系统架构、应用架构、数据架构、技术架构</strong>等视图。`
},
{ id:'kp_060', ch:4, sec:'4.2.1', title:'系统架构定义', tags:['重要'],
  body:`<strong>系统架构</strong>是系统各组成部分及其相互关系的描述。<ul><li>定义系统的<strong>组件</strong>及其<strong>关系</strong></li><li>定义系统的<strong>行为</strong>和<strong>约束</strong></li><li>定义系统的<strong>环境</strong>和<strong>边界</strong></li></ul>系统架构是系统设计的基础，决定了系统的质量和特性。`
},
{ id:'kp_061', ch:4, sec:'4.2.2', title:'系统架构分类', tags:['重要'],
  body:`<strong>系统架构分类</strong>：<ul><li><strong>集中式架构</strong>：所有功能集中在单一节点</li><li><strong>分布式架构</strong>：功能分布在多个节点</li><li><strong>面向服务架构(SOA)</strong>：以服务为核心</li><li><strong>微服务架构</strong>：将应用拆分为小型服务</li><li><strong>云原生架构</strong>：面向云环境设计</li></ul>`
},
{ id:'kp_062', ch:4, sec:'4.2.3', title:'系统架构一般原理', tags:['重要'],
  body:`<strong>系统架构设计的一般原理</strong>：<ul><li><strong>抽象</strong>：提取关键特征，忽略无关细节</li><li><strong>封装</strong>：隐藏内部实现，暴露接口</li><li><strong>信息隐藏</strong>：模块内部信息不对外暴露</li><li><strong>模块化</strong>：将系统分解为独立模块</li><li><strong>关注点分离</strong>：不同关注点分开处理</li><li><strong>高内聚低耦合</strong>：模块内功能紧密相关，模块间依赖少</li></ul>`
},
{ id:'kp_063', ch:4, sec:'4.2.4', title:'分层模式架构特点', tags:['重要','高频'],
  body:`<strong>分层模式</strong>：采用层次化的组织方式，每一层都为上一层提供服务，并使用下一层提供的功能。<ul><li>每一层<strong>依赖于它的下层服务</strong>，为<strong>上层</strong>提供服务（非为各层服务）</li><li>每一层允许用不同方法实现，只要保证接口一致性</li><li>通过接口提供服务，实现层与层之间的解耦</li><li>允许复杂问题逐步分层实现，降低系统复杂性</li></ul>`
},
{ id:'kp_064', ch:4, sec:'4.2.4', title:'常用架构模型 - 其他模式', tags:['重要'],
  body:`除分层模式外，常用架构模型还包括：<ul><li><strong>管道-过滤器模式</strong>：数据流式处理</li><li><strong>客户/服务器模式(C/S)</strong>：客户端请求，服务器响应</li><li><strong>浏览器/服务器模式(B/S)</strong>：基于Web的三层架构</li><li><strong>面向对象模式</strong>：以对象为基本单元</li><li><strong>事件驱动模式</strong>：基于事件触发</li><li><strong>MVC模式</strong>：模型-视图-控制器分离</li><li><strong>微核模式</strong>：核心+插件</li></ul>`
},
{ id:'kp_065', ch:4, sec:'4.2.5', title:'组织战略规划体系特性', tags:['重要'],
  body:`组织战略规划分为长期规划和短期规划两种。<ul><li><strong>长期规划</strong>：相对稳定，如调整产品结构等</li><li><strong>短期规划</strong>：根据长期规划目的制订，容易根据环境、组织运作情况改变，如决定新产品类型</li></ul><strong>组织的战略规划体系不是比较稳定的</strong>，会随着市场环境、组织目标等因素的变化而调整。`
},
{ id:'kp_066', ch:4, sec:'4.2.6', title:'价值驱动的体系结构', tags:['重要'],
  body:`<strong>价值驱动的体系结构</strong>强调架构设计应围绕<strong>价值创造</strong>展开：<ul><li>架构设计以<strong>业务价值</strong>为导向</li><li>关注架构对<strong>组织战略</strong>的支撑</li><li>平衡<strong>短期价值</strong>与<strong>长期价值</strong></li><li>通过架构治理保障价值持续交付</li></ul>价值驱动架构是<strong>ABCD</strong>（Architecture Business Capability Design）等方法的核心理念。`
},
{ id:'kp_067', ch:4, sec:'4.3.1', title:'应用架构基本原则', tags:['重要'],
  body:`<strong>应用架构设计基本原则</strong>：<ul><li><strong>业务导向</strong>：应用架构支撑业务需求</li><li><strong>松耦合</strong>：应用间依赖最小化</li><li><strong>高内聚</strong>：应用内功能紧密相关</li><li><strong>可复用</strong>：公共能力沉淀复用</li><li><strong>可扩展</strong>：支持业务灵活扩展</li><li><strong>标准化</strong>：遵循统一技术标准和规范</li></ul>`
},
{ id:'kp_068', ch:4, sec:'4.3.2', title:'应用架构分层分组', tags:['重要'],
  body:`<strong>应用架构分层分组</strong>：<ul><li><strong>展现层</strong>：用户交互界面</li><li><strong>应用层</strong>：业务逻辑处理</li><li><strong>服务层</strong>：公共业务服务</li><li><strong>数据层</strong>：数据访问和存储</li><li><strong>基础设施层</strong>：底层支撑</li></ul>分组按<strong>业务域</strong>划分应用，实现业务功能的聚合和内聚。`
},
{ id:'kp_069', ch:4, sec:'4.4.1', title:'数据架构发展演进', tags:['重要'],
  body:`<strong>数据架构发展演进</strong>：<ol><li><strong>文件系统</strong>阶段：数据以文件方式存储</li><li><strong>数据库系统</strong>阶段：数据以数据库方式管理</li><li><strong>数据仓库</strong>阶段：面向主题、分析型数据存储</li><li><strong>数据湖</strong>阶段：原始数据统一存储</li><li><strong>湖仓一体</strong>阶段：融合数据湖和数据仓库优势</li></ol>`
},
{ id:'kp_070', ch:4, sec:'4.4.2', title:'数据架构基本原则', tags:['重要'],
  body:`<strong>数据架构设计基本原则</strong>：<ul><li><strong>数据统一管理</strong>：统一数据标准和口径</li><li><strong>数据共享</strong>：促进数据跨域共享</li><li><strong>数据安全</strong>：保障数据全生命周期安全</li><li><strong>数据质量</strong>：保障数据准确、完整、一致</li><li><strong>可扩展</strong>：支持数据量和数据类型的扩展</li><li><strong>分类分级</strong>：按敏感程度分类管理</li></ul>`
},
{ id:'kp_071', ch:4, sec:'4.4.3', title:'数据架构举例', tags:['重要'],
  body:`<strong>数据架构示例</strong>：<ul><li><strong>操作型数据存储(ODS)</strong>：面向操作型应用</li><li><strong>数据仓库(DW)</strong>：面向分析型应用，存储历史数据</li><li><strong>数据集市(DM)</strong>：面向特定主题或部门</li><li><strong>大数据平台</strong>：处理海量异构数据</li></ul>典型的数据架构遵循"采集-存储-计算-服务"的数据流。`
},
{ id:'kp_072', ch:4, sec:'4.5.1', title:'技术架构基本原则', tags:['重要'],
  body:`<strong>技术架构设计基本原则</strong>：<ul><li><strong>标准化</strong>：采用主流技术标准</li><li><strong>开放性</strong>：支持开放接口和协议</li><li><strong>可扩展性</strong>：支持水平和垂直扩展</li><li><strong>高可用性</strong>：消除单点故障</li><li><strong>安全性</strong>：多层级安全保障</li><li><strong>可运维性</strong>：便于监控和管理</li></ul>`
},
{ id:'kp_073', ch:4, sec:'4.5.2', title:'技术架构举例', tags:['重要'],
  body:`<strong>技术架构示例</strong>：<ul><li><strong>基础设施层</strong>：服务器、存储、网络设备</li><li><strong>平台服务层</strong>：中间件、数据库、消息队列</li><li><strong>容器编排层</strong>：Docker、Kubernetes</li><li><strong>微服务网格</strong>：服务注册发现、负载均衡、熔断</li><li><strong>DevOps工具链</strong>：CI/CD、监控、日志</li></ul>`
},
{ id:'kp_074', ch:4, sec:'4.6.1', title:'网络架构基本原则', tags:['重要'],
  body:`<strong>网络架构设计基本原则</strong>：<ul><li><strong>可靠性</strong>：网络冗余设计，避免单点故障</li><li><strong>安全性</strong>：多层次安全防护</li><li><strong>可扩展性</strong>：支持网络规模扩展</li><li><strong>可管理性</strong>：便于网络监控和管理</li><li><strong>高性能</strong>：满足带宽和延迟需求</li><li><strong>标准化</strong>：遵循国际和国家标准</li></ul>`
},
{ id:'kp_075', ch:4, sec:'4.6.2', title:'局域网架构', tags:['重要'],
  body:`<strong>局域网(LAN)</strong>架构通常采用层次化设计：<ul><li><strong>接入层</strong>：连接终端设备，提供网络接入</li><li><strong>汇聚层</strong>：汇聚接入层流量，实现策略控制</li><li><strong>核心层</strong>：高速数据转发，连接汇聚层</li></ul>常见的局域网技术：<strong>以太网、Wi-Fi、VLAN</strong>等。大型园区网通常采用三层架构，中小型网络可简化为二层。`
},
{ id:'kp_076', ch:4, sec:'4.6.3', title:'广域网架构', tags:['重要'],
  body:`<strong>广域网(WAN)</strong>架构连接不同地理位置的网络。<ul><li><strong>专线</strong>：点对点专用线路，如MSTP、OTN</li><li><strong>VPN</strong>：基于公网构建虚拟专用网络，如IPSec VPN、MPLS VPN</li><li><strong>SD-WAN</strong>：软件定义广域网，智能选路</li></ul>广域网设计需考虑带宽、延迟、可靠性和成本等因素。`
},
{ id:'kp_077', ch:4, sec:'4.6.4', title:'移动通信网架构', tags:['重要'],
  body:`<strong>移动通信网</strong>架构演进：<ul><li><strong>2G</strong>：数字语音，GSM/CDMA</li><li><strong>3G</strong>：移动数据，WCDMA/CDMA2000/TD-SCDMA</li><li><strong>4G</strong>：移动互联网，LTE/LTE-Advanced</li><li><strong>5G</strong>：万物互联，三大场景：eMBB（增强移动宽带）、uRLLC（超低时延高可靠）、mMTC（海量机器通信）</li></ul>5G网络采用<strong>NSA（非独立组网）</strong>和<strong>SA（独立组网）</strong>两种模式。`
},
{ id:'kp_078', ch:4, sec:'4.6.5', title:'软件定义网络(SDN)', tags:['重要','高频'],
  body:`<strong>SDN(Software Defined Network)</strong>是一种新型网络架构，将网络控制面与数据面分离。<ul><li><strong>应用层</strong>：网络应用</li><li><strong>控制层</strong>：SDN控制器，集中控制网络</li><li><strong>基础设施层(数据层)</strong>：网络设备，负责数据转发</li></ul>特点：<strong>控制与转发分离、开放可编程接口、集中控制</strong>。<br>SDN的关键技术：<strong>OpenFlow协议、NETCONF/YANG</strong>等。`
},
{ id:'kp_079', ch:4, sec:'4.7.1', title:'安全威胁', tags:['重要'],
  body:`<strong>安全威胁</strong>类型：<ul><li><strong>网络攻击</strong>：DDoS、SQL注入、跨站脚本等</li><li><strong>恶意软件</strong>：病毒、木马、勒索软件等</li><li><strong>社会工程学</strong>：钓鱼攻击等</li><li><strong>内部威胁</strong>：内部人员有意或无意泄露</li><li><strong>物理威胁</strong>：自然灾害、设备故障等</li></ul>威胁来源包括黑客、竞争对手、内部人员、自然灾害等。`
},
{ id:'kp_080', ch:4, sec:'4.7.2', title:'安全架构定义和范围', tags:['重要'],
  body:`<strong>安全架构</strong>是为保障信息系统安全而设计的体系结构。<ul><li><strong>物理安全</strong>：机房、设备等物理层面的安全</li><li><strong>网络安全</strong>：网络传输和访问的安全</li><li><strong>主机安全</strong>：操作系统和服务器的安全</li><li><strong>应用安全</strong>：应用程序的安全</li><li><strong>数据安全</strong>：数据的保密性、完整性、可用性</li><li><strong>管理安全</strong>：安全管理制度和流程</li></ul>安全架构遵循<strong>纵深防御</strong>原则，多层级安全防护。`
},
{ id:'kp_081', ch:4, sec:'4.7.3', title:'安全整体架构设计', tags:['重要'],
  body:`<strong>安全整体架构设计</strong>遵循纵深防御策略：<ul><li><strong>安全防护</strong>：身份认证、访问控制、加密等</li><li><strong>安全检测</strong>：入侵检测、安全审计等</li><li><strong>安全响应</strong>：事件响应、应急处置等</li><li><strong>安全恢复</strong>：灾备恢复、业务连续性等</li></ul>安全架构设计应遵循<strong>等级保护</strong>要求，与业务架构同步规划。`
},
{ id:'kp_082', ch:4, sec:'4.7.4', title:'网络安全架构设计', tags:['重要'],
  body:`<strong>网络安全架构设计</strong>包括：<ul><li><strong>边界安全</strong>：防火墙、入侵检测/防御(IDS/IPS)</li><li><strong>网络隔离</strong>：DMZ、网络分段、VLAN隔离</li><li><strong>访问控制</strong>：网络访问控制(NAC)、VPN</li><li><strong>流量安全</strong>：流量加密、DPI深度包检测</li><li><strong>安全管理</strong>：安全运营中心(SOC)、SIEM</li></ul>`
},
{ id:'kp_083', ch:4, sec:'4.7.5', title:'数据库系统安全设计', tags:['重要'],
  body:`<strong>数据库系统安全设计</strong>包括：<ul><li><strong>身份认证</strong>：强密码策略、多因子认证</li><li><strong>访问控制</strong>：最小权限原则、角色访问控制(RBAC)</li><li><strong>数据加密</strong>：传输加密(TLS)、存储加密(TDE)</li><li><strong>审计追踪</strong>：数据库审计日志</li><li><strong>数据脱敏</strong>：敏感数据脱敏处理</li><li><strong>备份恢复</strong>：定期备份和容灾</li></ul>`
},
{ id:'kp_084', ch:4, sec:'4.7.6', title:'安全架构设计案例分析', tags:['案例'],
  body:`<strong>安全架构设计案例</strong>要点：<ul><li>分析业务需求和安全风险</li><li>确定安全保护等级</li><li>设计纵深防御体系</li><li>选择安全产品和技术</li><li>制定安全管理策略</li><li>规划安全运营流程</li></ul>案例通常涉及<strong>电子政务、金融、医疗</strong>等行业的安全架构设计，需结合等保2.0要求。`
},
{ id:'kp_085', ch:4, sec:'4.8.1', title:'云原生发展概述', tags:['重要'],
  body:`<strong>云原生(Cloud Native)</strong>是面向云环境设计和运行应用的方法论。<ul><li>云原生发展经历了<strong>容器化→微服务→DevOps→持续交付</strong>的演进</li><li>CNCF（云原生计算基金会）是推动云原生发展的核心组织</li><li>云原生已成为云计算发展的主流方向</li></ul>云原生的代表技术包括<strong>容器、服务网格、微服务、不可变基础设施、声明式API</strong>等。`
},
{ id:'kp_086', ch:4, sec:'4.8.2', title:'云原生架构定义', tags:['重要'],
  body:`<strong>云原生架构</strong>是基于云原生技术构建的、充分利用云平台弹性和分布式优势的架构。<ul><li><strong>容器</strong>：轻量级虚拟化，如Docker</li><li><strong>微服务</strong>：应用拆分为小型独立服务</li><li><strong>服务网格</strong>：如Istio，管理服务间通信</li><li><strong>不可变基础设施</strong>：基础设施以代码方式管理</li><li><strong>声明式API</strong>：如Kubernetes YAML</li></ul>`
},
{ id:'kp_087', ch:4, sec:'4.8.3', title:'云原生服务化原则', tags:['重要','高频'],
  body:`<strong>服务化原则</strong>：当代码规模超出小团队的合作范围时，就有必要进行服务化拆分，包括拆分为<strong>微服务架构、小服务(MiniService)架构</strong>等。<ul><li>通过服务化架构把不同生命周期的模块分离，分别进行业务迭代</li><li>避免迭代频繁模块被慢速模块拖慢，加快整体进度和提升系统稳定性</li><li>以面向接口编程，服务内部功能高度内聚</li><li>模块间通过公共功能模块的提取增加软件复用程度</li></ul>`
},
{ id:'kp_088', ch:4, sec:'4.8.4', title:'云原生常用架构模式', tags:['重要'],
  body:`<strong>云原生常用架构模式</strong>：<ul><li><strong>服务治理</strong>：服务注册发现、负载均衡、熔断降级、链路追踪</li><li><strong>弹性伸缩</strong>：根据负载自动扩缩容</li><li><strong>故障容错</strong>：健康检查、自动恢复、故障隔离</li><li><strong>配置管理</strong>：集中配置、动态更新</li><li><strong>API网关</strong>：统一入口、认证鉴权、限流</li></ul>`
},
{ id:'kp_089', ch:4, sec:'4.8.5', title:'云原生案例', tags:['案例'],
  body:`<strong>云原生应用案例</strong>：<ul><li><strong>容器化部署</strong>：使用Docker+Kubernetes部署应用</li><li><strong>微服务改造</strong>：单体应用拆分为微服务</li><li><strong>DevOps流水线</strong>：CI/CD持续交付</li><li><strong>服务网格</strong>：Istio/Linkerd管理服务通信</li><li><strong>Serverless</strong>：无服务器架构，按需运行</li></ul>云原生技术已在互联网、金融、政务等领域广泛应用。`
},

// ---- 第5章 软件工程 ----
{ id:'kp_090', ch:5, sec:'5.1', title:'软件工程定义', tags:['重要'],
  body:`<strong>软件工程</strong>是将系统化的、规范化的、可度量的方法应用于软件的开发、运行和维护的过程。<ul><li><strong>方法</strong>：完成软件开发的各项任务的技术方法</li><li><strong>工具</strong>：为方法提供自动化或半自动化支持</li><li><strong>过程</strong>：为获得高质量软件所执行的一系列任务框架</li></ul>软件工程三要素：<strong>方法、工具、过程</strong>。`
},
{ id:'kp_091', ch:5, sec:'5.2.1', title:'软件需求的层次', tags:['重要'],
  body:`软件需求分为多个层次：<ul><li><strong>业务需求</strong>：反映组织或客户高层次的目标</li><li><strong>用户需求</strong>：用户使用系统需要完成的任务描述</li><li><strong>系统需求</strong>（功能需求）：系统应该具备的功能</li><li><strong>非功能需求</strong>：性能、安全、可靠性等质量属性</li><li><strong>设计约束</strong>：技术选择、标准法规等限制</li></ul>`
},
{ id:'kp_092', ch:5, sec:'5.2.2', title:'质量功能部署(QFD)', tags:['重要'],
  body:`<strong>质量功能部署(QFD)</strong>是一种将用户需求转化为产品需求的方法。<ul><li><strong>常规需求</strong>：用户明确需求的功能</li><li><strong>期望需求</strong>：用户未明确但期望的功能</li><li><strong>意外需求</strong>：用户未意识到的功能</li></ul>QFD通过"质量屋"(House of Quality)矩阵将用户需求映射到技术特征。`
},
{ id:'kp_093', ch:5, sec:'5.2.3', title:'软件需求获取', tags:['重要'],
  body:`<strong>需求获取</strong>是从用户和干系人收集需求的过程，常用方法：<ul><li><strong>用户访谈</strong>：一对一或小组访谈</li><li><strong>问卷调查</strong>：大规模需求收集</li><li><strong>现场观察</strong>：观察用户工作流程</li><li><strong>原型法</strong>：快速构建原型验证需求</li><li><strong>头脑风暴</strong>：集思广益</li><li><strong>JAD联合需求开发</strong>：研讨会形式</li></ul>`
},
{ id:'kp_094', ch:5, sec:'5.2.4', title:'软件需求定义与特征', tags:['重要'],
  body:`<strong>软件需求</strong>是针对待解决问题的特性的描述。<ul><li><strong>所定义的需求必须可以被验证</strong></li><li>资源有限时，可以通过优先级对需求进行权衡</li><li>通过需求分析，可以<strong>检测和解决需求之间的冲突</strong></li><li>发现系统的边界</li><li>详细描述出系统需求</li></ul>`
},
{ id:'kp_095', ch:5, sec:'5.2.5', title:'需求规格说明书(SRS)', tags:['重要'],
  body:`<strong>需求规格说明书(SRS)</strong>是需求分析阶段的产物，是软件需求的核心文档。<ul><li><strong>功能需求</strong>：系统应提供的功能</li><li><strong>非功能需求</strong>：性能、安全等质量属性</li><li><strong>设计约束</strong>：技术限制条件</li><li><strong>接口需求</strong>：用户接口、硬件接口等</li></ul>SRS的<strong>IEEE 830标准</strong>规定了需求文档的基本结构。`
},
{ id:'kp_096', ch:5, sec:'5.2.6', title:'需求变更', tags:['重要'],
  body:`<strong>需求变更</strong>管理是需求工程的重要组成部分。<ul><li><strong>变更控制</strong>：通过CCB（变更控制委员会）审批变更</li><li><strong>变更影响分析</strong>：评估变更对成本、进度、质量的影响</li><li><strong>变更追溯</strong>：跟踪变更的来源和影响</li></ul>需求变更应遵循<strong>变更控制流程</strong>：提出变更→评估影响→审批→实施→验证。`
},
{ id:'kp_097', ch:5, sec:'5.2.7', title:'需求跟踪', tags:['重要'],
  body:`<strong>需求跟踪</strong>是建立需求与设计、代码、测试用例等之间关系的过程。<ul><li><strong>前向跟踪</strong>：需求→设计→实现→测试</li><li><strong>后向跟踪</strong>：测试→实现→设计→需求</li><li><strong>需求跟踪矩阵(RTM)</strong>：记录需求与各制品的双向追溯关系</li></ul>需求跟踪确保每个需求都被实现和验证，变更影响可追溯。`
},
{ id:'kp_098', ch:5, sec:'5.3.1', title:'结构化设计', tags:['重要'],
  body:`<strong>结构化设计</strong>是一种面向数据流的设计方法。<ul><li><strong>自顶向下、逐步求精</strong>的设计策略</li><li><strong>模块化</strong>：将系统分解为模块</li><li><strong>抽象</strong>：不同层次关注不同细节</li><li><strong>信息隐藏</strong>：模块内部细节对外隐藏</li><li><strong>高内聚低耦合</strong>：模块设计的基本原则</li></ul>主要工具：<strong>数据流图(DFD)、结构图、数据字典</strong>等。`
},
{ id:'kp_099', ch:5, sec:'5.3.2', title:'面向对象设计 - 继承', tags:['重要','高频'],
  body:`<strong>继承</strong>是从已有的类中派生出新的类，新的类能吸收已有类的数据属性和行为，并能扩展新的能力。<ul><li><strong>类</strong>是实例的抽象，<strong>对象</strong>是现实世界中某个实体的抽象</li><li>类是生成对象的模板</li><li>如：学生是一个类，大学生继承学生类，大学生张三就是一个对象</li></ul>面向对象三大特性：<strong>封装、继承、多态</strong>。`
},
{ id:'kp_100', ch:5, sec:'5.3.3', title:'UML统一建模语言', tags:['重要','高频'],
  body:`<strong>UML</strong>（Unified Modeling Language）是一种<strong>可视化的建模语言</strong>。<br><br>UML的图分为两大类：<ul><li><strong>结构图(静态)</strong>：类图、对象图、组件图、部署图、包图</li><li><strong>行为图(动态)</strong>：用例图、活动图、状态图、顺序图、协作图</li></ul>UML通过关系（关联、依赖、泛化、实现）描述元素间关系。`
},
{ id:'kp_101', ch:5, sec:'5.3.4', title:'设计模式', tags:['重要','高频'],
  body:`<strong>设计模式</strong>是面向对象设计中反复使用的设计经验总结。GoF 23种设计模式分为三类：<ul><li><strong>创建型模式</strong>：对象创建，如工厂方法、抽象工厂、单例、建造者、原型</li><li><strong>结构型模式</strong>：类和对象组合，如适配器、桥接、组合、装饰器、外观、享元、代理</li><li><strong>行为型模式</strong>：对象间通信，如责任链、命令、解释器、迭代器、中介者、备忘录、观察者、状态、策略、模板方法、访问者</li></ul>`
},
{ id:'kp_102', ch:5, sec:'5.4.1', title:'软件配置管理', tags:['重要','高频'],
  body:`<strong>软件配置管理(SCM)</strong>是管理软件变更的过程。<ul><li><strong>配置项</strong>：源代码、文档、数据等可管理的单元</li><li><strong>基线</strong>：已正式审定、作为后续开发基础的一组配置项</li><li><strong>配置库</strong>：动态库(开发库)、受控库(主库)、静态库、备份库</li><li><strong>变更控制</strong>：通过CCB审批变更</li><li><strong>配置审计</strong>：功能配置审计、物理配置审计</li></ul>`
},
{ id:'kp_103', ch:5, sec:'5.4.2', title:'软件编码', tags:['重要'],
  body:`<strong>软件编码</strong>是将设计转化为可执行程序的过程。<ul><li><strong>编程规范</strong>：遵循统一的编码标准</li><li><strong>代码审查</strong>：同行评审发现缺陷</li><li><strong>静态分析</strong>：工具自动检查代码质量</li><li><strong>结对编程</strong>：两人协作编程（敏捷开发）</li><li><strong>重构</strong>：在不改变外部行为前提下改善内部结构</li></ul>编码阶段应注重<strong>可读性、可维护性、可测试性</strong>。`
},
{ id:'kp_104', ch:5, sec:'5.4.3', title:'软件测试', tags:['重要','高频'],
  body:`<strong>软件测试</strong>是为发现程序错误而执行程序的过程。测试分类：<ul><li><strong>按阶段</strong>：单元测试、集成测试、系统测试、验收测试</li><li><strong>按方法</strong>：白盒测试（路径覆盖、语句覆盖）、黑盒测试（等价类划分、边界值分析）、灰盒测试</li><li><strong>按方向</strong>：功能测试、性能测试、安全测试</li></ul>测试原则：<strong>尽早测试、穷尽测试不可能、缺陷集群性、杀虫剂悖论</strong>。`
},
{ id:'kp_105', ch:5, sec:'5.5.1', title:'软件部署', tags:['重要'],
  body:`<strong>软件部署</strong>是将软件从开发环境发布到生产环境的过程。<ul><li><strong>部署方式</strong>：手动部署、自动部署、蓝绿部署、金丝雀发布(灰度发布)</li><li><strong>部署策略</strong>：全量部署、增量部署、滚动部署</li><li><strong>回滚机制</strong>：部署失败时快速回退</li></ul>现代部署强调<strong>自动化</strong>和<strong>可重复性</strong>。`
},
{ id:'kp_106', ch:5, sec:'5.5.2', title:'发布管理和交付活动任务', tags:['重要','高频'],
  body:`发布管理和交付活动的主要任务：<ul><li>有效控制软件产品和文档的发行和交付</li><li>在软件产品的生存期内妥善保存代码和文档的<strong>母拷贝</strong></li><li>包括<strong>存储、复制、打包、交付、重建</strong></li></ul><strong>注意</strong>：确定可交付成果的正确性通常是在<strong>质量保证和质量控制过程</strong>完成的，不是发布管理和交付活动的主要任务。`
},
{ id:'kp_107', ch:5, sec:'5.5.3', title:'持续交付', tags:['重要'],
  body:`<strong>持续交付(CD)</strong>是一种软件工程方法，确保软件可以随时被安全地发布到生产环境。<ul><li><strong>持续集成(CI)</strong>：代码频繁合并到主干，自动构建和测试</li><li><strong>持续交付(CD)</strong>：CI基础上，自动部署到类生产环境，随时可发布</li><li><strong>流水线</strong>：构建→测试→部署的自动化流程</li></ul>持续交付的核心理念：<strong>每次变更都是可发布的</strong>。`
},
{ id:'kp_108', ch:5, sec:'5.5.4', title:'持续部署', tags:['重要'],
  body:`<strong>持续部署(CD)</strong>是持续交付的进一步延伸，每次代码变更通过测试后自动部署到生产环境。<ul><li>比持续交付更进一步：<strong>自动发布</strong>到生产环境</li><li>需要完善的<strong>自动化测试</strong>保障</li><li>需要<strong>灰度发布</strong>和<strong>快速回滚</strong>能力</li><li>需要完善的<strong>监控告警</strong>体系</li></ul>持续部署是DevOps实践的高级阶段。`
},
{ id:'kp_109', ch:5, sec:'5.5.5', title:'部署和交付的新趋势', tags:['重要'],
  body:`<strong>部署和交付新趋势</strong>：<ul><li><strong>DevOps</strong>：开发运维一体化，强调协作和自动化</li><li><strong>GitOps</strong>：以Git为唯一真源的基础设施即代码</li><li><strong>Serverless</strong>：无服务器部署，按需运行</li><li><strong>容器化部署</strong>：Docker+Kubernetes</li><li><strong>微服务部署</strong>：独立部署、独立扩展</li><li><strong>AIOps</strong>：AI驱动的智能运维</li></ul>`
},
{ id:'kp_110', ch:5, sec:'5.6', title:'软件质量定义', tags:['重要'],
  body:`<strong>软件质量</strong>指的是软件特性的总和，是软件满足用户需求的能力，即遵从用户需求，达到用户满意。<br><br>软件质量包括三部分：<ul><li><strong>内部质量</strong></li><li><strong>外部质量</strong></li><li><strong>使用质量</strong></li></ul>`
},
{ id:'kp_111', ch:5, sec:'5.6', title:'管理评审的目的', tags:['重要'],
  body:`<strong>管理评审</strong>的目的是<strong>监控进展，决定计划和进度的状态，或评价用于达到目标所用管理方法的有效性</strong>。`
},
{ id:'kp_112', ch:5, sec:'5.7.1', title:'软件过程能力成熟度模型', tags:['重要'],
  body:`<strong>软件过程能力成熟度模型(CMM)</strong>是评估软件过程能力的框架。<ul><li><strong>CMM</strong>：美国卡内基梅隆大学提出，5个等级</li><li><strong>CMMI</strong>：CMM的升级集成版本</li><li><strong>CSMM</strong>：中国自主的软件过程能力成熟度模型</li></ul>CMMI有两种表示方式：<strong>阶段式</strong>（5个成熟度等级）和<strong>连续式</strong>（能力等级0-3）。`
},
{ id:'kp_113', ch:5, sec:'5.7.2', title:'软件成熟度等级', tags:['重要','高频'],
  body:`CMMI<strong>阶段式</strong>5个成熟度等级：<ol><li><strong>初始级(1)</strong>：过程无序，成功依赖个人努力</li><li><strong>已管理级(2)</strong>：建立了基本的项目管理过程</li><li><strong>已定义级(3)</strong>：组织级标准过程已建立并使用</li><li><strong>量化管理级(4)</strong>：使用统计和量化技术管理过程</li><li><strong>优化级(5)</strong>：关注过程改进和创新</li></ol>CMMI<strong>连续式</strong>能力等级：0(不完整)、1(已执行)、2(已管理)、3(已定义)。`
},

// ---- 第6章 数据工程 ----
{ id:'kp_114', ch:6, sec:'6.1.1', title:'数据采集', tags:['重要'],
  body:`<strong>数据采集</strong>是数据工程的第一步，从各种数据源获取原始数据。<ul><li><strong>内部数据</strong>：业务系统数据库、日志文件等</li><li><strong>外部数据</strong>：公开数据、爬虫数据、API接口数据</li><li><strong>物联网数据</strong>：传感器、设备采集数据</li></ul>常用工具：<strong>Flume（日志采集）、Sqoop（关系数据库采集）、Kafka（消息队列）、Logstash</strong>等。`
},
{ id:'kp_115', ch:6, sec:'6.1.2', title:'数据预处理', tags:['重要'],
  body:`<strong>数据预处理</strong>是对采集的原始数据进行清洗和标准化处理。<ul><li><strong>数据清洗</strong>：去除重复、填补缺失、纠正错误</li><li><strong>数据转换</strong>：格式转换、编码统一</li><li><strong>数据集成</strong>：多源数据整合</li><li><strong>数据归约</strong>：减少数据量但保持完整性</li></ul>ETL（Extract-Transform-Load）是数据预处理的核心过程。`
},
{ id:'kp_116', ch:6, sec:'6.1.3', title:'数据预处理方法', tags:['重要'],
  body:`<strong>数据预处理方法</strong>：<ul><li><strong>缺失值处理</strong>：删除、均值填充、回归填充</li><li><strong>异常值处理</strong>：3σ原则、箱线图检测</li><li><strong>数据标准化</strong>：Min-Max标准化、Z-score标准化</li><li><strong>数据离散化</strong>：等宽、等频、聚类</li><li><strong>数据变换</strong>：对数变换、平滑变换</li><li><strong>特征选择</strong>：过滤法、包装法、嵌入法</li></ul>`
},
{ id:'kp_117', ch:6, sec:'6.2.1', title:'数据存储', tags:['重要'],
  body:`<strong>数据存储</strong>技术根据数据类型选择不同方案：<ul><li><strong>结构化数据</strong>：关系数据库（MySQL、Oracle）</li><li><strong>半结构化数据</strong>：NoSQL（MongoDB、Redis）</li><li><strong>非结构化数据</strong>：对象存储（HDFS、S3）</li><li><strong>分布式存储</strong>：HDFS、Ceph</li></ul>存储类型对比：DAS、NAS、SAN。存储介质包括<strong>机械硬盘(HDD)、固态硬盘(SSD)、磁带</strong>等。`
},
{ id:'kp_118', ch:6, sec:'6.2.2', title:'数据归档', tags:['重要'],
  body:`<strong>数据归档</strong>是将不常访问的数据从主存储迁移到归档存储的过程。<ul><li><strong>目的</strong>：释放主存储空间、降低存储成本、满足合规要求</li><li><strong>归档策略</strong>：按时间、按访问频率</li><li><strong>归档介质</strong>：磁带、光盘、低成本硬盘</li><li><strong>归档管理</strong>：索引、检索、恢复</li></ul>归档数据应保持完整性和可读性。`
},
{ id:'kp_119', ch:6, sec:'6.2.3', title:'数据备份', tags:['重要','高频'],
  body:`<strong>数据备份</strong>是防止数据丢失的重要手段。备份策略：<ul><li><strong>完全备份</strong>：备份所有数据，恢复快但占用空间大</li><li><strong>增量备份</strong>：只备份上次备份后变化的数据</li><li><strong>差分备份</strong>：备份上次完全备份后变化的数据</li></ul>备份类型：<strong>热备份（在线备份）、冷备份（离线备份）</strong>。<br><strong>3-2-1原则</strong>：3份数据、2种介质、1份异地。`
},
{ id:'kp_120', ch:6, sec:'6.2.4', title:'容灾系统指标 RPO与RTO', tags:['重要','高频','计算'],
  body:`衡量容灾系统有两个主要指标：<ul><li><strong>RPO</strong>（Recovery Point Object，恢复点目标）：代表当灾难发生时<strong>允许丢失的数据量</strong></li><li><strong>RTO</strong>（Recovery Time Object，恢复时间目标）：代表<strong>系统恢复的时间</strong></li></ul>数据容灾的关键技术主要包括<strong>远程镜像技术和快照技术</strong>。<br><br><strong>注意区分</strong>：远程镜像技术是实现容灾的技术手段，异地容灾是部署模式，数据备份策略是保障手段，<strong>均非衡量指标</strong>。`
},
{ id:'kp_121', ch:6, sec:'6.3.1', title:'元数据', tags:['重要'],
  body:`<strong>元数据(Metadata)</strong>是描述数据的数据。<ul><li><strong>技术元数据</strong>：表结构、字段类型、索引等</li><li><strong>业务元数据</strong>：业务术语、指标定义等</li><li><strong>管理元数据</strong>：数据权限、数据流向等</li></ul>元数据管理是数据治理的基础，提供数据血缘追踪、数据字典等功能。`
},
{ id:'kp_122', ch:6, sec:'6.3.2', title:'数据标准化', tags:['重要'],
  body:`<strong>数据标准化</strong>是统一数据格式和口径的过程。<ul><li><strong>数据格式标准化</strong>：日期、编码等格式统一</li><li><strong>数据编码标准化</strong>：主数据编码、行业编码</li><li><strong>数据口径标准化</strong>：指标定义统一</li><li><strong>数据交换标准</strong>：如XML、JSON格式规范</li></ul>数据标准化是数据共享和互操作的基础。`
},
{ id:'kp_123', ch:6, sec:'6.3.3', title:'数据质量', tags:['重要'],
  body:`<strong>数据质量</strong>是衡量数据满足使用要求的程度。数据质量维度：<ul><li><strong>完整性</strong>：数据是否缺失</li><li><strong>准确性</strong>：数据是否正确</li><li><strong>一致性</strong>：数据是否矛盾</li><li><strong>及时性</strong>：数据是否最新</li><li><strong>唯一性</strong>：数据是否重复</li><li><strong>有效性</strong>：数据是否符合规则</li></ul>数据质量管理是一个<strong>持续循环</strong>的过程。`
},
{ id:'kp_124', ch:6, sec:'6.3.4', title:'数据模型', tags:['重要'],
  body:`<strong>数据模型</strong>是对现实世界数据特征的抽象。<ul><li><strong>概念模型</strong>：面向业务用户，如E-R图</li><li><strong>逻辑模型</strong>：面向设计人员，如关系模型、层次模型、网状模型</li><li><strong>物理模型</strong>：面向实现，描述表结构、索引等</li></ul>数据模型的三个层次：<strong>概念模型→逻辑模型→物理模型</strong>。`
},
{ id:'kp_125', ch:6, sec:'6.3.5', title:'数据建模', tags:['重要'],
  body:`<strong>数据建模</strong>是创建数据模型的过程。<ul><li><strong>需求分析</strong>：理解业务需求</li><li><strong>概念建模</strong>：识别实体和关系</li><li><strong>逻辑建模</strong>：设计表结构和关系</li><li><strong>物理建模</strong>：设计物理存储结构</li></ul>常用建模方法：<strong>三范式建模(3NF)、维度建模(星型/雪花型)</strong>。<br>OLTP用三范式，OLAP用维度建模。`
},
{ id:'kp_126', ch:6, sec:'6.4.1', title:'数据仓库', tags:['重要','高频'],
  body:`<strong>数据仓库(Data Warehouse)</strong>是面向主题的、集成的、相对稳定的、反映历史变化的数据集合，用于支持管理决策。<br><br>四个特性：<ul><li><strong>面向主题</strong>：按业务主题组织数据</li><li><strong>集成</strong>：整合多源数据</li><li><strong>相对稳定</strong>：数据一旦进入不再修改</li><li><strong>反映历史变化</strong>：包含历史数据</li></ul>数据仓库架构：数据源→ETL→ODS→DW→DM→前端工具。<br><img src="assets/image.png">`
},
{ id:'kp_127', ch:6, sec:'6.4.2', title:'主题库', tags:['重要'],
  body:`<strong>主题库</strong>是围绕特定业务主题组织的数据集合。<ul><li><strong>主题</strong>是较高层次上将企业信息系统中的数据综合、归类后的分析对象</li><li>如：客户主题、产品主题、财务主题</li><li>主题库的数据来源于<strong>数据仓库</strong></li><li>主题库面向特定分析需求</li></ul>主题库是数据仓库的组成部分，支持特定领域的数据分析。`
},
{ id:'kp_128', ch:6, sec:'6.4.3', title:'数据资产管理', tags:['重要'],
  body:`<strong>数据资产管理</strong>是对数据资产进行全生命周期管理的过程。<ul><li><strong>数据资产盘点</strong>：梳理数据资产清单</li><li><strong>数据资产编目</strong>：建立数据资产目录</li><li><strong>数据资产估值</strong>：评估数据资产价值</li><li><strong>数据资产运营</strong>：数据资产交易和变现</li><li><strong>数据资产治理</strong>：数据资产质量管理</li></ul>数据资产管理的目标是<strong>实现数据资产价值最大化</strong>。`
},
{ id:'kp_129', ch:6, sec:'6.4.4', title:'数据资源编目', tags:['重要'],
  body:`<strong>数据资源编目</strong>是对数据资源进行分类和编目管理。<ul><li><strong>元数据管理</strong>：描述数据资源</li><li><strong>分类分级</strong>：按类别和敏感程度分类</li><li><strong>编目体系</strong>：建立树状编目结构</li><li><strong>检索服务</strong>：支持关键词、分类检索</li></ul>数据资源编目是数据共享和开放的基础。`
},
{ id:'kp_130', ch:6, sec:'6.5.1', title:'数据集成', tags:['重要'],
  body:`<strong>数据集成</strong>是将多源异构数据整合为统一视图的过程。<ul><li><strong>ETL</strong>：抽取-转换-加载</li><li><strong>ELT</strong>：抽取-加载-转换（先加载后转换）</li><li><strong>数据联邦</strong>：虚拟集成，不移动数据</li><li><strong>数据复制</strong>：源数据复制到目标</li><li><strong>API集成</strong>：通过接口获取数据</li></ul>常用工具：<strong>Informatica、DataX、Sqoop、Kettle</strong>等。`
},
{ id:'kp_131', ch:6, sec:'6.5.2', title:'数据挖掘', tags:['重要','高频'],
  body:`<strong>数据挖掘</strong>是从大量数据中发现隐藏的、有价值的模式和知识的过程。<ul><li><strong>分类</strong>：决策树、朴素贝叶斯、SVM</li><li><strong>聚类</strong>：K-Means、DBSCAN</li><li><strong>关联规则</strong>：Apriori、FP-Growth</li><li><strong>回归</strong>：线性回归、逻辑回归</li><li><strong>时序分析</strong>：ARIMA</li></ul>数据挖掘流程：<strong>CRISP-DM</strong>（业务理解→数据理解→数据准备→建模→评估→部署）。`
},
{ id:'kp_132', ch:6, sec:'6.5.3', title:'数据服务', tags:['重要'],
  body:`<strong>数据服务</strong>是将数据能力以服务方式提供给应用系统。<ul><li><strong>数据API</strong>：RESTful接口提供数据访问</li><li><strong>数据订阅</strong>：消息队列方式推送数据</li><li><strong>数据共享</strong>：数据交换平台</li><li><strong>DaaS</strong>：数据即服务</li></ul>数据服务的目标是实现数据的<strong>一次接入、多次复用</strong>。`
},
{ id:'kp_133', ch:6, sec:'6.5.4', title:'数据可视化', tags:['重要'],
  body:`<strong>数据可视化</strong>是将数据转换为图形化表达的过程。<ul><li><strong>图表类型</strong>：柱状图、折线图、饼图、散点图、热力图、树图等</li><li><strong>可视化工具</strong>：ECharts、Tableau、PowerBI、Grafana</li><li><strong>大屏展示</strong>：数据大屏、指挥中心</li><li><strong>交互式分析</strong>：钻取、切片、旋转</li></ul>好的可视化应遵循<strong>简洁、准确、美观、有效</strong>原则。`
},
{ id:'kp_134', ch:6, sec:'6.6.1', title:'数据脱敏', tags:['重要'],
  body:`<strong>数据脱敏</strong>是对敏感数据进行变形处理，保护隐私信息。<ul><li><strong>静态脱敏</strong>：对存储数据进行脱敏，永久性</li><li><strong>动态脱敏</strong>：对访问时实时脱敏，按权限返回不同数据</li></ul>脱敏方法：<ul><li><strong>掩码</strong>：如手机号显示为138****8888</li><li><strong>替换</strong>：用虚拟值替换</li><li><strong>置乱</strong>：随机打乱</li><li><strong>截断</strong>：截取部分数据</li><li><strong>加密</strong>：可逆/不可逆加密</li></ul>`
},
{ id:'kp_135', ch:6, sec:'6.6.2', title:'数据分类', tags:['重要'],
  body:`<strong>数据分类</strong>是按数据的属性和用途进行分门别类。<ul><li><strong>按性质</strong>：公开数据、内部数据、敏感数据、涉密数据</li><li><strong>按业务</strong>：客户数据、财务数据、运营数据</li><li><strong>按结构</strong>：结构化、半结构化、非结构化</li></ul>数据分类是数据分级和差异化保护的基础。`
},
{ id:'kp_136', ch:6, sec:'6.6.3', title:'数据分级', tags:['重要'],
  body:`<strong>数据分级</strong>是按数据的重要程度和敏感程度确定保护级别。<ul><li><strong>公开级</strong>：可公开发布</li><li><strong>内部级</strong>：限组织内部使用</li><li><strong>敏感级</strong>：涉及个人隐私或商业秘密</li><li><strong>涉密级</strong>：涉及国家安全</li></ul>不同级别数据采取不同的安全保护措施，实现<strong>分类分级管理</strong>。`
},

// ---- 第7章 软硬件系统集成 ----
{ id:'kp_137', ch:7, sec:'7.1', title:'系统集成基础', tags:['重要'],
  body:`<strong>系统集成</strong>是将计算机软件、硬件、网络通信等技术和设备整合为满足用户需求的、一体化的系统过程。<ul><li><strong>目标</strong>：整体性能最优、总体拥有成本最低</li><li><strong>特点</strong>：跨学科、跨技术、跨平台</li><li><strong>原则</strong>：开放性、标准化、可扩展性、可靠性、安全性</li></ul>系统集成包括<strong>基础设施集成、软件集成、数据集成、应用集成</strong>等。`
},
{ id:'kp_138', ch:7, sec:'7.2.1', title:'弱电工程', tags:['重要'],
  body:`<strong>弱电工程</strong>是建筑智能化系统的基础，工作电压一般在36V以下。主要子系统：<ul><li><strong>综合布线系统</strong>：建筑物内通信线路</li><li><strong>安防系统</strong>：视频监控、门禁、报警</li><li><strong>楼宇自控系统</strong>：空调、照明、电梯控制</li><li><strong>公共广播系统</strong>：背景音乐、应急广播</li><li><strong>机房工程</strong>：UPS、精密空调、防静电</li></ul>`
},
{ id:'kp_139', ch:7, sec:'7.2.2', title:'网络集成', tags:['重要'],
  body:`<strong>网络集成</strong>是构建计算机网络系统的过程。<ul><li><strong>网络设计</strong>：需求分析→拓扑设计→设备选型</li><li><strong>层次化设计</strong>：核心层、汇聚层、接入层</li><li><strong>网络设备</strong>：路由器、交换机、防火墙、负载均衡器</li><li><strong>网络协议</strong>：TCP/IP、OSPF、BGP等</li></ul>网络集成需考虑<strong>可靠性、安全性、可扩展性、性能</strong>。`
},
{ id:'kp_140', ch:7, sec:'7.2.3', title:'数据中心集成', tags:['重要'],
  body:`<strong>数据中心集成</strong>是构建数据中心（机房）的工程。<ul><li><strong>机房设施</strong>：装修、供电、空调、消防、安防</li><li><strong>IT基础设施</strong>：服务器、存储、网络</li><li><strong>等级标准</strong>：GB 50174《数据中心设计规范》A/B/C三级</li><li><strong>TIA-942标准</strong>：Tier I~IV四个等级</li></ul>数据中心选址应考虑：地理位置、电力供应、通信条件、自然环境等因素。`
},
{ id:'kp_141', ch:7, sec:'7.3.1', title:'基础软件集成', tags:['重要'],
  body:`<strong>基础软件集成</strong>包括操作系统、数据库、中间件等基础软件的集成。<ul><li><strong>操作系统</strong>：Windows、Linux、国产操作系统</li><li><strong>数据库</strong>：Oracle、MySQL、国产数据库</li><li><strong>中间件</strong>：应用服务器、消息队列、缓存</li><li><strong>集成要点</strong>：兼容性、性能、可靠性、安全</li></ul>信创（信息技术应用创新）背景下，国产基础软件集成是重要趋势。`
},
{ id:'kp_142', ch:7, sec:'7.3.2', title:'应用软件集成', tags:['重要','高频'],
  body:`<strong>应用软件集成</strong>是实现不同应用系统间互操作和数据共享的过程。<ul><li><strong>数据集成</strong>：ETL、数据交换、数据总线</li><li><strong>应用集成</strong>：API接口、消息中间件</li><li><strong>界面集成</strong>：门户 Portal、单点登录(SSO)</li><li><strong>流程集成</strong>：工作流引擎、BPM</li></ul>集成模式：<strong>点对点、星型(ESB总线)、微服务</strong>等。`
},
{ id:'kp_143', ch:7, sec:'7.3.3', title:'其他软件集成', tags:['重要'],
  body:`<strong>其他软件集成</strong>主要包括：<ul><li><strong>安全软件集成</strong>：防火墙、入侵检测、杀毒、WAF等安全设备的集成管理</li><li><strong>运维管理集成</strong>：监控系统、日志系统、工单系统的集成</li><li><strong>文档管理集成</strong>：OA与文档管理系统的集成</li></ul>这些集成需要考虑<strong>兼容性、安全性、可管理性</strong>。`
},
{ id:'kp_144', ch:7, sec:'7.4', title:'业务应用集成', tags:['重要','案例'],
  body:`<strong>业务应用集成</strong>是将各类应用系统整合，支撑端到端业务流程。<ul><li><strong>业务流程整合</strong>：跨系统流程贯通</li><li><strong>数据贯通</strong>：主数据统一、数据一致性</li><li><strong>服务复用</strong>：公共能力服务化</li><li><strong>统一门户</strong>：一体化用户入口</li></ul>典型案例：<strong>电子政务一体化平台、企业ERP集成、智慧城市一体化</strong>等。业务应用集成是系统集成的最高层次。`
},

// ---- 第8章 信息安全工程 ----
{ id:'kp_145', ch:8, sec:'8.1.1', title:'信息安全CIA三属性', tags:['重要','高频'],
  body:`信息安全属性和目标是：<strong>Confidentiality, Integrity, and Availability</strong>，即<strong>保密性、完整性和可用性</strong>，这是信息安全的三个基本属性和目标。<ul><li><strong>保密性</strong>（Confidentiality）：确保信息不被未授权访问</li><li><strong>完整性</strong>（Integrity）：保证信息不被篡改</li><li><strong>可用性</strong>（Availability）：保证信息在需要时可访问</li></ul>`
},
{ id:'kp_146', ch:8, sec:'8.1.1', title:'信息安全保障要求', tags:['重要'],
  body:`<strong>信息安全保障要求</strong>遵循<strong>纵深防御</strong>策略，从多层面保障安全：<ul><li><strong>人员安全</strong>：安全意识培训、背景调查</li><li><strong>物理安全</strong>：机房门禁、环境监控</li><li><strong>网络安全</strong>：防火墙、IDS/IPS、VPN</li><li><strong>主机安全</strong>：系统加固、漏洞修复</li><li><strong>应用安全</strong>：身份认证、访问控制</li><li><strong>数据安全</strong>：加密、备份、脱敏</li></ul>安全保障还包括<strong>检测、响应、恢复</strong>三个环节（PDR模型扩展）。`
},
{ id:'kp_147', ch:8, sec:'8.1.2', title:'信息安全管理内容', tags:['重要'],
  body:`<strong>信息安全管理内容</strong>包括：<ul><li><strong>安全策略</strong>：制定信息安全方针和策略</li><li><strong>安全组织</strong>：建立安全管理组织架构</li><li><strong>安全人员</strong>：人员安全管理和培训</li><li><strong>安全制度</strong>：制定安全管理制度和流程</li><li><strong>安全运营</strong>：日常安全运营和事件处置</li><li><strong>安全审计</strong>：安全合规审计</li></ul>`
},
{ id:'kp_148', ch:8, sec:'8.1.2', title:'应用系统保密技术四原则', tags:['重要'],
  body:`应用系统常用的保密技术：<ol><li><strong>最小授权原则</strong></li><li><strong>防暴露</strong></li><li><strong>信息加密</strong></li><li><strong>物理保密</strong></li></ol>`
},
{ id:'kp_149', ch:8, sec:'8.1.2', title:'安全和保密层次四层', tags:['重要'],
  body:`应用系统运行中涉及的安全和保密层次包括：<ol><li><strong>系统级安全</strong>：系统整体安全策略和防护，如操作系统安全</li><li><strong>资源访问安全</strong>：对系统资源（文件、数据库等）的访问控制</li><li><strong>功能性安全</strong>：系统功能的安全运行，防止功能被滥用或破坏</li><li><strong>数据域安全</strong>：数据本身的安全保护，如保密性、完整性</li></ol>`
},
{ id:'kp_150', ch:8, sec:'8.1.3', title:'信息安全管理体系', tags:['重要','法规'],
  body:`<strong>信息安全管理体系(ISMS)</strong>是基于风险评估的信息安全管理方法。<ul><li><strong>ISO 27001</strong>：信息安全管理体系国际标准</li><li><strong>PDCA循环</strong>：Plan-Do-Check-Act 持续改进</li><li><strong>风险评估</strong>：识别资产、威胁、脆弱性、风险</li><li><strong>风险处置</strong>：规避、转移、降低、接受</li></ul>ISMS的核心是<strong>风险管理</strong>，通过管理和技术结合保障安全。`
},
{ id:'kp_151', ch:8, sec:'8.1.4', title:'等级保护五级安全保护能力', tags:['重要','高频','法规'],
  body:`《信息安全技术网络安全等级保护基本要求》(GB/T 22239-2019)规定五级保护能力：<ul><li><strong>第一级</strong>：防护免受个人、拥有很少资源的威胁源攻击。损害后<strong>能恢复部分功能</strong>。</li><li><strong>第二级</strong>：防护免受外部小型组织、少量资源威胁源攻击。能发现安全漏洞和处置事件。损害后<strong>能在一段时间内恢复部分功能</strong>。</li><li><strong>第三级</strong>：在统一安全策略下防护免受外部有组织团体、较丰富资源威胁源攻击。能及时发现、监测攻击行为。损害后<strong>能较快恢复绝大部分功能</strong>。</li><li><strong>第四级</strong>：在统一安全策略下防护免受国家级别、敌对组织、丰富资源威胁源攻击。损害后<strong>能迅速恢复所有功能</strong>。</li><li><strong>第五级</strong>：标准中未给出具体内容</li></ul>`
},
{ id:'kp_152', ch:8, sec:'8.2.1', title:'安全机制', tags:['重要'],
  body:`<strong>安全机制</strong>是实现安全服务的具体技术手段。<ul><li><strong>加密机制</strong>：对称加密(AES)、非对称加密(RSA)、哈希(MD5/SHA)</li><li><strong>数字签名机制</strong>：身份认证、防抵赖</li><li><strong>访问控制机制</strong>：自主访问控制(DAC)、强制访问控制(MAC)、基于角色的访问控制(RBAC)</li><li><strong>数据完整性机制</strong>：校验和、MAC</li><li><strong>认证交换机制</strong>：Kerberos、证书</li><li><strong>流量填充机制</strong>：防止流量分析</li><li><strong>路由控制机制</strong>：选择安全路径</li><li><strong>公证机制</strong>：第三方公证</li></ul>`
},
{ id:'kp_153', ch:8, sec:'8.2.2', title:'安全服务', tags:['重要'],
  body:`<strong>安全服务</strong>是安全机制提供的功能，ISO 7498-2定义了五大安全服务：<ol><li><strong>认证(鉴别)服务</strong>：实体认证、数据源认证</li><li><strong>访问控制服务</strong>：防止未授权访问</li><li><strong>数据保密性服务</strong>：防止信息泄露</li><li><strong>数据完整性服务</strong>：防止数据篡改</li><li><strong>抗抵赖服务</strong>：防止发送方或接收方否认</li></ol>安全服务通过安全机制实现，是安全架构的核心组成部分。`
},
{ id:'kp_154', ch:8, sec:'8.3.1', title:'安全工程基础', tags:['重要'],
  body:`<strong>信息安全系统工程</strong>是系统工程方法在信息安全领域的应用。<ul><li><strong>系统安全工程</strong>：将安全需求融入系统生命周期</li><li><strong>安全工程过程</strong>：发现安全需求→定义系统安全→设计安全架构→实施安全控制→评估安全有效性</li><li><strong>基本原则</strong>：安全应贯穿系统全生命周期，安全是系统工程的一部分</li></ul>安全工程强调<strong>安全左移</strong>（在设计和开发阶段考虑安全）。`
},
{ id:'kp_155', ch:8, sec:'8.3.2', title:'ISSE-CMM基础', tags:['重要'],
  body:`<strong>ISSE-CMM</strong>（Information System Security Engineering Capability Maturity Model）是信息系统安全工程能力成熟度模型。<ul><li>由<strong>ISO</strong>发布，用于评估安全工程能力</li><li>关注<strong>安全工程过程</strong>的能力评估</li><li>将安全工程过程分为若干<strong>过程域</strong></li><li>定义了<strong>5个能力等级</strong>（0-4级）</li></ul>ISSE-CMM强调<strong>过程改进</strong>和安全工程能力提升。`
},
{ id:'kp_156', ch:8, sec:'8.3.3', title:'ISSE过程', tags:['重要'],
  body:`<strong>ISSE过程</strong>是信息系统安全工程过程，包括以下阶段：<ol><li><strong>发现安全需求</strong>：识别安全目标、需求和约束</li><li><strong>定义系统安全</strong>：制定安全策略和方案</li><li><strong>设计安全架构</strong>：设计安全体系结构</li><li><strong>实施安全控制</strong>：部署安全措施和机制</li><li><strong>评估安全有效性</strong>：评估安全措施是否有效</li></ol>ISSE过程强调安全与系统工程<strong>同步进行</strong>。`
},
{ id:'kp_157', ch:8, sec:'8.3.4', title:'ISSE-CMM体系结构', tags:['重要'],
  body:`<strong>ISSE-CMM体系结构</strong>由<strong>域维度</strong>和<strong>能力维度</strong>构成：<ul><li><strong>域维度（横向）</strong>：定义安全工程的<strong>过程域</strong>，如安全风险评估、安全需求分析、安全方案设计等</li><li><strong>能力维度（纵向）</strong>：定义每个过程域的<strong>能力等级</strong>：<ol><li>0级：未执行级</li><li>1级：非正式执行级</li><li>2级：计划跟踪级</li><li>3级：充分定义级</li><li>4级：量化控制级</li></ol></li></ul>两个维度构成二维模型，评估组织在各个过程域的能力水平。`
},

// ==================== 第9章 项目管理概论 ====================
{ id:'kp_201', ch:9, sec:'9.1', title:'PMBOK的发展历程', tags:['重要'],
  body:`<strong>PMBOK</strong>（Project Management Body of Knowledge，项目管理知识体系指南）由美国项目管理协会（PMI）发布。<ul><li>1996年正式发布第1版</li><li>PMBOK第6版（2017）引入<strong>敏捷项目管理</strong>内容，包含49个过程、5大过程组、10大知识领域</li><li>PMBOK第7版（2021）实现重大变革：从基于过程的方法转向<strong>基于原则和基于绩效域</strong>的方法，不再以过程组为核心组织方式</li></ul>PMBOK的发展体现了项目管理从规范化、标准化向价值导向、适应性方向演进的趋势。`
},

{ id:'kp_202', ch:9, sec:'9.2', title:'项目基本要素总览', tags:['重要'],
  body:`项目的<strong>基本要素</strong>决定了项目特征及实施方式。基本要素包括：<ol><li><strong>项目基础</strong>：临时性、独特性、渐进明细</li><li><strong>项目管理</strong>：将知识、技能、工具与技术应用于项目活动</li><li><strong>项目成功的标准</strong>：现代项目关注价值和相关方满意度</li><li><strong>项目/项目集/项目组合/运营管理关系</strong></li><li><strong>项目运行环境</strong>：事业环境因素EEF与组织过程资产OPA</li><li><strong>组织系统</strong>：组织结构类型与PMO</li><li><strong>项目管理和产品管理</strong>：临时性与持续性</li></ol>事业环境因素分为内部和外部两类，共同影响项目开展。<img src="assets/image 1.png">`
},

{ id:'kp_203', ch:9, sec:'9.2.1', title:'项目基础 - 临时性与独特性', tags:['重要','高频'],
  body:`<strong>项目</strong>是为创造独特的产品、服务或成果而进行的<strong>临时性</strong>工作。<ul><li><strong>临时性</strong>：项目有明确的开始和结束时间。结束时指项目的产品/服务按计划完成，或项目被终止，或需求消失。临时性不意味着持续时间短。</li><li><strong>独特性</strong>：项目所创造的产品、服务或成果是独特的。即使使用相同资源，不同项目也存在差异。</li><li><strong>渐进明细</strong>：项目的目标和范围随着项目和有关环境信息的不断积累而逐步细化。项目逐步完善的特点与项目范围和临时性密切相关。</li></ul><strong>项目与运营的区别</strong>：运营是<strong>持续不断、重复进行</strong>的活动（如生产流水线），项目是临时性、独特性的工作。`
},

{ id:'kp_204', ch:9, sec:'9.2.2', title:'项目管理定义与五大过程组', tags:['重要','高频'],
  body:`<strong>项目管理</strong>是将知识、技能、工具与技术应用于项目活动，以满足项目的要求。<br><br>项目管理通过<strong>5大过程组、10大知识领域、49个过程</strong>来实现：<ul><li><strong>5大过程组</strong>：启动过程组、规划过程组、执行过程组、监控过程组、收尾过程组</li><li><strong>10大知识领域</strong>：整合管理、范围管理、进度管理、成本管理、质量管理、资源管理、沟通管理、风险管理、采购管理、相关方（干系人）管理</li></ul>项目管理需在相互竞争的<strong>范围、进度、成本、质量、资源、风险</strong>等制约因素之间寻求平衡。`
},

{ id:'kp_205', ch:9, sec:'9.2.3', title:'项目成功的标准', tags:['重要'],
  body:`<strong>项目成功的标准</strong>因项目和相关方不同而异，需要项目开始时<strong>明确并达成共识</strong>。<ul><li><strong>传统标准</strong>：时间（进度）、成本（预算）、范围、质量——即项目"铁三角"</li><li><strong>现代/扩展标准</strong>：相关方满意度、项目目标实现、商业价值创造、社会效益、可持续性</li></ul>项目成功标准不是一成不变的，应在项目生命周期中持续评估。项目成功不仅取决于项目经理，还取决于组织、相关方、产品所有者等。`
},

{ id:'kp_206', ch:9, sec:'9.2.4', title:'项目/项目集/项目组合和运营管理之间的关系', tags:['重要','高频'],
  body:`<ul><li><strong>项目集（Program）</strong>：一组相互关联且被协调管理的<strong>项目、子项目集和项目集活动</strong>，目的是获得单个项目单独管理无法获得的收益。侧重对项目间依赖关系的管理。</li><li><strong>项目组合（Portfolio）</strong>：为实现战略目标而集中管理的<strong>项目、项目集、子项目组合和运营</strong>的集合。侧重战略对齐和资源优化。</li><li><strong>运营管理</strong>：负责<strong>持续、重复</strong>的生产活动，关注业务连续性。不属于项目组合的"组件"范畴，但项目可改善运营。</li></ul><strong>层级关系</strong>：战略 → 项目组合 → 项目集 → 项目。项目集和项目都为实现战略目标服务。`
},

{ id:'kp_207', ch:9, sec:'9.2.5', title:'项目运行环境 - EEF与OPA', tags:['重要'],
  body:`项目运行环境由<strong>事业环境因素</strong>（EEF）和<strong>组织过程资产</strong>（OPA）构成。<br><br><strong>事业环境因素（EEF）</strong>：项目团队无法控制、将影响/限制/指挥项目的影响因素。<ul><li><strong>内部的</strong>：组织文化/结构/治理、设施/资源、信息系统软件、员工能力等</li><li><strong>外部的</strong>：市场环境、政府/行业标准、法律/法规要求、政治环境、文化和社会影响等</li></ul><strong>组织过程资产（OPA）</strong>：组织使用的政策、过程、模板、知识库等。<ul><li>过程、政策、流程和程序</li><li>组织知识库（经验教训、历史信息等）</li></ul>`
},

{ id:'kp_208', ch:9, sec:'9.2.6', title:'组织系统 - 组织结构与PMO类型', tags:['重要','高频'],
  body:`<strong>组织结构类型</strong>（按项目经理权力递增）：<ol><li><strong>职能型</strong>：项目经理权力很弱，按职能划分部门</li><li><strong>弱矩阵型</strong>：项目经理权力弱</li><li><strong>平衡矩阵型</strong>：项目经理权力中等</li><li><strong>强矩阵型</strong>：项目经理权力强</li><li><strong>项目型</strong>：项目经理权力很强</li><li><strong>复合型</strong>：多种结构混合</li></ol><strong>PMO（项目管理办公室）三种类型</strong>按管控力度划分：<ul><li><strong>支持型</strong>：提供模板、培训、咨询，管控力度<strong>最弱</strong></li><li><strong>控制型</strong>：制定统一流程标准，要求项目遵循，具备一定管控权</li><li><strong>指令型</strong>：直接管理项目，项目经理由PMO任命并向其汇报，管控力度<strong>最强</strong></li></ul><img src="assets/image 2.png">`
},

{ id:'kp_209', ch:9, sec:'9.2.7', title:'项目管理和产品管理', tags:['重要'],
  body:`<ul><li><strong>项目管理</strong>：临时性、独特性，关注"按时按预算交付既定范围的成果"</li><li><strong>产品管理</strong>：关注产品从构思到退出市场的<strong>整个生命周期</strong>，具有持续性、迭代性，关注产品价值最大化和市场竞争力</li></ul>一个产品生命周期内可以包含多个项目，产品管理可能需要开展或包含项目管理。两者均需适应变化、关注价值创造、涉及相关方管理，但<strong>时间属性不同</strong>（临时 vs 持续）。`
},

{ id:'kp_210', ch:9, sec:'9.3', title:'项目经理的角色与能力', tags:['重要'],
  body:`<strong>项目经理</strong>由执行组织委派，负责领导团队实现项目目标。<br><br><strong>影响力范围</strong>：<ul><li>项目内：领导项目团队</li><li>组织内/跨组织：与职能经理互动，影响组织</li><li>行业和跨学科：在专业领域发展，参与跨学科合作</li></ul><strong>项目经理的能力（PMI人才三角）</strong>：<ol><li><strong>技术项目管理技能</strong>：有效运用项目管理知识实现成果</li><li><strong>领导力</strong>：指导、激励和带领团队</li><li><strong>战略和商业管理技能</strong>：帮助项目实现商业价值</li></ol>`
},

{ id:'kp_211', ch:9, sec:'9.4.1', title:'项目生命周期定义与特征', tags:['重要','高频'],
  body:`<strong>项目生命周期</strong>：项目从启动到收尾所经历的一系列阶段。<br><br><strong>特征</strong>：<ul><li>成本和人力投入在项目开始时<strong>较低</strong>，随工作进展而<strong>逐渐增加</strong>，在项目接近收尾时<strong>迅速回落</strong></li><li><strong>风险和不确定性</strong>在项目开始时<strong>最大</strong>，随项目进展而<strong>逐渐减少</strong></li><li><strong>相关方影响项目最终产品特性的能力</strong>在项目开始时<strong>最强</strong>，随项目进展而<strong>逐渐减弱</strong></li><li><strong>变更和纠错代价</strong>随项目进展而<strong>逐渐增加</strong></li></ul>项目阶段通常按顺序排列，阶段的结束以<strong>阶段评审/阶段关口</strong>为标志。`
},

{ id:'kp_212', ch:9, sec:'9.4.2', title:'项目生命周期类型', tags:['重要','高频'],
  body:`<ol><li><strong>预测型（瀑布型）</strong>：范围、进度和成本在项目早期阶段确定，按顺序执行。适用于需求明确、变更少的项目。</li><li><strong>迭代型</strong>：通过一系列重复循环活动来增加产品功能，按时间逐步完善。关注正确性。</li><li><strong>增量型</strong>：渐进地增加产品功能，按预定时间段逐步交付。关注速度。</li><li><strong>适应型（敏捷型）</strong>：<strong>迭代+增量</strong>，短周期(冲刺)迭代，每次迭代交付可用的产品增量。响应频繁变更。</li><li><strong>混合型</strong>：预测型与适应型的结合，不同部分采用不同生命周期。</li></ul><strong>辨析</strong>：迭代型关注功能完善，增量型关注分批交付，适应型兼具两者且强调短迭代和快速反馈。`
},

{ id:'kp_213', ch:9, sec:'9.5.1', title:'项目建议与立项申请', tags:['重要'],
  body:`<strong>项目建议书</strong>是项目建设单位向上级主管部门提交的申请，是对项目的设想和概要分析。内容一般包括：<ol><li>项目名称、必要性和依据</li><li>项目概况（建设方案、规模、地点等）</li><li>投资估算和资金筹措</li><li>项目进度建议</li><li>项目效益初步分析</li></ol><strong>立项申请</strong>经主管部门批准后，项目进入可行性研究阶段。`
},

{ id:'kp_214', ch:9, sec:'9.5.2', title:'可行性研究三阶段与七项内容', tags:['重要','高频'],
  body:`<strong>可行性研究三阶段</strong>（由浅入深）：<ol><li><strong>机会可行性研究</strong>：对投资项目或投资方提出建议，寻找最佳投资机会，目的是<strong>激发投资者兴趣</strong></li><li><strong>初步可行性研究</strong>：在机会研究基础上进一步判断项目是否有进行详细可行性研究的必要性。<strong>某些情况下可省去</strong></li><li><strong>详细可行性研究</strong>：深入分析项目各方面，<strong>费时、费力、需要资金支持</strong>，是最终决策依据</li></ol><strong>可行性研究七项内容</strong>：<ol><li>投资必要性</li><li>技术可行性</li><li>财务可行性</li><li>组织可行性</li><li>经济可行性</li><li>社会可行性</li><li>风险因素及对策</li></ol><strong>注意</strong>：项目真实性评价一般在前期立项环节核实，<strong>不属于</strong>可行性研究内容。`
},

{ id:'kp_215', ch:9, sec:'9.5.3', title:'项目评估与决策', tags:['重要'],
  body:`<strong>项目评估</strong>是在项目可行性研究基础上，由<strong>第三方（如咨询机构、银行）</strong>进行的审查评价。<br><br><strong>评估目的</strong>：审查可行性研究报告的<strong>可靠性、真实性和客观性</strong>，为项目决策提供依据。<br><br><strong>评估内容</strong>：项目概况、市场、规模、选址、资源、技术、财务、经济、社会等各方面的审核。<br><br><strong>项目决策</strong>：根据评估结果，决定项目是否立项。评估和决策为项目是否启动提供最终依据。`
},

{ id:'kp_216', ch:9, sec:'9.6', title:'项目管理五大过程组', tags:['重要','高频'],
  body:`5大过程组及其关系：<ol><li><strong>启动过程组</strong>：定义并授权项目或阶段，识别干系人，制定项目章程</li><li><strong>规划过程组</strong>：明确项目范围、优化目标、制订计划</li><li><strong>执行过程组</strong>：整合人员和其他资源，按计划执行工作</li><li><strong>监控过程组</strong>：定期测量和监控进展，识别偏差，采取纠正措施</li><li><strong>收尾过程组</strong>：正式接受产品/服务，有序结束项目</li></ol><strong>特征</strong>：过程组并非离散、孤立的事件，而是相互重叠的活动。监控过程组贯穿项目始终。规划过程组与执行过程组重叠最多。`
},

{ id:'kp_217', ch:9, sec:'9.7', title:'项目管理12项原则（PMBOK第7版）', tags:['重要'],
  body:`PMBOK第7版提出的12项项目管理原则：<ol><li><strong>勤勉、尊重和关爱的管家</strong>：以节约、社会和环境责任方式行事</li><li>营造协作的团队环境</li><li>与干系人有效互动</li><li>聚焦价值</li><li>识别、评估和响应系统交互</li><li>展现领导力行为</li><li>裁剪（Tailoring）</li><li>将质量融入过程和可交付成果</li><li>驾驭复杂性</li><li>优化风险应对</li><li>拥抱适应性和韧性</li><li>为实现预期的未来状态而驱动变革</li></ol>`
},

{ id:'kp_218', ch:9, sec:'9.8', title:'10大知识领域与49个过程', tags:['重要','高频'],
  body:`<strong>10大知识领域</strong>：<ol><li><strong>整合管理</strong>：制定章程、制订计划、指导执行、管理知识、实施整体变更控制、结束项目</li><li><strong>范围管理</strong>：规划范围、收集需求、定义范围、创建WBS、确认范围、控制范围</li><li><strong>进度管理</strong>：规划进度、定义活动、排列顺序、估算持续时间、制订进度计划、控制进度</li><li><strong>成本管理</strong>：规划成本、估算成本、制定预算、控制成本</li><li><strong>质量管理</strong>：规划质量、管理质量、控制质量</li><li><strong>资源管理</strong>：规划资源、估算活动资源、获取资源、建设团队、管理团队、控制资源</li><li><strong>沟通管理</strong>：规划沟通、管理沟通、监督沟通</li><li><strong>风险管理</strong>：规划风险、识别风险、实施定性风险分析、实施定量风险分析、规划风险应对、实施风险应对、监督风险</li><li><strong>采购管理</strong>：规划采购、实施采购、控制采购</li><li><strong>相关方管理</strong>：识别相关方、规划相关方参与、管理相关方参与、监督相关方参与</li></ol>合计49个过程。<img src="assets/image 4.png">`
},

{ id:'kp_219', ch:9, sec:'9.9', title:'价值交付系统组件', tags:['重要','高频'],
  body:`<strong>价值交付系统</strong>是组织用于实现战略目标、创造价值的体系。<br><br><strong>价值交付组件</strong>（可单独或共同使用以创造价值）包括：<ol><li><strong>项目组合</strong></li><li><strong>项目集</strong></li><li><strong>项目</strong></li><li><strong>产品</strong></li><li><strong>运营</strong></li></ol>这些组件共同组成符合组织战略的价值交付系统。<br><br><strong>注意</strong>：战略是指导价值创造的<strong>理念层面</strong>内容，市场环境是<strong>外部因素</strong>，<strong>均不是</strong>价值交付组件本身。<img src="assets/image 3.png">`
},

// ==================== 第10章 启动过程组 ====================
{ id:'kp_220', ch:10, sec:'10.1.1', title:'制定项目章程的主要输入', tags:['重要','高频'],
  body:`<strong>制定项目章程</strong>的输入主要包括：<ol><li><strong>项目工作说明书（SOW）</strong>：对项目要交付的产品/服务/成果的叙述性描述。包括业务论证、产品范围描述、战略计划</li><li><strong>商业论证</strong>：解释为何立项、决策依据</li><li><strong>协议</strong>：合同、SLA、意向书、协议书等</li><li><strong>事业环境因素</strong>（EEF）</li><li><strong>组织过程资产</strong>（OPA）</li><li><strong>战略计划</strong>（通常隐含在商业论证或高层需求中）</li></ol><strong>SOW的三个要素</strong>：业务论证、产品范围描述、战略计划。`
},

{ id:'kp_221', ch:10, sec:'10.1.2', title:'制定项目章程的主要输出', tags:['重要'],
  body:`<strong>项目章程</strong>是制定项目章程过程的核心输出，由<strong>项目发起人</strong>签发。<br><br>项目章程的作用：<ul><li><strong>正式确认项目存在</strong>，授权项目经理使用组织资源</li><li>明确项目目的、目标、高层级需求</li><li>任命项目经理并赋予其权力</li><li>明确发起人或关键干系人</li><li>记录高层级预算、里程碑、风险</li></ul>项目章程<strong>不能被项目经理单方面修改</strong>，由发起人批准。项目章程一旦批准，项目正式成立。`
},

{ id:'kp_222', ch:10, sec:'10.2.1', title:'识别干系人的主要输入', tags:['重要'],
  body:`<strong>识别干系人</strong>过程主要输入：<ol><li>项目章程（提供发起人、关键干系人信息）</li><li>商业文件（商业论证、效益管理计划）</li><li>项目管理计划（已发布的版本，如沟通、相关方参与计划）</li><li>项目文件（变更日志、问题日志、需求文档）</li><li>协议</li><li>事业环境因素</li><li>组织过程资产</li></ol>`
},

{ id:'kp_223', ch:10, sec:'10.2.2', title:'识别干系人的主要工具与技术', tags:['重要','高频'],
  body:`<strong>识别干系人</strong>的工具与技术：<ol><li><strong>专家判断</strong></li><li><strong>数据收集</strong>：问卷和调查、标杆对照</li><li><strong>数据分析</strong>：<ul><li><strong>文件分析</strong></li><li><strong>干系人分析</strong>：识别干系人并分析其利益、期望、影响。常用分类模型见kp_224</li></ul></li><li><strong>数据表现</strong>：干系人映射（如<strong>权力/利益方格</strong>、突出/影响、影响/作用）</li><li><strong>会议</strong>：引导式研讨会</li></ol><strong>权力/利益方格</strong>四类：高权力高利益(重点管理)、高权力低利益(令其满意)、低权力高利益(随时告知)、低权力低利益(监督)。`
},

{ id:'kp_224', ch:10, sec:'10.2.3', title:'识别干系人输出 - 沟通对象分类', tags:['重要'],
  body:`<strong>干系人登记册</strong>是识别干系人的主要输出，记录已识别干系人的信息。<br><br>按沟通需求，干系人可分为：<ul><li><strong>主要沟通对象</strong>：直接参与项目的人员，有直接沟通需求</li><li><strong>次要沟通对象</strong>：不是直接项目参与者，但可能对项目实施具有潜在影响力</li><li><strong>关键影响人</strong>：对项目有重大影响的人员，通常是直接参与者</li><li><strong>主要干系人</strong>：直接参与项目或对项目有直接利益关系的人</li></ul>`
},

{ id:'kp_225', ch:10, sec:'10.3.1', title:'项目启动会议', tags:['重要'],
  body:`<strong>项目启动会议</strong>是项目正式启动的标志，由项目经理召集。<br><br>会议目的：<ul><li>正式宣布项目成立</li><li>传达项目章程内容、项目目标</li><li>明确各成员角色和职责</li><li>建立沟通机制和工作方式</li><li>统一认识，增强团队凝聚力</li></ul>启动会议的召开标志着<strong>项目从启动阶段进入规划/执行阶段</strong>。`
},

{ id:'kp_226', ch:10, sec:'10.3.2', title:'启动过程组 - 关注价值和目标', tags:['重要'],
  body:`启动过程组的核心是<strong>关注价值和目标</strong>。<ul><li><strong>价值导向</strong>：项目立项应以创造业务价值为核心，通过商业论证明确预期收益</li><li><strong>明确目标</strong>：通过项目章程明确项目目标、关键里程碑</li><li><strong>识别所有相关方</strong>：确保关键干系人早期介入，避免后期变更代价高昂</li></ul>启动过程组要避免"为立项而立项"，应保证项目与组织战略对齐，价值贡献清晰可衡量。`
},

// ==================== 第11章 规划过程组 ====================
{ id:'kp_227', ch:11, sec:'11.1.1', title:'制订项目管理计划的主要输入', tags:['重要'],
  body:`<strong>制订项目管理计划</strong>的输入：<ol><li>项目章程</li><li>其他过程的输出（如各子计划的初稿）</li><li>事业环境因素</li><li>组织过程资产</li></ol>项目管理计划是渐进明细的，会随项目进展不断更新。`
},

{ id:'kp_228', ch:11, sec:'11.1.2', title:'项目管理计划主要输出与六大用途', tags:['重要','高频'],
  body:`<strong>项目管理计划</strong>是综合的、经批准的、用于管理项目执行的文档。<br><br><strong>六大用途</strong>：<ol><li>指导项目执行、监控和收尾</li><li>为项目绩效考核和项目控制提供基准</li><li>记录制订项目计划所依据的<strong>假设条件</strong></li><li>记录制订项目计划过程中的有关<strong>方案选择</strong></li><li>促进项目干系人之间的沟通</li><li>规定管理层审查项目的时间、内容和方式</li></ol>项目管理计划包括各<strong>子管理计划</strong>和<strong>基准</strong>（范围、进度、成本基准）。`
},

{ id:'kp_229', ch:11, sec:'11.2.1', title:'规划范围管理的主要输入', tags:['重要'],
  body:`<strong>规划范围管理</strong>输入：<ol><li>项目章程</li><li>项目管理计划（含质量管理计划、项目生命周期）</li><li>事业环境因素</li><li>组织过程资产</li></ol>`
},

{ id:'kp_230', ch:11, sec:'11.2.2', title:'规划范围管理的主要输出', tags:['重要'],
  body:`输出：<ol><li><strong>范围管理计划</strong>：描述如何定义、制定和核实项目范围、如何创建WBS、如何维护和批准WBS</li><li><strong>需求管理计划</strong>：描述如何分析、记录和管理需求</li></ol>`
},

{ id:'kp_231', ch:11, sec:'11.3.1', title:'收集需求的主要输入', tags:['重要'],
  body:`<strong>收集需求</strong>输入：项目章程、项目管理计划（范围/需求/相关方参与/质量管理计划）、项目文件（相关方登记册、假设日志、经验教训登记册）、商业文件（商业论证、效益管理计划）、协议、事业环境因素、组织过程资产。`
},

{ id:'kp_232', ch:11, sec:'11.3.2', title:'收集需求的主要工具与技术', tags:['重要','高频'],
  body:`<strong>收集需求</strong>的工具与技术（重点掌握）：<ol><li><strong>访谈</strong>：直接交谈</li><li><strong>焦点小组</strong>：召集相关方和主题专家</li><li><strong>引导式研讨会</strong>：跨职能、快速定义需求</li><li><strong>头脑风暴</strong>：集思广益</li><li><strong>问卷调查</strong>：受众多、需快速完成</li><li><strong>标杆对照</strong>：与可比组织对照</li><li><strong>原型法</strong>：渐进明细，先做原型再获取反馈（适用于需求不明确）</li><li><strong>系统交互图、亲和图</strong>：数据表现工具</li></ol>`
},

{ id:'kp_233', ch:11, sec:'11.3.3', title:'收集需求的主要输出', tags:['重要'],
  body:`<strong>收集需求</strong>输出：<ol><li><strong>需求文件</strong>：包含业务需求、相关方需求、解决方案需求（功能/非功能需求）、过渡需求、项目需求、质量需求</li><li><strong>需求跟踪矩阵</strong>：把产品需求从来源连接到满足需求的可交付成果，便于跟踪、管理需求变更</li></ol>`
},

{ id:'kp_234', ch:11, sec:'11.4.1', title:'定义范围的主要输入', tags:['重要'],
  body:`<strong>定义范围</strong>输入：项目章程、项目管理计划（范围管理计划）、项目文件（假设日志、需求文件、风险登记册）、事业环境因素、组织过程资产。`
},

{ id:'kp_235', ch:11, sec:'11.4.2', title:'定义范围的主要输出', tags:['重要'],
  body:`<strong>定义范围</strong>输出：<ol><li><strong>项目范围说明书</strong>：详细描述项目的范围，包括<strong>产品范围描述、可交付成果、验收标准、项目的除外责任</strong>（明确什么不属于项目范围，防止范围蔓延）</li><li>项目文件更新</li></ol>项目范围说明书使相关方对项目范围达成共识。`
},

{ id:'kp_236', ch:11, sec:'11.5.1', title:'创建WBS的主要输入', tags:['重要'],
  body:`<strong>创建WBS</strong>（Work Breakdown Structure，工作分解结构）输入：项目管理计划（范围管理计划）、项目文件（项目范围说明书、需求文件）、事业环境因素、组织过程资产。`
},

{ id:'kp_237', ch:11, sec:'11.5.2', title:'创建WBS主要工具与技术 - 分解五步骤', tags:['重要','高频'],
  body:`<strong>分解</strong>是把项目范围说明书定义的可交付成果划分为更小、更易管理的组件。<br><br>WBS分解活动五步骤：<ol><li>识别和分析可交付成果及相关工作</li><li>确定WBS的结构和编排方法</li><li>自上而下逐层细化分解</li><li>为WBS组成部分制定和分配标识编码</li><li>核实可交付成果分解的程度是否恰当</li></ol><strong>分解原则</strong>：<ul><li>最底层是<strong>工作包</strong>（Work Package），是估算成本和监控的基础</li><li>每层分解不超过<strong>6-8层</strong></li><li>工作包应能可靠估算成本和工期</li><li><strong>100%原则</strong>：WBS应涵盖项目全部工作，各子项之和等于100%</li></ul>`
},

{ id:'kp_238', ch:11, sec:'11.5.3', title:'创建WBS的主要输出', tags:['重要'],
  body:`<strong>创建WBS</strong>输出：<ol><li><strong>范围基准</strong>：包括项目范围说明书、WBS、WBS词典。经批准的范围基准是范围变更的基准</li><li>项目文件更新（假设日志、需求文件）</li></ol><strong>WBS词典</strong>：对每个WBS组件的详细描述，包括工作内容、进度、成本、质量要求、负责人等。<br><br><strong>滚动式规划</strong>：近期工作详细规划，远期工作粗略规划，随项目进展迭代细化。`
},

{ id:'kp_239', ch:11, sec:'11.6.1', title:'规划进度管理的主要输入', tags:['重要'],
  body:`<strong>规划进度管理</strong>输入：项目章程、项目管理计划（范围管理、开发方法）、事业环境因素、组织过程资产。`
},

{ id:'kp_240', ch:11, sec:'11.6.2', title:'规划进度管理的主要输出', tags:['重要'],
  body:`<strong>规划进度管理</strong>输出：<strong>进度管理计划</strong>，描述将如何规划、编制、管理和执行项目进度。包括进度模型、准确度、计量单位、绩效测量规则、控制临界值、报告格式、过程描述等。`
},

{ id:'kp_241', ch:11, sec:'11.7.1', title:'定义活动的主要输入', tags:['重要'],
  body:`<strong>定义活动</strong>输入：项目管理计划（进度管理计划、范围基准）、事业环境因素、组织过程资产。`
},

{ id:'kp_242', ch:11, sec:'11.7.2', title:'定义活动的主要工具与技术', tags:['重要'],
  body:`<strong>定义活动</strong>的工具与技术：<ol><li><strong>专家判断</strong></li><li><strong>分解</strong>：把WBS工作包分解为更小的、可估算和管理的<strong>活动</strong></li><li><strong>滚动式规划</strong></li><li><strong>会议</strong></li></ol><strong>活动</strong>是进度工作的最小单位，是估算、排序、进度计划的基础。<strong>活动与工作包的关系</strong>：活动是工作包的进一步分解。`
},

{ id:'kp_243', ch:11, sec:'11.7.3', title:'定义活动的主要输出', tags:['重要'],
  body:`<strong>定义活动</strong>输出：<ol><li><strong>活动清单</strong>：包含项目所需的全部进度活动</li><li><strong>活动属性</strong>：扩展活动清单中各活动的描述</li><li><strong>里程碑清单</strong>：里程碑是持续时间为零的重要事件或时间点</li><li>项目文件更新（假设日志、经验教训登记册）</li></ol>`
},

{ id:'kp_244', ch:11, sec:'11.8.1', title:'排列活动顺序的主要输入', tags:['重要'],
  body:`<strong>排列活动顺序</strong>输入：项目管理计划（范围基准、进度管理计划）、项目文件（活动清单、活动属性、里程碑清单、假设日志）、事业环境因素、组织过程资产。`
},

{ id:'kp_245', ch:11, sec:'11.8.2', title:'排列活动顺序主要工具与技术 - 依赖关系', tags:['重要','高频'],
  body:`<strong>依赖关系四类</strong>：<ol><li><strong>强制性依赖</strong>（硬逻辑）：法律/合同要求或内在性质决定。如先打地基再建墙</li><li><strong>选择性依赖</strong>（软逻辑/首选逻辑）：基于最佳实践或经验。快速跟进基于此类</li><li><strong>外部依赖</strong>：项目活动与非项目活动之间的关系。如政府审批</li><li><strong>内部依赖</strong>：项目活动之间的关系，项目团队可控制</li></ol><strong>工具</strong>：紧前关系绘图法（PDM/前导图法）、确定和整合依赖关系、提前量和滞后量、PMIS。<br><br><strong>PDM四种逻辑关系</strong>：完成-开始（FS，最常用）、完成-完成（FF）、开始-开始（SS）、开始-完成（SF，最少用）。`
},

{ id:'kp_246', ch:11, sec:'11.8.3', title:'排列活动顺序的主要输出', tags:['重要'],
  body:`<strong>排列活动顺序</strong>输出：<ol><li><strong>项目进度网络图</strong>：展示活动间逻辑关系的图</li><li>项目文件更新（活动清单、活动属性、假设日志、里程碑清单）</li></ol>`
},

{ id:'kp_247', ch:11, sec:'11.9.1', title:'估算活动持续时间的主要输入', tags:['重要'],
  body:`<strong>估算活动持续时间</strong>输入：项目管理计划（进度管理计划）、项目文件（活动清单、活动属性、活动资源需求、资源日历、假设日志、风险登记册、经验教训登记册）、事业环境因素、组织过程资产。`
},

{ id:'kp_248', ch:11, sec:'11.9.2', title:'估算活动持续时间主要工具 - PERT三点估算公式', tags:['重要','计算','高频'],
  body:`<strong>三点估算法（PERT技术）</strong>用于活动持续时间不确定时：<div class="formula">期望工期 = (最悲观 + 最可能×4 + 最乐观) ÷ 6</div><div class="formula">标准差 σ = (最悲观 − 最乐观) ÷ 6</div>正态分布概率：<ul><li><strong>±1σ</strong>：68.2%</li><li><strong>±2σ</strong>：95.4%</li><li><strong>±3σ</strong>：99.7%</li></ul><strong>示例</strong>：最悲观7天，最可能5天，最乐观3天<br>期望工期 = (7+5×4+3)÷6 = 5天<br>标准差 = (7−3)÷6 = 0.67天<br><br>其他工具：类比估算、参数估算、自下而上估算、储备分析、决策分析。<img src="assets/IMG_3571.jpg">`
},

{ id:'kp_249', ch:11, sec:'11.9.3', title:'估算活动持续时间的主要输出', tags:['重要'],
  body:`<strong>估算活动持续时间</strong>输出：<ol><li><strong>持续时间估算</strong>：对完成活动所需时段的定量评估，应包括变动范围（如"2周±1天"）</li><li><strong>估算依据</strong>：记录假设条件、限制因素、估算方法</li><li>项目文件更新（活动属性、假设日志、经验教训登记册）</li></ol>`
},

{ id:'kp_250', ch:11, sec:'11.10.1', title:'制订进度计划的主要输入', tags:['重要'],
  body:`<strong>制订进度计划</strong>输入：项目管理计划（进度管理计划）、项目文件（活动清单、活动属性、里程碑清单、持续时间估算、资源需求、风险登记册等）、协议、事业环境因素、组织过程资产。`
},
