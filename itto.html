<title>49过程ITTO知识大网 · 系统集成项目管理工程师</title>
<style>
:root{--bg:#0f1419;--bg-card:#1a1f29;--bg-hover:#222834;--border:#2a3140;--text:#e0e0e0;--text-dim:#8b95a7;--primary:#4a9eff;--accent:#f0a020}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.header h1{font-size:18px;font-weight:700}
.header nav a{color:var(--primary);text-decoration:none;font-size:13px;padding:4px 12px;border-radius:4px;border:1px solid var(--border)}
.header nav a:hover{background:var(--bg-hover)}
.pg-legend{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.pg-legend span{font-size:12px;display:flex;align-items:center;gap:4px}
.pg-legend .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.matrix-wrap{padding:12px;overflow-x:auto}
.matrix{display:grid;min-width:900px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cell{min-height:60px;border:1px solid var(--border);padding:4px;background:var(--bg-card);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px}
.cell:hover{background:var(--bg-hover);transform:scale(1.02);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cell.empty{background:var(--bg);cursor:default;opacity:.25}
.cell .pid{font-size:10px;color:var(--text-dim)}
.cell .pname{font-weight:600;line-height:1.2;margin-top:2px}
.cell-header{background:var(--bg-hover);font-weight:700;color:var(--primary);padding:10px 6px;font-size:13px;position:sticky;top:0;z-index:3;text-align:center}
.cell-header.row{text-align:left;min-width:110px;padding:8px 12px;color:var(--text)}
.cell-header.row .pg-desc{font-weight:400;font-size:11px;color:var(--text-dim);margin-top:2px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-mask.show{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;padding:24px;position:relative}
.modal-close{position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:var(--text-dim);background:none;border:none}
.modal-close:hover{color:var(--text)}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .proc-id{color:var(--primary);font-size:13px;margin-bottom:12px}
.itto-section{margin-top:16px}
.itto-section h3{font-size:14px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.itto-section h3::before{content:"";width:4px;height:16px;border-radius:2px}
.itto-section:nth-of-type(1) h3::before{background:#4a9eff}
.itto-section:nth-of-type(2) h3::before{background:#ffa726}
.itto-section:nth-of-type(3) h3::before{background:#66bb6a}
.itto-list{list-style:none;padding:0}
.itto-list li{padding:8px 12px;margin:4px 0;background:var(--bg);border-radius:6px;font-size:13px;border-left:3px solid var(--border)}
.itto-list.tools li{border-left-color:#ffa726;cursor:pointer;transition:all .15s}
.itto-list.tools li:hover{background:var(--bg-hover);border-left-color:var(--accent)}
.tool-detail{margin-top:6px;padding:10px 12px;background:var(--bg-hover);border-radius:6px;font-size:12px;color:var(--text-dim);line-height:1.7;display:none}
.tool-detail.show{display:block}
.search-bar{padding:12px 24px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-size:14px}
.search-bar input:focus{outline:none;border-color:var(--primary)}
.pg-filter{display:flex;gap:4px;flex-wrap:wrap}
.pg-filter button{background:var(--bg);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.pg-filter button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
@media(max-width:768px){
  .header{flex-wrap:wrap;gap:8px}
  .pg-legend{margin-left:0;width:100%;justify-content:flex-start}
  .cell{font-size:10px;min-height:48px;padding:2px}
  .cell .pname{font-size:10px}
}
</style>
</head>

      const p=PROCS[pi];
      const show=curPG==='all'||p.pg===curPG;
      const match=!sTerm||p.n.includes(sTerm)||p.id.includes(sTerm)||p.i.some(x=>x.includes(sTerm))||p.t.some(x=>x.includes(sTerm))||p.o.some(x=>x.includes(sTerm));
      if(!show||!match){h+='<div class="cell empty"></div>';return}
      h+='<div class="cell" style="border-left:3px solid '+PCOLOR[pg.k]+'" data-idx="'+pi+'">';
      h+='<span class="pid">'+p.id+'</span><span class="pname">'+p.n+'</span></div>';
    });
  });
  h+='</div>';
  w.innerHTML=h;
  w.querySelectorAll('.cell[data-idx]').forEach(el=>{
    el.addEventListener('click',()=>openModal(PROCS[+el.dataset.idx]));
  });
}
function openModal(p){
  document.getElementById('mTitle').textContent=p.n;
  document.getElementById('mId').textContent=p.id+' · '+PG.find(x=>x.k===p.pg).n+' · '+KA.find(x=>x.k===p.ka).n;
  document.getElementById('mInputs').innerHTML=p.i.map(x=>'<li>'+x+'</li>').join('');
  document.getElementById('mTools').innerHTML=p.t.map((x,idx)=>{
    const d=TOOL_DETAILS[x];
    return '<li data-tidx="'+idx+'">'+x+(d?' 💡':'')+(d?'<div class="tool-detail">'+d+'</div>':'')+'</li>';
  }).join('');
  document.getElementById('mOutputs').innerHTML=p.o.map(x=>'<li>'+x+'</li>').join('');
  document.querySelectorAll('#mTools li').forEach(li=>{
    li.addEventListener('click',e=>{e.stopPropagation();li.querySelector('.tool-detail')?.classList.toggle('show')});
  });
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){document.getElementById('modalMask').classList.remove('show')}
document.getElementById('modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('searchInput').addEventListener('input',e=>{sTerm=e.target.value.trim();buildMatrix()});
document.getElementById('pgFilter').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#pgFilter button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');curPG=e.target.dataset.pg;buildMatrix();
});
buildMatrix();
</script>
