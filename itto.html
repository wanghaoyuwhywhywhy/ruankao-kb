<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ITTO知识大网 · 系统集成项目管理工程师</title>
<style>
:root{--bg:#0f1419;--bg-card:#1a1f29;--bg-hover:#222834;--border:#2a3140;--text:#e0e0e0;--text-dim:#8b95a7;--primary:#4a9eff;--accent:#f0a020}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.header h1{font-size:18px;font-weight:700}
.header nav a{color:var(--primary);text-decoration:none;font-size:13px;padding:4px 12px;border-radius:4px;border:1px solid var(--border)}
.header nav a:hover{background:var(--bg-hover)}
.pg-legend{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.pg-legend span{font-size:12px;display:flex;align-items:center;gap:4px}
.pg-legend .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.matrix-wrap{padding:12px;overflow-x:auto}
.matrix{display:grid;min-width:900px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cell{min-height:60px;border:1px solid var(--border);padding:4px;background:var(--bg-card);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px}
.cell:hover{background:var(--bg-hover);transform:scale(1.02);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cell.empty{background:var(--bg);cursor:default;opacity:.25}
.cell.multi{padding:2px;display:flex;flex-direction:column;gap:2px}
.sub-cell{padding:8px 6px;border-radius:4px;cursor:pointer;transition:all .15s}
.sub-cell:hover{background:var(--bg-hover);transform:scale(1.02)}
.sub-cell .pid{font-size:10px}
.sub-cell .pname{font-size:11px}
.cell .pid{font-size:10px;color:var(--text-dim)}
.cell .pname{font-weight:600;line-height:1.2;margin-top:2px}
.cell-header{background:var(--bg-hover);font-weight:700;color:var(--primary);padding:10px 6px;font-size:13px;position:sticky;top:0;z-index:3;text-align:center}
.cell-header.row{text-align:center;min-width:110px;padding:10px 12px;color:var(--text);display:flex;align-items:center;justify-content:center}
.cell-header.row .pg-desc{font-weight:400;font-size:11px;color:var(--text-dim);margin-top:2px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-mask.show{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;padding:24px;position:relative}
.modal-close{position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:var(--text-dim);background:none;border:none}
.modal-close:hover{color:var(--text)}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .proc-id{color:var(--primary);font-size:13px;margin-bottom:12px}
.itto-section{margin-top:16px}
.itto-section h3{font-size:14px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.itto-section h3::before{content:"";width:4px;height:16px;border-radius:2px}
.itto-section:nth-of-type(1) h3::before{background:#4a9eff}
.itto-section:nth-of-type(2) h3::before{background:#ffa726}
.itto-section:nth-of-type(3) h3::before{background:#66bb6a}
.itto-list{list-style:none;padding:0}
.itto-list li{padding:8px 12px;margin:4px 0;background:var(--bg);border-radius:6px;font-size:13px;border-left:3px solid var(--border)}
.itto-list.tools li{border-left-color:#ffa726;transition:all .15s}
.itto-list.tools li:hover{background:var(--bg-hover);border-left-color:var(--accent)}
.tool-item{display:flex;align-items:center;gap:8px}
.tool-arrow{display:inline-block;width:16px;text-align:center;color:var(--text-dim);font-size:11px;transition:transform .15s;flex-shrink:0}
.tool-arrow.open{transform:rotate(90deg)}
.tool-name{flex:1}
.tool-badge{font-size:10px;color:var(--accent);flex-shrink:0}
.tool-detail{margin-top:8px;padding:10px 12px;background:var(--bg-hover);border-radius:6px;font-size:12px;color:var(--text-dim);line-height:1.7;display:none}
.tool-detail.show{display:block}
.itto-list.tools li.no-detail{cursor:default}
.itto-list.tools li.no-detail:hover{background:var(--bg)}
.itto-list.tools li.has-detail{cursor:pointer}
.search-bar{padding:12px 24px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-size:14px}
.search-bar input:focus{outline:none;border-color:var(--primary)}
.pg-filter{display:flex;gap:4px;flex-wrap:wrap}
.pg-filter button{background:var(--bg);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.pg-filter button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
@media(max-width:768px){
  .header{flex-wrap:wrap;gap:8px}
  .pg-legend{margin-left:0;width:100%;justify-content:flex-start}
  .cell{font-size:10px;min-height:48px;padding:2px}
  .cell .pname{font-size:10px}
}
</style>
</head>

const TOOL_DETAILS={"专家判断":"专家判断:基于某应用领域、知识学科、行业、项目管理等的专业知识做出判断。可通过专家小组、个人访谈、Delphi法等获取。几乎每个过程都使用。","数据分析":"数据分析:对数据进行处理和分析以得出结论。包括:备选方案分析、成本效益分析、挣值分析、根本原因分析、趋势分析、偏差分析、储备分析等多种子技术。","数据收集":"数据收集:收集所需信息的技术。包括:头脑风暴、访谈、问卷调查、核对表、检查表、统计抽样等。","数据表现":"数据表现:用图形化方式展示数据。包括:直方图、帕累托图、控制图、散点图、矩阵图、思维导图、亲和图、树形图、优先级矩阵等。","决策":"决策:从多个方案中选择最优方案。包括:投票(多数/相对多数/一致同意)、独裁决策、多标准决策分析、优先级排序等。","会议":"会议:通过面对面或虚拟会议进行讨论和决策。包括:信息交流会、头脑风暴会、评审会、启动会等。注意控制会议规模和时长。","分解":"分解:将项目可交付成果和工作分解为更小、更易于管理的组件。WBS分解到工作包级别。分解原则:100%原则、唯一性、可管理性。","滚动式规划":"滚动式规划:对近期要完成的工作进行详细规划,对远期工作进行粗略规划,随项目推进逐步细化。适用于需求不明确或变化频繁的项目。","紧前关系绘图法":"紧前关系绘图法(PDM/前导图法):用方框(节点)表示活动,箭线表示逻辑关系。4种关系:FS(完成-开始)、SS(开始-开始)、FF(完成-完成)、SF(开始-完成)。最常用的是FS。","确定和整合依赖关系":"确定和整合依赖关系:识别活动之间的依赖关系。3种依赖:强制性依赖(硬逻辑)、选择性依赖(软逻辑/首选逻辑)、外部依赖(项目外部)。内部分解活动间的关系由项目团队决定。","提前量和滞后量":"提前量(Lead):紧后活动可以提前开始的时间量,如FS-2天。滞后量(Lag):紧后活动需要等待的时间量,如FS+3天。用于调整活动之间的时序关系。","类比估算":"类比估算:以过去类似项目的实际值为基础,估算当前项目的参数。优点:快速、成本低;缺点:精度低。适用于项目早期信息不足时。属于专家判断的一种。","参数估算":"参数估算:利用历史数据与其他变量的统计关系来估算。如:每平米造价×面积、每人每天编码行数×人天。精度取决于参数模型的成熟度和数据可靠性。","三点估算":"三点估算(PERT):考虑估算中的不确定性,使用3种估算值:最乐观(O)、最悲观(P)、最可能(M)。期望工期=(O+4M+P)/6,标准差=(P-O)/6。起源于美国海军北极星导弹计划。","自下而上估算":"自下而上估算:从工作包级别开始估算,逐级向上汇总得到整体估算。精度高但耗时。适用于有详细WBS的情况。","进度网络分析":"进度网络分析:通过多种技术分析项目进度。包括:关键路径法、关键链法、资源平衡、假设情景分析、进度压缩等。是制订进度计划的核心技术。","关键路径法":"关键路径法(CPM):通过计算活动的最早/最晚开始和完成时间,确定项目关键路径。关键路径是项目中最长的活动序列,决定项目最短工期。关键路径上的活动总浮动时间为0。","资源优化":"资源优化:根据资源供需情况调整进度。包括:资源平衡(在资源约束下调整活动,可能延长关键路径)、资源平滑(在不改变关键路径的前提下调整活动,浮动时间内调整)。","进度压缩":"进度压缩:在不缩减项目范围的前提下缩短工期。两种方法:赶工(增加资源投入,以最小成本增量换取最大工期缩短,可能增加成本)、快速跟进(将原本串行的活动改为并行执行,可能增加风险和返工)。","计划评审技术":"计划评审技术(PERT):与关键路径法类似,但使用概率分布估算工期。三点估算(乐观/悲观/最可能)计算期望工期和标准差,用于评估项目按期完成的概率。","敏捷发布规划":"敏捷发布规划:基于敏捷方法论进行发布计划。通常以迭代(sprint)为单位,每个迭代2-4周交付可用增量。通过燃尽图跟踪进度。","迭代燃尽图":"迭代燃尽图:展示迭代内剩余工作量随时间的变化曲线。纵轴为剩余工作量(故事点/小时),横轴为迭代天数。用于可视化迭代进度,识别偏差。","成本汇总":"成本汇总:将各工作包的成本估算按WBS层级逐级向上汇总,得到项目总成本估算。是制定预算的核心技术。","资金限制平衡":"资金限制平衡:根据资金限制调整进度计划,确保项目支出不超过资金供应。可能导致关键路径延长。类似于资源平衡,但针对资金而非人力。","融资":"融资:获取项目所需资金的方式。包括:内部融资(自有资金)、外部融资(贷款/债券/股权)。大型项目常采用BOT/PPP等模式。","历史信息审核":"历史信息审核:审核过去类似项目的实际成本数据,用于验证当前估算的合理性。属于类比估算的深化,强调对历史数据的系统性审查。","挣值分析":"挣值分析(EVM):综合测量项目绩效。三个核心值:PV(计划价值-预算)、EV(挣值-已完成工作的预算)、AC(实际成本)。衍生指标:SV=EV-PV(进度偏差)、CV=EV-AC(成本偏差)、SPI=EV/PV(进度绩效指数)、CPI=EV/AC(成本绩效指数)。预测:EAC=BAC/CPI、ETC=EAC-AC、VAC=BAC-EAC。","储备分析":"储备分析:分析应急储备和管理储备的使用情况。应急储备(应对已识别风险,包含在成本基准内)、管理储备(应对未知未知风险,不包含在成本基准内但在项目预算内)。随项目推进定期评估储备充足性。","偏差分析":"偏差分析:比较实际绩效与计划基线,识别偏差并分析原因。常用指标:SV/CV/SPI/CPI。是控制范围、进度、成本的通用技术。","趋势分析":"趋势分析:根据过去的绩效预测未来趋势。常用方法:回归分析、移动平均、S曲线。用于判断项目绩效是在改善还是恶化。","根本原因分析":"根本原因分析(RCA):透过表面现象找到问题的根本原因。常用工具:5Why分析法、鱼骨图(因果图)、树状图。目标是消除根本原因而非仅仅处理症状。","产品分析":"产品分析:将项目可交付成果的文字描述转化为可量化的产品需求。包括:产品分解、系统工程、价值工程、价值分析、功能分析。用于定义范围过程。","原型法":"原型法:在开发实际产品前先构建一个工作模型(原型),供用户试用和反馈,通过迭代逐步明确需求。适用于需求不明确的场景。可抛弃式vs演进式原型。","审计":"审计:对项目活动进行结构化审查,验证是否符合组织和项目的政策、流程和标准。包括:质量审计(识别最佳实践)、风险审计(评估风险管理过程有效性)、采购审计(总结采购经验教训)。","检查":"检查:通过检验、审查、评审等方式核实可交付成果是否符合要求和验收标准。包括:检查、评审、巡检、测试。是控制质量和确认范围的关键技术。","测试与评估":"测试与评估:对可交付成果进行测试以评估其质量。包括:单元测试、集成测试、系统测试、验收测试、Alpha测试、Beta测试。测试覆盖率是关键指标。","测试与检查的规划":"测试与检查的规划:规划如何进行测试和检查,明确测试目标、测试范围、测试方法、通过标准。包括:测试计划、测试用例设计、检查清单编制。","面向X的设计":"面向X的设计(DFX):在设计阶段考虑产品全生命周期各方面(X)。包括:面向制造的设计(DFM)、面向装配的设计(DFA)、面向可靠性的设计(DFR)、面向成本的设计(DFC)等。","问题解决":"问题解决:系统化地解决问题的过程。步骤:定义问题→分析原因→生成方案→选择方案→实施→验证。包括根本原因分析、决策矩阵等子技术。","质量改进方法":"质量改进方法:持续改进质量的方法体系。包括:PDCA循环(戴明环)、六西格玛(DMAIC:定义-测量-分析-改进-控制)、全面质量管理(TQM)、Kaizen(持续改善)。","组织理论":"组织理论:研究组织结构、组织行为和组织文化的理论。包括:职能型、矩阵型、项目型组织结构的特点;马斯洛需求层次、赫茨伯格双因素、麦克利兰成就动机等激励理论。","组织工具":"组织工具:用于描述项目角色和职责的工具。包括:层级结构图(OBS)、责任分配矩阵(RACI矩阵)、文本格式的角色描述。确保每个工作包有明确责任人。","集中办公":"集中办公(作战室):将项目团队成员安排在同一物理地点工作,以增强沟通和团队凝聚力。包括:团队作战室、看板、公告板等设施。是建设团队的有效手段。","虚拟团队":"虚拟团队:成员不在同一地点,通过电子通信工具协作的团队。优点:扩大人才选择范围、降低成本;挑战:沟通成本高、文化差异、孤独感。需要更完善的沟通计划。","培训":"培训:提升团队成员技能和能力的活动。包括:课堂培训、在线学习、导师制、岗位轮换、工作坊。是建设团队的重要手段,直接影响团队绩效。","认可与奖励":"认可与奖励:对团队成员的良好表现给予正式或非正式认可。包括:物质奖励(奖金/礼品)、精神奖励(表彰/晋升)。应满足马斯洛需求层次,及时、具体、公平。","基本规则":"基本规则(团队章程):明确团队成员的行为准则。包括:沟通规则、决策规则、冲突处理规则、会议规则。由团队共同制定并遵守,减少误解和冲突。","个人和团队评估":"个人和团队评估:评估团队成员和团队整体的能力、态度、绩效。包括:态度调查、绩效评估、360度反馈、团队效能评估。用于识别培训需求和改进方向。","预分派":"预分派:在项目开始前就确定某些特定团队成员。原因:竞标时承诺、特定专业技能要求、项目章程指定。需要提前沟通确认。","人际关系与团队技能":"人际关系与团队技能:项目经理必备的软技能。包括:领导力、团队建设、激励、沟通、谈判、影响、冲突管理、情商、教练技术、政治意识。是项目经理能力三角的重要部分。","知识管理":"知识管理:确保项目团队和相关方能够及时获取所需信息和知识。包括:知识分享会、经验教训登记册、知识库、社区实践、导师制。核心是将隐性知识转化为显性知识。","信息管理":"信息管理:确保信息在正确的时间以正确的格式传递给正确的人。包括:信息分发系统、项目管理信息系统(PMIS)、文档管理系统、沟通记录。与知识管理互补。","沟通需求分析":"沟通需求分析:确定项目干系人的信息需求。分析:谁需要信息、需要什么信息、何时需要、以何种方式传递。通过干系人分析和组织结构图确定。输出是沟通管理计划的基础。","沟通技术":"沟通技术:用于传递信息的技术手段。包括:面对面会议、电话、邮件、即时通讯、视频会议、协作平台、社交媒体。选择依据:信息紧急性、可用性、成本、环境因素。","沟通模型":"沟通模型:描述沟通过程的框架。基本模型:发送者→编码→信息→媒介→解码→接收者→反馈。注意噪声干扰。互动沟通模型增加了确认和反馈环节。","沟通方法":"沟通方法:信息传递的方式。3类:交互式沟通(双向实时,如会议)、推式沟通(发送给特定接收方,如邮件)、拉式沟通(接收方主动获取,如知识库)。选择依据:信息性质、受众规模、紧急程度。","沟通技能":"沟通技能:有效沟通所需的能力。包括:写作(书面沟通)、演讲(口头沟通)、倾听(积极倾听)、非语言沟通(肢体语言)、演示技巧、谈判技巧。","提示清单":"提示清单(Checklist):用于识别风险的结构化清单。基于历史项目经验和行业知识编制。优点:快速、系统化;缺点:可能遗漏清单外的风险。常用于识别风险过程的初始识别。","SWOT分析":"SWOT分析:从优势(S)、劣势(W)、机会(O)、威胁(T)四个维度分析项目。用于识别风险:优势和机会是积极风险,劣势和威胁是消极风险。通过交叉分析制定应对策略。","风险分类":"风险分类:将识别出的风险按类别分组。分类维度:风险来源(技术/管理/外部)、影响对象(范围/进度/成本/质量)、优先级。常用工具:风险分解结构(RBS)。","不确定性表现与分析":"不确定性表现与分析:量化风险对项目目标的影响。包括:敏感性分析(龙卷风图)、概率分析(蒙特卡洛模拟)、决策树分析(EMV)。用于实施定量风险分析。","威胁应对策略":"威胁应对策略:针对消极风险(威胁)的5种策略:规避(消除威胁)、转移(将影响转移给第三方,如保险)、减轻(降低概率或影响)、接受(不主动应对,分主动和被动)、上报(超出项目范围的风险上报)。","机会应对策略":"机会应对策略:针对积极风险(机会)的5种策略:开拓(确保机会实现)、分享(将机会分配给第三方)、提高(增加概率或影响)、接受(不主动追求)、上报(超出项目范围的机会上报)。","应急应对策略":"应急应对策略:为特定已识别风险制定的备用应对方案。当触发条件发生时启动。包括:应急计划(Plan A失效后启动)、弹回计划(应急计划也失效时的最终方案)。","应急计划与弹回计划":"应急计划:为已识别风险预先制定的应对措施,当风险发生时执行。弹回计划:当应急计划无效时使用的备用方案。两者配合使用,确保风险有多层应对。","触发条件识别":"触发条件识别:确定何时启动应急应对计划的预警信号。如:供应商交付延迟超过7天、关键资源流失、进度偏差超过10%。需要在风险登记册中明确定义并持续监控。","技术绩效测量":"技术绩效测量:比较技术成果的实际达成情况与计划要求。如:系统响应时间、吞吐量、错误率。用于监督风险过程,识别技术风险是否正在发生。","整体风险应对策略":"整体风险应对策略:针对项目整体风险(而非单个风险)的应对。包括:规避(取消项目)、转移(外包整个项目)、减轻(降低整体不确定性)、接受。关注项目整体风险敞口。","供方选择分析":"供方选择分析:评估和选择潜在供应商的方法。包括:加权打分法(最常用,按权重打分)、筛选系统(多轮淘汰)、独立估算(与标底比较)。综合考虑价格、质量、能力、风险等因素。","广告":"广告:通过公开渠道发布采购信息,吸引潜在供应商。包括:招标公告、邀请招标、竞争性谈判。适用于扩大供应商选择范围,确保充分竞争。","投标人会议":"投标人会议(标前会):在投标前与所有潜在供应商召开的会议,解答疑问、澄清需求。确保所有供应商获得相同信息,保证公平竞争。所有问答应书面记录并分发给所有投标人。","索赔管理":"索赔管理:处理合同执行过程中的索赔事项。索赔类型:工期索赔、费用索赔。处理原则:以合同为依据、实事求是、及时处理。争议解决顺序:协商→调解→仲裁→诉讼。","支付系统":"支付系统:按合同约定向供应商支付款项的系统。包括:进度付款、里程碑付款、最终付款。需确保支付与已验收的可交付成果挂钩,保留支付凭证。","项目管理信息系统":"项目管理信息系统(PMIS):用于收集、整合和传播项目管理过程输出的工具集合。包括:进度计划软件、成本管理软件、文档管理系统、协作平台。是项目管理的基础设施。","变更控制工具":"变更控制工具:管理和控制变更的工具和流程。包括:变更管理系统、配置管理系统、变更控制委员会(CCB)、变更日志。确保变更经过评估、批准和跟踪。","绩效审查":"绩效审查:对照基准测量、对比和分析项目绩效。包括:状态审查会、进度评审、成本评审。常用工具:挣值分析、趋势分析、偏差分析。目的是发现问题并采取纠正措施。"};
const PCOLOR={"init": "#ff6b6b", "plan": "#4a9eff", "exec": "#66bb6a", "mc": "#ffa726", "close": "#ab47bc"};
let curPG="all",sTerm="";

function buildMatrix(){
  const w=document.getElementById('matrixWrap');
  let h='<div class="matrix" style="grid-template-columns:140px repeat('+PG.length+',1fr)">';
  h+='<div class="cell-header row"></div>';
  PG.forEach(pg=>{h+='<div class="cell-header" style="color:'+PCOLOR[pg.k]+'">'+pg.n+'</div>'});
  KA.forEach(ka=>{
    h+='<div class="cell-header row"><div>'+ka.n+'</div></div>';
    PG.forEach(pg=>{
      const matches=PROCS.filter(x=>x.pg===pg.k&&x.ka===ka.k);
      if(matches.length===0){h+='<div class="cell empty"></div>';return}
      const shown=matches.filter(p=>{
        const show=curPG==='all'||p.pg===curPG;
        const match=!sTerm||p.n.includes(sTerm)||p.id.includes(sTerm)||p.i.some(x=>x.includes(sTerm))||p.t.some(x=>x.includes(sTerm))||p.o.some(x=>x.includes(sTerm));
        return show&&match;
      });
      if(shown.length===0){h+='<div class="cell empty"></div>';return}
      if(shown.length===1){
        const p=shown[0];const pi=PROCS.indexOf(p);
        h+='<div class="cell" style="border-left:3px solid '+PCOLOR[pg.k]+'" data-idx="'+pi+'"><span class="pid">'+p.id+'</span><span class="pname">'+p.n+'</span></div>';
      }else{
        h+='<div class="cell multi" style="border-left:3px solid '+PCOLOR[pg.k]+'">';
        shown.forEach(p=>{const pi=PROCS.indexOf(p);h+='<div class="sub-cell" data-idx="'+pi+'"><span class="pid">'+p.id+'</span><span class="pname">'+p.n+'</span></div>'});
        h+='</div>';
      }
    });
  });
  h+='</div>';
  w.innerHTML=h;
  w.querySelectorAll('[data-idx]').forEach(el=>{
    el.addEventListener('click',()=>openModal(PROCS[+el.dataset.idx]));
  });
}
function openModal(p){
  document.getElementById('mTitle').textContent=p.n;
  document.getElementById('mId').textContent=p.id+' · '+PG.find(x=>x.k===p.pg).n+' · '+KA.find(x=>x.k===p.ka).n;
  document.getElementById('mInputs').innerHTML=p.i.map(x=>'<li>'+x+'</li>').join('');
  document.getElementById('mTools').innerHTML=p.t.map((x,idx)=>{
    const d=TOOL_DETAILS[x];
    if(d){
      return '<li class="has-detail" onclick="event.stopPropagation();var dt=this.querySelector(\'.tool-detail\');var ar=this.querySelector(\'.tool-arrow\');if(dt){dt.classList.toggle(\'show\');if(ar)ar.classList.toggle(\'open\')}"><div class="tool-item"><span class="tool-arrow">▶</span><span class="tool-name">'+x+'</span><span class="tool-badge">💡详解</span></div><div class="tool-detail">'+d+'</div></li>';
    }
    return '<li class="no-detail"><div class="tool-item"><span class="tool-arrow" style="opacity:0">▶</span><span class="tool-name">'+x+'</span></div></li>';
  }).join('');
  document.getElementById('mOutputs').innerHTML=p.o.map(x=>'<li>'+x+'</li>').join('');
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){document.getElementById('modalMask').classList.remove('show')}
document.getElementById('modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('searchInput').addEventListener('input',e=>{sTerm=e.target.value.trim();buildMatrix()});
document.getElementById('pgFilter').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#pgFilter button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');curPG=e.target.dataset.pg;buildMatrix();
});
buildMatrix();
</script>
</body>
</html>
